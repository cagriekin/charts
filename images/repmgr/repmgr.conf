# Template repmgr configuration for Kubernetes.
#
# Reference only: init-repmgr.sh writes the live /etc/repmgr/repmgr.conf from its own
# heredoc, so nothing reads this file at runtime. Kept in the image (as
# repmgr.conf.template) as documentation of the shape -- keep PG_BINDIR/env references
# in sync with init-repmgr.sh so it cannot mislead (#269).

node_id=${NODE_ID}
node_name=${NODE_NAME}
conninfo='host=${NODE_NAME} port=5432 user=${REPMGR_USER} dbname=${REPMGR_DB} connect_timeout=10'
data_directory='/var/lib/postgresql/data'
pg_bindir='${PG_BINDIR}'
replication_user='${REPMGR_USER}'
replication_type='streaming'
failover='automatic'
promote_command='repmgr standby promote -f /etc/repmgr/repmgr.conf'
follow_command='repmgr standby follow -f /etc/repmgr/repmgr.conf --upstream-node-id=%n'
monitoring_history=true
monitoring_history_keep=7
# log_file='/var/log/repmgr/repmgr.log'  # Commented out to log to stdout for Kubernetes
log_level=INFO
log_status_interval=10
service_start_command='pg_ctl -D /var/lib/postgresql/data start'
service_stop_command='pg_ctl -D /var/lib/postgresql/data stop'
service_restart_command='pg_ctl -D /var/lib/postgresql/data restart'
service_reload_command='pg_ctl -D /var/lib/postgresql/data reload'