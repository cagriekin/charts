{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled (and (eq (include "pg.agentMode" .) "true") .Values.repmgr.agent.syncReplicationSlots) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pg.fullname" . }}-postgresql-config
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
{{- /* When the chart owns shared_preload_libraries (repmgr and/or pgaudit must be
       preserved), the merged value is emitted from an authoritative file below that sorts
       after custom.conf under conf.d's include_dir; emitting it here too would be a dead
       duplicate that file overrides, so skip it. Matched case-insensitively -- PostgreSQL
       GUC names are case-insensitive, and the merge helper reads the key the same way, so
       both must agree or a non-canonically cased key would be emitted here yet dropped
       from the merged preload list. Keys are collected first so custom.conf is omitted
       entirely (rather than emitted empty) when the preload key was its only entry. */}}
{{- $ownsPreload := eq (include "pg.chartOwnsSharedPreloadLibraries" .) "true" }}
{{- $customKeys := list }}
{{- range $key, $value := (.Values.postgresql.configuration | default dict) }}
{{- if not (and $ownsPreload (eq (lower ($key | toString)) "shared_preload_libraries")) }}
{{- $customKeys = append $customKeys $key }}
{{- end }}
{{- end }}
{{- if $customKeys }}
  custom.conf: |
    {{- range $key := $customKeys }}
    {{ $key }} = '{{ index $.Values.postgresql.configuration $key | toString | replace "'" "''" }}'
    {{- end }}
{{- end }}
{{- if and (not .Values.postgresql.audit.enabled) (eq (include "pg.chartOwnsSharedPreloadLibraries" .) "true") }}
  # repmgr mode with an operator-declared shared_preload_libraries. custom.conf is loaded
  # via conf.d's include_dir at the END of PGDATA/postgresql.conf, so a bare operator value
  # there would override the repmgr image entrypoint's `shared_preload_libraries = 'repmgr'`
  # and start the postmaster WITHOUT the repmgr library -- replication and the repmgr GUCs
  # lose their functions and failover silently stops working (#262 review). This file sorts
  # after custom.conf, so its merged value (repmgr + the operator's libraries) wins.
  # shared_preload_libraries is a postmaster parameter: a change here rolls the pods via the
  # StatefulSet's checksum/postgresql-config annotation.
  repmgr-preload.conf: |
    shared_preload_libraries = '{{ include "pg.sharedPreloadLibraries" . }}'
{{- end }}
{{- if .Values.pgbackrest.enabled }}
  # Required for pgbackrest WAL archiving. archive_mode is a postmaster
  # parameter so it only takes effect after a postgres restart, which the
  # configmap checksum annotation on the StatefulSet triggers.
  #
  # wal_level (#308): sourced from postgresql.walLevel, not hardcoded, so a logical
  # subscriber can be supported without losing to this file -- it sorts after
  # custom.conf under conf.d's include_dir (same ordering the shared_preload_libraries
  # merge above depends on), so a bare `replica` here would silently override a
  # postgresql.configuration.wal_level set there whenever pgbackrest is on. The
  # pg.validateWalLevel guard rejects setting wal_level in postgresql.configuration
  # directly, so this is the one place it can come from. `logical` is a superset of
  # `replica` and is fully compatible with archive_mode=on.
  #
  # max_wal_senders is deliberately NOT set here: it used to be hardcoded to the same
  # value images/repmgr/entrypoint.sh already sets at initdb, which meant this file
  # clobbered any larger postgresql.configuration.max_wal_senders for no reason
  # (nothing else needs it re-asserted). Removed; the value now simply flows from
  # postgresql.configuration (via custom.conf) or the initdb default, uncontested.
  pgbackrest-archive.conf: |
    archive_mode = on
    archive_command = 'pgbackrest --stanza={{ .Values.pgbackrest.stanza | toString | replace "'" "''" }} archive-push %p'
    wal_level = {{ .Values.postgresql.walLevel | default "replica" }}
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
  # Server TLS (#110). The cert Secret is mounted at /etc/postgresql/tls; ssl_ca_file
  # is set only under mutual TLS (it verifies CLIENT certs). ssl is SIGHUP-reloadable;
  # the configmap checksum annotation rolls the pod when this changes.
  tls.conf: |
    ssl = on
    ssl_cert_file = '/etc/postgresql/tls/tls.crt'
    ssl_key_file = '/etc/postgresql/tls/tls.key'
{{- if .Values.postgresql.tls.clientCertAuth }}
    ssl_ca_file = '/etc/postgresql/tls/ca.crt'
{{- end }}
{{- end }}
{{- if .Values.postgresql.audit.enabled }}
  # pgaudit audit logging (#219). shared_preload_libraries is a postmaster parameter,
  # so it takes effect only after a restart -- toggling audit.enabled changes this
  # ConfigMap's checksum, which the StatefulSet's checksum/postgresql-config annotation
  # turns into a controlled rolling restart. This file sorts after custom.conf under
  # conf.d's include_dir, so its shared_preload_libraries is authoritative; the helper
  # keeps repmgr (replication) and any operator-declared libraries and adds pgaudit.
  pgaudit.conf: |
    shared_preload_libraries = '{{ include "pg.sharedPreloadLibraries" . }}'
    pgaudit.log = '{{ .Values.postgresql.audit.log | toString | replace "'" "''" }}'
    pgaudit.log_catalog = {{ ternary "on" "off" .Values.postgresql.audit.logCatalog }}
    pgaudit.log_parameter = {{ ternary "on" "off" .Values.postgresql.audit.logParameter }}
    pgaudit.log_relation = {{ ternary "on" "off" .Values.postgresql.audit.logRelation }}
{{- if .Values.postgresql.audit.role }}
    pgaudit.role = '{{ .Values.postgresql.audit.role | toString | replace "'" "''" }}'
{{- end }}
{{- end }}
{{- if and (eq (include "pg.agentMode" .) "true") .Values.repmgr.agent.syncReplicationSlots }}
  # Logical failover slot sync (#308), PostgreSQL 17+. sync_replication_slots is a plain
  # boolean, not topology-dependent (unlike synchronized_standby_slots below, which the
  # agent reconciles per-tick on the primary via ALTER SYSTEM as the standby set changes),
  # so it is safe to set unconditionally here rather than needing agent involvement: it
  # enables the slot-sync worker on a standby, and is a documented no-op on a primary
  # (there is nothing there for it to sync).
  sync-replication-slots.conf: |
    sync_replication_slots = on
{{- end }}
{{- end }}
