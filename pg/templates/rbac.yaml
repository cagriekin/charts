{{- include "pg.normalizeValues" . -}}
{{- if .Values.ha.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pg.fullname" . }}-repmgr
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  {{- /* This is the postgresql pods' identity: global annotations plus the
         postgresql.serviceAccount.annotations knob (cloud workload identity for
         keyless pgbackrest S3 -- IRSA / GKE WI). SA-specific keys win on conflict. */}}
  {{- $saAnnotations := merge (deepCopy .Values.postgresql.serviceAccount.annotations) .Values.global.annotations }}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pg.fullname" . }}-repmgr
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["{{ include "pg.fullname" . }}"]
    verbs: ["get", "patch"]
  {{- /* list cannot be resourceName-scoped (the object name is not known at
         authorization time); it is read-only enumeration of the pg pods for
         pg-role labeling. */}}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  {{- /* get/patch (pg-role labeling for the readonly Service) are scoped to the chart's
         own StatefulSet pods <fullname>-0..N, so a leaked SA token cannot patch
         arbitrary namespace pods. There is deliberately no `delete`: it was only ever
         granted to the repmgrd-mode service-updater for split-brain fencing (#154), and
         with repmgrd gone (#286) nothing in the chart deletes a pod -- the agent
         soft-fences locally via pg_ctl. (ha.splitBrainDetection, which once named a
         log/fence choice here, was removed in 2.0.0 -- the demote is unconditional.) */}}
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      {{- range $i := until (int (add .Values.postgresql.replicaCount 1)) }}
      - {{ printf "%s-%d" (include "pg.fullname" $) $i | quote }}
      {{- end }}
    verbs:
      - "get"
      - "patch"
{{- if eq (include "pg.agentMode" .) "true" }}
  # Durable primary marker (<fullname>-primary): the agent records the highest
  # timeline here (#125) via Get -> Create-if-absent -> Update. get/update are
  # scoped to the one marker name; create stays unscoped (resourceNames cannot
  # restrict create). The agent records its failover decisions in a structured
  # audit log (not core/v1 Events), so it needs no events grant.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "pg.fullname" . }}-primary"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
{{- if eq (include "pg.controlRestoreEnabled" .) "true" }}
  # Control-API restore triggering (#276). READ THIS BEFORE ENABLING IT.
  #
  # `create` on jobs CANNOT be restricted by resourceName -- the API server does not
  # know an object's name at authorization time for a create -- so this grant BY ITSELF
  # lets anything holding the postgresql pods' ServiceAccount token create ARBITRARY Jobs
  # in this namespace. A Job's pod may name any ServiceAccount, and Kubernetes does no
  # separate permission check for that, which makes this a namespace-wide
  # privilege-escalation primitive. The token is mounted next to a PostgreSQL that
  # executes user-supplied SQL, i.e. the chart's largest attack surface.
  #
  # What actually bounds it is NOT in this file, because the restriction has to happen at
  # a layer RBAC does not reach: the ValidatingAdmissionPolicy in
  # agent-restore-admissionpolicy.yaml (#279) restricts these creates by CONTENT -- one
  # permitted Job name, this release's ServiceAccount with no mounted token, this
  # release's image running this release's restore command, its security contexts, volumes
  # and Secrets, and a single pod. It renders under the same pg.controlRestoreEnabled
  # condition as this grant, and dropping it requires setting
  # ha.agent.control.restore.admissionPolicy.acknowledgeUnbounded=true, which the
  # render otherwise refuses.
  #
  # So this rule CAN still exist without that policy -- deliberately, for clusters below
  # Kubernetes 1.30 and for namespace-limited installers -- and in that configuration the
  # 1.9.0 warning applies unchanged: the grant is unbounded, and it is worth having only
  # if API-driven restore is worth that trade. Check which state you are in with
  # `kubectl get validatingadmissionpolicybinding -l app.kubernetes.io/instance=<release>`;
  # do not infer it from the presence of this rule.
  #
  # Narrowing it further: the grant is rendered ONLY under
  # ha.agent.control.restore.enabled (default false, so a normal install's Role is
  # unchanged), the API additionally requires a client certificate whose CN is on
  # ha.agent.control.restore.allowedClientCNs, and the Job the agent creates is a
  # verbatim clone of the CronJob below rather than a spec it composes. The equivalent
  # kubectl path (`kubectl create job --from=cronjob/...`) needs none of this.
  #
  # get on the CronJob: the jobTemplate the agent clones.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["{{ include "pg.fullname" . }}-pgbackrest-restore"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  # get/delete ARE scopeable, because the agent always creates the same deterministic
  # Job name -- which is why it uses one instead of generateName.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["{{ include "pg.fullname" . }}-pgbackrest-restore-api"]
    verbs: ["get", "delete"]
{{- if .Values.ha.agent.control.restore.readPodLogs }}
  # Live file-copy progress by tailing the restore pod's log. The Job's pod name is
  # generated, so this cannot be resourceName-scoped either: it grants log read for
  # EVERY pod in the namespace, and logs are where other workloads leak secrets. Off
  # by default; the progress that needs no privilege (WAL replay position after
  # scale-up, and the recorded restore outcome) is always available without it.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- end }}
{{- end }}
{{- if ne (include "pg.agentEtcdMode" .) "true" }}
  # Lease <fullname>-leader is the sole leadership authority (client-go
  # leaderelection): get/update scoped to that name, create unscoped. No "patch":
  # client-go's LeaseLock renews/adopts with Get+Update only, so the verb was pure
  # attack surface on the token mounted beside a PostgreSQL that runs user SQL
  # (#298 review). With the etcd DCS backend leadership lives in etcd, not the
  # apiserver, so this grant is dropped (least privilege); routing still uses the
  # services/pods grants above.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["{{ include "pg.fullname" . }}-leader"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pg.fullname" . }}-repmgr
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pg.fullname" . }}-repmgr
subjects:
  - kind: ServiceAccount
    name: {{ include "pg.fullname" . }}-repmgr
    namespace: {{ .Release.Namespace }}
{{- end }}
