{{- if .Values.pgbackrest.enabled }}
{{- if not (has .Values.pgbackrest.s3.keyType (list "shared" "auto")) }}
{{- fail "pgbackrest.s3.keyType must be 'shared' (static access/secret key) or 'auto' (cloud workload identity / instance credential chain)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pg.fullname" . }}-pgbackrest
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbackrest
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  pgbackrest.conf: |
    [global]
    repo1-type=s3
    repo1-s3-key-type={{ .Values.pgbackrest.s3.keyType }}
    repo1-s3-endpoint={{ required "pgbackrest.s3.endpoint is required" .Values.pgbackrest.s3.endpoint }}
    repo1-s3-bucket={{ required "pgbackrest.s3.bucket is required" .Values.pgbackrest.s3.bucket }}
    repo1-s3-region={{ .Values.pgbackrest.s3.region }}
    {{- if ne .Values.pgbackrest.s3.uriStyle "host" }}
    repo1-s3-uri-style={{ .Values.pgbackrest.s3.uriStyle }}
    {{- end }}
    {{- if not .Values.pgbackrest.s3.verifyTls }}
    repo1-storage-verify-tls=n
    {{- end }}
    repo1-path=/{{ .Values.pgbackrest.s3.prefix }}/{{ include "pg.fullname" . }}
    repo1-retention-full={{ .Values.pgbackrest.retention.full }}
    repo1-retention-diff={{ .Values.pgbackrest.retention.diff }}
    {{- if .Values.pgbackrest.repoEncryption.enabled }}
    repo1-cipher-type={{ .Values.pgbackrest.repoEncryption.cipherType }}
    {{- else }}
    repo1-cipher-type=none
    {{- end }}
    start-fast=y
    log-level-console=info
    compress-type=zst
    process-max=2

    [{{ .Values.pgbackrest.stanza }}]
    pg1-path=/var/lib/postgresql/data/pgdata
    pg1-port=5432
    pg1-socket-path=/var/run/postgresql
{{- if .Values.pgbackrest.validation.enabled }}
  # Automated PITR restore-validation script (#38), mounted into the
  # pgbackrest-validation CronJob. Kept here (not inlined in the CronJob args) to
  # mirror the #31 pg_dump validate.sh. All inputs arrive via env (PGBACKREST_*,
  # POSTGRES_USER/DB, RECOVERY_TIMEOUT, TARGET_TYPE/TARGET) so the body is literal.
  validate.sh: |
    #!/bin/bash
    set -euo pipefail

    # The PostgreSQL binaries (pg_ctl, psql, postgres) live in
    # /usr/lib/postgresql/<major>/bin in the Debian-based repmgr image and are NOT on
    # PATH when this script runs as the container command (the image entrypoint, which
    # would add them, is bypassed). pgbackrest is in /usr/bin so the restore works, but
    # pg_ctl would be "command not found". Prepend the PG bin dir (glob -> major-agnostic).
    PG_BIN=$(dirname "$(ls -1 /usr/lib/postgresql/*/bin/pg_ctl 2>/dev/null | sort -V | tail -1)")
    [ -n "$PG_BIN" ] && export PATH="$PG_BIN:$PATH"

    WORK=/work
    # Restore into a throwaway PGDATA on the emptyDir. PGBACKREST_PG1_PATH (env)
    # overrides the pg1-path baked into the mounted pgbackrest.conf for BOTH the
    # restore and the archive-get the recovery runs, so we never touch
    # /var/lib/postgresql/data. restartPolicy:Never gives a fresh pod each run, but
    # clear defensively in case of a manual rerun.
    rm -rf "$PGDATA" "$WORK/run"
    mkdir -p "$PGDATA" "$WORK/run" "$PGBACKREST_LOG_PATH" "$PGBACKREST_LOCK_PATH"

    echo "Restoring stanza '$PGBACKREST_STANZA' into the throwaway PGDATA ($PGDATA)..."
    # No --type => recover to the end of the archived WAL stream (latest). With a
    # target, --target-action=promote is REQUIRED: PostgreSQL's default
    # recovery_target_action is `pause`, which would leave the instance paused in
    # recovery (never accepting connections) so the wait below would hang until the
    # Job times out. The latest-only branch promotes on its own (end of WAL +
    # recovery.signal).
    if [ -n "$TARGET_TYPE" ]; then
      echo "PITR target: type=$TARGET_TYPE target=$TARGET"
      pgbackrest --stanza="$PGBACKREST_STANZA" --type="$TARGET_TYPE" --target="$TARGET" --target-action=promote restore
    else
      pgbackrest --stanza="$PGBACKREST_STANZA" restore
    fi

    # The restored postgresql.conf is the live cluster's. The chart appends
    # `include_dir = '/etc/postgresql/conf.d'` to PGDATA (statefulset setup-config),
    # captured in the base backup -- but this Job has no conf.d (a ConfigMap mount on
    # live pods only, and pg_ctl bypasses the entrypoint), so postgres would FATAL
    # with "could not open configuration directory". Strip the line; the throwaway
    # needs none of those tunables to prove restorability.
    if [ -f "$PGDATA/postgresql.conf" ]; then
      grep -v "include_dir = '/etc/postgresql/conf.d'" "$PGDATA/postgresql.conf" > "$PGDATA/postgresql.conf.tmp"
      mv "$PGDATA/postgresql.conf.tmp" "$PGDATA/postgresql.conf"
    fi
    # The restored pg_hba.conf is the live cluster's (scram/peer over the pod
    # network), and this Job has no DB password. Prepend a trust rule for the local
    # socket so the validation queries can connect as the restored superuser without
    # a secret -- safe because this throwaway instance is socket-only
    # (listen_addresses='') and discarded when the pod ends.
    printf 'local all all trust\n%s\n' "$(cat "$PGDATA/pg_hba.conf")" > "$PGDATA/pg_hba.conf"

    # PostgreSQL refuses to begin archive recovery with hot_standby=on unless the
    # recovery instance's max_connections / max_worker_processes / max_wal_senders /
    # max_prepared_transactions / max_locks_per_transaction are >= the values the
    # PRIMARY had when the WAL was generated (checked against pg_control). Those
    # primary values come from the chart's conf.d overlay (any of these tunables raised
    # above its default), which we stripped above with the include_dir line -- so the
    # throwaway would fall back to initdb defaults and FATAL with "recovery aborted
    # because of insufficient parameter settings". pg_controldata reports exactly the
    # primary values recorded in pg_control, so echo them back as startup overrides
    # (self-adjusting if the primary is ever retuned). Guarded with `|| CTL=""`: under
    # `set -e` a non-zero pg_controldata (e.g. a version-mismatched PGDATA vs the newest
    # installed PG binary picked for PG_BIN above) would otherwise abort the Job HERE,
    # before recovery is even attempted -- instead we fall through to the recovery
    # diagnostics below. A single awk pass maps each pg_controldata field to its GUC and
    # WARNs (rather than silently dropping) if an expected label is absent, so a future
    # label rename surfaces as a warning instead of a mystifying "recovery did not
    # promote" failure that silently reintroduces the very bug this guards against.
    CTL=$(pg_controldata "$PGDATA" 2>/dev/null) || CTL=""
    REC_OVERRIDES=""
    if [ -n "$CTL" ]; then
      REC_OVERRIDES=$(printf '%s\n' "$CTL" | awk '
        BEGIN {
          g["max_connections setting"]      = "max_connections"
          g["max_worker_processes setting"] = "max_worker_processes"
          g["max_wal_senders setting"]      = "max_wal_senders"
          g["max_prepared_xacts setting"]   = "max_prepared_transactions"
          g["max_locks_per_xact setting"]   = "max_locks_per_transaction"
        }
        {
          c = index($0, ":")
          if (c > 0) {
            label = substr($0, 1, c - 1); val = substr($0, c + 1)
            gsub(/^[ \t]+|[ \t]+$/, "", label); gsub(/[ \t]/, "", val)
            if ((label in g) && val != "") found[label] = val
          }
        }
        END {
          ov = ""
          for (label in g) {
            if (label in found) ov = ov " -c " g[label] "=" found[label]
            else print "WARN: pg_controldata reported no \"" label "\"; recovery may abort if the source raised " g[label] > "/dev/stderr"
          }
          print ov
        }')
    else
      echo "WARN: pg_controldata produced no output; starting recovery without derived GUC overrides (may abort if the source raised a recovery-relevant setting)" >&2
    fi

    echo "Starting the throwaway PostgreSQL to replay WAL (archive recovery)..."
    # recovery.signal (written by restore) makes postgres replay WAL via the
    # restore_command (pgbackrest archive-get, inheriting this container's env for S3
    # creds + PGBACKREST_PG1_PATH). listen_addresses='' keeps it socket-only.
    # archive_mode=off is CRITICAL: the restored config still has archive_mode=on +
    # the archive-push command, so once this throwaway PROMOTES it would push its own
    # new-timeline WAL into the PRODUCTION repo and pollute it. archive-get
    # (restore_command) for reading WAL during recovery is unaffected.
    # hot_standby=on is forced so the postmaster accepts (read-only) connections at the
    # consistency point DURING recovery; otherwise `pg_ctl -w` blocks for its whole
    # timeout waiting for connections the server won't accept until it promotes.
    # `-l startup.log` captures the server log so a failure is diagnosable; `-w -t 60`
    # bounds the wait (don't block for the full recoveryTimeout here), and the poll
    # below -- which also tolerates a not-yet-connectable server -- does the real wait.
    # Overrides applied at startup (win over the restored postgresql.conf):
    #   shared_preload_libraries='' : the live config preloads repmgr, whose GUCs live in
    #     the conf.d we stripped above -- loading it here would FATAL. The throwaway needs
    #     no operational extensions to replay WAL.
    #   logging_collector=off + log_destination=stderr : send any startup error to the
    #     -l file so a failure is visible (with logging_collector on it goes to PGDATA/log).
    #   archive_mode=off, hot_standby=on, socket-only : see above.
    #   $REC_OVERRIDES : per-parameter minimums recovered from pg_control (see above).
    pg_ctl -D "$PGDATA" -w -t 60 -l "$PGDATA/startup.log" \
      -o "-c listen_addresses='' -c unix_socket_directories=$WORK/run -c port=5432 -c archive_mode=off -c hot_standby=on -c shared_preload_libraries='' -c logging_collector=off -c log_destination=stderr${REC_OVERRIDES}" start \
      || echo "WARN: server not connectable within 60s; polling for recovery/promotion below" >&2
    trap 'pg_ctl -D "$PGDATA" -m immediate -w stop >/dev/null 2>&1 || true' EXIT

    # Poll pg_is_in_recovery() until the instance promotes to read-write ('f'), bounded
    # by recoveryTimeout. Bail early (and surface the server log) if the postmaster dies,
    # so a startup failure fails the Job in seconds instead of hanging the full timeout.
    echo "Waiting for WAL replay to finish and the instance to promote..."
    promoted=""
    poll_interval=5
    poll_iters=$(( (RECOVERY_TIMEOUT + poll_interval - 1) / poll_interval ))
    rec=""
    for _ in $(seq 1 "$poll_iters"); do
      if ! pg_ctl -D "$PGDATA" status >/dev/null 2>&1; then
        echo "ERROR: the throwaway postmaster is not running (it exited during startup/recovery)" >&2
        break
      fi
      rec=$(psql -h "$WORK/run" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()" 2>/dev/null | tr -d '[:space:]') || rec=""
      [ "$rec" = "f" ] && { promoted="yes"; break; }
      sleep "$poll_interval"
    done
    if [ -z "$promoted" ]; then
      echo "ERROR: recovery did not promote within ${RECOVERY_TIMEOUT}s (pg_is_in_recovery=${rec:-unreadable})" >&2
      echo "----- throwaway postgres startup log -----" >&2
      cat "$PGDATA/startup.log" >&2 2>/dev/null || true
      for f in "$PGDATA"/log/*; do [ -f "$f" ] && { echo "----- $f -----" >&2; cat "$f" >&2; }; done 2>/dev/null || true
      exit 1
    fi

    echo "Validating restored contents..."
    # No ANALYZE: a physical restore preserves pg_class.reltuples from the source, and
    # the load-bearing signal is the relation COUNT (needs no stats). Skipping it
    # avoids a full-database scan that could dominate runtime on a large restore.
    SUMMARY=$(psql -h "$WORK/run" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAF'|' -c "
      SELECT count(*),
             COALESCE(sum(c.reltuples)::bigint, 0)
      FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind IN ('r','p','m','f') AND n.nspname NOT IN ('pg_catalog','information_schema')")
    RELS="${SUMMARY%%|*}"
    ROWS="${SUMMARY##*|}"
    echo "Restore OK: recovery completed and promoted; ${RELS} table-like relation(s), ~${ROWS} row(s) (estimate) in '$POSTGRES_DB'"
    echo "pgBackRest PITR validation succeeded for stanza '$PGBACKREST_STANZA'"
{{- end }}
{{- if .Values.pgbackrest.restore.enabled }}
  # First-class PITR restore program (#226), mounted into the pgbackrest-restore
  # Job/CronJob. Unlike validate.sh above (throwaway instance, proves restorability) this
  # one restores over the LIVE data directory. Kept here rather than inlined in the Job so
  # the two stay side by side; all inputs arrive via env (PGBACKREST_*, PGDATA,
  # TARGET_TYPE/TARGET, BACKUP_SET, FORCE) so the body is literal.
  restore.sh: |
    #!/bin/bash
    set -euo pipefail

    # Restores the pgBackRest repository over the live data directory and then STOPS: it
    # deliberately never starts postgres. Recovery (WAL replay + promotion) happens when
    # the operator scales the StatefulSet back up, under the normal chart entrypoint.
    # Run this only while the StatefulSet is scaled to 0.

    # pg_controldata lives in /usr/lib/postgresql/<major>/bin in the Debian-based repmgr
    # image and is NOT on PATH when this script is the container command (the image
    # entrypoint, which would add it, is bypassed). pgbackrest itself is in /usr/bin, so
    # the restore works either way -- this is for the post-restore report at the end.
    PG_BIN=$(dirname "$(ls -1 /usr/lib/postgresql/*/bin/pg_controldata 2>/dev/null | sort -V | tail -1)")
    [ -n "$PG_BIN" ] && export PATH="$PG_BIN:$PATH"

    mkdir -p "$PGBACKREST_LOG_PATH" "$PGBACKREST_LOCK_PATH"

    # Restoring over a RUNNING cluster would corrupt it. pgbackrest is the real interlock
    # -- it refuses while $PGDATA/postmaster.pid exists ("unable to restore while
    # PostgreSQL is running"), which is why this Job needs no API access to check replica
    # counts -- but test it first so the failure names the actual operator mistake and
    # points at the one legitimate override.
    if [ -f "$PGDATA/postmaster.pid" ] && [ "$FORCE" != "true" ]; then
      echo "ERROR: $PGDATA/postmaster.pid exists -- PostgreSQL is (or was) running on this volume." >&2
      echo "       Scale the StatefulSet to 0, wait for the pods to terminate, then rerun." >&2
      echo "       If the cluster crashed and the pid file is stale, set pgbackrest.restore.force=true." >&2
      exit 1
    fi

    # --delta compares checksums and copies only the files that differ, so the existing
    # PGDATA is left in place (a wiped data directory silently degrades to a full restore
    # -- still correct, just slower). Rerunning the Job simply restores again.
    ARGS=(--stanza="$PGBACKREST_STANZA" --delta)
    if [ -n "$BACKUP_SET" ]; then
      echo "Restoring from backup set: $BACKUP_SET"
      ARGS+=(--set="$BACKUP_SET")
    fi
    if [ -n "$TARGET_TYPE" ]; then
      # With a target, --target-action=promote is REQUIRED: PostgreSQL's default
      # recovery_target_action is `pause`, which would leave the restored cluster paused
      # in recovery (never accepting connections) after scale-up. With no target,
      # recovery replays to the end of the archived WAL stream and promotes on its own.
      echo "PITR target: type=$TARGET_TYPE target=$TARGET"
      ARGS+=(--type="$TARGET_TYPE" --target="$TARGET" --target-action=promote)
    fi
    if [ "$FORCE" = "true" ]; then
      ARGS+=(--force)
    fi

    echo "Restoring stanza '$PGBACKREST_STANZA' into the live data directory ($PGDATA)..."
    pgbackrest "${ARGS[@]}" restore

    # Echo the restored control file (state + checkpoint) into the Job log: it is the
    # first thing to look at if the cluster does not come up after scale-up.
    echo "----- pg_controldata after restore -----"
    pg_controldata -D "$PGDATA" 2>/dev/null | grep -E 'Database cluster state|Latest checkpoint location|Time of latest checkpoint' || true

    echo "pgBackRest restore succeeded for stanza '$PGBACKREST_STANZA'"
    echo "Scale the StatefulSet back up to replay WAL and promote (see the chart README)."
{{- end }}
{{- if .Values.pgbackrest.bootstrap.enabled }}
  # Bootstrap-from-backup program (#266), run as an init container on replica 0 before
  # repmgr-init. Where restore.sh (#226) deliberately restores OVER a live data directory
  # under operator control, this one only ever populates an EMPTY one -- so an ordinary pod
  # restart or rollout can never re-restore over a running cluster. All inputs arrive via env.
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    # Seeds an EMPTY data directory from the pgBackRest repository so a replica that lost its
    # PVC recovers its data instead of initdb-ing an empty cluster. Runs before repmgr-init:
    # once PGDATA is populated, init-repmgr.sh defers ("Primary-state data directory present")
    # and the entrypoint skips initdb, so postgres starts, replays the archived WAL via
    # restore_command and promotes -- the same recovery path as a scale-up after #226's Job.

    # pg_controldata lives in /usr/lib/postgresql/<major>/bin and is NOT on PATH when this
    # script is the container command (the image entrypoint, which would add it, is bypassed).
    PG_BIN=$(dirname "$(ls -1 /usr/lib/postgresql/*/bin/pg_controldata 2>/dev/null | sort -V | tail -1)")
    [ -n "$PG_BIN" ] && export PATH="$PG_BIN:$PATH"

    mkdir -p "$PGBACKREST_LOG_PATH" "$PGBACKREST_LOCK_PATH"

    # The marker records a COMPLETED bootstrap. It lives inside PGDATA on purpose: it shares
    # the volume's lifecycle, so a wiped/lost PVC clears it exactly when a fresh bootstrap
    # becomes correct again -- no external state to get out of sync.
    MARKER="$PGDATA/.pgbackrest-bootstrap-complete"
    RESUMING=""

    ORDINAL="${HOSTNAME##*-}"
    # Only replica 0 bootstraps. Standbys must clone from the restored primary (repmgr
    # standby clone), not each restore their own copy: independent restores of the same repo
    # would land on divergent recovery points and could not stream from one another.
    if [ "$ORDINAL" != "0" ]; then
      echo "Not replica 0 (ordinal $ORDINAL): standbys clone from the primary; nothing to bootstrap."
      exit 0
    fi

    if [ -s "$PGDATA/PG_VERSION" ]; then
      if [ -f "$MARKER" ]; then
        echo "Bootstrap already completed on this volume:"
        cat "$MARKER"
        exit 0
      fi
      # PG_VERSION present but no marker. Either a pre-existing cluster (this feature was
      # enabled on a running release) or an aborted bootstrap. pgbackrest restores
      # global/pg_control LAST precisely so an interrupted restore cannot be started, so a
      # READABLE control file means a real cluster -- never touch it. An unreadable one means
      # the previous attempt died mid-restore, and Kubernetes is retrying this init container.
      if pg_controldata -D "$PGDATA" >/dev/null 2>&1; then
        echo "PGDATA already holds an initialized cluster; leaving it untouched."
        echo "(To restore OVER existing data, use the operator-driven restore Job: pgbackrest.restore.enabled -- see the README.)"
        exit 0
      fi
      echo "WARNING: PGDATA is partially populated and its control file is unreadable -- resuming an aborted bootstrap." >&2
      RESUMING=yes
    fi

    # Is there anything to bootstrap FROM? This must be answered before restoring, because a
    # `restore` with no backup exits non-zero, which under `set -e` would fail this init
    # container -- and Kubernetes retries init containers forever, so a FIRST install (empty
    # repo by definition) would never start a pod at all.
    #
    # `pgbackrest info` exits 0 even for a missing stanza AND for an unreachable repository, so
    # the exit code cannot be used; the JSON status code is what distinguishes them:
    #   1 = missing stanza path/data, 2 = no valid backups  -> benign, nothing to restore yet
    #   anything else (e.g. 99 HostConnectError)             -> the repo state is UNKNOWN
    # The distinction is the whole safety story here: "no backup yet" means initialize normally,
    # while "cannot reach the repo" must NOT fall through to initdb -- that would create an
    # empty cluster over a database that is probably still recoverable, which is precisely the
    # silent data loss this feature exists to prevent.
    #
    # Reached only when PGDATA is empty (the checks above returned early otherwise), so a pod
    # rescheduled with an intact volume never depends on the repository being reachable.
    INFO=$(pgbackrest info --stanza="$PGBACKREST_STANZA" --output=json 2>/dev/null || echo '[]')
    NBACKUPS=$(printf '%s' "$INFO" | jq -r '[.[].backup[]?] | length' 2>/dev/null || echo 0)
    REPO_CODE=$(printf '%s' "$INFO" | jq -r '.[0].status.code // 99' 2>/dev/null || echo 99)
    REPO_MSG=$(printf '%s' "$INFO" | jq -r '.[0].status.message // "unreadable"' 2>/dev/null || echo unreadable)
    case "${NBACKUPS:-0}" in ''|*[!0-9]*) NBACKUPS=0 ;; esac

    if [ "$NBACKUPS" -eq 0 ]; then
      if [ "$REPO_CODE" = "1" ] || [ "$REPO_CODE" = "2" ]; then
        echo "Repository holds no backup for stanza '$PGBACKREST_STANZA' yet (pgbackrest: ${REPO_MSG})."
        echo "Leaving the data directory empty so this node initializes normally -- the expected path on a first install."
        exit 0
      fi
      echo "FATAL: cannot determine the state of the pgBackRest repository for stanza '$PGBACKREST_STANZA' (status ${REPO_CODE}: ${REPO_MSG})." >&2
      echo "       Refusing to continue: initializing an empty cluster now would silently discard a database that is probably still recoverable." >&2
      echo "       Fix repository access (endpoint, credentials, network), or set pgbackrest.bootstrap.enabled=false to initialize an empty cluster deliberately." >&2
      exit 1
    fi
    echo "Repository has ${NBACKUPS} backup(s) for stanza '$PGBACKREST_STANZA'."

    # --delta unconditionally: on a genuinely empty directory pgbackrest just warns and does a
    # full restore, and on a resumed attempt it copies only what is missing or differs. Without
    # it, a retry into the partially-restored directory would abort ("directory not empty").
    ARGS=(--stanza="$PGBACKREST_STANZA" --delta)
    if [ -n "$BACKUP_SET" ]; then
      echo "Bootstrapping from backup set: $BACKUP_SET"
      ARGS+=(--set="$BACKUP_SET")
    fi
    if [ -n "$TARGET_TYPE" ]; then
      # --target-action=promote is REQUIRED with a target: the default recovery_target_action
      # is `pause`, which would leave the bootstrapped node in recovery, never becoming ready.
      echo "PITR target: type=$TARGET_TYPE target=$TARGET"
      ARGS+=(--type="$TARGET_TYPE" --target="$TARGET" --target-action=promote)
    fi

    if [ -n "$RESUMING" ]; then
      echo "Resuming bootstrap of stanza '$PGBACKREST_STANZA' into the partially-restored data directory ($PGDATA)..."
    else
      echo "Bootstrapping stanza '$PGBACKREST_STANZA' into the empty data directory ($PGDATA)..."
    fi
    pgbackrest "${ARGS[@]}" restore

    # Only now is the bootstrap complete: pg_control has been restored, so the cluster is
    # startable. Record what produced this volume -- the first thing to check if the node
    # later comes up with unexpected contents.
    SYSID=$(pg_controldata -D "$PGDATA" 2>/dev/null | awk -F: '/Database system identifier/{gsub(/ /,"",$2); print $2}')
    {
      echo "stanza=$PGBACKREST_STANZA"
      echo "backupSet=${BACKUP_SET:-<latest>}"
      echo "targetType=${TARGET_TYPE:-<latest-wal>}"
      echo "target=${TARGET:-}"
      echo "systemIdentifier=${SYSID:-unknown}"
      echo "completedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    } > "$MARKER"

    echo "Bootstrap succeeded; PostgreSQL will replay the archived WAL and promote on startup."
{{- end }}
{{- end }}
