{{- if .Values.pgbackrest.enabled }}
{{- $root := . -}}
{{- range $type, $schedule := dict "full" $root.Values.pgbackrest.schedule.full "diff" $root.Values.pgbackrest.schedule.diff }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pg.fullname" $root }}-pgbackrest-{{ $type }}
  labels:
    {{- include "pg.labels" $root | nindent 4 }}
    app.kubernetes.io/component: pgbackrest
    pgbackrest.type: {{ $type }}
  annotations:
    # one-shot CronJob: liveness/readiness probes do not apply (kube-linter waiver).
    ignore-check.kube-linter.io/no-liveness-probe: "one-shot pgbackrest CronJob"
    ignore-check.kube-linter.io/no-readiness-probe: "one-shot pgbackrest CronJob"
    {{- with (include "pg.annotations" $root) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  schedule: {{ $schedule | quote }}
  concurrencyPolicy: {{ $root.Values.pgbackrest.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $root.Values.pgbackrest.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.pgbackrest.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $root.Values.pgbackrest.cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ $root.Values.pgbackrest.cronjob.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "pg.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: pgbackrest
            pgbackrest.type: {{ $type }}
        spec:
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.pgbackrest.cronjob.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          serviceAccountName: {{ include "pg.fullname" $root }}-pgbackrest
          restartPolicy: Never
          securityContext:
            {{- toYaml $root.Values.pgbackrest.cronjob.podSecurityContext | nindent 12 }}
          containers:
            - name: pgbackrest
              image: {{ include "pg.image" $root.Values.pgbackrest.cronjob.image | quote }}
              imagePullPolicy: {{ $root.Values.pgbackrest.cronjob.image.pullPolicy }}
              securityContext:
                {{- toYaml $root.Values.pgbackrest.cronjob.containerSecurityContext | nindent 16 }}
              command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
              args:
                - |
                  # Resolve the primary pod from the write Service's EndpointSlices
                  # (the core Endpoints API is deprecated). The write Service selects
                  # only the primary, but during a failover + scale-down collision
                  # stale EndpointSlices can briefly expose more than one Ready
                  # endpoint; taking the first blindly could target a standby, and
                  # with backoffLimit:0 the failed backup is silently skipped (#212).
                  # So validate every Ready candidate with pg_is_in_recovery() and
                  # pick the one true read-write primary (=f). The check runs in the
                  # candidate's postgresql container over its local socket -- the same
                  # invocation the readiness probe uses, so no extra creds are needed.
                  # `|| CANDIDATES=""` so a failed EndpointSlice list (RBAC denial,
                  # transient API error) under `set -eu -o pipefail` falls through to
                  # the actionable error below instead of aborting with a bare trace.
                  # Sorted so selection is deterministic across runs and independent of
                  # EndpointSlice list order (matters only in the rare multi-endpoint case).
{{- if $root.Values.pgbackrest.info.enabled }}
                  # The #343 record needs jq (alpine/k8s ships it). Check before the backup, so
                  # a custom pgbackrest.cronjob.image without it fails here with the fix named
                  # rather than after a successful backup it then reports as failed.
                  command -v jq >/dev/null 2>&1 || {
                    echo "ERROR: jq is not in the CronJob image but pgbackrest.info.enabled=true needs it to record the repository state; use an image that has jq (the default alpine/k8s does) or set pgbackrest.info.enabled=false" >&2
                    exit 1
                  }
{{- end }}
                  CANDIDATES=$(kubectl -n "$NAMESPACE" get endpointslices \
                    -l "kubernetes.io/service-name=$PRIMARY_SVC" \
                    -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].targetRef.name}' \
                    | tr ' ' '\n' | sort | tr '\n' ' ') || CANDIDATES=""
                  if [ -z "$(echo $CANDIDATES)" ]; then
                    echo "ERROR: no ready endpoint found (or the endpointslice lookup failed) for $PRIMARY_SVC" >&2
                    exit 1
                  fi
                  # Pick the one read-write primary among the Ready endpoints. Validate
                  # over each candidate's local socket -- the same psql call the readiness
                  # probe uses. `timeout 10` bounds a wedged/mid-shutdown pod (socket open
                  # but not serving) so the scan can never hang until activeDeadlineSeconds;
                  # two attempts absorb a transient blip. `|| rec=""` keeps a failed exec
                  # (a candidate that vanished mid-scan) from tripping `set -e -o pipefail`.
                  PRIMARY=""
                  saw_standby=""
                  ncand=0
                  last_cand=""
                  for cand in $CANDIDATES; do
                    ncand=$((ncand + 1))
                    last_cand="$cand"
                    rec=""
                    for attempt in 1 2; do
                      rec=$(kubectl -n "$NAMESPACE" exec "$cand" -c postgresql -- \
                        sh -c 'timeout 10 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()"' 2>/dev/null \
                        | tr -d '[:space:]') || rec=""
                      [ -n "$rec" ] && break
                      [ "$attempt" -lt 2 ] && sleep 2
                    done
                    if [ "$rec" = "f" ]; then
                      PRIMARY="$cand"
                      break
                    fi
                    [ "$rec" = "t" ] && saw_standby="yes"
                    echo "Skipping $cand: pg_is_in_recovery=${rec:-unreadable} (not a confirmed read-write primary)"
                  done
                  if [ -z "$PRIMARY" ]; then
                    # No candidate confirmed pg_is_in_recovery()=f. Fall back ONLY when
                    # there is exactly one Ready endpoint whose state we could not read
                    # (not a confirmed standby 't'): the write Service selects only the
                    # primary, so a lone unverifiable endpoint is almost certainly it, and
                    # master would have backed it up -- skipping on a transient probe blip
                    # would silently drop the backup (backoffLimit:0). pgbackrest fails
                    # cleanly if it really is a standby. The ambiguous MULTI-endpoint case
                    # (#212) still requires a confirmed primary, and a confirmed standby is
                    # never used.
                    if [ "$ncand" -eq 1 ] && [ -z "$saw_standby" ]; then
                      PRIMARY="$last_cand"
                      echo "WARNING: could not confirm read-write state of the sole Ready endpoint $PRIMARY; proceeding (it is the write Service target). pgbackrest will fail cleanly if it is not the primary."
                    else
                      echo "ERROR: none of the ready endpoints ($CANDIDATES) is a confirmed read-write primary for $PRIMARY_SVC" >&2
                      exit 1
                    fi
                  fi
                  echo "Primary pod resolved to: $PRIMARY"

                  # Required so the first backup after a fresh install (or after a
                  # failover that promoted a node which was a standby at boot) creates
                  # the stanza on the actual primary. stanza-create is natively
                  # idempotent -- it exits 0 when the stanza already exists -- so it is
                  # NOT guarded with `|| true`: a real failure (S3 permissions, repo
                  # lock, a kubectl exec error, or a needed stanza-upgrade after a PG
                  # major upgrade) must abort here with the root-cause message under
                  # `set -eu -o pipefail`, not be masked into a misleading backup error.
                  echo "Ensuring stanza '$STANZA' exists..."
                  kubectl -n "$NAMESPACE" exec "$PRIMARY" -c pgbackrest -- \
                    pgbackrest --stanza="$STANZA" stanza-create

                  echo "Starting $BACKUP_TYPE backup..."
                  kubectl -n "$NAMESPACE" exec "$PRIMARY" -c pgbackrest -- \
                    pgbackrest --stanza="$STANZA" --type="$BACKUP_TYPE" backup

                  echo "$BACKUP_TYPE backup completed."
{{- if $root.Values.pgbackrest.info.enabled }}

                  # Record the repository state where a controller can read it without
                  # pgbackrest credentials or a control-API certificate (#343). `info` reads
                  # the REPOSITORY, not the node, so any pod would answer the same -- it runs
                  # in the sidecar that just backed up only because this is the one moment
                  # that knows a backup completed. Console logging off so nothing interleaves
                  # with the JSON; the sed drops anything pgBackRest prints to stdout BEFORE
                  # logging is configured (an unknown PGBACKREST_* option arriving through
                  # pgbackrest.extraEnv earns a WARN there); jq -e requires one valid document
                  # (empty input is exit 4, not an empty record), so a non-JSON answer fails
                  # here and the previous record stays intact. Files live under $HOME: that is
                  # the /tmp emptyDir here, and it lets the template test point it elsewhere.
                  kubectl -n "$NAMESPACE" exec "$PRIMARY" -c pgbackrest -- \
                    pgbackrest --stanza="$STANZA" --output=json --log-level-console=off info \
                    | sed -n '/^[[{]/,$p' | jq -ce . > "$HOME/info.json"
                  # The exit status is NOT the verdict: `pgbackrest info` exits 0 on a
                  # repository it cannot read (status "missing stanza data", code 3) and
                  # `verify` prints "completed successfully" on the same repository; only the
                  # JSON's status.code tells. Record first, whatever the code, so an unreadable
                  # repository stays distinguishable from an empty one -- then fail the Job on
                  # a non-zero code, so whatever alerts on a failed backup alerts on this too.
                  # The document is an ARRAY of stanzas (one here, --stanza filters), each with its
                  # own status; select ours by name rather than trusting the position.
                  INFO_STANZA='first(.[] | select(.name == $s))'
                  INFO_CODE=$(jq -r --arg s "$STANZA" "($INFO_STANZA | .status.code) // \"absent\"" "$HOME/info.json")
                  jq -n --arg type "$BACKUP_TYPE" --arg stanza "$STANZA" --arg primary "$PRIMARY" \
                    --arg code "$INFO_CODE" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --rawfile info "$HOME/info.json" \
                    '{ metadata: { annotations: {
                         "pg-ha/recorded-at": $at, "pg-ha/backup-type": $type, "pg-ha/stanza": $stanza,
                         "pg-ha/primary": $primary, "pg-ha/status-code": $code } },
                       data: { "info.json": ($info | rtrimstr("\n")) } }' > "$HOME/info-patch.json"
                  kubectl -n "$NAMESPACE" patch configmap "$INFO_CONFIGMAP" --type merge --patch-file "$HOME/info-patch.json"
                  echo "Recorded repository state in configmap/$INFO_CONFIGMAP: $(jq -r --arg s "$STANZA" "$INFO_STANZA"' | "status=\(.status.code) (\(.status.message)) backups=\(.backup | length) latest=\(.backup[-1].label // "none") repo-size=\(.backup[-1].info.repository.size // 0)"' "$HOME/info.json")"
                  if [ "$INFO_CODE" != "0" ]; then
                    echo "ERROR: pgbackrest info reports status.code=$INFO_CODE ($(jq -r --arg s "$STANZA" "($INFO_STANZA | .status.message) // \"stanza not in the document\"" "$HOME/info.json")) for stanza $STANZA -- the repository is not restorable even though the backup command exited 0" >&2
                    exit 1
                  fi
{{- else }}
                  echo "Repository state:"
                  kubectl -n "$NAMESPACE" exec "$PRIMARY" -c pgbackrest -- \
                    pgbackrest --stanza="$STANZA" info
{{- end }}
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PRIMARY_SVC
                  value: {{ include "pg.fullname" $root | quote }}
                - name: STANZA
                  value: {{ $root.Values.pgbackrest.stanza | quote }}
                - name: BACKUP_TYPE
                  value: {{ $type | quote }}
{{- if $root.Values.pgbackrest.info.enabled }}
                - name: INFO_CONFIGMAP
                  value: {{ printf "%s-pgbackrest-info" (include "pg.fullname" $root) | quote }}
{{- end }}
                # kubectl writes its discovery/http cache under $HOME; point it at the
                # writable /tmp emptyDir so the read-only root filesystem is enough (#117).
                - name: HOME
                  value: /tmp
{{- /* #323: this pod is an apiserver client -- it resolves the primary from EndpointSlices and
       drives pgbackrest with `kubectl exec`. On a cluster whose egress policy denies pod
       traffic to the apiserver, kubectl times out, the backup never runs AND stanza-create
       never runs (this CronJob is the only thing that creates the stanza), so archive_command
       fails on every WAL segment from the moment the cluster starts. `KUBECONFIG` plus a
       mounted kubeconfig sends it through an in-cluster proxy instead -- the same escape the
       agent got in #317, which had `postgresql.extraEnv` to use and this pod did not. */}}
{{- with $root.Values.pgbackrest.extraEnv }}
                {{- toYaml . | nindent 16 }}
{{- end }}
              resources:
                {{- toYaml $root.Values.pgbackrest.cronjob.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
{{- with $root.Values.pgbackrest.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
{{- end }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
{{- with $root.Values.pgbackrest.extraVolumes }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
