{{- include "pg.validatePgpoolReattach" . -}}
{{- include "pg.validatePgpoolAdminUsername" . -}}
{{- if .Values.pgpool.enabled }}
{{- /* Removed in favor of pgpool.admin.*; fail instead of silently falling
       back to the chart defaults when stale values are still set. */}}
{{- if or (hasKey .Values.pgpool "adminUsername") (hasKey .Values.pgpool "adminPassword") }}
{{- fail "pgpool.adminUsername and pgpool.adminPassword were removed: set pgpool.admin.username/pgpool.admin.password or bring your own Secret via pgpool.admin.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pg.fullname" . }}-pgpool
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgpool
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.pgpool.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgpool
  template:
    metadata:
      labels:
        {{- include "pg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgpool
      annotations:
        {{- /* pgpool.conf and pool_passwd are rendered into an emptyDir by
               the init container, so configmap changes only reach pods
               through a template-hash roll */}}
        checksum/pgpool-config: {{ include (print $.Template.BasePath "/pgpool-configmap.yaml") . | sha256sum }}
        {{- /* pcp.conf is generated into an emptyDir from the admin Secret,
               so chart-managed credential changes only apply via a roll */}}
        checksum/pgpool-admin-secret: {{ include (print $.Template.BasePath "/pgpool-secret.yaml") . | sha256sum }}
        {{- if .Values.pgpool.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9719"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.pgpool.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # pgpool makes no Kubernetes API calls, so don't mount an SA token (#166).
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.pgpool.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.pgpool.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- with .Values.pgpool.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.pgpool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pgpool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.pgpool.affinity }}
        {{- toYaml .Values.pgpool.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "pg.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: pgpool
              topologyKey: kubernetes.io/hostname
        {{- end }}
      securityContext:
        {{- toYaml .Values.pgpool.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-config
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pgpool.containerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              cp /config/pgpool.conf /usr/local/etc/pgpool.conf
              cp /config/pool_hba.conf /usr/local/etc/pool_hba.conf
              cp /config/pool_passwd /usr/local/etc/pool_passwd
              # pcp.conf entries are user:md5(password) -- pgpool's PCP auth
              # validates the password as plain md5(password) (what `pg_md5`
              # emits), NOT sha256, so sha256 made every pcp_* command fail.
              # Hashing here from the admin Secret keeps the credential out of
              # the ConfigMap. busybox md5sum of the raw password matches pg_md5.
              # One normalised copy feeds BOTH pcp.conf and .pcppass (#361 review): a
              # Secret written with `echo` carries a trailing newline, and hashing it
              # into pcp.conf while $(...) stripped it from .pcppass left the re-attach
              # loop unable to authenticate -- silently, until the first detach. $(...)
              # drops trailing newlines from both. A newline INSIDE the password cannot
              # be expressed in the line-based .pcppass (or typed to any pcp_* tool), so
              # that one is refused with the fix rather than shipped half-working.
              PCP_PASS=$(printf '%s' "$PCP_ADMIN_PASSWORD")
              nl='
              '
              case "$PCP_PASS" in *"$nl"*)
                echo "pgpool admin password contains a newline, which the PCP tools cannot carry; remove it from the admin Secret (pgpool.admin / pgpool.admin.existingSecret)" >&2; exit 1;;
              esac
              # The username is held to the same format (#375): pgpool splits each pcp.conf
              # line at the FIRST ':', so a user containing one can never authenticate -- and
              # since the probes authenticate over PCP, that used to restart pgpool in a loop
              # on every replica. The chart-managed value is refused at render time
              # (pg.validatePgpoolAdminUsername); an existing Secret is only visible here.
              PCP_USER=$(printf '%s' "$PCP_ADMIN_USER")
              case "$PCP_USER" in *:*|*"$nl"*)
                echo "pgpool admin username contains ':' or a newline, which pcp.conf (user:md5 per line, split at the first ':') cannot carry, so no PCP client could authenticate as it; choose another username (pgpool.admin.username, or the usernameKey of pgpool.admin.existingSecret)" >&2; exit 1;;
              esac
              printf '%s:%s\n' "$PCP_USER" "$(printf '%s' "$PCP_PASS" | md5sum | cut -d' ' -f1)" > /usr/local/etc/pcp.conf
              # The username on its own, for the re-attach loop and the probes
              # (pg.pgpoolPcpPrelude): nothing parses pcp.conf back.
              printf '%s\n' "$PCP_USER" > /usr/local/etc/pcp_user
              chmod 0600 /usr/local/etc/pcp_user
              # .pcppass for the re-attach loop in the pgpool container (#361): the pcp_*
              # tools read it through PCPPASSFILE, 0600 like libpq's pgpass. It lives in
              # the emptyDir beside pcp.conf, so the PCP password never enters the pgpool
              # container's environment. Same escaping as pgpass: \ -> \\, : -> \:
              PCP_PASS_ESC=$(printf '%s' "$PCP_PASS" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              PCP_USER_ESC=$(printf '%s' "$PCP_USER" | sed -e 's/\\/\\\\/g')
              printf '127.0.0.1:9898:%s:%s\n' "$PCP_USER_ESC" "$PCP_PASS_ESC" > /usr/local/etc/.pcppass
              chmod 0600 /usr/local/etc/.pcppass
              # Byte-safe placeholder splice: sed replacement corrupts
              # values containing / & or \, and awk -v assignments eat
              # backslashes, so values travel via ENVIRON.
              subst() {
                awk '
                  function splice(s, ph, val,   out, i) {
                    out = ""
                    while (i = index(s, ph)) { out = out substr(s, 1, i - 1) val; s = substr(s, i + length(ph)) }
                    return out s
                  }
                  { $0 = splice($0, "__POSTGRES_USER__", ENVIRON["SUB_USER"])
                    $0 = splice($0, "__POSTGRES_PASSWORD__", ENVIRON["SUB_PASS"])
                    $0 = splice($0, "__POSTGRES_DB__", ENVIRON["SUB_DB"])
                    $0 = splice($0, "__CHECK_USER__", ENVIRON["SUB_CHECK_USER"])
                    $0 = splice($0, "__CHECK_PASSWORD__", ENVIRON["SUB_CHECK_PASS"])
                    $0 = splice($0, "__APP_USER__", ENVIRON["SUB_APP_USER"])
                    $0 = splice($0, "__APP_PASSWORD__", ENVIRON["SUB_APP_PASS"])
                    print }
                ' "$1" > "$1.tmp" && mv "$1.tmp" "$1"
              }
              # pgpool.conf placeholders sit inside single-quoted strings;
              # its lexer escapes with backslash, not SQL-style doubling:
              # \ -> \\ first, then ' -> \'
              SUB_USER=$(printf '%s' "$POSTGRES_USER" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")
              SUB_PASS=$(printf '%s' "$POSTGRES_PASSWORD" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")
              SUB_DB=$(printf '%s' "$POSTGRES_DB" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")
              SUB_CHECK_USER=$(printf '%s' "$PGPOOL_CHECK_USER" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")
              SUB_CHECK_PASS=""
              SUB_APP_USER=""
              SUB_APP_PASS=""
              export SUB_USER SUB_PASS SUB_DB SUB_CHECK_USER SUB_CHECK_PASS SUB_APP_USER SUB_APP_PASS
              subst /usr/local/etc/pgpool.conf
              # pool_passwd escapes backslash and the field separator with
              # backslash: \ -> \\ first, then : -> \:
              SUB_USER=$(printf '%s' "$POSTGRES_USER" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              SUB_PASS=$(printf '%s' "$POSTGRES_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              SUB_DB="$POSTGRES_DB"
              SUB_CHECK_USER=$(printf '%s' "$PGPOOL_CHECK_USER" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              SUB_CHECK_PASS=$(printf '%s' "$PGPOOL_CHECK_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              SUB_APP_USER=$(printf '%s' "$APP_USER" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              SUB_APP_PASS=$(printf '%s' "$APP_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')
              subst /usr/local/etc/pool_passwd
{{- if .Values.pgpool.tls.enabled }}
              # Stage TLS certs from the read-only Secret mounts into the emptyDir with
              # a 0600 key (pgpool/libpq reject a group/world-readable key), like the
              # config staging above (#110).
              mkdir -p /usr/local/etc/tls
              cp /config-tls/tls.crt /usr/local/etc/tls/tls.crt
              cp /config-tls/tls.key /usr/local/etc/tls/tls.key
              chmod 0600 /usr/local/etc/tls/tls.key
              [ -f /config-tls/ca.crt ] && cp /config-tls/ca.crt /usr/local/etc/tls/ca.crt
{{- if .Values.pgpool.tls.backendClientCert }}
              cp /config-tls-backend/tls.crt /usr/local/etc/tls/backend.crt
              cp /config-tls-backend/tls.key /usr/local/etc/tls/backend.key
              chmod 0600 /usr/local/etc/tls/backend.key
{{- end }}
{{- end }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
            - name: PGPOOL_CHECK_USER
              value: {{ include "pg.pgpoolCheckUsername" . | quote }}
            - name: PGPOOL_CHECK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPgpoolCheckPasswordKey" . }}
            - name: APP_USER
              value: {{ include "pg.appUsername" . | quote }}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretAppPasswordKey" . }}
            - name: PCP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgpoolAdminSecretName" . }}
                  key: {{ include "pg.pgpoolAdminUsernameKey" . }}
            - name: PCP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgpoolAdminSecretName" . }}
                  key: {{ include "pg.pgpoolAdminPasswordKey" . }}
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: pgpool-config
              mountPath: /usr/local/etc
{{- if .Values.pgpool.tls.enabled }}
            - name: pgpool-tls
              mountPath: /config-tls
              readOnly: true
{{- if .Values.pgpool.tls.backendClientCert }}
            - name: pgpool-tls-backend
              mountPath: /config-tls-backend
              readOnly: true
{{- end }}
{{- end }}
        {{- /* Hold pgpool back until its check role can log in. The role is created by the
               agent on the primary (HA) or the postStart hook (standalone), and on an upgrade
               this pod can start before that has run. Started without it, every health
               check fails, the RO backend is detached and the probes -- which route through
               pgpool -- fail too. Waiting here instead keeps the new pod out of service
               (maxUnavailable 0: the old pods keep serving) and the reason in this
               container's log. No deadline: a role that never appears is a provisioning
               failure the agent's log or the FailedPostStartHook event names, and giving up
               would only start pgpool into the broken state. Same backend and TLS as
               pgpool's own checks. */}}
        - name: wait-check-role
          image: {{ include "pg.image" .Values.pgpool.image | quote }}
          imagePullPolicy: {{ .Values.pgpool.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pgpool.containerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              until err=$(PGCONNECT_TIMEOUT=5 psql -h {{ printf "%s.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }} -p 5432 -U "$PGPOOL_CHECK_USER" -d "$POSTGRES_DB" --no-psqlrc -tAc "SELECT 1" 2>&1 >/dev/null); do
                echo "waiting for pgpool check role $PGPOOL_CHECK_USER to log in: $err"
                sleep 5
              done
              echo "pgpool check role $PGPOOL_CHECK_USER logs in; starting pgpool"
          env:
{{- include "pg.pgpoolBackendTLSEnv" . | nindent 12 }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
            - name: PGPOOL_CHECK_USER
              value: {{ include "pg.pgpoolCheckUsername" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPgpoolCheckPasswordKey" . }}
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
          volumeMounts:
            - name: pgpool-config
              mountPath: /usr/local/etc
      containers:
        - name: pgpool
          image: {{ include "pg.image" .Values.pgpool.image | quote }}
          imagePullPolicy: {{ .Values.pgpool.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pgpool.containerSecurityContext | nindent 12 }}
          command:
          {{- with .Values.pgpool.command }}
            {{- toYaml . | nindent 12 }}
          {{- else }}
            - /bin/sh
            - -c
            - |
              # Reap SysV shmem/semaphores orphaned by a prior OOM-killed pgpool in
              # this pod's IPC namespace before allocating new ones. A container OOM
              # kill (pod cgroup memory.oom.group=0) leaves the pod -- and its IPC
              # namespace -- alive, but SIGKILL can't run shmctl(IPC_RMID), so each
              # restart strands another ~136Mi segment. After enough cycles the pod
              # cgroup fills and the kernel OOM-kills runc init before pgpool runs,
              # wedging the pod in a crash loop recoverable only by pod deletion
              # (#234). The namespace holds nothing but pgpool's own orphans (the
              # exporter sidecar uses no SysV IPC), so `ipcrm -a` is safe here.
              # stderr is left visible (a missing ipcrm or a permission error is a
              # signal worth logging); `|| true` keeps a no-op reap non-fatal so a
              # healthy first boot with nothing to remove still starts pgpool.
              ipcrm -a || true
{{- if .Values.pgpool.reattach.enabled }}
              # Re-attach loop (#361). The RO backend is detachable (see pgpool.conf), and
              # pgpool never health-checks a detached node, so something has to bring it
              # back when the standby returns. pgpool's auto_failback cannot: it matches
              # backend_application_name against pg_stat_replication and the agent names
              # standbys by pod, which the -readonly Service backend can never equal. So:
              # every interval, each backend pgpool reports "down" that answers pg_isready
              # again is re-attached with pcp_attach_node. That includes a node an operator
              # detached by hand with pcp_detach_node: under this chart membership is the
              # agent's (pg-role labels and the Services), not pgpool's, so to keep a
              # standby out of the read pool make it unready or scale it away, and to run
              # pgpool-level manual control set pgpool.reattach.enabled=false first
              # (#361 review). A background sibling of pgpool,
              # not a sidecar: it needs pgpool's own PCP port, credentials and tools, and
              # nothing else. It stays alive for the pod's life, so pgpool (PID 1 after
              # the exec) never has to reap it. pgpool.command replaces this whole block;
              # pg.validatePgpoolReattach refuses that pairing at render time.
              (
                {{- include "pg.pgpoolPcpPrelude" . | nindent 16 }}
                pcp_ok=1
                sleep 15
                while :; do
                  # One PCP call lists every backend, one per line:
                  #   hostname port status weight status_name backend_status role ...
                  if pcp_info; then
                    [ "$pcp_ok" = 1 ] || echo "[reattach] PCP answers again"
                    pcp_ok=1
                    printf '%s\n' "$info" | awk '$5 == "down" { print NR - 1, $1, $2 }' | while read -r idx host port; do
                      if pg_isready -h "$host" -p "$port" -t 3 >/dev/null 2>&1; then
                        echo "[reattach] backend $idx ($host:$port) answers again; re-attaching (#361)"
                        pcp_attach_node -h 127.0.0.1 -p 9898 -U "$PCP_USER" -w -n "$idx" 2>&1 | sed 's/^/[reattach] /'
                      fi
                    done
                  elif [ "$pcp_ok" = 1 ]; then
                    # Once per episode, not every pass. Silent failure here would leave a
                    # detached backend detached for good with nothing in the log: the
                    # liveness probe is pinned to the primary and no longer restarts pgpool
                    # over a missing read backend. Causes seen: an unreadable .pcppass, an
                    # image without the pcp tools (a PCP user with ':' in it is refused at
                    # boot since #375).
                    echo "[reattach] pcp_node_info failed; nothing will be re-attached until this clears: $info"
                    pcp_ok=0
                  fi
                  sleep {{ int .Values.pgpool.reattach.interval }}
                done
              ) &
{{- end }}
              exec pgpool -D -n -f /usr/local/etc/pgpool.conf -F /usr/local/etc/pcp.conf -a /usr/local/etc/pool_hba.conf
          {{- end }}
          ports:
            - name: pgpool
              containerPort: 9999
              protocol: TCP
            - name: pcp
              containerPort: 9898
              protocol: TCP
          env:
{{- include "pg.pgpoolBackendTLSEnv" . | nindent 12 }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
          # Probes ask pgpool itself, over PCP, and open no PostgreSQL session. Any session
          # through pgpool -- whatever the role -- makes pgpool open a backend connection and
          # keep it cached in that child, and a probe lands on a different one of the
          # numInitChildren children each time. On a node at max_connections those
          # connections came out of a reserve and stayed there: as the superuser they took
          # superuser_reserved_connections from the agent; as pgpool.checkUser they would
          # take reserved_connections from pgpool's own health checks; as the application
          # role a full node would fail the probes and restart the proxy.
          # Liveness: PCP answers and at least one backend is not down. That still catches
          # the #122 wedge -- a pgpool that accepts TCP but rejects every session with "all
          # backend nodes are down" -- and restarts it with a fresh status file.
          # Readiness: PCP answers, backend 0 -- the primary, the write path -- answers
          # pg_isready, and at least one pgpool child is free ("Wait for connection" in
          # pcp_proc_info -a -v). A read backend that is detached or lagging must not make the
          # proxy unready (#361); the re-attach loop brings it back. The free-child check is
          # the part of the old session probe worth keeping: with every child busy or hung,
          # new sessions queue until they time out, so the pod should leave the Service
          # (readiness only -- liveness does not restart a pgpool that is merely saturated).
          # "Idle" is a child still holding a connected client, so it does not count.
          #
          # Backend 0 is asked DIRECTLY (#374), because pgpool's own view of it can never say
          # down: it is ALWAYS_PRIMARY|DISALLOW_TO_FAILOVER (pgpool.conf), so a failed health
          # check never detaches it and the "node 0 is up or waiting" clause this replaced was
          # true with the primary unreachable, leaving pgpool Ready while every session failed.
          # pg_isready sends a startup packet and reads the answer -- no session, no auth, no
          # reserve slot -- and rc 0 only: a primary in crash recovery (rc 1) takes no writes.
          # Its host and port come from the rendered pgpool.conf (the RW Service in HA, pod 0
          # in standalone), so the probe and pgpool agree on what backend 0 is. Failover
          # interaction: the agent re-points the RW Service within a lease term plus the
          # promote (~20-40s on chart defaults) while readiness needs 6 failures 10s apart,
          # so an ordinary failover never empties the pgpool endpoints; a primary gone for
          # 60s+ does, which is the behaviour the README describes.
          #
          # A PCP AUTHENTICATION fault is fail-open on both probes (#375). pgpool answered, so
          # it is alive, and a restart cannot mint credentials: before #365 the same fault only
          # stalled the re-attach loop, while here it restarted every replica in a loop and
          # took the pooled endpoint down. The episode is logged once to the container log
          # (pcp_auth_note); the one known cause, a ':' in the admin username, is refused at
          # render time and at boot. PCP not answering at all still fails both probes.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- include "pg.pgpoolPcpPrelude" . | nindent 18 }}
                  pcp_info; rc=$?
                  [ "$rc" = 2 ] && { pcp_auth_note fail; exit 0; }
                  [ "$rc" = 0 ] || exit 1
                  pcp_auth_note ok
                  printf '%s\n' "$info" | awk '$5 != "" && $5 != "down" { live = 1 } END { exit !live }'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- include "pg.pgpoolPcpPrelude" . | nindent 18 }}
                  pcp_info; rc=$?
                  [ "$rc" = 2 ] && { pcp_auth_note fail; exit 0; }
                  [ "$rc" = 0 ] || exit 1
                  pcp_auth_note ok
                  host=$(sed -n "s/^backend_hostname0 = '\(.*\)'$/\1/p" /usr/local/etc/pgpool.conf)
                  port=$(sed -n "s/^backend_port0 = \(.*\)$/\1/p" /usr/local/etc/pgpool.conf)
                  [ -n "$host" ] && [ -n "$port" ] || exit 1
                  pg_isready -h "$host" -p "$port" -t 3 -q || exit 1
                  procs=$(pcp_proc_info -h 127.0.0.1 -p 9898 -U "$PCP_USER" -w -a -v) || exit 1
                  printf '%s\n' "$procs" | grep -q '^Status *: Wait for connection'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.pgpool.resources | nindent 12 }}
          volumeMounts:
            - name: pgpool-config
              mountPath: /usr/local/etc
{{- if .Values.pgpool.metrics.enabled }}
        - name: pgpool-exporter
          image: {{ include "pg.image" .Values.pgpool.metrics.image | quote }}
          imagePullPolicy: {{ .Values.pgpool.metrics.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.pgpool.containerSecurityContext | nindent 12 }}
          env:
            {{- /* The exporter logs in as pgpool's check role, not the superuser. It only runs
                   pgpool's own SHOW POOL_* commands, but its session still makes pgpool open a
                   backend connection to every backend; as the superuser that connection came
                   out of superuser_reserved_connections on a full node, the agent's slots. As
                   the check role it comes out of reserved_connections, which counts it
                   (pg.reservedConnections), and pgpool metrics keep working while a node is
                   full. pgpool2_exporter caps its pool at one connection (SetMaxOpenConns(1),
                   also on reconnect), so it is one session per pgpool replica. */}}
            - name: POSTGRES_USERNAME
              value: {{ include "pg.pgpoolCheckUsername" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPgpoolCheckPasswordKey" . }}
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
            - name: PGPOOL_SERVICE
              value: "localhost"
            - name: PGPOOL_SERVICE_PORT
              value: "9999"
            - name: SSLMODE
              value: {{ if .Values.pgpool.tls.enabled }}"require"{{ else }}"disable"{{ end }}
          ports:
            - name: metrics
              containerPort: 9719
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: {{ .Values.pgpool.metrics.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.pgpool.metrics.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.pgpool.metrics.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.pgpool.metrics.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: {{ .Values.pgpool.metrics.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.pgpool.metrics.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.pgpool.metrics.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.pgpool.metrics.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.pgpool.metrics.resources | nindent 12 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pg.fullname" . }}-pgpool
        - name: pgpool-config
          emptyDir:
            sizeLimit: 16Mi
{{- if .Values.pgpool.tls.enabled }}
        - name: pgpool-tls
          secret:
            secretName: {{ required "pgpool.tls.enabled requires pgpool.tls.existingSecret (a Secret with keys tls.crt, tls.key[, ca.crt])" .Values.pgpool.tls.existingSecret | quote }}
            defaultMode: 0444
{{- if .Values.pgpool.tls.backendClientCert }}
        - name: pgpool-tls-backend
          secret:
            secretName: {{ .Values.pgpool.tls.backendClientCert | quote }}
            defaultMode: 0444
{{- end }}
{{- end }}
{{- end }}
