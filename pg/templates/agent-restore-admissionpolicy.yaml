{{- include "pg.normalizeValues" . -}}
{{- if eq (include "pg.controlRestoreEnabled" .) "true" }}
{{- if .Values.ha.agent.control.restore.admissionPolicy.enabled }}
{{- /* Bound the restore Job-create grant by CONTENT, not just by verb (#279).

       rbac.yaml has to hand the database pods' ServiceAccount `create` on `batch/jobs`,
       and RBAC cannot restrict a create by resourceName -- the API server does not know
       the object's name at authorization time. So that grant alone lets anything holding
       the token (i.e. anything that achieves code execution in a PostgreSQL running
       user-supplied SQL) create ARBITRARY Jobs in the namespace, and a Job's pod may name
       any ServiceAccount with no separate permission check. That is a namespace-wide
       privilege-escalation primitive, and it is why control.restore shipped in 1.9.0 as
       "leave it off unless the trade is worth it".

       The restriction has to happen at a layer RBAC does not reach. ValidatingAdmission-
       Policy is exactly that layer: it is in-tree and GA since Kubernetes 1.30, so this
       adds no webhook, no serving certificate and no new failure domain -- unlike a
       webhook, there is nothing here that can be down.

       WHAT THIS DOES AND DOES NOT ACHIEVE. The validations below pin the Job to the shape
       this release's own restore template renders: one deterministic name, this release's
       ServiceAccount with no token, this release's image running this release's restore
       command, this release's volumes, env, placement and security contexts, and a single
       pod. Two things are left, both documented in README.md rather than papered over:

         * The RECOVERY POINT (the literal env values TARGET_TYPE, TARGET, BACKUP_SET). So a
           token holder can run this release's own restore, to a point of their choosing,
           without going through the control API's mTLS and restore.allowedClientCNs.
           Inherent to `create jobs` and not closable by admission -- picking the point is
           what a restore IS, and the API overrides exactly these three on purpose.

           FORCE is deliberately NOT in that list (#283). It is not a recovery-point choice;
           it is the switch that disarms pgBackRest's postmaster.pid interlock, and that
           interlock is the only reason "a restore over the live PGDATA" needs the
           StatefulSet already scaled to 0 rather than working against a running primary at
           any moment. Rule 17 pins it to whatever pgbackrest.restore.force renders, so the
           bypass stays a reviewed, git-visible values change and not something the
           job-create grant can reach for.
         * Code execution inside the pinned container. The command pin is not a sandbox.
           Rule 18 closes the env route (BASH_ENV, LD_PRELOAD and every other unlisted name
           are denied), but restore.sh itself runs pgbackrest against the mounted PGDATA
           with the free recovery-point parameters, and an actor who already runs code in
           the postgresql container can shape what that volume contains. What any of it
           reaches is uid 101 with no token and only this release's volumes -- the
           privileges already held, which is the bar this policy is written to -- but it
           is not a proof that "only restore.sh can run", and the pins below (image,
           security contexts, volumes, env) are what keep it at that bar rather than the
           command pin alone.

       Both are why the feature stays opt-in.

       This is also defence in depth ON TOP OF the agent's own bounds (verbatim jobTemplate
       clone, valueFrom env never overwritten, podOrdinal not an API decision, never
       --force), not a replacement for them: those bound what the AGENT builds, and this
       bounds what anyone else holding the same token can build. FORCE is the one input both
       layers cover: the agent never sets it, and rule 17 denies anyone else who does.

       The >= 1.30 requirement is enforced below by asking whether the API GROUP EXISTS,
       not by comparing `.Capabilities.KubeVersion` against 1.30. The version comparison
       looks equivalent and is not: with no cluster to query, `.Capabilities.KubeVersion`
       is the HELM CLIENT'S OWN built-in version (helm 3.14 reports v1.29), so a semver
       floor fails every `helm template` run by a slightly older helm -- CI, a GitOps
       dry-run, `helm diff` -- regardless of what the target cluster actually is. Asking
       for the API group is also the more accurate question: it is true wherever the kind
       can be created and false where 1.30+ has it disabled via --runtime-config.

       `.Capabilities.APIVersions` is safe to consult here BECAUSE this is a fail and not
       a silent skip. Helm's no-cluster default set already contains
       admissionregistration.k8s.io/v1 (53 entries, not core/v1 only), so `helm template`
       and the kubeconform gate render the policy without a cluster; a real install or
       upgrade replaces that set with server discovery, which is what makes the fail fire
       on a cluster that genuinely cannot host it. helm-unittest's default set is the one
       exception -- it does NOT include the group -- so the suite declares it, and the
       fail's own test is the suite that declines to. */}}
{{- /* Fail at render time, not at apply time: without this, an upgrade from 1.9.0 on a
       cluster without the API renders clean and then aborts mid-apply with "no matches for
       kind ValidatingAdmissionPolicy", leaving the release in a failed state. */}}
{{- if not (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1") }}
{{- fail (printf "ha.agent.control.restore needs admissionregistration.k8s.io/v1 for the ValidatingAdmissionPolicy that bounds its `create jobs` grant, and this cluster does not expose it -- it is GA from Kubernetes 1.30 (this cluster reports %s), and can also be disabled by --runtime-config (#279). Upgrade or enable the API, or set ha.agent.control.restore.admissionPolicy.enabled=false together with acknowledgeUnbounded=true to run the feature with an unbounded grant deliberately" .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- $fullname := include "pg.fullname" . }}
{{- $guard := include "pg.restoreGuardName" . }}
{{- /* The Secrets the rendered restore Job legitimately reads through secretKeyRef. Any
       other Secret in the namespace must stay unreachable: a Job that could mount or
       project an arbitrary Secret would be the same exfiltration primitive by another
       route. Built from the same values the Job's env is built from, so the two cannot
       disagree. */}}
{{- $secretRefs := list }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
{{- $secretRefs = append $secretRefs (include "pg.pgbackrestS3SecretName" .) }}
{{- end }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
{{- $secretRefs = append $secretRefs .Values.pgbackrest.repoEncryption.existingSecret.name }}
{{- end }}
{{- /* #323 review: pgbackrest.extraEnv/extraVolumes reach the restore Job too, and this policy
       pins the Job the AGENT creates by cloning that same spec (k8s.CloneCronJobToJob). Left
       out of these rules, an operator who added a kubeconfig to fix backups would find
       POST /v1/restore denied at admission -- during an incident, with the release itself
       looking correct. So the passthrough's own sources are folded into the pins, by NAME and
       by TYPE: the policy still refuses everything the release did not declare, which is the
       property it exists for (the threat is a compromised agent, not the values file).

       A source this cannot pin by name -- projected, csi, downwardAPI, hostPath, an env
       resourceFieldRef -- is a RENDER failure rather than a silent widening or a silent
       breakage: admitting `has(v.projected)` would readmit arbitrary Secrets through the
       exact door rule 15 exists to close. */}}
{{- $extraVolPins := list }}
{{- range $i, $v := (.Values.pgbackrest.extraVolumes | default list) }}
{{- $vn := $v.name | toString }}
{{- /* hasKey, not truthiness (#323 review): `emptyDir: {}` is the canonical spelling and an
       empty map is FALSY in Go templates, so a truth test sends it to the fail below --
       rejecting the one source that needs no pin at all. */}}
{{- if hasKey $v "emptyDir" }}
{{- /* already admitted by the emptyDir clause */}}
{{- else if hasKey $v "configMap" }}
{{- $extraVolPins = append $extraVolPins (dict "kind" "configMap" "field" "name" "value" ($v.configMap.name | toString)) }}
{{- else if hasKey $v "secret" }}
{{- $extraVolPins = append $extraVolPins (dict "kind" "secret" "field" "secretName" "value" ($v.secret.secretName | toString)) }}
{{- else if hasKey $v "persistentVolumeClaim" }}
{{- $extraVolPins = append $extraVolPins (dict "kind" "persistentVolumeClaim" "field" "claimName" "value" ($v.persistentVolumeClaim.claimName | toString)) }}
{{- else }}
{{- fail (printf "pgbackrest.extraVolumes[%d] (%s) is a volume source this chart cannot pin in the restore admission policy (#279/#323): only emptyDir, configMap, secret and persistentVolumeClaim carry a name the policy can bind to, and admitting an unpinned source would let the agent's Jobs mount anything of that type. The restore Job would be denied at admission the moment the agent tried to create it. Use one of those four sources, or -- if you need this one -- disable the policy deliberately with ha.agent.control.restore.admissionPolicy.enabled=false plus acknowledgeUnbounded=true" $i $vn) }}
{{- end }}
{{- end }}
{{- /* Mount pins (rule 19, #283 review). Rule 15 closes the set of volume SOURCES; on its own
       that is not enough, because it does not say where each source may be mounted. The
       permitted data PVC mounted at /scripts replaces the pinned command's body with bytes
       the caller wrote into PGDATA earlier (the threat model here is code execution in the
       postgresql container, which owns that volume); mounted at /etc/pgbackrest/conf.d it
       supplies every pgbackrest option rule 18 keeps out of the env. So each mount is bound
       to (mountPath, subPath, source kind) exactly as the jobTemplate renders it. For
       pgbackrest.extraVolumeMounts the source is the pgbackrest.extraVolumes entry of the same
       name; a mount that names no such volume is already a render failure in
       pg.validatePgbackrestPassthrough, and the fail below only guards this file's own
       assumption should that validator ever be relaxed. */}}
{{- $extraMountPins := list }}
{{- range $i, $m := (.Values.pgbackrest.extraVolumeMounts | default list) }}
{{- $mn := $m.name | toString }}
{{- $src := dict }}
{{- range $v := ($.Values.pgbackrest.extraVolumes | default list) }}
{{- if eq ($v.name | toString) $mn }}{{- $src = $v }}{{- end }}
{{- end }}
{{- if not $src }}
{{- fail (printf "pgbackrest.extraVolumeMounts[%d] (%s) names no pgbackrest.extraVolumes entry, so the restore admission policy cannot bind its mountPath to a source (#283): the Job would be rejected by the API server for the dangling volume name regardless. Declare a pgbackrest.extraVolumes entry named %q, or remove the mount." $i $mn $mn) }}
{{- end }}
{{- /* /etc/pgbackrest/conf.d is pgbackrest's config-include-path, and #323 admits a passthrough
       mount there on purpose (operator-managed option fragments). With THIS grant in play it is
       different (#283 review round 4): the pods' ServiceAccount holds `create configmaps`, so if
       the named ConfigMap does not exist yet -- a typo, GitOps ordering -- a token holder
       creates it and gets arbitrary pgbackrest options under the pinned command
       (repo1-host-cmd is code execution). Nothing at render time can check existence, so the
       mount is refused while control.restore is enabled; without the grant the risk is not
       there and #323's behaviour is untouched. */}}
{{- $mp := $m.mountPath | toString }}
{{- /* Compared NORMALISED (collapsed slashes, no trailing slash), for the reason the passthrough
       validator gives: runc resolves //etc/pgbackrest//conf.d to the same directory. The pin
       below still uses the raw string, because that is what the jobTemplate renders. */}}
{{- $mpNorm := regexReplaceAll "/+" $mp "/" | trimSuffix "/" }}
{{- if or (eq $mpNorm "/etc/pgbackrest/conf.d") (hasPrefix "/etc/pgbackrest/conf.d/" $mpNorm) }}
{{- fail (printf "pgbackrest.extraVolumeMounts[%d] (%s): mountPath %q is at or under /etc/pgbackrest/conf.d, pgbackrest's config-include-path, and ha.agent.control.restore is enabled (#283). The pods' ServiceAccount can create ConfigMaps, so a fragment directory sourced from a ConfigMap that does not exist yet would let a token holder inject pgbackrest options (repo1-host-cmd is code execution) into the restore Job the admission policy otherwise pins. Move the fragment out of conf.d, or run the restore API without control.restore" $i $mn $mp) }}
{{- end }}
{{- $pin := dict "path" $mp "subPath" (($m.subPath | default "") | toString) "kind" "" "field" "" "value" "" }}
{{- if hasKey $src "emptyDir" }}{{- $_ := set $pin "kind" "emptyDir" }}
{{- else if hasKey $src "configMap" }}{{- $_ := set $pin "kind" "configMap" }}{{- $_ := set $pin "field" "name" }}{{- $_ := set $pin "value" ($src.configMap.name | toString) }}
{{- else if hasKey $src "secret" }}{{- $_ := set $pin "kind" "secret" }}{{- $_ := set $pin "field" "secretName" }}{{- $_ := set $pin "value" ($src.secret.secretName | toString) }}
{{- else if hasKey $src "persistentVolumeClaim" }}{{- $_ := set $pin "kind" "persistentVolumeClaim" }}{{- $_ := set $pin "field" "claimName" }}{{- $_ := set $pin "value" ($src.persistentVolumeClaim.claimName | toString) }}
{{- end }}
{{- $extraMountPins = append $extraMountPins $pin }}
{{- end }}
{{- /* The env NAME allowlist (rule 18, #283 review). Rule 16 bounds where a valueFrom may
       read from and rule 17 pins FORCE, but neither says anything about which literal env
       entries may exist -- and pgbackrest reads any PGBACKREST_<OPTION> from the environment
       (the mechanism this very Job uses for PGBACKREST_STANZA and PGBACKREST_LOG_PATH). So a
       Job carrying the rendered FORCE=false plus PGBACKREST_FORCE=y would pass rule 17 and
       still restore --force over a running primary; PGBACKREST_REPO1_S3_BUCKET/ENDPOINT
       would redirect the restore's SOURCE to a repository the attacker controls; and
       BASH_ENV / LD_PRELOAD are code execution before the pinned command runs a line. The
       fix is the same shape as the volume rule: enumerate exactly what the jobTemplate
       renders and deny every other name.

       Three tiers, mirroring pgbackrest-restore-job.yaml entry by entry (the drift test in
       tests/test-template.sh compares the two renders, so a new env there fails here):
         - $envPinned:    pinned by value. The chart constants -- PGDATA is what the shell
                          interlock tests (`-f "$PGDATA/postmaster.pid"`), so a free PGDATA
                          would point that check at a directory that does not exist -- and
                          every LITERAL pgbackrest.extraEnv entry (see the loop below for why
                          an operator-declared name must not come with a caller-chosen value).
         - $envFree:      name allowed, value free. The recovery point (the API overrides
                          TARGET_TYPE/TARGET/BACKUP_SET), the stanza (the repository itself
                          comes from the pinned ConfigMap volume, so another stanza name only
                          selects within this release's own repo), FORCE (rule 17 owns its
                          value), and the console log level the agent adds under readPodLogs.
         - $envValueFrom: must STAY valueFrom. The credentials and the requester come from a
                          Secret or the downward API; a literal under the same name would be
                          an attacker-supplied credential that rule 16 never sees (it only
                          inspects entries that HAVE a valueFrom).
       PGBACKREST_LOG_LEVEL_CONSOLE is not in the jobTemplate: the agent appends it when
       ha.agent.control.restore.readPodLogs is on (restoreEnvOverrides), so the allowlist
       carries it unconditionally -- a log level is harmless, and a policy that denied the
       agent's own Job whenever the operator toggled log reading would be the outage this
       whole file is written to avoid. */}}
{{- $envPinned := dict "PGDATA" "/var/lib/postgresql/data/pgdata" "PGBACKREST_LOG_PATH" "/work/pgbackrest-log" "PGBACKREST_LOCK_PATH" "/work/pgbackrest-lock" }}
{{- $envFree := list "PGBACKREST_STANZA" "TARGET_TYPE" "TARGET" "BACKUP_SET" "FORCE" "PGBACKREST_LOG_LEVEL_CONSOLE" }}
{{- $envValueFrom := list "RESTORE_REQUESTED_BY" }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
{{- $envValueFrom = append $envValueFrom "PGBACKREST_REPO1_CIPHER_PASS" }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
{{- $envValueFrom = concat $envValueFrom (list "PGBACKREST_REPO1_S3_KEY" "PGBACKREST_REPO1_S3_KEY_SECRET") }}
{{- end }}
{{- /* (name, key) pairs, not names alone (#283 review round 4): rule 16 admitting a Secret by
       NAME lets a caller read any OTHER key of that Secret into a free env such as TARGET --
       and restore.sh writes target= into the status file on the data PVC, which the modeled
       attacker reads. Every key is known at render time, so it is pinned with the name. */}}
{{- $secretKeyPins := list }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
{{- $secretKeyPins = append $secretKeyPins (dict "name" (include "pg.pgbackrestS3SecretName" .) "key" (.Values.pgbackrest.existingSecret.accessKeyIdKey | toString)) }}
{{- $secretKeyPins = append $secretKeyPins (dict "name" (include "pg.pgbackrestS3SecretName" .) "key" (.Values.pgbackrest.existingSecret.secretAccessKeyKey | toString)) }}
{{- end }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
{{- $secretKeyPins = append $secretKeyPins (dict "name" (.Values.pgbackrest.repoEncryption.existingSecret.name | toString) "key" (.Values.pgbackrest.repoEncryption.existingSecret.passphraseKey | toString)) }}
{{- end }}
{{- $cmKeyPins := list }}
{{- $extraSecretRefs := list }}
{{- $extraCmRefs := list }}
{{- $extraEnvNames := list }}
{{- /* Operator values are emitted as JSON (double-quoted CEL) string literals, not through the
       single-quote charset check (#283 review round 3): NO_PROXY is comma-separated by
       definition, PGOPTIONS carries `=` and spaces, and a proxy URL may carry a query string.
       CEL's double-quoted literal takes the same escapes JSON does, so toJson is exact for any
       string, `"`/`\`/newline included -- no charset needed, no render regression. An EMPTY
       value is pinned as "absent or empty": core/v1.EnvVar.Value is `omitempty`, so the
       apiserver's unstructured form drops it and has(e.value) is false for a legitimate
       `value: ""` -- a pin requiring has(e.value) would deny the release's own Job. */}}
{{- $extraEnvPinned := dict }}
{{- range $i, $e := (.Values.pgbackrest.extraEnv | default list) }}
{{- $en := $e.name | toString }}
{{- $extraEnvNames = append $extraEnvNames $en }}
{{- with $e.valueFrom }}
{{- $envValueFrom = append $envValueFrom $en }}
{{- if hasKey . "secretKeyRef" }}
{{- $extraSecretRefs = append $extraSecretRefs (.secretKeyRef.name | toString) }}
{{- $secretKeyPins = append $secretKeyPins (dict "name" (.secretKeyRef.name | toString) "key" (.secretKeyRef.key | toString)) }}
{{- else if hasKey . "configMapKeyRef" }}
{{- $extraCmRefs = append $extraCmRefs (.configMapKeyRef.name | toString) }}
{{- $cmKeyPins = append $cmKeyPins (dict "name" (.configMapKeyRef.name | toString) "key" (.configMapKeyRef.key | toString)) }}
{{- else if not (hasKey . "fieldRef") }}
{{- fail (printf "pgbackrest.extraEnv[%d] (%s) uses an env valueFrom source the restore admission policy cannot pin (#279/#323): only fieldRef, secretKeyRef and configMapKeyRef can be bound to a name there, so this Job would be denied at admission the moment the agent tried to create it. Use one of those three, or disable the policy deliberately with ha.agent.control.restore.admissionPolicy.enabled=false plus acknowledgeUnbounded=true" $i $en) }}
{{- end }}
{{- else }}
{{- /* A LITERAL extraEnv is pinned by value, not merely allowed by name (#283 review). Nothing
       legitimately rewrites it at Job-creation time -- restoreEnvOverrides touches only the
       recovery point and the log level, and `kubectl create job --from` copies the
       jobTemplate verbatim -- while the names an operator declares here are exactly the ones
       whose VALUE is the attack: PGBACKREST_REPO1_STORAGE_HOST is a source redirect,
       LD_LIBRARY_PATH/PATH are code execution. Allowing the name and freeing the value would
       hand the caller the listed spelling of what rule 18 denies in the unlisted one. The
       value goes through pg.validateCelLiterals like every other interpolated literal; one
       that cannot be single-quoted into CEL fails the render with the usual escape hatch. */}}
{{- $_ := set $extraEnvPinned $en (($e.value | default "") | toString) }}
{{- end }}
{{- end }}
{{- $envAllowed := concat (keys $envPinned | sortAlpha) (keys $extraEnvPinned | sortAlpha) $envFree $envValueFrom }}
{{- /* Allowed env valueFrom sources. fieldRef (the downward API, which can read nothing
       but the pod's own metadata) is always permitted -- the restore's
       RESTORE_REQUESTED_BY comes from it -- and this release's own Secrets are added when
       it has any. Everything else (configMapKeyRef, resourceFieldRef, and any Secret that
       is not the release's own) falls through to a denial.

       Written as an ALLOWLIST of sources rather than "no secretKeyRef": under
       s3.keyType=auto with repo encryption off the release reads no Secret at all, and a
       rule phrased as a negation of secretKeyRef would then admit configMapKeyRef -- the
       opposite of what its message promises, in exactly the keyless configuration a
       cloud-workload-identity install uses. */}}
{{- $allSecretRefs := concat $secretRefs $extraSecretRefs }}
{{- $valueFromRule := "has(e.valueFrom.fieldRef)" }}
{{- if $secretKeyPins }}
{{- $pairs := list }}
{{- range $p := $secretKeyPins }}{{- $pairs = append $pairs (printf "(e.valueFrom.secretKeyRef.name == '%s' && e.valueFrom.secretKeyRef.key == '%s')" $p.name $p.key) }}{{- end }}
{{- $valueFromRule = printf "%s || (has(e.valueFrom.secretKeyRef) && (%s))" $valueFromRule (join " || " $pairs) }}
{{- end }}
{{- /* configMapKeyRef stays denied unless the release itself declared one through
       pgbackrest.extraEnv (#323) -- named AND keyed, so an arbitrary ConfigMap (or another key
       of the declared one) is still out. */}}
{{- if $cmKeyPins }}
{{- $pairs := list }}
{{- range $p := $cmKeyPins }}{{- $pairs = append $pairs (printf "(e.valueFrom.configMapKeyRef.name == '%s' && e.valueFrom.configMapKeyRef.key == '%s')" $p.name $p.key) }}{{- end }}
{{- $valueFromRule = printf "%s || (has(e.valueFrom.configMapKeyRef) && (%s))" $valueFromRule (join " || " $pairs) }}
{{- end }}
{{- /* The pod-template labels the restore Job renders, read back from the same helper the
       Job template uses so the two cannot drift. Pinning these is not cosmetic: the
       primary and read-only Services select on pg.selectorLabels plus
       app.kubernetes.io/component, so a Job whose POD carried component=postgresql would
       be added to the write Service's endpoints -- a pod with no readiness probe becomes
       Ready immediately, and application traffic (with its credentials) would be
       load-balanced onto it. validation #2's label check is on the Job object and does
       nothing about that. */}}
{{- $podLabels := include "pg.selectorLabels" . | fromYaml }}
{{- $_ := set $podLabels "app.kubernetes.io/component" "pgbackrest-restore" }}
{{- /* The four labels the API server itself stamps on a Job's pod template, which are
       therefore already on the object when this policy sees it: the batch controller's
       PrepareForCreate runs BEFORE validating admission (the same reason a generateName is
       already resolved by then), so a rule phrased as "exactly the labels the chart
       renders" would deny every legitimate restore. They are safe to allow: their values
       are server-assigned (the Job's own name and UID), validation #7 keeps
       manualSelector from turning that off, and nothing in this chart selects on them.

       Note the coupling this creates, because it fails CLOSED: the list is the set
       Kubernetes stamps today (verified against 1.36). A future version that adds another
       pod-template label would deny every restore for this release until the list is
       extended here. That is the deliberate trade of a key allowlist over a subset check --
       an EXTRA label is the whole attack this rule exists to stop, so "unknown key" has to
       mean "deny" -- and the failure is loud, naming the exact rule, rather than silent. */}}
{{- $ctrlLabelKeys := list "batch.kubernetes.io/controller-uid" "batch.kubernetes.io/job-name" "controller-uid" "job-name" }}
{{- $podLabelRules := list (printf "variables.podLabels.all(k, k in ['%s'])" (join "','" (concat (keys $podLabels | sortAlpha) $ctrlLabelKeys))) }}
{{- range $k := (keys $podLabels | sortAlpha) }}
{{- $podLabelRules = append $podLabelRules (printf "('%s' in variables.podLabels && variables.podLabels['%s'] == '%s')" $k $k (index $podLabels $k)) }}
{{- end }}
{{- /* Security contexts, resources and the command are pinned to what THIS RELEASE'S
       values render, not to a hardcoded hardened profile: a fixed profile would deny the
       release's own restore the moment an operator legitimately changed
       postgresql.containerSecurityContext, and a chart that denies its own Job is worse
       than no policy at all. Each field is "present and equal to the rendered value" when
       the values set it and "absent" when they do not, which is exactly the shape the
       jobTemplate produces. */}}
{{- $csc := .Values.postgresql.containerSecurityContext | default dict }}
{{- $psc := .Values.postgresql.podSecurityContext | default dict }}
{{- $caps := $csc.capabilities | default dict }}
{{- $addPin := "(!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)" }}
{{- /* On the VALUE, not hasKey (#283 review round 5): `capabilities.add: []` is a common PSS
       spelling, and Capabilities.Add is omitempty, so the apiserver drops the empty list --
       `== ['']` would then deny the release's own Job. The no-key branch above is already the
       right pin for an empty list. */}}
{{- if $caps.add }}
{{- $addPin = printf "(has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add == ['%s'])" (join "','" $caps.add) }}
{{- end }}
{{- /* seccompProfile is pinned too, and it is not belt-and-braces. The command pin does not
       make code execution in the restore container impossible: rules 18 and 19 close the
       env (BASH_ENV) and mount (the data PVC over /scripts) routes, but restore.sh still runs
       pgbackrest against a volume the modeled attacker already writes to, so assume it is
       reachable. What that buys is uid 101 with no token and only this release's volumes,
       i.e. exactly the privileges already held, which is the stated bar. Relaxing seccomp
       to Unconfined would be a real step past it, so the profile is pinned. Nested, hence
       written out rather than going through pg.celScalarPin: has() on a leaf whose parent is
       absent is an evaluation ERROR, not false. */}}
{{- $cscSeccomp := "!has(c.securityContext.seccompProfile)" }}
{{- if and $csc.seccompProfile $csc.seccompProfile.type }}
{{- $cscSeccomp = printf "(has(c.securityContext.seccompProfile) && has(c.securityContext.seccompProfile.type) && c.securityContext.seccompProfile.type == '%s')" $csc.seccompProfile.type }}
{{- end }}
{{- $pscSeccomp := "!has(variables.pod.securityContext.seccompProfile)" }}
{{- if and $psc.seccompProfile $psc.seccompProfile.type }}
{{- $pscSeccomp = printf "(has(variables.pod.securityContext.seccompProfile) && has(variables.pod.securityContext.seccompProfile.type) && variables.pod.securityContext.seccompProfile.type == '%s')" $psc.seccompProfile.type }}
{{- end }}
{{- /* capabilities.drop, same shape as add (#283 review): the chart renders drop: [ALL] when
       the values say so, and a caller who removes it gets the runtime's default bounding set
       back. Weak on its own (uid 101 + no_new_privs leaves the effective set empty), pinned
       because "this release's security context" should mean the whole of it. */}}
{{- $dropPin := "(!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.drop) || size(c.securityContext.capabilities.drop) == 0)" }}
{{- if $caps.drop }}
{{- $dropPin = printf "(has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop == ['%s'])" (join "','" $caps.drop) }}
{{- end }}
{{- /* AppArmor, SELinux and procMount are the unpinned twins of the seccomp pin below (#283
       review): appArmorProfile.type=Unconfined strips the runtime's default profile on any
       AppArmor node (Debian -- the HA image's own base), seLinuxOptions requests a type or
       level on SELinux nodes, procMount=Unmasked exposes /proc. Rule 20 closes the legacy
       container.apparmor.security.beta.kubernetes.io/<container> annotation spelling.

       They FOLLOW THE VALUES like every other pin (#283 review round 6): the Job renders
       postgresql.containerSecurityContext verbatim, so an SELinux operator's seLinuxOptions or
       a hardening baseline's explicit appArmorProfile lands on the Job, and an unconditional
       !has() would deny the release's own restore. Absent when the values leave them unset
       (the default, which is where the attack lives); appArmorProfile pinned on .type like
       seccomp; procMount pinned exactly; seLinuxOptions free when set (its level carries a
       comma the CEL charset refuses, and pinning it buys nothing an operator who set it needs). */}}
{{- $hardeningPins := list "!has(c.volumeDevices)" "!has(c.ports)" }}
{{- if not $csc.appArmorProfile }}{{- $hardeningPins = append $hardeningPins "!has(c.securityContext.appArmorProfile)" }}
{{- else if $csc.appArmorProfile.type }}{{- $hardeningPins = append $hardeningPins (printf "(has(c.securityContext.appArmorProfile) && has(c.securityContext.appArmorProfile.type) && c.securityContext.appArmorProfile.type == '%s')" $csc.appArmorProfile.type) }}{{- end }}
{{- if not $csc.seLinuxOptions }}{{- $hardeningPins = append $hardeningPins "!has(c.securityContext.seLinuxOptions)" }}{{- end }}
{{- $hardeningPins = append $hardeningPins (include "pg.celScalarPin" (list "c.securityContext.procMount" $csc "procMount")) }}
{{- $cscPins := concat (list
      (include "pg.celScalarPin" (list "c.securityContext.privileged" $csc "privileged"))
      (include "pg.celScalarPin" (list "c.securityContext.allowPrivilegeEscalation" $csc "allowPrivilegeEscalation"))
      (include "pg.celScalarPin" (list "c.securityContext.runAsUser" $csc "runAsUser"))
      (include "pg.celScalarPin" (list "c.securityContext.runAsGroup" $csc "runAsGroup"))
      (include "pg.celScalarPin" (list "c.securityContext.runAsNonRoot" $csc "runAsNonRoot"))
      (include "pg.celScalarPin" (list "c.securityContext.readOnlyRootFilesystem" $csc "readOnlyRootFilesystem"))
      $addPin $dropPin $cscSeccomp) $hardeningPins }}
{{- /* Pod-level list/enum fields the chart renders only when the values carry them: pinned
       absent when the values do not set them (the common case), left free when they do --
       a list-of-objects pin for sysctls is not worth the drift risk against a value the
       operator deliberately chose. */}}
{{- $pscAbsent := list }}
{{- if not $psc.appArmorProfile }}{{- $pscAbsent = append $pscAbsent "!has(variables.pod.securityContext.appArmorProfile)" }}
{{- else if $psc.appArmorProfile.type }}{{- $pscAbsent = append $pscAbsent (printf "(has(variables.pod.securityContext.appArmorProfile) && has(variables.pod.securityContext.appArmorProfile.type) && variables.pod.securityContext.appArmorProfile.type == '%s')" $psc.appArmorProfile.type) }}{{- end }}
{{- if not $psc.seLinuxOptions }}{{- $pscAbsent = append $pscAbsent "!has(variables.pod.securityContext.seLinuxOptions)" }}{{- end }}
{{- range $f := list "sysctls" "supplementalGroups" "fsGroupChangePolicy" }}
{{- /* Emptiness, not hasKey: `supplementalGroups: []` and `sysctls: []` are omitempty and
       vanish at the apiserver, so absent is the right pin for them too (#283 review round 5). */}}
{{- if not (index $psc $f) }}{{- $pscAbsent = append $pscAbsent (printf "!has(variables.pod.securityContext.%s)" $f) }}{{- end }}
{{- end }}
{{- /* supplementalGroups is a flat int list, so when the values DO set it, it is pinned by
       exact equality like capabilities.drop (#283 review round 4); sysctls stays free when set. */}}
{{- with $psc.supplementalGroups }}
{{- /* Integral float64 printed as %d (helm's `%v` goes scientific at 1e6, and the k8s CEL
       environment forbids a heterogeneous [103, 1e+06] literal -- an apply-time compile
       error); anything else is registered as a literal below so it fails the render. */}}
{{- $g := list }}{{- range . }}{{- if and (kindIs "float64" .) (eq (float64 (int64 .)) .) }}{{- $g = append $g (printf "%d" (int64 .)) }}{{- else }}{{- $g = append $g (toString .) }}{{- end }}{{- end }}
{{- $pscAbsent = append $pscAbsent (printf "(has(variables.pod.securityContext.supplementalGroups) && variables.pod.securityContext.supplementalGroups == [%s])" (join ", " $g)) }}
{{- end }}
{{- /* When the values set NOTHING, the rule is "no securityContext, OR one that sets none of
       the fields pinned above" -- not a bare !has(). `postgresql.containerSecurityContext:
       {}` renders `securityContext: {}` on the Job, which is PRESENT as far as has() is
       concerned, so a bare !has() would deny the release's own restore. The
       !has(parent) || (...) shape is safe despite the pins dereferencing that parent: CEL's
       logical operators are commutative, so a true left side wins even when the right side
       would error. */}}
{{- $cscRule := "" }}
{{- if $csc }}
{{- $cscRule = printf "variables.pod.containers.all(c, has(c.securityContext) && %s)" (join " && " $cscPins) }}
{{- else }}
{{- $cscRule = printf "variables.pod.containers.all(c, !has(c.securityContext) || (%s))" (join " && " $cscPins) }}
{{- end }}
{{- $pscPins := concat (list
      (include "pg.celScalarPin" (list "variables.pod.securityContext.runAsUser" $psc "runAsUser"))
      (include "pg.celScalarPin" (list "variables.pod.securityContext.runAsGroup" $psc "runAsGroup"))
      (include "pg.celScalarPin" (list "variables.pod.securityContext.fsGroup" $psc "fsGroup"))
      (include "pg.celScalarPin" (list "variables.pod.securityContext.runAsNonRoot" $psc "runAsNonRoot"))
      $pscSeccomp) $pscAbsent }}
{{- $pscRule := "" }}
{{- if $psc }}
{{- $pscRule = printf "has(variables.pod.securityContext) && %s" (join " && " $pscPins) }}
{{- else }}
{{- $pscRule = printf "!has(variables.pod.securityContext) || (%s)" (join " && " $pscPins) }}
{{- end }}
{{- /* priorityClassName, pinned to what the restore jobTemplate renders
       (pgbackrest.cronjob.priorityClassName). This one does NOT belong with nodeSelector and
       tolerations, which are left unpinned because they can only ever RESTRICT where a pod
       runs: a priority class does the opposite. Referencing a PriorityClass needs no
       permission, so a caller could name a high-priority class and let the scheduler PREEMPT
       this release's own postgresql pods to make room -- and the SA holds delete on the
       pinned Job name, so it is repeatable. The parallelism/completions cap does not close
       that, because one pod is enough. */}}
{{- $pcnPin := "!has(variables.pod.priorityClassName)" }}
{{- with .Values.pgbackrest.cronjob.priorityClassName }}
{{- $pcnPin = printf "(has(variables.pod.priorityClassName) && variables.pod.priorityClassName == '%s')" . }}
{{- end }}
{{- /* Resources: presence of exactly the request/limit keys the release renders. The
       VALUES are not compared -- a Quantity round-trips as the string it was written as
       ("1" vs "1000m" vs 1), so an equality test on it would be a false-denial generator
       during an incident. Presence is what matters here anyway: a container with no
       limits, multiplied by an unbounded parallelism (validation #14), is the resource-
       exhaustion path against the database's own nodes, and it is the same requests-and-
       limits rule the chart's kube-linter gate enforces on every other container. */}}
{{- $rres := .Values.pgbackrest.restore.resources | default dict }}
{{- $resPins := list }}
{{- range $section := list "requests" "limits" }}
{{- $sec := (index $rres $section) | default dict }}
{{- $keys := list }}
{{- range $k := list "cpu" "memory" }}
{{- if hasKey $sec $k }}
{{- $keys = append $keys (printf "'%s' in c.resources.%s" $k $section) }}
{{- end }}
{{- end }}
{{- if $keys }}
{{- $resPins = append $resPins (printf "has(c.resources.%s) && %s" $section (join " && " $keys)) }}
{{- end }}
{{- end }}
{{- /* Every value interpolated into a CEL string literal below, checked at render time for
       characters that would break the expression or turn it into a tautology. */}}
{{- $literals := list (list "the release namespace" .Release.Namespace) (list "the release fullname" $fullname) (list "ha.image (pg.haImage)" (include "pg.haImage" .)) }}
{{- range $k, $v := $podLabels }}
{{- $literals = append $literals (list (printf "the restore pod label %s" $k) $v) }}
{{- end }}
{{- range $s := $secretRefs }}
{{- $literals = append $literals (list "a pgbackrest Secret name (pgbackrest.existingSecret.name / pgbackrest.repoEncryption.existingSecret.name)" $s) }}
{{- end }}
{{- range $s := $extraSecretRefs }}
{{- $literals = append $literals (list "a pgbackrest.extraEnv secretKeyRef name" $s) }}
{{- end }}
{{- range $c := $extraCmRefs }}
{{- $literals = append $literals (list "a pgbackrest.extraEnv configMapKeyRef name" $c) }}
{{- end }}
{{- range $n := $extraEnvNames }}
{{- $literals = append $literals (list "a pgbackrest.extraEnv name" $n) }}
{{- end }}
{{- range $p := $secretKeyPins }}
{{- $literals = append $literals (list (printf "the key read from Secret %s" $p.name) $p.key) }}
{{- end }}
{{- range $p := $cmKeyPins }}
{{- $literals = append $literals (list (printf "the key read from ConfigMap %s" $p.name) $p.key) }}
{{- end }}
{{- /* pg.celScalarPin's string branch is the one other single-quoted interpolation (#283 review
       round 4): postgresql.podSecurityContext/containerSecurityContext are untyped by the
       schema, so a string where a bool or int belongs would otherwise render a tautology. */}}
{{- range $f := list "privileged" "allowPrivilegeEscalation" "runAsUser" "runAsGroup" "runAsNonRoot" "readOnlyRootFilesystem" }}
{{- if and (hasKey $csc $f) (kindIs "string" (index $csc $f)) }}{{- $literals = append $literals (list (printf "postgresql.containerSecurityContext.%s" $f) (index $csc $f)) }}{{- end }}
{{- end }}
{{- range $f := list "runAsUser" "runAsGroup" "fsGroup" "runAsNonRoot" }}
{{- if and (hasKey $psc $f) (kindIs "string" (index $psc $f)) }}{{- $literals = append $literals (list (printf "postgresql.podSecurityContext.%s" $f) (index $psc $f)) }}{{- end }}
{{- end }}
{{- range $sg := ($psc.supplementalGroups | default list) }}
{{- if not (kindIs "float64" $sg) }}{{- $literals = append $literals (list "a postgresql.podSecurityContext.supplementalGroups entry" $sg) }}{{- end }}
{{- end }}
{{- with $csc.procMount }}{{- $literals = append $literals (list "postgresql.containerSecurityContext.procMount" .) }}{{- end }}
{{- with $csc.appArmorProfile }}{{- with .type }}{{- $literals = append $literals (list "postgresql.containerSecurityContext.appArmorProfile.type" .) }}{{- end }}{{- end }}
{{- with $psc.appArmorProfile }}{{- with .type }}{{- $literals = append $literals (list "postgresql.podSecurityContext.appArmorProfile.type" .) }}{{- end }}{{- end }}
{{- /* extraEnv VALUES and extraVolumeMounts paths are emitted with toJson (see $extraEnvPinned),
       so they need no charset registration; the names above do, because they sit inside the
       single-quoted `e.name in [...]` list. */}}
{{- range $p := $extraVolPins }}
{{- $literals = append $literals (list (printf "a pgbackrest.extraVolumes %s name" $p.kind) $p.value) }}
{{- end }}
{{- /* Every OTHER value that reaches a single-quoted CEL literal. Missing one is not
       cosmetic: `RuntimeDefault' || true || '` renders a syntactically valid, always-true
       expression -- == binds tighter than || -- so the pin becomes a tautology that renders
       and lints clean. values.schema.json constrains none of these. */}}
{{- with $csc.seccompProfile }}{{- with .type }}
{{- $literals = append $literals (list "postgresql.containerSecurityContext.seccompProfile.type" .) }}
{{- end }}{{- end }}
{{- with $psc.seccompProfile }}{{- with .type }}
{{- $literals = append $literals (list "postgresql.podSecurityContext.seccompProfile.type" .) }}
{{- end }}{{- end }}
{{- range $cap := ($caps.add | default list) }}
{{- $literals = append $literals (list "a postgresql.containerSecurityContext.capabilities.add entry" $cap) }}
{{- end }}
{{- range $cap := ($caps.drop | default list) }}
{{- $literals = append $literals (list "a postgresql.containerSecurityContext.capabilities.drop entry" $cap) }}
{{- end }}
{{- with .Values.pgbackrest.cronjob.priorityClassName }}
{{- $literals = append $literals (list "pgbackrest.cronjob.priorityClassName" .) }}
{{- end }}
{{- /* The schema types it boolean, so only `true`/`false` can get here; registered anyway
       because it is a single-quoted CEL literal (rule 17), and this list is the one place
       that guarantee is enforced (#283). */}}
{{- $forcePin := .Values.pgbackrest.restore.force | toString }}
{{- $literals = append $literals (list "pgbackrest.restore.force" $forcePin) }}
{{- include "pg.validateCelLiterals" $literals }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  # Cluster-scoped: hash-suffixed so two releases cannot collide (pg.restoreGuardName).
  name: {{ $guard }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Fail, not Ignore, and it is load-bearing: with Ignore a policy-evaluation failure
         would silently re-open the hole this exists to close, which is the worst possible
         shape -- the grant still rendered, the bound quietly absent. Every expression
         below is written to be evaluable (has() guards on every optional field), so a
         failure here means something is wrong that SHOULD stop a restore. */}}
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  {{- /* CREATE only. The agent has no update/patch on jobs (and a Job's spec is immutable
         anyway), so matching updates would police nothing and could only add false
         denials on status writes by the Job controller. */}}
  matchConditions:
    # Police ONE subject: this release's ServiceAccount. Humans, GitOps controllers, the
    # CronJob controller and every other workload in the cluster create Jobs unaffected --
    # which matters as much as the denials do, because a policy that broke every other
    # controller in the namespace would be worse than the hole it closes.
    #
    # Exact equality rather than a prefix/suffix match: matching on the ServiceAccount name
    # alone would also police an identically-named ServiceAccount in an unrelated namespace
    # (and break that release's restores), and the username already carries the namespace.
    - name: only-this-releases-agent
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $fullname }}-repmgr'"
  variables:
    # spec.template is required on a Job, so this cannot fail to evaluate.
    - name: pod
      expression: "object.spec.template.spec"
    # spec.template.metadata IS optional, hence the ternary rather than a bare access:
    # an absent metadata must reach validation #6 as an empty map (and be denied there for
    # having no labels), not error out of the expression.
    - name: podLabels
      expression: "has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}"
  validations:
    # 1. The bound RBAC could not express, and the one that collapses the grant: the agent
    #    always creates ONE deterministic Job name (which is why get/delete ARE scopeable
    #    in rbac.yaml). Pinning it here means `create jobs` becomes, in effect, create on
    #    that single object -- the resourceName restriction RBAC refused to give.
    #
    #    generateName cannot slip past this: name generation happens before VALIDATING
    #    admission runs, so object.metadata.name is the final name (a mutating webhook, by
    #    contrast, would see it empty). A generated name never equals the pinned one.
    - expression: "object.metadata.name == '{{ $fullname }}-pgbackrest-restore-api'"
      message: "the pg agent may create only the Job {{ $fullname }}-pgbackrest-restore-api (ha.agent.control.restore, #279)"
      reason: Forbidden
    # 2. Provenance, and it is why the CronJob's jobTemplate carries this label: the agent
    #    copies jobTemplate labels onto the Job it clones, so a Job without it did not come
    #    from this release's restore template. Not a bound by itself (a caller can add a
    #    label) -- it makes the object attributable, and it fails closed if the chart's
    #    template and this policy ever drift apart.
    - expression: "has(object.metadata.labels) && 'pg-ha/restore' in object.metadata.labels && object.metadata.labels['pg-ha/restore'] == '{{ $fullname }}'"
      message: "the pg agent's Jobs must carry pg-ha/restore={{ $fullname }}, the label this release's restore jobTemplate renders"
      reason: Forbidden
    # 3+4. The escalation itself. Naming another ServiceAccount is the primitive; requiring
    #    the release's own SA removes the "escalate" and leaves only "same privileges I
    #    already hold". Requiring automountServiceAccountToken=false explicitly (absent
    #    counts as a denial, not a pass) is what makes SA-naming moot in the first place:
    #    the pod gets no token to use. The rendered Job sets both.
    - expression: "has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName == '{{ $fullname }}-repmgr'"
      message: "the pg agent may only create Jobs running as ServiceAccount {{ $fullname }}-repmgr -- naming another ServiceAccount is the privilege escalation this policy exists to deny"
      reason: Forbidden
    - expression: "has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false"
      message: "the pg agent's Jobs must set automountServiceAccountToken: false explicitly (the restore talks to S3 and the PVC, never to the Kubernetes API)"
      reason: Forbidden
    # 5. Escapes from the pod boundary to the node, plus the two placement knobs a caller
    #    could turn against the release. nodeName bypasses the scheduler outright -- it
    #    ignores taints, and it is how a caller would place this pod on a node of its
    #    choosing. priorityClassName is pinned for the reason in its construction above: it
    #    can PREEMPT this release's own pods. nodeSelector and tolerations are deliberately
    #    NOT pinned -- they are inherited from postgresql.nodeSelector/tolerations so the
    #    restore can land where the data volume attaches. nodeSelector can only RESTRICT
    #    placement; a toleration is the opposite -- `operator: Exists` lets the pod schedule
    #    onto a tainted (control-plane) node. That is accepted: the pod still has to be where
    #    the RWO data PVC can attach, so a toleration can move it onto a node where the Job
    #    cannot start, not onto one where it does something new, and the cost of a pin would
    #    be a drift pair against a list the operator legitimately changes.
    #
    #    hostAliases, dnsConfig and a non-default dnsPolicy are denied too (#283 review). The
    #    restore's SOURCE is the S3 endpoint named in the mounted pgbackrest.conf; rule 18
    #    keeps PGBACKREST_REPO1_S3_ENDPOINT out of the env, but a hostAliases entry (or a
    #    caller-supplied resolver) points that same hostname wherever the caller likes, and
    #    with pgbackrest.s3.verifyTls=false -- a documented, supported configuration for
    #    MinIO/Ceph gateways -- nothing then stands between the caller's bucket and the live
    #    PGDATA. dnsPolicy is compared against ClusterFirst rather than required absent
    #    because the apiserver DEFAULTS it onto every pod template before admission sees it.
    #
    #    Fields deliberately left FREE, so the next reader does not have to rediscover why:
    #    nodeSelector/tolerations/affinity (above); restartPolicy, backoffLimit,
    #    activeDeadlineSeconds, ttlSecondsAfterFinished (retry and lifetime of a Job that
    #    rules 1 and 14 already cap at one name and one pod); readOnly on a mount (can only
    #    take write access away); emptyDir medium/sizeLimit (rule 13 bounds the pod's own
    #    resources, and an emptyDir is scratch space in the pod's own cgroup); sysctls and
    #    fsGroupChangePolicy ONLY when the values set them (pinned absent otherwise, see
    #    $pscAbsent; supplementalGroups is pinned exactly either way); imagePullSecrets,
    #    runtimeClassName, schedulerName, hostname/subdomain, workingDir, mountPropagation
    #    and terminationMessagePath (none reaches past the pinned image, command and
    #    volumes). volumeDevices and container ports are denied (rule 11) -- neither is
    #    exploitable, both are one clause.
    - expression: "(!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) && (!has(variables.pod.hostPID) || variables.pod.hostPID == false) && (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) && !has(variables.pod.nodeName) && {{ $pcnPin }} && !has(variables.pod.hostAliases) && !has(variables.pod.dnsConfig) && (!has(variables.pod.dnsPolicy) || variables.pod.dnsPolicy == 'ClusterFirst')"
      message: "hostNetwork, hostPID, hostIPC, an explicit nodeName, any priorityClassName other than this release's, hostAliases, dnsConfig and any dnsPolicy other than ClusterFirst are not permitted on the pg agent's Jobs -- the last three would let the caller redirect the S3 endpoint the restore reads from (#283)"
      reason: Forbidden
    # 6. The pod's OWN labels: an allowlist of keys (this release's restore pod labels plus
    #    the batch controller's own), with the release's values pinned. A key allowlist
    #    rather than a subset check, because an EXTRA label is the whole attack -- it is how
    #    a pod joins a selector it should not match (see the Service-endpoint reasoning above
    #    the rule's construction).
    - expression: >-
        {{ join " && " $podLabelRules }}
      message: "the pg agent's Jobs may carry only this release's restore pod labels ({{ range $i, $k := (keys $podLabels | sortAlpha) }}{{ if $i }}, {{ end }}{{ $k }}={{ index $podLabels $k }}{{ end }}) plus the batch controller's own -- extra or altered pod labels would let the restore pod join this release's Service endpoints"
      reason: Forbidden
    # 7. manualSelector is what turns OFF the server-side selector generation that #6's key
    #    allowlist is written around, so it is pinned to what the chart renders (absent).
    #    Honestly labelled defence in depth rather than a closed hole: built-in Job
    #    validation already requires spec.selector to be present and to MATCH the pod
    #    template labels, and #6 pins those, so a manual selector cannot be aimed at this
    #    release's postgresql pods even without this rule. What it removes is the case where
    #    a Job's identity labels are caller-supplied rather than server-assigned.
    - expression: "!has(object.spec.manualSelector) || object.spec.manualSelector == false"
      message: "the pg agent's Jobs may not set manualSelector: the API server must generate the Job's pod selector and identity labels"
      reason: Forbidden
    # 8+9. One container, running the release's own image. The agent already refuses to
    #    clone a jobTemplate with anything other than exactly one container (it will not
    #    guess which container's env to rewrite), so this matches the agent's own rule.
    #    ephemeralContainers cannot be set through a pod template at all, but denying it
    #    here costs one clause and removes the question.
    - expression: "size(variables.pod.containers) == 1 && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) && (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)"
      message: "the pg agent's Jobs must have exactly one container and no init or ephemeral containers"
      reason: Forbidden
    - expression: "variables.pod.containers.all(c, c.image == '{{ include "pg.haImage" . }}')"
      message: "the pg agent's Jobs may only run this release's HA image ({{ include "pg.haImage" . }})"
      reason: Forbidden
    # 10. The command, pinned to the release's own restore entrypoint (pg.restoreCommandJSON,
    #    the same definition the jobTemplate renders, converted to CEL quoting). The image
    #    pin alone is a weak bound -- the postgresql container already runs this image with
    #    this data volume -- so without this the Job is "run anything you like as the
    #    database's uid, with the live PGDATA mounted", which is a data-destruction
    #    primitive that needs no privilege escalation at all. With it, the Job can only run
    #    the chart's restore.sh (delivered by the pinned ConfigMap volume, which this token
    #    cannot write) plus the literal env values the restore already takes.
    #
    #    lifecycle is denied in the same rule because it is the same question: a
    #    postStart/preStop exec hook runs a caller-chosen program in the pinned container
    #    without touching command or args, which would make "must run exactly this release's
    #    restore command" untrue as written. The chart renders no lifecycle hooks, so pinning
    #    absence costs nothing. It does not close the residual documented at the top of this
    #    file -- $BASH_ENV reaches the same place -- but there is no reason to leave a second,
    #    more direct door open.
    - expression: "variables.pod.containers.all(c, has(c.command) && c.command == {{ include "pg.restoreCommandJSON" . | replace "\"" "'" }} && !has(c.args) && !has(c.lifecycle))"
      message: "the pg agent's Jobs must run exactly this release's restore command ({{ include "pg.restoreCommandJSON" . | replace "\"" "'" }}) with no args and no lifecycle hooks"
      reason: Forbidden
    # 11+12. Security contexts, pinned to the release's own (see the reasoning above their
    #    construction). Without these the Job is admitted with privileged: true,
    #    runAsUser: 0 and CAP_SYS_ADMIN -- a root container on a node of the caller's
    #    choosing, which is a strictly larger privilege set than the token started with and
    #    would make "same privileges I already hold" false.
    - expression: "{{ $cscRule }}"
      message: "the pg agent's Jobs must run with this release's container security context (postgresql.containerSecurityContext) -- privileged, added capabilities, a different runAsUser or a relaxed allowPrivilegeEscalation are denied"
      reason: Forbidden
    - expression: "{{ $pscRule }}"
      message: "the pg agent's Jobs must run with this release's pod security context (postgresql.podSecurityContext)"
      reason: Forbidden
    {{- if $resPins }}
    # 13. Requests and limits, present as the release renders them (values deliberately not
    #    compared -- see the reasoning above).
    - expression: "variables.pod.containers.all(c, has(c.resources) && {{ join " && " $resPins }})"
      message: "the pg agent's Jobs must declare the CPU and memory requests and limits this release renders (pgbackrest.restore.resources)"
      reason: Forbidden
    {{- end }}
    # 14. One pod, once. The API server DEFAULTS both fields to 1 before admission runs, so
    #    this is written as "<= 1" rather than "absent": the rendered Job sets neither, and
    #    requiring absence would deny every legitimate restore. Unbounded parallelism is
    #    what turns one permitted Job name into a repeatable way to fill the namespace's
    #    ResourceQuota and evict the database's own pods.
    - expression: "(!has(object.spec.parallelism) || object.spec.parallelism <= 1) && (!has(object.spec.completions) || object.spec.completions <= 1)"
      message: "the pg agent's Jobs must run a single pod (parallelism and completions <= 1)"
      reason: Forbidden
    # 15. Volumes, and after the ServiceAccount pin this is the check that matters most.
    #    With the token gone, mounting somebody else's Secret is the remaining way to reach
    #    outside this release -- so the sources are pinned to exactly the three the restore
    #    template renders. hostPath, projected service-account tokens, arbitrary Secrets
    #    and arbitrary PVCs all fall out of this as denials rather than needing a rule each.
    #    This rule is an all() over the volumes PRESENT -- it does not say where they may be
    #    mounted, and it does not require the chart's own three to exist. Rule 19 carries the
    #    mount side (#283 review): the permitted data PVC mounted at /scripts is the pinned
    #    command running caller-written bytes, so "remapping a mount can only break the
    #    restore" was wrong and is not claimed here any more.
    - expression: >-
        !has(variables.pod.volumes) || variables.pod.volumes.all(v,
        has(v.emptyDir)
        || (has(v.configMap) && v.configMap.name == '{{ $fullname }}-pgbackrest')
        || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'data-{{ $fullname }}-{{ .Values.pgbackrest.restore.podOrdinal }}')
{{- range $p := $extraVolPins }}
        || (has(v.{{ $p.kind }}) && v.{{ $p.kind }}.{{ $p.field }} == '{{ $p.value }}')
{{- end }})
      message: "the pg agent's Jobs may mount only this release's restore volumes: emptyDir, configMap {{ $fullname }}-pgbackrest, and PVC data-{{ $fullname }}-{{ .Values.pgbackrest.restore.podOrdinal }}{{ with $extraVolPins }}, plus this release's pgbackrest.extraVolumes ({{ range $i, $p := . }}{{ if $i }}, {{ end }}{{ $p.kind }} {{ $p.value }}{{ end }}){{ end }}"
      reason: Forbidden
    # 16. The same bound for env: envFrom pulls a whole Secret or ConfigMap, and
    #    secretKeyRef/configMapKeyRef pull a key from any of them. Only the downward API
    #    and the release's own Secrets are allowed through (see $valueFromRule above).
    - expression: >-
        variables.pod.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e,
        !has(e.valueFrom) || ({{ $valueFromRule }}))))
      message: "the pg agent's Jobs may not use envFrom, and may reference only the downward API{{ with $allSecretRefs }} or this release's own Secrets ({{ join ", " . }}){{ end }}{{ with $extraCmRefs }} or the ConfigMaps this release's pgbackrest.extraEnv names ({{ join ", " . }}){{ end }} through env valueFrom"
      reason: Forbidden
    # 17. FORCE is pinned to the value this release renders (#283). Rules 1-16 bound the
    #    Job's SHAPE and leave the restore parameters free, which is right for the recovery
    #    point (TARGET_TYPE/TARGET/BACKUP_SET -- the API overrides those, and choosing the
    #    point is the feature). FORCE is not a recovery-point choice: it is `pgbackrest
    #    restore --force`, the bypass of the postmaster.pid interlock, i.e. the one thing
    #    standing between "restore this release to a point of your choosing" and "restore
    #    over a RUNNING primary at any moment". The agent never sets it
    #    (restoreEnvOverrides), so the only legitimate writer is the chart render, and the
    #    pin follows that render: an operator who sets pgbackrest.restore.force=true for a
    #    stale pid file still gets a working Job, because the policy moves with them.
    #
    #    Three closures, each load-bearing:
    #      - exists(): the entry must be PRESENT. restore.sh is `set -u`, so deleting it
    #        would only trade a denial with a named reason for a shell abort -- but requiring
    #        it here means a future script change can never turn absence into a bypass.
    #      - all() over every FORCE entry, not filter()[0]: Kubernetes env is last-wins on a
    #        duplicate name, so a second FORCE=true appended after the pinned one would win.
    #      - !has(valueFrom): rule 16 admits fieldRef, and the Job creator controls the pod
    #        template's annotations, so FORCE sourced from metadata.annotations['x'] would
    #        slip a value-only pin. FORCE must be a literal.
    #    Compared as the STRING 'true'/'false': the CronJob renders the value through `quote`
    #    and restore.sh tests `"$FORCE" = "true"`, so this is the contract both ends use.
    - expression: >-
        variables.pod.containers.all(c, has(c.env) && c.env.exists(e, e.name == 'FORCE') &&
        c.env.all(e, e.name != 'FORCE' || (!has(e.valueFrom) && has(e.value) && e.value == '{{ $forcePin }}')))
      message: "the pg agent's restore Job must carry FORCE={{ $forcePin }} as a literal, the value pgbackrest.restore.force renders -- pgbackrest --force disarms the postmaster.pid interlock (the last guard against restoring over a live volume), so it may not be flipped, duplicated, or sourced from valueFrom through the job-create grant; change pgbackrest.restore.force in values instead (#283)"
      reason: Forbidden
    # 18. Env NAMES are an allowlist, and the chart's constants are pinned by value (#283
    #    review). Without this, 17 pins a name pgbackrest does not read: pgbackrest takes any
    #    PGBACKREST_<OPTION> from the environment, so FORCE=false plus PGBACKREST_FORCE=y is
    #    a --force restore that passes rule 17, and PGBACKREST_REPO1_S3_ENDPOINT/BUCKET is a
    #    restore from someone else's repository. BASH_ENV and LD_PRELOAD are code execution
    #    before the pinned command's first line. See the tier comment on $envPinned above for
    #    why each name sits where it does; the entries that render as valueFrom must stay
    #    valueFrom, because rule 16 only inspects entries that have one, so a literal under
    #    the same name would be an attacker-supplied credential nothing else looks at. And
    #    the FREE tier must be literal (#283 review round 4): rule 16 admits this release's own
    #    Secrets by (name, key), but a free name such as TARGET sourced from a Secret would still
    #    be a read of whatever the caller can name -- restore.sh writes target= into the status
    #    file on the data PVC. The agent and `kubectl create job --from` render every one of
    #    these as a literal, so the pin costs nothing.
    - expression: >-
        variables.pod.containers.all(c, !has(c.env) || c.env.all(e,
        e.name in ['{{ join "','" $envAllowed }}'] &&
        (!(e.name in ['{{ join "','" $envValueFrom }}']) || has(e.valueFrom)) &&
        (!(e.name in ['{{ join "','" $envFree }}']) || !has(e.valueFrom)){{ range $k := (keys $envPinned | sortAlpha) }} &&
        (e.name != '{{ $k }}' || (!has(e.valueFrom) && has(e.value) && e.value == '{{ index $envPinned $k }}')){{ end }}{{ range $k := (keys $extraEnvPinned | sortAlpha) }} &&
        (e.name != '{{ $k }}' || (!has(e.valueFrom) && {{ with index $extraEnvPinned $k }}has(e.value) && e.value == {{ . | toJson }}{{ else }}(!has(e.value) || e.value == ''){{ end }})){{ end }}))
      message: "the pg agent's restore Job may carry only the env its jobTemplate renders ({{ join ", " $envAllowed }}); {{ join ", " (concat (keys $envPinned | sortAlpha) (keys $extraEnvPinned | sortAlpha)) }} must be the rendered literals and {{ join ", " $envValueFrom }} must stay valueFrom and {{ join ", " $envFree }} must be literals -- pgbackrest reads any PGBACKREST_<OPTION> from the environment (PGBACKREST_FORCE would bypass the postmaster.pid interlock, PGBACKREST_REPO1_* would redirect the restore's source) and bash reads BASH_ENV, so an unlisted name is not an option, it is a bypass (#283)"
      reason: Forbidden
    # 19. Every mount is bound to its rendered (mountPath, subPath, source kind) -- see the
    #    comment on $extraMountPins above for the two attacks this closes (the data PVC over
    #    /scripts, or over /etc/pgbackrest/conf.d). The volume is looked up by name from the
    #    mount, so a mount may not claim a path with a source of another kind; the two
    #    configMap paths are additionally pinned to this release's pgbackrest ConfigMap, so
    #    an operator-declared extraVolumes ConfigMap cannot be swapped in as the script
    #    source either. The ConfigMap's `items` are pinned as well (#283 review round 3): the
    #    same ConfigMap carries validate.sh, which begins with `rm -rf "$PGDATA"` and then
    #    restores with no interlock at all (the pid file went with the directory) -- so
    #    `items: [{key: validate.sh, path: restore.sh}]` on the permitted ConfigMap would be a
    #    destroy-and-restore primitive under the pinned command, with no FORCE and no code
    #    execution anywhere. /scripts must project exactly restore.sh, and the config mount
    #    must project the whole ConfigMap as rendered. subPathExpr is denied everywhere -- the
    #    chart never renders it, and it resolves env into the path. A mount that omits one of the chart's own entries is not
    #    denied: without /scripts the pinned command has nothing to run, without the config
    #    pgbackrest has no stanza -- a broken Job, not a wider one.
    - expression: >-
        variables.pod.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
        !has(m.subPathExpr) && has(variables.pod.volumes) && variables.pod.volumes.exists(v, v.name == m.name && (
        (m.mountPath == '/var/lib/postgresql/data' && !has(m.subPath) && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'data-{{ $fullname }}-{{ .Values.pgbackrest.restore.podOrdinal }}')
        || (m.mountPath == '/etc/pgbackrest/pgbackrest.conf' && has(m.subPath) && m.subPath == 'pgbackrest.conf' && has(v.configMap) && v.configMap.name == '{{ $fullname }}-pgbackrest' && !has(v.configMap.items))
        || (m.mountPath == '/scripts' && !has(m.subPath) && has(v.configMap) && v.configMap.name == '{{ $fullname }}-pgbackrest' && has(v.configMap.items) && size(v.configMap.items) == 1 && v.configMap.items.all(i, i.key == 'restore.sh' && (!has(i.path) || i.path == 'restore.sh')))
        || (m.mountPath == '/work' && !has(m.subPath) && has(v.emptyDir))
{{- range $p := $extraMountPins }}
        || (m.mountPath == {{ $p.path | toJson }} && {{ if $p.subPath }}has(m.subPath) && m.subPath == {{ $p.subPath | toJson }}{{ else }}!has(m.subPath){{ end }} && has(v.{{ $p.kind }}){{ if $p.field }} && v.{{ $p.kind }}.{{ $p.field }} == '{{ $p.value }}'{{ end }})
{{- end }}))))
      message: "the pg agent's restore Job may mount only what its jobTemplate mounts, each at its rendered path from its rendered source: the data PVC at /var/lib/postgresql/data, configMap {{ $fullname }}-pgbackrest at /etc/pgbackrest/pgbackrest.conf (subPath pgbackrest.conf) and at /scripts, an emptyDir at /work{{ with $extraMountPins }}, plus this release's pgbackrest.extraVolumeMounts ({{ range $i, $p := . }}{{ if $i }}, {{ end }}{{ $p.path | toJson | trimAll "\"" }}{{ end }}){{ end }}; /scripts projecting exactly the restore.sh key; no subPathExpr -- the permitted data PVC mounted over /scripts or /etc/pgbackrest/conf.d would run the caller's bytes, or the caller's pgbackrest options, under the pinned command, and projecting validate.sh as restore.sh would rm -rf the live PGDATA (#283)"
      reason: Forbidden
    # 20. Pod-template ANNOTATIONS are an allowlist, like the labels in rule 6 (#283 review).
    #    The jobTemplate renders none; the agent stamps pg-ha/requested-by (the requester,
    #    read back through the downward API into RESTORE_REQUESTED_BY). Everything else is
    #    denied because annotations are not inert: the legacy
    #    container.apparmor.security.beta.kubernetes.io/<container> key still selects a
    #    profile on 1.30+ and is the annotation spelling of the appArmorProfile field rule 11
    #    pins absent -- and since the key carries the container name, only an allowlist can
    #    close it. The Job's own metadata.annotations are not bounded: the agent copies the
    #    CronJob's onto the Job, and nothing reads a Job annotation at run time.
    - expression: >-
        !has(object.spec.template.metadata) || !has(object.spec.template.metadata.annotations) ||
        object.spec.template.metadata.annotations.all(k, k in ['pg-ha/requested-by'])
      message: "the pg agent's restore Job may carry only the pod annotation pg-ha/requested-by -- the jobTemplate renders none, and an AppArmor profile is selectable through an annotation as well as through securityContext (#283)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guard }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  policyName: {{ $guard }}
  validationActions: ["Deny"]
  {{- /* Scoped to the release namespace via kubernetes.io/metadata.name, a label the API
         server sets on every namespace itself (immutable, and always present since 1.21) --
         so unlike binding on a label the chart would have to ask an operator to apply, this
         cannot be left off. It exists to bound the blast radius of a policy-evaluation
         failure under failurePolicy: Fail to this namespace; it is NOT what enforces the
         rules, which is why the policy still pins the subject exactly in matchConditions.

         Note what is deliberately absent: an objectSelector. Narrowing the BINDING by the
         pg-ha/restore label would make validation #2 self-defeating -- a Job created
         without the label would simply not match the binding, and would be admitted. What
         the caller controls must be checked by a validation, never by a match rule. */}}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
{{- end }}
