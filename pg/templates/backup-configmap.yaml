{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pg.fullname" . }}-backup
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    for var in POSTGRES_HOST POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY S3_PREFIX RETENTION_DAYS; do
      if [ -z "${!var}" ]; then
        echo "ERROR: Required environment variable $var is not set"
        exit 1
      fi
    done

    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    # Namespace every object under a per-release subpath (#143) so a retention
    # pass never sees, counts, or deletes another release's dumps when multiple
    # releases share one bucket/prefix. Mirrors the pgBackRest repo layout
    # (repo1-path=/<prefix>/<fullname>). The fullname is release-unique.
    # Strip any trailing slash on the prefix so the key never gets an empty
    # segment (b/backups//<fullname>); upload, guard, and retention then agree.
    S3_DIR="${S3_BUCKET}/${S3_PREFIX%/}/{{ include "pg.fullname" . }}"
    S3_PATH="${S3_DIR}/backup_${TIMESTAMP}.dump"

    export PATH="/tools:${PATH}"
    # postgres image ships no CA bundle; use the one copied from the rclone image
    export SSL_CERT_FILE=/tools/ca-bundle.crt

    case "$S3_ENDPOINT" in
      *://*) ;;
      *) echo "ERROR: S3_ENDPOINT must include a scheme (http:// or https://)" >&2; exit 1 ;;
    esac
    # The S3 remote ("s3:") is defined entirely from the environment (#353): rclone reads
    # RCLONE_CONFIG_<REMOTE>_<OPTION>, so the credentials never appear in argv
    # (/proc/<pid>/cmdline, readable via ps -- the reason #167 took them off the command line)
    # and reach the SigV4 signer raw, never percent-encoded (the #221 failure for keys
    # containing '/' or '+'). No config file is read or written (RCLONE_CONFIG=/dev/null);
    # the cache dir lands on the /tmp emptyDir because the root filesystem is read-only.
    # NO_CHECK_BUCKET: the bucket must already exist, and the Job then needs no
    # CreateBucket permission. PROVIDER/REGION come from backup.s3.provider / .region --
    # Amazon S3 needs AWS + the bucket's region, which rclone does not auto-detect.
    export RCLONE_CONFIG=/dev/null
    export RCLONE_CACHE_DIR=/tmp/.rclone
    export RCLONE_CONFIG_S3_TYPE=s3
    export RCLONE_CONFIG_S3_PROVIDER="${S3_PROVIDER:-Other}"
    export RCLONE_CONFIG_S3_ENDPOINT="$S3_ENDPOINT"
    export RCLONE_CONFIG_S3_REGION="${S3_REGION:-}"
    export RCLONE_CONFIG_S3_ACCESS_KEY_ID="$S3_ACCESS_KEY"
    export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
    export RCLONE_CONFIG_S3_ENV_AUTH=false
    export RCLONE_CONFIG_S3_NO_CHECK_BUCKET=true

    # Stage to a .tmp object and publish (rclone moveto) to the canonical backup_<ts>.dump
    # name ONLY after integrity is verified (#159). A mid-stream pg_dump failure leaves a
    # truncated object; staging keeps that truncation off the canonical name, so a restore
    # of "the newest backup" can never pick a half-written dump. The EXIT trap removes the
    # staging object on any early failure (a no-op once the move has run); stale stages
    # from a hard-killed run are swept by retention below. The staging key is made unique
    # per run (pod hostname + pid) so a manually triggered backup overlapping the scheduled
    # one cannot share a .tmp key -- each run's trap then only ever deletes its OWN stage,
    # never a concurrent run's (#159 review). The '*.tmp' sweep glob still reaps it.
    S3_TMP="${S3_PATH}.$(hostname)-$$.tmp"
    trap 'rclone deletefile "s3:${S3_TMP}" >/dev/null 2>&1 || true' EXIT

    echo "Starting streaming backup to s3:${S3_PATH} (staged via .tmp)..."
    PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -Fc -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" | rclone rcat "s3:${S3_TMP}"

    echo "Verifying upload..."
    # lsjson answers an empty array (exit 0) for a missing object, so presence is decided
    # by the parsed size, not by the exit status.
    UPLOADED_SIZE=$(rclone lsjson "s3:${S3_TMP}" | grep -o '"Size":[0-9]*' | grep -o '[0-9]*' || true)
    if [ -z "$UPLOADED_SIZE" ] || [ "$UPLOADED_SIZE" -eq 0 ]; then
      echo "ERROR: Upload verification failed - file missing or zero bytes"
      exit 1
    fi
    echo "Upload verified: ${UPLOADED_SIZE} bytes"

    # Stream the integrity check instead of buffering the whole dump to /tmp on the
    # container's (unbounded, unsized) writable layer -- a large DB could otherwise hit
    # node-disk eviction (#119). pg_restore --list reads only the header + TOC at the
    # front of a -Fc dump; it does NOT consume the data blocks. On any dump larger than
    # the OS pipe buffer (~64 KB) pg_restore exits 0 while `rclone cat` is still streaming,
    # `rclone cat` is then SIGPIPE-killed (exit 141), and pipefail would propagate that and
    # abort the Job *before* the publish step -- so no backup is ever produced (#230).
    # Disable BOTH pipefail and errexit around the pipe so we can inspect each end via
    # PIPESTATUS rather than aborting on the first non-zero (and so the diagnostics below
    # actually run on a failure instead of being skipped by `set -e` at the pipe). The
    # consumer (pg_restore) must succeed; the producer (rclone cat) may exit 141 (128+SIGPIPE)
    # because pg_restore closed the read end early -- that is expected -- but any OTHER
    # rclone cat failure (a real S3 read error / mid-stream truncation) is still fatal, so a
    # damaged read can never be published as "verified".
    echo "Verifying backup integrity via pg_restore --list..."
    set +o pipefail +e
    rclone cat "s3:${S3_TMP}" | pg_restore --list > /dev/null
    # Copy the WHOLE array in one statement: any later command (even a bare assignment)
    # resets PIPESTATUS, so reading [0] then [1] on separate lines would leave [1] unset
    # (fatal under set -u). Index the snapshot instead.
    rc=( "${PIPESTATUS[@]}" )
    set -e -o pipefail
    rc_cat=${rc[0]}
    rc_restore=${rc[1]}
    if [ "$rc_restore" -ne 0 ]; then
      echo "ERROR: backup integrity check failed (pg_restore --list exit $rc_restore)" >&2
      exit 1
    fi
    if [ "$rc_cat" -ne 0 ] && [ "$rc_cat" -ne 141 ]; then
      echo "ERROR: reading the staged dump for verification failed (rclone cat exit $rc_cat)" >&2
      exit 1
    fi
    echo "Backup integrity verified"

    # Integrity confirmed -> publish the staged object to the canonical name. moveto is a
    # server-side copy + delete; the canonical PutObject is itself atomic, so a reader of
    # backup_<ts>.dump only ever sees a complete, verified dump (never a torn one).
    echo "Publishing verified backup to s3:${S3_PATH}..."
    # If the copy succeeds but the stage-delete half errors transiently, do NOT fail an
    # already-published, verified backup: treat a present canonical object as success (the
    # EXIT trap removes the leftover stage). Only a genuinely absent canonical is fatal.
    if ! rclone moveto "s3:${S3_TMP}" "s3:${S3_PATH}"; then
      if rclone lsjson "s3:${S3_PATH}" 2>/dev/null | grep -q '"Size"'; then
        echo "WARN: rclone moveto reported an error but the canonical dump is present; continuing" >&2
      else
        echo "ERROR: failed to publish the verified dump to s3:${S3_PATH}" >&2
        exit 1
      fi
    fi

    # Guard against wiping the whole prefix: the dump uploaded above must be
    # visible as a recent object. If it is not (upload landed elsewhere,
    # prefix mismatch, clock skew), deletion must not run. Scoped to this
    # release's subpath and dump objects only (#143). --max-depth 1 keeps every
    # listing and deletion below at the release directory itself: nothing an
    # operator stores in a subdirectory of it is ever counted or reaped.
    echo "Verifying a recent backup exists before retention cleanup..."
    RECENT_COUNT=$(rclone lsf "s3:${S3_DIR}/" --files-only --max-depth 1 --include 'backup_*.dump' --max-age "${RETENTION_DAYS}d" | grep -c . || true)
    if [ "$RECENT_COUNT" -eq 0 ]; then
      echo "ERROR: No backup newer than ${RETENTION_DAYS} days found under s3:${S3_DIR}/ - aborting retention cleanup" >&2
      exit 1
    fi
    echo "Found ${RECENT_COUNT} recent backup(s)"

    # Delete only this release's own dump objects under its subpath: the per-release
    # path isolates releases, and --include keeps unrelated objects a user may store
    # under the prefix safe (#143).
    # The dump is already published + verified above, so retention maintenance must
    # never fail the Job (a transient S3 list/delete error would mark a good backup
    # Failed and re-run the whole pg_dump). Both maintenance passes are best-effort.
    echo "Running retention cleanup (removing backups older than ${RETENTION_DAYS} days)..."
    rclone delete "s3:${S3_DIR}/" --max-depth 1 --include 'backup_*.dump' --min-age "${RETENTION_DAYS}d" \
      || echo "WARN: retention cleanup encountered an error (non-fatal; backup already published)" >&2

    # Sweep stale staging objects orphaned by a hard-killed run (the EXIT trap covers
    # the normal failure path; this catches a SIGKILL/OOM that skipped it). A short 1d
    # window reaps them promptly (vs RETENTION_DAYS). Scoped to this release's subpath;
    # never matches a published backup_<ts>.dump (#159). Best-effort (see above).
    rclone delete "s3:${S3_DIR}/" --max-depth 1 --include '*.tmp' --min-age 1d \
      || echo "WARN: stale-stage sweep encountered an error (non-fatal)" >&2

    echo "Backup completed successfully"
{{- if .Values.backup.validation.enabled }}
  validate.sh: |
    #!/bin/bash
    # Restore-validation (#31): prove the latest pg_dump backup is actually
    # restorable by restoring it into a throwaway PostgreSQL inside this pod (never
    # the live database) and failing the Job on any pg_restore error.
    set -euo pipefail

    for var in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY S3_PREFIX; do
      if [ -z "${!var}" ]; then
        echo "ERROR: Required environment variable $var is not set"
        exit 1
      fi
    done

    # Same release-scoped path the backup writer uses (#143) so we read this
    # release's own dumps, not another release's under a shared bucket/prefix.
    S3_DIR="${S3_BUCKET}/${S3_PREFIX%/}/{{ include "pg.fullname" . }}"

    export PATH="/tools:${PATH}"
    export SSL_CERT_FILE=/tools/ca-bundle.crt

    case "$S3_ENDPOINT" in
      *://*) ;;
      *) echo "ERROR: S3_ENDPOINT must include a scheme (http:// or https://)" >&2; exit 1 ;;
    esac
    # Same environment-defined remote as backup.sh (#353): credentials never in argv
    # (#167), never percent-encoded (#221).
    export RCLONE_CONFIG=/dev/null
    export RCLONE_CACHE_DIR=/tmp/.rclone
    export RCLONE_CONFIG_S3_TYPE=s3
    export RCLONE_CONFIG_S3_PROVIDER="${S3_PROVIDER:-Other}"
    export RCLONE_CONFIG_S3_ENDPOINT="$S3_ENDPOINT"
    export RCLONE_CONFIG_S3_REGION="${S3_REGION:-}"
    export RCLONE_CONFIG_S3_ACCESS_KEY_ID="$S3_ACCESS_KEY"
    export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
    export RCLONE_CONFIG_S3_ENV_AUTH=false
    export RCLONE_CONFIG_S3_NO_CHECK_BUCKET=true

    echo "Finding the latest backup under s3:${S3_DIR}/ ..."
    # Separate the listing from the parse so a real S3/rclone error fails the Job
    # loudly (set -e) instead of being swallowed by the pipeline and misreported as
    # "no backup found". A successful-but-empty listing still yields no LATEST.
    LISTING=$(rclone lsf "s3:${S3_DIR}/" --files-only --max-depth 1)
    # backup_<YYYYmmdd_HHMMSS>.dump sorts lexically by timestamp, so tail -1 is newest.
    LATEST=$(printf '%s\n' "$LISTING" | grep -E '^backup_.*\.dump$' | sort | tail -1 || true)
    if [ -z "$LATEST" ]; then
      echo "ERROR: no backup_*.dump found under s3:${S3_DIR}/ -- nothing to validate" >&2
      exit 1
    fi
    echo "Latest backup: ${LATEST}"

    WORK=/work
    echo "Downloading ${LATEST}..."
    rclone copyto "s3:${S3_DIR}/${LATEST}" "${WORK}/latest.dump"

    # Throwaway PostgreSQL in this pod's emptyDir -- isolated from production. fsync
    # off (ephemeral) speeds the restore; only the unix socket is used (no TCP).
    export PGDATA="${WORK}/pgdata"
    # restartPolicy OnFailure reuses the pod's emptyDir, so a prior failed attempt
    # leaves a non-empty PGDATA that initdb refuses -- clear it so a retry starts
    # clean (the downloaded dump elsewhere under ${WORK} is untouched).
    rm -rf "${PGDATA}" "${WORK}/run"
    mkdir -p "${WORK}/run"
    echo "Initializing a throwaway PostgreSQL for the restore test..."
    initdb -D "$PGDATA" --auth-local=trust >/dev/null
    pg_ctl -D "$PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=${WORK}/run -c fsync=off" -w start
    trap 'pg_ctl -D "$PGDATA" -m immediate -w stop >/dev/null 2>&1 || true' EXIT

    createdb -h "${WORK}/run" validation
    echo "Restoring ${LATEST} into the throwaway database (any error fails the Job)..."
    # --exit-on-error: a torn/corrupt dump or a missing object aborts here, which is
    # exactly the failure this Job exists to surface. --no-owner/--no-privileges so a
    # missing source role does not fail an otherwise-good restore.
    pg_restore -h "${WORK}/run" -d validation --no-owner --no-privileges --exit-on-error "${WORK}/latest.dump"

    echo "Validating restored contents..."
    psql -h "${WORK}/run" -d validation -q -c "ANALYZE"
    SUMMARY=$(psql -h "${WORK}/run" -d validation -tAF'|' -c "
      SELECT count(*),
             COALESCE(sum(c.reltuples)::bigint, 0)
      FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind IN ('r', 'p', 'm', 'f') AND n.nspname NOT IN ('pg_catalog', 'information_schema')")
    RELS="${SUMMARY%%|*}"
    ROWS="${SUMMARY##*|}"
    echo "Restore OK: ${RELS} table-like relation(s), ~${ROWS} row(s) (estimate)"
    # The hard pass/fail signal is pg_restore --exit-on-error above. A restored DB
    # with no ordinary/partitioned/matview/foreign relations is only a WARNING, not
    # a failure: a schema-only or extension-only database restores cleanly yet has
    # none, and false-failing it would block a perfectly restorable backup.
    if [ "${RELS:-0}" -eq 0 ]; then
      echo "WARN: restored database has no table-like relations (schema-only/extension-only?); the dump still restored cleanly via --exit-on-error" >&2
    fi
    echo "Backup validation succeeded for ${LATEST}"
{{- end }}
{{- end }}
