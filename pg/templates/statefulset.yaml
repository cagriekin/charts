{{- include "pg.normalizeValues" . -}}
{{- /* An overlay that nulls the whole agent block must fail with THIS message rather than a
       raw nil-pointer, and the check therefore has to precede the WHOLE validator chain
       (#298 review). It used to sit beside the env block it was written for, ~800 lines
       below, which made it unreachable: pg.validateSyncReplicationSlotsMajor already reads
       .Values.ha.agent.syncReplicationSlots, so `--set ha.agent=null` died at line 18 with
       `nil pointer evaluating interface {}.syncReplicationSlots` -- exactly the message the
       guard exists to replace. */}}
{{- if eq (include "pg.agentMode" .) "true" }}
{{- $_ := required "ha.agent is required when ha.enabled=true" .Values.ha.agent }}
{{- end }}
{{- include "pg.validateResourceNames" . }}
{{- include "pg.validateAudit" . }}
{{- include "pg.validateRoleNames" . }}
{{- include "pg.validatePgHba" . }}
{{- include "pg.validateExtraPassthrough" . }}
{{- include "pg.validatePgbackrestPassthrough" . }}
{{- include "pg.validateExtensionPackages" . }}
{{- /* #320: BEFORE the aptSources/extraLibs guards below. Those two reject anything set
       while packages is empty -- which is the NORMAL state on the prebuilt-image path, so
       left first they would answer "you set aptSources with no packages" to an operator
       whose actual mistake was combining aptSources with an image. This one names the
       image, so it has to speak first. */}}
{{- include "pg.validateExtensionInitOverrides" . }}
{{- include "pg.validateExtensionAptSources" . }}
{{- include "pg.validateExtraLibs" . }}
{{- include "pg.validateWalLevel" . }}
{{- include "pg.validateSyncReplicationSlotsMajor" . }}
{{- include "pg.validateSyncReplicationSlotsWalLevel" . }}
{{- include "pg.validateNativePreloadRepmgr" . }}
{{- include "pg.validateRemovedRepmgrdValues" . }}
{{- include "pg.validateLeaseTimings" . }}
{{- include "pg.validateHaImageGeneration" . }}
{{- include "pg.validateEtcdBootstrapImage" . }}
{{- if and (not .Values.ha.enabled) (gt (int .Values.postgresql.replicaCount) 0) }}
{{- fail "postgresql.replicaCount > 0 requires ha.enabled=true: with HA disabled the chart would run replicaCount+1 independent PostgreSQL instances with no replication between them. Set postgresql.replicaCount=0 for standalone mode, or ha.enabled=true" }}
{{- end }}
{{- /* Client TLS validation (#110) */}}
{{- if .Values.postgresql.tls.enabled }}
{{- if not .Values.postgresql.tls.existingSecret }}{{ fail "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" }}{{- end }}
{{- end }}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (not .Values.postgresql.tls.enabled) }}
{{- fail "postgresql.tls.require / clientCertAuth require postgresql.tls.enabled" }}
{{- end }}
{{- /* require/mTLS are enforced via the agent-assembled pg_hba (hostssl), and only the
       agent authors pg_hba. Standalone mode (ha.enabled=false) runs the stock postgres
       image with its own pg_hba, which carries an md5-fallback line that would bypass a
       hostssl rule -- so enforced TLS is unsafe there. Server TLS (ssl=on) still works;
       clients can opt in with sslmode=require, or add explicit hostssl rules via
       postgresql.pgHba. */}}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (ne (include "pg.agentMode" .) "true") }}
{{- fail "postgresql.tls.require / clientCertAuth require ha.enabled=true: enforced TLS depends on the agent-assembled pg_hba (hostssl with no md5 fallback), and standalone mode runs the stock postgres image's own pg_hba. For standalone, use postgresql.tls.enabled for optional server TLS and have clients set sslmode=require." }}
{{- end }}
{{- /* Cross-component sslmode consistency: when the server requires TLS, the exporter
       must also use TLS or its scrapes are rejected by hostssl. clientCertAuth forces
       hostssl on its own (it implies require in AssemblePgHba), so guard on either. */}}
{{- $tlsRequired := or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth }}
{{- if and $tlsRequired .Values.prometheusExporter.enabled (eq .Values.prometheusExporter.sslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires prometheusExporter.sslmode >= require (else the exporter's scrapes are rejected by hostssl). Set prometheusExporter.sslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- if and (has .Values.prometheusExporter.sslmode (list "verify-ca" "verify-full")) (not .Values.postgresql.tls.enabled) }}
{{- fail "prometheusExporter.sslmode verify-ca/verify-full requires postgresql.tls.enabled (the CA from postgresql.tls.existingSecret is mounted to verify the server cert)." }}
{{- end }}
{{- /* pgpool backend must also speak TLS when the server requires it. */}}
{{- if and $tlsRequired .Values.pgpool.enabled .Values.pgpool.tls.enabled (eq .Values.pgpool.tls.backendSslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires pgpool.tls.backendSslmode >= require (else pgpool's backend connections are rejected by hostssl). Set pgpool.tls.backendSslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- /* Under PostgreSQL mTLS, application connections passing through pgpool need pgpool
       to present a backend client cert (the app users are not exempted from clientcert). */}}
{{- if and .Values.postgresql.tls.clientCertAuth .Values.pgpool.enabled (or (not .Values.pgpool.tls.enabled) (not .Values.pgpool.tls.backendClientCert)) }}
{{- fail "postgresql.tls.clientCertAuth=true with pgpool.enabled requires pgpool.tls.enabled and pgpool.tls.backendClientCert (a client cert pgpool presents to the backends for app-user passthrough under mTLS)." }}
{{- end }}
{{- /* Control API validation (#276). Every one of these is a RENDER guard rather than
       only a boot check in the agent: an operator who enables the API without its TLS
       material would otherwise get a crash-looping database (the agent refuses to open
       an unauthenticated mutating port), and discovering that from a CrashLoopBackOff
       is a much worse experience than a failed `helm upgrade`. Mirrors the
       postgresql.tls.existingSecret guard above. */}}
{{- $control := .Values.ha.agent.control }}
{{- if $control.enabled }}
{{- if ne (include "pg.agentMode" .) "true" }}
{{- fail "ha.agent.control.enabled requires ha.enabled=true: the control API is served by the Go agent, and standalone mode runs no agent." }}
{{- end }}
{{- if not $control.tls.existingSecret }}
{{- fail "ha.agent.control.enabled requires ha.agent.control.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt). The control API is mTLS-only -- there is no token or plaintext mode -- so without client-CA material it would have no way to authenticate callers and the agent refuses to start." }}
{{- end }}
{{- if eq (int $control.port) 9200 }}
{{- fail "ha.agent.control.port must not be 9200: that is the agent's read-only metrics/probe port, and keeping the two apart is what lets a NetworkPolicy admit Prometheus to 9200 without admitting anything to the mutating control surface." }}
{{- end }}
{{- if eq (int $control.port) 5432 }}
{{- fail "ha.agent.control.port must not be 5432 (the PostgreSQL port)" }}
{{- end }}
{{- end }}
{{- if $control.restore.enabled }}
{{- if not $control.enabled }}
{{- fail "ha.agent.control.restore.enabled requires ha.agent.control.enabled" }}
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "ha.agent.control.restore.enabled requires pgbackrest.enabled (there is no repository to restore from)" }}
{{- end }}
{{- if not .Values.pgbackrest.restore.enabled }}
{{- fail "ha.agent.control.restore.enabled requires pgbackrest.restore.enabled: the API triggers the chart's restore Job rather than constructing one, so the release must render it" }}
{{- end }}
{{- if ne .Values.pgbackrest.restore.mode "cronjob" }}
{{- fail "ha.agent.control.restore.enabled requires pgbackrest.restore.mode=cronjob: the agent clones the suspended CronJob's jobTemplate (exactly as `kubectl create job --from=cronjob/...` does), so in mode=job there is nothing to clone" }}
{{- end }}
{{- if not $control.restore.allowedClientCNs }}
{{- fail "ha.agent.control.restore.enabled requires a non-empty ha.agent.control.restore.allowedClientCNs: restore is a separate authz verb from pause/switchover, and an empty allowlist denies every client -- name the certificate CNs permitted to overwrite the data directory" }}
{{- end }}
{{- /* The grant and its bound render together or not at all (#279). Refusing here rather
       than warning is the point: `create jobs` cannot be resourceName-scoped, so a Role
       rendered without the admission policy carries a namespace-wide privilege-escalation
       primitive on a token that sits next to user-supplied SQL. Opting out stays possible
       -- a cluster below 1.30, a namespace-limited installer, a platform-managed policy --
       but it has to be said out loud in values, where it is reviewable. */}}
{{- if and (not $control.restore.admissionPolicy.enabled) (not $control.restore.admissionPolicy.acknowledgeUnbounded) }}
{{- fail "ha.agent.control.restore.admissionPolicy.enabled=false leaves the restore feature's `create jobs` grant unbounded: RBAC cannot restrict create by resourceName, so anything holding the database pods' ServiceAccount token could create arbitrary Jobs in this namespace and name any ServiceAccount in them. Either leave admissionPolicy.enabled=true (it needs Kubernetes >= 1.30 and cluster-scoped create on ValidatingAdmissionPolicy), or set ha.agent.control.restore.admissionPolicy.acknowledgeUnbounded=true to accept that trade deliberately" }}
{{- end }}
{{- end }}
{{- if and $control.restore.readPodLogs (not $control.restore.enabled) }}
{{- fail "ha.agent.control.restore.readPodLogs requires ha.agent.control.restore.enabled (it only affects reading a restore Job's log)" }}
{{- end }}
{{- if .Values.ha.enabled }}
{{- $haMajor := required "ha.image.majorVersion is required (the PostgreSQL major bundled in the HA image)" .Values.ha.image.majorVersion }}
{{- if ne (toString .Values.postgresql.majorVersion) (toString $haMajor) }}
{{- fail (printf "postgresql.majorVersion=%q does not match ha.image.majorVersion=%q. With ha.enabled the PostgreSQL server runs from the HA image (%s), which bundles only PostgreSQL %s and always runs that server regardless of postgresql.image; a mismatch crash-loops the extension init container or silently runs the wrong major. Set postgresql.majorVersion=%q (with a matching postgresql.image), or point ha.image at an image built for PostgreSQL %s and set ha.image.majorVersion to match" (toString .Values.postgresql.majorVersion) (toString $haMajor) .Values.ha.image.repository (toString $haMajor) (toString $haMajor) (toString .Values.postgresql.majorVersion)) }}
{{- end }}
{{- /* The two majorVersion values above are hand-typed claims; the image TAG is what
       actually decides the major (#269). The published per-major tags carry a -pgNN
       suffix, so when one is in use the chart can check the claim against the artifact
       instead of trusting it -- catching "moved the tag, forgot the majors" (and the
       reverse) at render time rather than as a crash-looping extension init container or,
       with extensions off, a silently wrong major. An unsuffixed tag carries no major to
       compare, which is why the container also gets PG_MAJOR from majorVersion: the
       entrypoint and agent then refuse to start an image that lacks that major. */}}
{{- $tagMajor := regexFind "-pg[0-9]+$" (toString .Values.ha.image.tag) }}
{{- if $tagMajor }}
{{- $tagMajor = trimPrefix "-pg" $tagMajor }}
{{- if ne $tagMajor (toString $haMajor) }}
{{- fail (printf "ha.image.tag=%q is built for PostgreSQL %s, but ha.image.majorVersion=%q. The tag decides which major actually runs, so these must agree: set ha.image.majorVersion=%q and postgresql.majorVersion=%q, or change the tag suffix to -pg%s" (toString .Values.ha.image.tag) $tagMajor (toString $haMajor) $tagMajor $tagMajor (toString $haMajor)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.pgbackrest.enabled (not .Values.ha.enabled) }}
{{- fail "pgbackrest.enabled requires ha.enabled=true: the pgbackrest binary and the archive_command run inside the postgresql container, which in standalone mode is the official postgres image without pgbackrest. WAL archiving would fail on every segment (unbounded WAL growth) and backups would time out. Set ha.enabled=true, or disable pgbackrest" }}
{{- end }}
{{- /* Bootstrap-from-backup (#266) prerequisites. Fail fast rather than rendering an init
       container that could never work. */}}
{{- if .Values.pgbackrest.bootstrap.enabled }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires pgbackrest.enabled (the bootstrap init container reads the pgBackRest repo config and S3 credentials the pgbackrest feature renders)" }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires postgresql.persistence.enabled: with an emptyDir PGDATA every pod restart loses the data directory, so the bootstrap would re-restore the entire database on each start instead of once" }}
{{- end }}
{{- if and (ne .Values.pgbackrest.bootstrap.targetType "") (not .Values.pgbackrest.bootstrap.target) }}
{{- fail "pgbackrest.bootstrap.target is required when pgbackrest.bootstrap.targetType is set" }}
{{- end }}
{{- end }}
{{- /* Bundled etcd consistency: the subchart deploys 3 stateful pods, so reject the
       contradictory inputs that would silently orphan them (fail-fast). */}}
{{- if (.Values.etcd).enabled }}
{{- if ne (include "pg.agentEtcdMode" .) "true" }}
{{- fail "etcd.enabled=true deploys a bundled etcd cluster, but the agent etcd backend is not active (it would be left unused). Set ha.enabled=true and ha.agent.dcs.backend=etcd, or set etcd.enabled=false" }}
{{- end }}
{{- if (.Values.ha.agent.dcs.etcd).endpoints }}
{{- fail "etcd.enabled=true (bundled etcd) and ha.agent.dcs.etcd.endpoints (external etcd) are both set; the agent would target the external endpoints and leave the bundled cluster unused. Pick one: enable the bundle OR set endpoints" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pg.fullname" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- /* The kube-linter probe waiver is GATED on pgbackrest.enabled (#298 review), not
         unconditional. kube-linter waives per OBJECT, not per container, so an unconditional
         annotation here would also stop the gate from ever noticing that the `postgresql`
         container had lost its liveness/readiness probes -- the one container in this pod where
         those probes are load-bearing. Gating it means every profile that does not enable
         pgbackrest (including the default render) keeps full enforcement on this StatefulSet,
         and only the pgbackrest-enabled renders carry the waiver. The waived container is an
         idle `exec sleep infinity` holder: the CronJobs `kubectl exec` into it, nothing serves
         from it, and there is no state a probe could observe -- if it dies the kubelet restarts
         it. Widening the gate past the DEFAULT render is what surfaced this at all. */ -}}
  {{- if or .Values.global.annotations .Values.postgresql.annotations .Values.pgbackrest.enabled }}
  annotations:
    {{- if .Values.pgbackrest.enabled }}
    ignore-check.kube-linter.io/no-liveness-probe: "the pgbackrest sidecar is an idle `sleep infinity` holder the CronJobs exec into"
    ignore-check.kube-linter.io/no-readiness-probe: "the pgbackrest sidecar is an idle `sleep infinity` holder the CronJobs exec into"
    {{- end }}
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.postgresql.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  serviceName: {{ include "pg.fullname" . }}-headless
  # Pinned explicitly (not left to the API default) so it cannot change silently.
  # podManagementPolicy is IMMUTABLE: changing it needs the StatefulSet recreated
  # (`kubectl delete sts --cascade=orphan`), which is why the 2.0.0 upgrade note calls
  # this out for anyone coming from failoverMode: repmgrd (#286).
  {{- if eq (include "pg.agentMode" .) "true" }}
  # HA: Parallel — all pods are present at a cold boot, so the lease winner compares
  # timelines across the complete candidate set and the highest-timeline survivor is
  # chosen before any node promotes.
  podManagementPolicy: Parallel
  {{- else }}
  # Standalone: a single pod (replicaCount must be 0), so ordering is moot; OrderedReady
  # keeps the rollout one-at-a-time and matches the pre-2.0.0 default for this mode.
  podManagementPolicy: OrderedReady
  {{- end }}
  replicas: {{ add .Values.postgresql.replicaCount 1 }}
  {{- with .Values.postgresql.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "pg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
{{- if or (eq (include "pg.postgresqlConfigRenders" .) "true") .Values.postgresql.podAnnotations }}
      annotations:
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
        checksum/postgresql-config: {{ include (print $.Template.BasePath "/postgresql-configmap.yaml") . | sha256sum }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Roll the pod when the pgbackrest config (S3 endpoint/bucket/retention)
        # changes: pgbackrest.conf is a subPath mount, which the kubelet never
        # live-updates, so without this checksum a helm upgrade would silently keep
        # archiving WAL + running backups against the OLD repository (#145).
        checksum/pgbackrest-config: {{ include (print $.Template.BasePath "/pgbackrest-configmap.yaml") . | sha256sum }}
{{- end }}
      {{- with .Values.postgresql.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.ha.enabled }}
      # Standalone (no repmgr): the agent that needs the API token is not present,
      # so don't mount one (#166). In repmgr mode the token is required.
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.ha.enabled }}
      terminationGracePeriodSeconds: {{ .Values.ha.terminationGracePeriodSeconds | default 120 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
      {{- if .Values.ha.enabled }}
      {{- /* No shareProcessNamespace: it existed so repmgrd could signal postgres across
             containers. The agent is PID 1 in the postgresql container and owns its child
             directly, so the pods no longer share a PID namespace (#286). */}}
      serviceAccountName: {{ include "pg.fullname" . }}-repmgr
      {{- end }}
      {{- with .Values.postgresql.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.postgresql.affinity }}
        {{- toYaml .Values.postgresql.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "pg.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: postgresql
              topologyKey: kubernetes.io/hostname
          # Zone spread is preferred (soft) so single-zone clusters still
          # schedule; the hostname rule above stays hard and dominates.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pg.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: postgresql
                topologyKey: topology.kubernetes.io/zone
        {{- end }}
      {{- with .Values.postgresql.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{- if .Values.postgresql.persistence.enabled }}
        - name: fix-permissions
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ['sh', '-c', 'chown -R 101:103 /var/lib/postgresql/data && if [ -d /var/lib/postgresql/data/pgdata ]; then chmod 0700 /var/lib/postgresql/data/pgdata; fi']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # Root is required to chown the volume, but drop the rest of the default
            # capability set -- only CHOWN (chown), FOWNER (chmod) and DAC_OVERRIDE
            # (traverse/modify regardless of perms) are needed (#162).
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- end }}
{{- if .Values.pgbackrest.bootstrap.enabled }}
        # Bootstrap-from-backup (#266). Seeds an EMPTY data directory from the pgBackRest
        # repository, so a replica-0 that lost its PVC recovers its data instead of silently
        # initdb-ing an empty cluster. Ordered BEFORE repmgr-init on purpose: once PGDATA is
        # populated, init-repmgr.sh defers the start decision and the entrypoint skips initdb,
        # so postgres starts, replays the archived WAL via restore_command and promotes.
        # It refuses to touch an already-initialized directory (see bootstrap.sh), which is
        # what makes it safe to leave enabled across ordinary restarts and rollouts.
        - name: pgbackrest-bootstrap
          image: "{{ include "pg.haImage" . }}"
          imagePullPolicy: {{ .Values.ha.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # pgbackrest's default log/lock paths may be unwritable, and neither belongs on
            # the data volume; /tmp is this container's own writable layer.
            - name: PGBACKREST_LOG_PATH
              value: /tmp/pgbackrest-log
            - name: PGBACKREST_LOCK_PATH
              value: /tmp/pgbackrest-lock
            - name: TARGET_TYPE
              value: {{ .Values.pgbackrest.bootstrap.targetType | quote }}
            - name: TARGET
              value: {{ .Values.pgbackrest.bootstrap.target | quote }}
            - name: BACKUP_SET
              value: {{ .Values.pgbackrest.bootstrap.backupSet | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
{{- /* #323: one operator list reaches every container that runs pgbackrest or drives it --
       this init container and the sidecar below, plus the backup CronJobs, the restore
       workload and the validation CronJob. Deliberately NOT the postgresql container: it has
       postgresql.extraEnv of its own (also where archive_command's own pgbackrest invocation
       reads its environment), and a KUBECONFIG injected there would redirect the entrypoint's
       stale-primary guard (#170) as a side effect of configuring backups. Appended LAST so it
       reads as an override in the manifest, though a collision with a chart-set name is
       refused at render time rather than left last-wins
       (pg.validatePgbackrestPassthrough). */}}
{{- with .Values.pgbackrest.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          resources:
            {{- toYaml .Values.pgbackrest.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            # Dedicated directory volume (not a subPath file) so /scripts is created by the
            # mount and need not pre-exist in the image.
            - name: pgbackrest-bootstrap-script
              mountPath: /scripts
              readOnly: true
{{- with .Values.pgbackrest.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.extensions.enabled .Values.ha.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
{{- $pkgs := list }}
{{- range $p := (.Values.postgresql.extensions.packages | default list) }}
{{- $pkgs = append $pkgs ($p | toString | replace "{major}" ($pgMajor | toString)) }}
{{- end }}
        - name: copy-base-ext
          image: "{{ include "pg.haImage" . }}"
          imagePullPolicy: {{ .Values.ha.image.pullPolicy }}
{{- if $pkgs }}
          # #303: apt-get install into THIS container's own filesystem before the copy
          # below -- neither ext-lib nor ext-share is mounted at the real
          # /usr/lib(share)/postgresql/{{ $pgMajor }}/... paths here (only the main
          # postgresql container mounts them there), so dpkg unpacks straight into
          # this image's normal extension directories and the unmodified cp then
          # picks up both the HA image's original extensions and anything just
          # installed. The HA image configures the PGDG apt repo at build time
          # (images/pg-ha/Dockerfile), so this is the reliable install path in
          # repmgr mode.
          #
          # Pin postgresql-{{ $pgMajor }} to whatever's already installed before naming any
          # extension package on the same apt-get install line (review, #303): an
          # unversioned `Depends: postgresql-{{ $pgMajor }}` is satisfied by any installed
          # version and normally left alone, but apt is still free to upgrade it to
          # satisfy some OTHER package's stricter constraint -- which would replace the
          # very libs this cp is about to copy with a build from a different point
          # release than the postmaster this chart actually starts (the #302 failure
          # mode, one layer up). The pin makes that impossible to do silently: apt
          # either leaves the server package alone (the normal case) or fails the
          # render-time-adjacent install outright, never a quiet swap.
          command: ['sh', '-c', {{ include "pg.extensionInstallCommand" (dict "pgMajor" $pgMajor "pkgs" $pkgs "aptSources" .Values.postgresql.extensions.aptSources "extraLibs" .Values.postgresql.extensions.extraLibs "noClobber" false) | quote }}]
          securityContext:
            # apt-get/dpkg needs root to write /var/lib/dpkg and run package
            # maintainer scripts (e.g. ldconfig) -- broader than fix-permissions'
            # plain chown/chmod (#162), because dpkg's maintainer-script surface is
            # inherently wider than one chown call. Root is confined to this
            # throwaway init container, which persists nothing: its only output is
            # two file trees copied into emptyDirs. The main postgresql container,
            # and this same container with no packages set, keep running as the
            # unprivileged containerSecurityContext user. This whole block REPLACES
            # postgresql.containerSecurityContext for this container while packages
            # is set (review, #303) -- deliberate, since dpkg needs root -- but it
            # means a values-set runAsGroup/seccompProfile/readOnlyRootFilesystem is
            # NOT merged in here and has no effect on this container. A namespace
            # enforcing the PSA restricted profile (or any runAsNonRoot admission
            # policy) will reject this pod outright; see the README PSA note.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                # SETUID/SETGID/SETFCAP are no-ops here under
                # allowPrivilegeEscalation: false (kernel no_new_privs blocks the
                # privilege gain these grant) -- kept anyway so a dpkg postinst
                # script that merely CALLS setuid()/setgid()/setcap() (e.g. to
                # verify ownership, not to actually escalate) gets EPERM handled
                # gracefully by the calling code instead of the syscall itself
                # being denied in a way some maintainer scripts do not expect.
                - SETUID
                - SETGID
                - SETFCAP
                - MKNOD
{{- else }}
          command: ['sh', '-c', 'cp /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so* /ext-lib/ && cp /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
{{- end }}
{{- if $pkgs }}
          {{- /* #320: proxy/mirror settings for the apt steps. On the init containers
                 ONLY -- never the postgresql container, where an http_proxy leaking into
                 the postmaster's environment would silently redirect anything else that
                 reads it. Gated on $pkgs for the same reason the install itself is: the
                 plain-copy path runs no apt, so env there would be inert and misleading. */}}
{{- with .Values.postgresql.extensions.env }}
          env:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.postgresql.extensions.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
{{- if .Values.postgresql.extensions.extraLibs }}
            - name: ext-extra-lib
              mountPath: /ext-extra-lib
{{- end }}
{{- if $pkgs }}
            {{- /* #320: an apt.conf.d snippet or a replacement sources.list -- what
                   aptSources cannot express, since it only APPENDS source files and
                   cannot rewrite the PGDG/base sources the images ship. Same $pkgs gate
                   and same init-containers-only scope as env above. */}}
{{- with .Values.postgresql.extensions.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          resources:
{{- if $pkgs }}
            {{- toYaml .Values.postgresql.extensions.installResources | nindent 12 }}
{{- else }}
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
{{- $pkgs := list }}
{{- range $p := (.Values.postgresql.extensions.packages | default list) }}
{{- $pkgs = append $pkgs ($p | toString | replace "{major}" ($pgMajor | toString)) }}
{{- end }}
        - name: copy-ext
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
{{- if $pkgs }}
          # #303: apt-get install before the copy below, same reasoning as
          # copy-base-ext. Still -n (no-clobber, #302) on the copy: in repmgr mode
          # copy-base-ext already populated ext-lib/ext-share from the HA image,
          # which is what actually runs the server, so this container's job (with or
          # without packages) is to ADD what's missing, never overwrite a core lib
          # with this image's build. PGDG apt-source availability in
          # postgresql.image is NOT verified by this chart -- see README "Installing
          # extensions without a custom image". Same postgresql-{{ $pgMajor }} version
          # pin as copy-base-ext, and for the same reason (review, #303) -- best-effort
          # here too: if this image did not install PostgreSQL via a dpkg-tracked
          # postgresql-{{ $pgMajor }} package, PGVER is empty and the pin is skipped
          # rather than failing an otherwise-valid custom-image install.
          command: ['sh', '-c', {{ include "pg.extensionInstallCommand" (dict "pgMajor" $pgMajor "pkgs" $pkgs "aptSources" .Values.postgresql.extensions.aptSources "extraLibs" .Values.postgresql.extensions.extraLibs "noClobber" true) | quote }}]
          securityContext:
            # Same as copy-base-ext's apt-step securityContext above (review, #303):
            # REPLACES postgresql.containerSecurityContext, not a merge -- and will
            # be rejected under the PSA restricted profile. SETUID/SETGID/SETFCAP
            # are no-ops under allowPrivilegeEscalation: false; kept so a dpkg
            # postinst that calls those syscalls gets a handled EPERM.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - SETUID
                - SETGID
                - SETFCAP
                - MKNOD
{{- else }}
          # -n (no-clobber, #302): copy-base-ext (when repmgr is enabled) already
          # populated ext-lib/ext-share from the HA image, which is what actually
          # runs the server. This container only ADDS what's missing (e.g. vector.so)
          # -- it must never overwrite a core lib (e.g. libpqwalreceiver.so) with this
          # image's build. The two images can drift to different postgres point
          # releases independently (this image's tag is often floating), and an
          # unconditional overwrite silently reintroduces an ABI mismatch between
          # the running server and its own WAL receiver plugin.
          command: ['sh', '-c', 'cp -n /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so* /ext-lib/ && cp -n /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
{{- end }}
{{- if $pkgs }}
          {{- /* #320: proxy/mirror settings for the apt steps. On the init containers
                 ONLY -- never the postgresql container, where an http_proxy leaking into
                 the postmaster's environment would silently redirect anything else that
                 reads it. Gated on $pkgs for the same reason the install itself is: the
                 plain-copy path runs no apt, so env there would be inert and misleading. */}}
{{- with .Values.postgresql.extensions.env }}
          env:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.postgresql.extensions.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
{{- if .Values.postgresql.extensions.extraLibs }}
            - name: ext-extra-lib
              mountPath: /ext-extra-lib
{{- end }}
{{- if $pkgs }}
            {{- /* #320: an apt.conf.d snippet or a replacement sources.list -- what
                   aptSources cannot express, since it only APPENDS source files and
                   cannot rewrite the PGDG/base sources the images ship. Same $pkgs gate
                   and same init-containers-only scope as env above. */}}
{{- with .Values.postgresql.extensions.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          resources:
{{- if $pkgs }}
            {{- toYaml .Values.postgresql.extensions.installResources | nindent 12 }}
{{- else }}
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- end }}
{{- $extImgVals := .Values.postgresql.extensions.image | default dict }}
{{- if and .Values.postgresql.extensions.enabled ($extImgVals.repository | default "") }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
{{- /* default dict throughout (#320 review): `extensions.image: null` in a values file
       otherwise produced a bare "nil pointer evaluating interface {}.repository" naming no
       value at all -- and nulling a map is exactly what a values-file merge does when
       someone tries to clear it. */}}
{{- $extImg := dict "repository" $extImgVals.repository "tag" ($extImgVals.tag | default "" | toString | replace "{major}" ($pgMajor | toString)) "digest" ($extImgVals.digest | default "") }}
        {{- /* #320: the prebuilt-extension path. The packages were resolved ONCE, at image
               build time (images/pg-extensions/), so this container runs a plain `cp` --
               no apt-get, therefore no egress on the pod-start path and no root. That last
               part matters beyond tidiness: the apt path has to REPLACE
               postgresql.containerSecurityContext with runAsUser: 0 (dpkg needs it), which
               a namespace enforcing the PSA restricted profile rejects outright. This path
               keeps the unprivileged context, so it works where the apt path cannot run at
               all.

               LAST of the three extension init containers, and `cp -n` (no-clobber), for
               the same #302 reason copy-ext is: copy-base-ext populated ext-lib/ext-share
               from the image that actually RUNS the server, and this image is an
               independent build that can sit on a different postgres point release. An
               unconditional copy would overwrite a core lib (e.g. libpqwalreceiver.so)
               with a build the running postmaster never linked against. Adding only what
               is missing is the whole job. */}}
        - name: copy-prebuilt-ext
          image: {{ include "pg.image" $extImg | quote }}
          imagePullPolicy: {{ $extImgVals.pullPolicy | default "IfNotPresent" }}
          command: ['sh', '-c', {{ include "pg.extensionPrebuiltCopyCommand" (dict "pgMajor" $pgMajor "extraLibs" .Values.postgresql.extensions.extraLibs) | quote }}]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
{{- if .Values.postgresql.extensions.extraLibs }}
            - name: ext-extra-lib
              mountPath: /ext-extra-lib
{{- end }}
          resources:
            {{- /* pg.initResources, not installResources: this is a `cp`, not a
                   package-manager run -- which is the entire point of the prebuilt path. */}}
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- if .Values.ha.enabled }}
        - name: repmgr-init
          image: "{{ include "pg.haImage" . }}"
          imagePullPolicy: {{ .Values.ha.image.pullPolicy }}
          command: ["/usr/local/bin/entrypoint.sh", "init"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            {{- /* The reduced `init` mode reads NOTHING but PG_MAJOR (#290): it stats a binary
                   and exits. The credentials, headless service and node count a cloning init
                   container needed are removed rather than left inert -- mounting the
                   release Secret into a container that cannot use it is needless credential
                   surface, and USE_REPLICATION_SLOTS in particular is now read by nothing in
                   the image at all. PG_MAJOR arrives via pg.pgMajorEnv above. */}}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.ha.initContainerResources | nindent 12 }}
{{- end }}
        - name: setup-config
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              CONF=/var/lib/postgresql/data/pgdata/postgresql.conf
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
              if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
              fi
{{- else }}
              # A stale include_dir left in PGDATA while conf.d features
              # were enabled is fatal at postmaster start once the mount
              # is gone.
              if [ -f "$CONF" ] && grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                grep -v "include_dir = '/etc/postgresql/conf.d'" "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
              # pgbackrest disabled: the HA image entrypoint persisted
              # archive_mode=on + a pgbackrest archive_command into PGDATA's
              # postgresql.conf at initdb (#132). With the pgbackrest config and
              # S3 credentials now gone, every archive_command fails and WAL is
              # never recycled -- pg_wal grows until the PVC fills and the
              # postmaster PANICs. Strip the entrypoint-written archive lines so
              # archiving reverts to the default (off). Live archive settings,
              # when enabled, come from the chart-managed conf.d include, never
              # this base file, so this only ever removes stale, failing config.
              if [ -f "$CONF" ] && grep -q "archive-push %p" "$CONF"; then
                grep -v -e '^archive_mode = on$' -e 'archive-push %p' "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
      containers:
        - name: postgresql
{{- if .Values.ha.enabled }}
          image: "{{ include "pg.haImage" . }}"
          imagePullPolicy: {{ .Values.ha.image.pullPolicy }}
          # Always agent mode. pg.agentMode IS ha.enabled and this block already sits inside
          # `if .Values.ha.enabled`, so a `postgres` alternative here would be unreachable
          # (#290). The image still has a `postgres` mode for direct, non-chart use, and the
          # stale-primary rejoin belongs to the agent's reconcile loop, where it can be fenced.
          command: ["/usr/local/bin/entrypoint.sh", "agent"]
{{- else }}
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
{{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
{{- if eq (include "pg.agentMode" .) "true" }}
            - name: agent-metrics
              containerPort: 9200
              protocol: TCP
{{- if $control.enabled }}
            {{- /* Control API (#276) on its own port, so the NetworkPolicy can admit
                   scrapers to agent-metrics without admitting anything here. */}}
            - name: agent-control
              containerPort: {{ int $control.port }}
              protocol: TCP
{{- end }}
{{- end }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
{{- if and .Values.postgresql.extensions.enabled .Values.postgresql.extensions.extraLibs }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
            # #309: an apt-installed extension's transitive shared-library dependency
            # (e.g. libsodium.so.23, needed by pgsodium/supabase_vault) has no RUNPATH
            # and is never in the default ld.so search path -- the extension .so itself
            # loads fine (postgres dlopen()s it by absolute path), but resolving ITS OWN
            # NEEDED entries then fails with "cannot open shared object file" unless the
            # copied-alongside dependency (postgresql.extensions.extraLibs) is on a path
            # the dynamic linker actually searches.
            #
            # Points at ext-extra-lib, NOT ext-lib (review, #302): ext-lib is also
            # populated by the unvalidated *.so* glob copy from either image, so pointing
            # the search path there would extend the same ABI-shadowing hazard
            # pg.validateExtraLibs' denylist exists to prevent to every file that glob
            # happens to sweep in. ext-extra-lib is written ONLY by the extraLibs copy
            # step, so LD_LIBRARY_PATH only ever searches paths this chart validated.
            # Gated on extraLibs specifically, not bare extensions.enabled, so a release
            # that doesn't use this feature gets no search-path change at all.
            #
            # A Kubernetes container env entry REPLACES (not appends to) the image's own
            # ENV of the same name (review) -- confirmed neither postgres:*-trixie nor
            # cagriekin/repmgr sets LD_LIBRARY_PATH today (`docker inspect ... Config.Env`
            # has no LD_LIBRARY_PATH entry in either), so there's nothing to clobber. If a
            # future base-image bump ever adds one, this would need to change to prepend
            # this path onto the image's own value instead of overwriting it outright.
            - name: LD_LIBRARY_PATH
              value: /usr/lib/postgresql/{{ $pgMajor }}/extra-lib
{{- end }}
{{- if .Values.ha.enabled }}
            - name: REPMGR_USER
              value: {{ .Values.ha.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.ha.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
            # Lets the entrypoint stale-primary guard read the durable primary
            # marker (#125) to tell a first install from a PVC-loss recreate, so
            # it only settles/retries the empty-data peer scan in the recreate
            # case and never delays a first install (#170).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRIMARY_MARKER
              value: {{ printf "%s-primary" (include "pg.fullname" .) | quote }}
{{- if eq (include "pg.agentMode" .) "true" }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LEASE_NAME
              value: {{ printf "%s-leader" (include "pg.fullname" .) | quote }}
            {{- /* Rendered through pg.haAgentDuration -- the SAME helper the
                   pg.validateLeaseTimings guard reads -- so the emitted value can never
                   diverge from the validated one (#298 review): `--set
                   ha.agent.leaseDuration=null` DELETES the key, the validator then
                   checks the default, but the raw `.Values` render emitted `value: ""`,
                   which config.Load refuses -- every pod CrashLoopBackOffed after a
                   clean render, the exact failure class the #291 validator exists to
                   prevent. Defaults must match values.yaml. */}}
            - name: LEASE_DURATION
              value: {{ include "pg.haAgentDuration" (list .Values.ha.agent "leaseDuration" "15s") | quote }}
            - name: RENEW_DEADLINE
              value: {{ include "pg.haAgentDuration" (list .Values.ha.agent "renewDeadline" "10s") | quote }}
            - name: RETRY_PERIOD
              value: {{ include "pg.haAgentDuration" (list .Values.ha.agent "retryPeriod" "2s") | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ include "pg.haAgentDuration" (list .Values.ha.agent "reconcileInterval" "5s") | quote }}
{{- if .Values.ha.agent.cascadingReplication }}
            {{- /* Cascading replication (#29): a standby may follow another standby to
                   offload the primary's WAL senders. The agent picks a safe upstream and
                   falls back to the primary, so a failed upstream never strands a node. */}}
            - name: CASCADE_REPLICATION
              value: "true"
{{- end }}
{{- if .Values.ha.agent.syncReplicationSlots }}
            {{- /* Logical failover slot sync (#308): the primary reconciles
                   synchronized_standby_slots to its current standby's physical slot(s)
                   on every tick. Requires postgresql.walLevel: logical -- enforced by
                   pg.validateSyncReplicationSlotsWalLevel, since the sync_replication_slots
                   worker this enables on every standby is NOT a harmless no-op without it
                   (it fails startup validation and PostgreSQL respawns it forever). */}}
            - name: SYNC_REPLICATION_SLOTS
              value: "true"
{{- end }}
            {{- /* Which replication mechanics the agent drives (#287). ALWAYS emitted, never
                   omitted at the default: an image predating #294 falls back to repmgr when
                   MECHANISM is absent, so a chart that leaves it out would run the removed
                   mechanism on a not-yet-updated image. `native` is the only accepted value;
                   `repmgr` is rejected by pg.validateRemovedRepmgrdValues. */}}
            - name: MECHANISM
              value: {{ (.Values.ha.agent).mechanism | default "native" | quote }}
            - name: MASTER_SERVICE
              value: {{ include "pg.fullname" . | quote }}
            - name: POD_SELECTOR
              value: app.kubernetes.io/name={{ include "pg.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=postgresql
            {{- /* The agent owns pg_hba in agent mode: it writes a hardened SCRAM-only
                   pg_hba trusting POD_CIDR (no legacy 0.0.0.0/0 md5), with the user's
                   postgresql.pgHba inserted above the network catch-alls. */}}
            - name: POD_CIDR
              value: {{ required "ha.agent.podCidr is required in agent mode (the pod network trusted by the hardened pg_hba)" .Values.ha.agent.podCidr | quote }}
{{- with .Values.postgresql.pgHba }}
            - name: POSTGRESQL_PGHBA
              value: {{ join "\n" . | quote }}
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
            {{- /* Client TLS pg_hba (#110): the agent emits hostssl on the pod CIDR
                   when require/clientCertAuth, exempting the internal service users
                   (repmgr/postgres/monitoring) from the client-cert requirement. */}}
            {{- /* TLS_ENABLED carries the INTENT, which the agent cannot infer from the two
                   variables below: `require` defaults to false, so an absent TLS_REQUIRE_SSL and
                   a deliberate `require: false` are the same value. The agent needs the intent
                   to run its #335 check -- verify from the postmaster (`SHOW ssl`) that the
                   server really is speaking TLS, because every other signal an operator can
                   read describes the config that was rendered, not the one that was loaded. */}}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_REQUIRE_SSL
              value: {{ .Values.postgresql.tls.require | quote }}
            - name: TLS_CLIENT_CERT_AUTH
              value: {{ .Values.postgresql.tls.clientCertAuth | quote }}
{{- if and .Values.prometheusExporter.enabled .Values.prometheusExporter.monitoringUser.enabled }}
            - name: MONITORING_USER
              value: {{ .Values.prometheusExporter.monitoringUser.username | quote }}
{{- end }}
{{- end }}
            {{- /* The agent runs the md5->scram managed-user re-hash on promotion/boot-primary
                   (#199); POSTGRES_PASSWORD/POSTGRES_DB are already on the container env above. */}}
            - name: MIGRATE_LEGACY_MD5_USERS
              value: {{ .Values.postgresql.migrateLegacyMd5Users | quote }}
            - name: DCS_BACKEND
              value: {{ (.Values.ha.agent.dcs).backend | default "kubernetes" | quote }}
{{- if eq (include "pg.agentEtcdMode" .) "true" }}
            {{- $etcd := required "ha.agent.dcs.etcd is required when dcs.backend=etcd" .Values.ha.agent.dcs.etcd }}
            {{- $endpoints := $etcd.endpoints }}
            {{- /* No explicit endpoints + the bundled etcd subchart enabled: target the
                   bundled cluster's client Service (<release>-etcd:<clientPort>). The
                   scheme follows the bundled etcd's tls.enabled, and under
                   client-cert-auth the agent must carry a client cert. */}}
            {{- if and (not $endpoints) (.Values.etcd).enabled }}
            {{- $etcdTls := ((.Values.etcd).tls).enabled | default false }}
            {{- /* dig (not `| default true`) so an explicit clientCertAuth=false is honored:
                   `false | default true` would wrongly coerce to true and force a client cert
                   on an encrypt-only (no mutual-auth) etcd. */}}
            {{- $etcdCca := dig "tls" "clientCertAuth" true (.Values.etcd | default dict) }}
            {{- /* Gated on $etcdTls ALONE, not on clientCertAuth too (#298 review). The agent
                   needs the CA for ANY TLS etcd, not just a mutual-auth one: with the three
                   ETCD_TLS_* vars unset, EtcdConfig.tlsConfig() returns nil and clientv3 falls
                   back to default transport credentials, verifying the etcd server cert against
                   the CONTAINER'S SYSTEM ROOT STORE -- which does not hold the operator's (or
                   cert-manager's) CA. So `etcd.tls.enabled=true` with `clientCertAuth=false`
                   and no secretName rendered perfectly clean and every agent's dial failed with
                   `x509: certificate signed by unknown authority`: no node ever wins the lease,
                   the release comes up with no primary and no write-Service endpoint, and the
                   only symptom is a TLS error in the agent log. $etcdCca survives in the
                   message because it changes WHY the Secret is needed, not WHETHER. */}}
            {{- if and $etcdTls (not (($etcd.tls).secretName)) }}
            {{ fail (printf "bundled etcd tls.enabled requires the agent's etcd TLS material (clientCertAuth=%v): set ha.agent.dcs.etcd.tls.secretName to a Secret with tls.crt, tls.key, ca.crt -- the agent needs ca.crt to verify the etcd server certificate at all, and the client cert/key additionally when clientCertAuth is on" $etcdCca) }}
            {{- end }}
            {{- $endpoints = list (printf "%s://%s-etcd:%v" (ternary "https" "http" $etcdTls) .Release.Name ((.Values.etcd).clientPort | default 2379)) }}
            {{- end }}
            {{- if not $endpoints }}{{ fail "etcd backend needs endpoints: set ha.agent.dcs.etcd.endpoints for a BYO/shared etcd, or enable the bundled etcd with etcd.enabled=true" }}{{ end }}
            - name: ETCD_ENDPOINTS
              value: {{ $endpoints | join "," | quote }}
            - name: ETCD_PREFIX
              value: {{ $etcd.prefix | default (printf "/pg-ha/%s/" .Release.Name) | quote }}
{{- if (($etcd.tls).secretName) }}
            - name: ETCD_TLS_CERT
              value: /etc/etcd-tls/tls.crt
            - name: ETCD_TLS_KEY
              value: /etc/etcd-tls/tls.key
            - name: ETCD_TLS_CA
              value: /etc/etcd-tls/ca.crt
{{- end }}
{{- end }}
{{- if $control.enabled }}
            {{- /* Control API (#276). The agent validates all of this at boot and
                   refuses to start if the mTLS material is incomplete -- the render
                   guards at the top of this file catch it earlier. */}}
            - name: CONTROL_ENABLED
              value: "true"
            - name: CONTROL_ADDR
              value: {{ printf ":%d" (int $control.port) | quote }}
            - name: CONTROL_TLS_CERT
              value: /etc/agent-control-tls/tls.crt
            - name: CONTROL_TLS_KEY
              value: /etc/agent-control-tls/tls.key
            - name: CONTROL_TLS_CA
              value: /etc/agent-control-tls/ca.crt
{{- with $control.allowedClientCNs }}
            - name: CONTROL_ALLOWED_CNS
              value: {{ join "," . | quote }}
{{- end }}
{{- if $control.restore.enabled }}
            - name: CONTROL_RESTORE_ENABLED
              value: "true"
            - name: CONTROL_RESTORE_ALLOWED_CNS
              value: {{ join "," $control.restore.allowedClientCNs | quote }}
            {{- /* The CronJob the agent clones, and the deterministic Job name it
                   creates -- deterministic so the RBAC get/delete grants can be scoped
                   to exactly that one object by resourceName. */}}
            - name: CONTROL_RESTORE_CRONJOB
              value: {{ printf "%s-pgbackrest-restore" (include "pg.fullname" .) | quote }}
            - name: CONTROL_RESTORE_JOB_NAME
              value: {{ printf "%s-pgbackrest-restore-api" (include "pg.fullname" .) | quote }}
            {{- /* Confirm-only: the volume the rendered Job writes into is decided here,
                   in values, and an HTTP body may only echo it back. */}}
            - name: CONTROL_RESTORE_POD_ORDINAL
              value: {{ .Values.pgbackrest.restore.podOrdinal | quote }}
{{- if $control.restore.readPodLogs }}
            - name: CONTROL_RESTORE_READ_POD_LOGS
              value: "true"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: PGBACKREST_ENABLED
              value: "true"
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if not .Values.ha.enabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..30}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- if .Values.postgresql.pgHba }}
                        HBA_FILE=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SHOW hba_file" | xargs)
                        {{- /* Insert the operator's rules as ONE ordered block, anchored on the
                               first NON-LOOPBACK host rule (#298).

                               pg_hba is first-match-wins, which fixes all three properties here:
                                - BEFORE the network catch-alls, or the rule is never consulted;
                                - AFTER initdb's `local ... trust` and its `127.0.0.1/32` /
                                  `::1/128` host rules, or a catch-all that also matches loopback
                                  (`host all all all reject`) beats them and breaks in-pod TCP
                                  clients -- `kubectl port-forward` + psql among them;
                                - in the operator's own order, so a `trust` written before a
                                  `reject` still wins. One pass, not one per entry: per-entry
                                  passes re-anchor on the previous insert and reverse the list.

                               The agent path is unaffected -- pgconf.AssemblePgHba places the
                               whole list itself, in order, with loopback first (#144).

                               cp onto the existing file, not mv: mv replaces the inode and the
                               file would inherit the redirect's 0644 instead of initdb's 0600.
                               A loud message rather than a silent skip if there is no host rule
                               to anchor on. */}}
                        PGCHART_INS="${HBA_FILE}.pgchart.ins"
                        : > "$PGCHART_INS"
                        {{- range .Values.postgresql.pgHba }}
                        grep -qF '{{ . }}' "$HBA_FILE" || printf '%s\n' '{{ . }}' >> "$PGCHART_INS"
                        {{- end }}
                        if [ -s "$PGCHART_INS" ]; then
                          if awk -v insfile="$PGCHART_INS" '
                                !done && $1 ~ /^host(ssl|nossl)?$/ && $4 != "127.0.0.1/32" && $4 != "::1/128" {
                                  while ((getline l < insfile) > 0) print l
                                  close(insfile); done=1
                                }
                                { print }
                                END { if (!done) exit 3 }' "$HBA_FILE" > "${HBA_FILE}.pgchart.tmp"; then
                            cp "${HBA_FILE}.pgchart.tmp" "$HBA_FILE"
                            rm -f "${HBA_FILE}.pgchart.tmp"
                          else
                            rm -f "${HBA_FILE}.pgchart.tmp"
                            echo "postStart: no non-loopback host rule in $HBA_FILE to anchor on; NOT applying the postgresql.pgHba entries" >&2
                          fi
                        fi
                        rm -f "$PGCHART_INS"
                        {{- end }}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        {{ .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 24 }}
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- else }}
          lifecycle:
{{- /* No preStop hook: the agent is PID 1 and owns SIGTERM shutdown (release the Lease,
       then stop its postgres child). A preStop `pg_ctl stop` would race the supervisor and
       stop postgres before the Lease is released. The repmgrd-tuned preStop that used to
       render here went away with repmgrd itself (#286). */}}
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
{{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                    {{- /* Empty, not 0: the primary-wait budget is a wall-clock DEADLINE armed
                           on the first no-primary iteration (#298 review), so it must not start
                           counting while the outer loop is still waiting for pg_isready --
                           doing so would burn the whole budget before postgres even opens and
                           skip the operator's commands on every cold boot. */}}
                    primary_wait_deadline=""
{{- end }}
                    for i in {1..90}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- /* md5/SCRAM pg_hba compat, the md5->scram re-hash and the user
                               pgHba entries are all authored by the agent (single author, #199):
                               it writes the md5-first compat pg_hba on every node and re-hashes
                               managed users on promotion/boot-primary. The postStart patches that
                               used to do this for repmgrd mode went with repmgrd (#286). */}}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        HEADLESS="{{ include "pg.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
                        PRIMARY_HOST=""
                        # Discovery and the user commands connect over TCP to a remote
                        # pod; the image's pg_hba requires md5/scram for every
                        # non-loopback connection, so without PGPASSWORD both the
                        # discovery psql and the user psql fail auth and silently no-op.
                        export PGPASSWORD="$POSTGRES_PASSWORD"
                        {{- /* Bound every probe (#288 review, round 4). Without a connect
                               timeout, a peer whose IP routes but does not answer -- a NotReady
                               node, a NetworkPolicy drop -- blocks psql for the kernel's TCP
                               timeout (~130s), and the retry budget below counts ITERATIONS, so
                               20 of those is minutes of the container being held out of Started
                               (probes have not begun, the pod is in no Service, and Kubernetes
                               applies no timeout of its own to an exec lifecycle hook). Scoped
                               to the discovery probe rather than exported, so a user's own
                               additionalCommands keep libpq's defaults. */}}
                        {{- /* StatefulSet runs replicaCount + 1 pods, ordinals 0..replicaCount */}}
                        for n in $(seq 0 {{ int .Values.postgresql.replicaCount }}); do
                          H="{{ include "pg.fullname" . }}-${n}.${HEADLESS}"
                          if PGCONNECT_TIMEOUT=3 psql -h "$H" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SELECT pg_is_in_recovery();" 2>/dev/null | grep -q 'f'; then
                            PRIMARY_HOST="$H"
                            break
                          fi
                        done
                        if [ -n "$PRIMARY_HOST" ]; then
                          # export PGHOST as its own statement: psql reads it only from
                          # the environment, and a bare `PGHOST=... <cmd>` prefix is
                          # split onto its own line by nindent, leaving it unexported.
                          export PGHOST="$PRIMARY_HOST"
                          {{- .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 26 }}
                        else
                          # Keep WAITING instead of breaking (#288 review). pg_isready has no -h,
                          # so it is satisfied by a unix socket -- including the socket-only
                          # postmaster bootstrap_initdb runs while CREATING the cluster, which no
                          # pod is reachable over TCP during. Breaking here skipped the user's
                          # additionalCommands SILENTLY, with no error and no retry, on every
                          # fresh install (under the default repmgr mechanism too, since
                          # bootstrap_initdb is shared). It also covers the pre-existing case
                          # where no peer has promoted yet. The loop is bounded at 90s, and the
                          # steps above it are idempotent, so retrying costs nothing.
                          #
                          # Exhausting the budget still skips the commands silently, and that is
                          # deliberate (#288 review, round 2): a non-zero postStart exit makes
                          # the kubelet KILL the container, so failing loudly here turns a
                          # skipped convenience command into a crash-loop.
                          #
                          # But the WAIT FOR A PRIMARY gets its own, much smaller budget (#288
                          # review, round 3), because Kubernetes does not consider a container
                          # started until postStart returns: while this loop spins, the
                          # startup/liveness/readiness probes have not begun and the pod is in
                          # no Service. Spending the full 90s here delayed readiness by 90s on
                          # every cold boot -- and on pgvector, whose default additionalCommands
                          # is CREATE EXTENSION vector, that is the default path. 20s covers the
                          # fresh-install window this retry was added for (bootstrap_initdb's
                          # socket-only postmaster lasts seconds) without holding a pod out of
                          # its Service while no peer has promoted yet.
                          {{- /* A WALL-CLOCK deadline, not an iteration count (#298 review).
                                 The 20 here was 20 iterations, and each iteration probes every
                                 peer with PGCONNECT_TIMEOUT=3 -- so on a cold boot where peers
                                 black-hole rather than refuse (NotReady node, NetworkPolicy
                                 drop) a 4-pod cluster spent 20 x (4x3s + 1s) ~= 260s here, not
                                 the 20s this comment and pg/values.yaml both promise, with the
                                 container held out of Started the whole time. SECONDS is bash's
                                 own monotonic counter, so the budget is now the documented one
                                 however slow an individual probe round turns out to be. */}}
                          : "${primary_wait_deadline:=$((SECONDS + 20))}"
                          if [ "$SECONDS" -ge "$primary_wait_deadline" ]; then
                            break
                          fi
                          sleep 1
                          continue
                        fi
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- end }}
{{- if .Values.postgresql.startupProbe.enabled }}
          # Holds off liveness/readiness until postgres first accepts
          # connections, so the repmgr stale-primary guard's settle loop and
          # crash-recovery WAL replay cannot be killed mid-startup by the
          # liveness probe (#172). Steady-state liveness stays tight below.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.postgresql.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.startupProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.livenessProbe.enabled }}
          livenessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # In agent mode the agent (PID 1) supervises postgres as a child, so
            # liveness asserts the agent's reconcile loop is alive: /healthz fails
            # when the loop has not progressed within ~3x the reconcile interval
            # (it beats every tick, on leader and standby alike). A wedged agent
            # that still answered 200 would keep a stale primary read-write; a dead
            # child postgres is the supervisor's concern, not the kubelet's.
            httpGet:
              path: /healthz
              port: agent-metrics
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.livenessProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.readinessProbe.enabled }}
          readinessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # Agent mode: readiness is replication-aware (#186). A standby reports Ready
            # only once its walreceiver is actually streaming -- NOT merely when postgres
            # accepts connections. Because a StatefulSet RollingUpdate advances to the
            # next pod only after the current one is Ready, gating standby readiness on
            # streaming stops the controller from rolling the primary / clone-source
            # while a standby is still cloning or catching up (which interrupted the
            # clone and deadlocked the cluster). A primary stays plain pg_isready. A
            # cloning standby (no postgres yet, or walreceiver not yet streaming) is
            # NotReady by design -- it is not killed (agent-mode liveness is the agent
            # /healthz heartbeat, and readiness is independent of the startup probe).
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 || exit 1
                  {{- if .Values.postgresql.tls.enabled }}
                  {{- /* Fail closed when requested server TLS is not actually on (#335).
                         `SHOW ssl` is the only signal that reports what the postmaster
                         LOADED; the ConfigMap, the mounted Secret and the values file all
                         describe what was rendered, and #335 is exactly the case where the
                         two disagree in silence -- the release goes Ready, the certificate
                         is mounted, and the server accepts only plaintext.
                         A NotReady pod leaves the client-facing Services, so nothing keeps
                         talking plaintext to it, while the headless Service
                         (publishNotReadyAddresses) keeps replication and the agent's peer
                         probes working -- and a RollingUpdate stalls here rather than
                         rolling the whole cluster into the broken state.
                         Only a DEFINITIVE "off" fails. An empty answer is a psql that did
                         not run, which is uncertainty rather than evidence of plaintext;
                         failing on it would turn a transient blip into a write outage. The
                         agent alarms on that case separately (pg_ha_agent_tls_inactive). */}}
                  if [ "$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SHOW ssl" 2>/dev/null)" = "off" ]; then
                    echo "postgresql.tls.enabled is set but this server reports ssl=off: refusing readiness rather than serving clients in plaintext (#335)" >&2
                    exit 1
                  fi
{{- end }}
                  rec=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)
                  if [ "$rec" = "f" ]; then exit 0; fi
                  if [ "$rec" = "t" ]; then
                    st=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT status FROM pg_stat_wal_receiver" 2>/dev/null)
                    [ "$st" = "streaming" ] && exit 0 || exit 1
                  fi
                  exit 1
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 || exit 1
                  {{- if .Values.postgresql.tls.enabled }}
                  {{- /* Fail closed when requested server TLS is not actually on (#335).
                         `SHOW ssl` is the only signal that reports what the postmaster
                         LOADED; the ConfigMap, the mounted Secret and the values file all
                         describe what was rendered, and #335 is exactly the case where the
                         two disagree in silence -- the release goes Ready, the certificate
                         is mounted, and the server accepts only plaintext.
                         A NotReady pod leaves the client-facing Services, so nothing keeps
                         talking plaintext to it, while the headless Service
                         (publishNotReadyAddresses) keeps replication and the agent's peer
                         probes working -- and a RollingUpdate stalls here rather than
                         rolling the whole cluster into the broken state.
                         Only a DEFINITIVE "off" fails. An empty answer is a psql that did
                         not run, which is uncertainty rather than evidence of plaintext;
                         failing on it would turn a transient blip into a write outage. The
                         agent alarms on that case separately (pg_ha_agent_tls_inactive). */}}
                  if [ "$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SHOW ssl" 2>/dev/null)" = "off" ]; then
                    echo "postgresql.tls.enabled is set but this server reports ssl=off: refusing readiness rather than serving clients in plaintext (#335)" >&2
                    exit 1
                  fi
{{- end }}
                  exit 0
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.readinessProbe.failureThreshold }}
{{- end }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
            - name: postgresql-config
              mountPath: /etc/postgresql/conf.d
              readOnly: true
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
            - name: postgresql-tls
              mountPath: /etc/postgresql/tls
              readOnly: true
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
            - name: ext-lib
              mountPath: /usr/lib/postgresql/{{ $pgMajor }}/lib
            - name: ext-share
              mountPath: /usr/share/postgresql/{{ $pgMajor }}/extension
{{- if .Values.postgresql.extensions.extraLibs }}
            # #309 (review): a SEPARATE volume from ext-lib, not a subdirectory of it --
            # ext-lib is also populated by the unvalidated *.so* glob copy (either image,
            # #302), so pointing LD_LIBRARY_PATH at ext-lib itself would extend the same
            # ABI-shadowing hazard pg.validateExtraLibs' denylist exists to prevent to
            # every file that glob happens to sweep in, not just the explicit,
            # denylist-checked entries in extraLibs. Keeping extraLibs' own copies
            # physically isolated means LD_LIBRARY_PATH only ever searches paths this
            # chart validated.
            - name: ext-extra-lib
              mountPath: /usr/lib/postgresql/{{ $pgMajor }}/extra-lib
{{- end }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pg-run
              mountPath: /var/run/postgresql
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.ha.agent.dcs.etcd).tls).secretName) }}
            - name: etcd-tls
              mountPath: /etc/etcd-tls
              readOnly: true
{{- end }}
{{- if $control.enabled }}
            {{- /* Control-API mTLS material (#276), same shape as the etcd-tls mount.
                   The agent re-reads these files per handshake, so a rotated Secret
                   takes effect without a pod restart. */}}
            - name: agent-control-tls
              mountPath: /etc/agent-control-tls
              readOnly: true
{{- end }}
{{- with .Values.postgresql.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Idle sidecar: holds the pgbackrest binary, config and S3 credentials
        # alongside PGDATA on every pg pod. The pgbackrest CronJobs find the
        # current primary via the primary service endpoints and `kubectl exec`
        # into this container to perform the actual backup. Scheduling lives
        # in the CronJobs, not here.
        - name: pgbackrest
          image: "{{ include "pg.haImage" . }}"
          imagePullPolicy: {{ .Values.ha.image.pullPolicy }}
          command: ["/bin/bash", "-c", "exec sleep infinity"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
{{- /* #323, as on the bootstrap init container above. This one matters most: stanza-create
       and backup actually EXECUTE here, via `kubectl exec` from the CronJob -- a value that
       reached the CronJob alone would route the kubectl call and leave the backup itself
       going direct. */}}
{{- with .Values.pgbackrest.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
{{- with .Values.pgbackrest.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          resources:
            {{- toYaml .Values.pgbackrest.resources | nindent 12 }}
{{- end }}
{{- /* The disjuncts are the conditions that actually CONTRIBUTE a volume (#298 review).
       `.Values.ha.enabled` used to stand in for agent mode, but the only volume it ever
       gated by itself was repmgr-config, which this release deletes -- so on the chart
       DEFAULT (ha on, persistence on, everything else off) this emitted a `volumes:` key
       with no items, i.e. `volumes: null` in the pod spec. The two agent-mode volumes that
       really exist are named explicitly instead, so the key appears exactly when there is
       something to put under it and cannot silently lose one either. */}}
{{- $needsVolumes := or .Values.postgresql.configuration .Values.postgresql.extensions.enabled .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.extraVolumes (not .Values.postgresql.persistence.enabled) (eq (include "pg.postgresqlConfigRenders" .) "true") (and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.ha.agent.dcs.etcd).tls).secretName)) $control.enabled -}}
{{- if $needsVolumes }}
      volumes:
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
        - name: postgresql-config
          configMap:
            name: {{ include "pg.fullname" . }}-postgresql-config
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
        # Server cert (#110). defaultMode 0400 + fsGroup 103 -> the postgres uid reads
        # it and PostgreSQL accepts the key (root-owned, not group/world readable),
        # the same pattern the etcd-tls mount uses below.
        - name: postgresql-tls
          secret:
            secretName: {{ required "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" .Values.postgresql.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
        - name: ext-lib
          emptyDir:
            sizeLimit: 1Gi
        - name: ext-share
          emptyDir:
            sizeLimit: 1Gi
{{- /* #320: operator-supplied volumes for the two init containers (an apt.conf.d
       snippet, a mirror sources.list). Declared whenever extensions is enabled rather
       than gated on packages: a pod-level volume nothing mounts is harmless, and gating
       it separately from extraVolumeMounts would make a values file that sets both
       render a mount referencing a volume that does not exist -- which fails at APPLY
       time, not render time. Names colliding with the chart's own are refused by
       pg.validateExtensionInitOverrides. */}}
{{- with .Values.postgresql.extensions.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.postgresql.extensions.extraLibs }}
        # Deliberately separate from ext-lib (review, #309/#302): ext-lib is also
        # populated by the unvalidated *.so* glob copy from either image, so
        # LD_LIBRARY_PATH (statefulset.yaml, postgresql container env) points at this
        # volume instead -- written ONLY by extraLibs' own denylist-checked copy step,
        # never by the general glob. Same 1Gi cap as ext-lib/ext-share (review): an
        # emptyDir sizeLimit is enforced by evicting the POD, not failing the copy
        # cleanly, so this needs real headroom -- a handful of real-world transitive
        # dependencies (e.g. a Python/GDAL-linked extension) can each be tens of MB.
        - name: ext-extra-lib
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.ha.agent.dcs.etcd).tls).secretName) }}
        - name: etcd-tls
          secret:
            secretName: {{ .Values.ha.agent.dcs.etcd.tls.secretName | quote }}
            defaultMode: 0400
{{- end }}
{{- if $control.enabled }}
        - name: agent-control-tls
          secret:
            secretName: {{ $control.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pgbackrest-config
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
{{- if .Values.pgbackrest.bootstrap.enabled }}
        - name: pgbackrest-bootstrap-script
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
            defaultMode: 0755
            items:
              - key: bootstrap.sh
                path: bootstrap.sh
{{- end }}
{{- /* #323: pod-level, so it reaches the pgbackrest sidecar and the pgbackrest-bootstrap init
       container. Declared whenever pgbackrest is enabled rather than gated on
       extraVolumeMounts: a pod-level volume nothing mounts is harmless, and gating the two
       separately would make a values file that sets both render a mount referencing a volume
       that does not exist -- which fails at APPLY time, not render time. Names colliding with
       this pod's own volumes (including postgresql.extraVolumes and
       postgresql.extensions.extraVolumes, which land in the same list) are refused by
       pg.validatePgbackrestPassthrough. */}}
{{- with .Values.pgbackrest.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          # Always bound the ephemeral PGDATA volume: an unbounded emptyDir lets a
          # runaway DB/WAL fill the node's ephemeral storage and evict co-tenants
          # (#165, #214). Falls back to persistence.size (the cap the operator
          # already declared for persistent mode) when emptyDir.sizeLimit is unset,
          # then to a 10Gi floor if persistence.size is also blank -- so the cap is
          # never null (an empty sizeLimit would render as unbounded again).
          emptyDir:
            sizeLimit: {{ .Values.postgresql.persistence.emptyDir.sizeLimit | default .Values.postgresql.persistence.size | default "10Gi" }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
{{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
