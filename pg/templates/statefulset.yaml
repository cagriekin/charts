                   refuses to start if the mTLS material is incomplete -- the render
                   guards at the top of this file catch it earlier. */}}
            - name: CONTROL_ENABLED
              value: "true"
            - name: CONTROL_ADDR
              value: {{ printf ":%d" (int $control.port) | quote }}
            - name: CONTROL_TLS_CERT
              value: /etc/agent-control-tls/tls.crt
            - name: CONTROL_TLS_KEY
              value: /etc/agent-control-tls/tls.key
            - name: CONTROL_TLS_CA
              value: /etc/agent-control-tls/ca.crt
{{- with $control.allowedClientCNs }}
            - name: CONTROL_ALLOWED_CNS
              value: {{ join "," . | quote }}
{{- end }}
{{- if $control.restore.enabled }}
            - name: CONTROL_RESTORE_ENABLED
              value: "true"
            - name: CONTROL_RESTORE_ALLOWED_CNS
              value: {{ join "," $control.restore.allowedClientCNs | quote }}
            {{- /* The CronJob the agent clones, and the deterministic Job name it
                   creates -- deterministic so the RBAC get/delete grants can be scoped
                   to exactly that one object by resourceName. */}}
            - name: CONTROL_RESTORE_CRONJOB
              value: {{ printf "%s-pgbackrest-restore" (include "pg.fullname" .) | quote }}
            - name: CONTROL_RESTORE_JOB_NAME
              value: {{ printf "%s-pgbackrest-restore-api" (include "pg.fullname" .) | quote }}
            {{- /* Confirm-only: the volume the rendered Job writes into is decided here,
                   in values, and an HTTP body may only echo it back. */}}
            - name: CONTROL_RESTORE_POD_ORDINAL
              value: {{ .Values.pgbackrest.restore.podOrdinal | quote }}
{{- if $control.restore.readPodLogs }}
            - name: CONTROL_RESTORE_READ_POD_LOGS
              value: "true"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: PGBACKREST_ENABLED
              value: "true"
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if not .Values.repmgr.enabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..30}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- if .Values.postgresql.pgHba }}
                        HBA_FILE=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SHOW hba_file" | xargs)
                        {{- range .Values.postgresql.pgHba }}
                        if ! grep -qF '{{ . }}' "$HBA_FILE"; then
                          sed -i '/host all all all scram-sha-256/i {{ . }}' "$HBA_FILE"
                        fi
                        {{- end }}
                        {{- end }}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        {{ .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 24 }}
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- else }}
          lifecycle:
{{- /* In agent mode the agent is PID 1 and owns SIGTERM shutdown (release the
       Lease, then stop its postgres child). A preStop pg_ctl stop would race the
       supervisor and stop postgres before the Lease is released, so the
       repmgrd-tuned preStop is gated to repmgrd mode. */}}
{{- if eq (include "pg.repmgrdMode" .) "true" }}
{{- include "pg.preStop" . | nindent 12 }}
{{- end }}
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..90}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- /* md5/SCRAM pg_hba compat + the md5->scram re-hash + user pgHba are
                               authored by the agent in agent mode (single author, #199): the agent
                               writes the md5-first compat pg_hba on every node and re-hashes managed
                               users on promotion/boot-primary. These postStart patches therefore run
                               only in repmgrd mode, where the image writes the legacy pg_hba and no
                               agent owns the file. */}}
                        {{- if eq (include "pg.repmgrdMode" .) "true" }}
                        # PG18 + repmgr MD5/SCRAM auth deadlock fix: the cagriekin/repmgr image
                        # entrypoint creates managed users (pgvector, repmgr) with MD5-hashed
                        # passwords while only writing `scram-sha-256` rules into pg_hba.conf,
                        # so every network auth attempt fails with "User <X> does not have a
                        # valid SCRAM secret" and traps the StatefulSet in CrashLoopBackOff.
                        #
                        # We patch pg_hba.conf to insert an `md5` line ABOVE every existing
                        # `scram-sha-256` line. pg_hba.conf is matched top-down with no
                        # fall-through on auth failure, so the md5 rule must come first to
                        # catch legacy MD5-hashed users (managed and custom, e.g. created via
                        # additionalCommands). On PG14+ the server auto-promotes md5 method
                        # to SCRAM when the stored password is SCRAM, so SCRAM-hashed users
                        # still authenticate via SCRAM wire protocol — same security, more
                        # compat. Marker comment makes the rewrite idempotent.
                        #
                        # Optionally re-hash managed users (POSTGRES_USER, REPMGR_USER) from
                        # MD5 to SCRAM so we converge on the modern hash. Gated by
                        # postgresql.migrateLegacyMd5Users (default true). When false, only
                        # the pg_hba fix runs and existing MD5 hashes are preserved; legacy
                        # users keep authenticating via the md5 rule above. The migration
                        # block itself is idempotent (gated on rolpassword LIKE 'md5%').
                        #
                        # TODO: drop the md5 line and the migrate flag once the chart's
                        # minimum PG is the first release without MD5 password storage.
                        HBA_FILE=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "SHOW hba_file" 2>/dev/null)
                        HBA_SENTINEL="# cagriekin-charts: md5 fallback applied (md5-first)"
                        if [ -n "$HBA_FILE" ] && [ -f "$HBA_FILE" ] && ! grep -qF "$HBA_SENTINEL" "$HBA_FILE"; then
                          HBA_TMP="${HBA_FILE}.cagriekin.tmp"
                          awk '/^[[:space:]]*host(ssl|nossl)?[[:space:]]+(all|replication)[[:space:]]+.*[[:space:]]+scram-sha-256[[:space:]]*$/ { m=$0; sub(/scram-sha-256[[:space:]]*$/, "md5", m); print m } {print}' "$HBA_FILE" > "$HBA_TMP"
                          printf '\n%s\n' "$HBA_SENTINEL" >> "$HBA_TMP"
                          cp "$HBA_TMP" "$HBA_FILE"
                          rm -f "$HBA_TMP"
                        fi
                        {{- if .Values.postgresql.migrateLegacyMd5Users }}
                        # 0.6.58 used `psql -c "DO \$\$ ... :'u' ... \$\$;"`. Two
                        # broken assumptions: (a) psql does NOT perform :'var'
                        # substitution inside `-c` (docs: "no psql-specific
                        # features"); (b) even if it did, substitution is also
                        # skipped inside dollar-quoted constants. The server saw
                        # `:'u'` literal, raised `syntax error at or near ":"`,
                        # and the rehash silently never ran. Connectivity kept
                        # working because the md5-fallback line in pg_hba.conf
                        # masked the failure.
                        #
                        # Fix: feed SQL via stdin (psql MainLoop, where :'var'
                        # IS substituted) and hoist user/pass into per-session
                        # GUCs read back inside the DO block via current_setting().
                        # GUC names use `tgt_user`/`tgt_pass` — `user` would
                        # collide with the SQL reserved keyword.
                        #
                        # User/pass are read from the environment with \getenv (as
                        # the monitoring-user job does), NOT passed via `-v`. A `-v`
                        # value containing a single quote breaks psql's :'var'
                        # quoting -- e.g. pass `a'b` rendered an unterminated literal
                        # and the rehash silently no-op'd for that user (#211). The
                        # md5 pg_hba fallback masks the failure, so connectivity is
                        # kept but the scram migration never converges. randAlphaNum
                        # never emits `'`, so only existingSecret passwords hit it.
                        # \getenv is client-side (psql >= 16, image is PG 18), so the
                        # PG < 14 server guard below is unaffected.
                        fix_user_auth() {
                          local target_user="$1"
                          local target_pass="$2"
                          [ -z "$target_user" ] && return 0
                          [ -z "$target_pass" ] && return 0
                          local sql="
                            \\getenv tgt_user FIX_TGT_USER
                            \\getenv tgt_pass FIX_TGT_PASS
                            SET myvars.tgt_user = :'tgt_user';
                            SET myvars.tgt_pass = :'tgt_pass';
                            DO \$\$
                            DECLARE
                              v_user TEXT := current_setting('myvars.tgt_user');
                              v_pass TEXT := current_setting('myvars.tgt_pass');
                            BEGIN
                              IF current_setting('server_version_num')::int < 140000 THEN
                                RAISE NOTICE 'Skipping md5->scram migration on PG < 14 (no md5->scram auto-promotion in pg_hba)';
                                RETURN;
                              END IF;
                              IF EXISTS (
                                SELECT 1 FROM pg_authid
                                WHERE rolname = v_user AND rolpassword LIKE 'md5%'
                              ) THEN
                                SET LOCAL password_encryption = 'scram-sha-256';
                                EXECUTE format('ALTER USER %I WITH PASSWORD %L', v_user, v_pass);
                              END IF;
                            END
                            \$\$;"
                          if ! FIX_TGT_USER="$target_user" FIX_TGT_PASS="$target_pass" \
                            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                            -v ON_ERROR_STOP=1 \
                            --no-psqlrc <<<"$sql"; then
                            echo "fix_user_auth: md5->scram rehash failed for ${target_user} (psql returned non-zero, see error above)" >&2
                          fi
                        }
                        fix_user_auth "$POSTGRES_USER" "$POSTGRES_PASSWORD"
                        fix_user_auth "$REPMGR_USER" "$REPMGR_PASSWORD"
                        {{- end }}
                        {{- if .Values.postgresql.pgHba }}
                        HBA_FILE_USER=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SHOW hba_file" | xargs)
                        # pg_hba.conf is first-match-wins. The repmgr image writes broad
                        # 10.0.0.0/8 and 0.0.0.0/0 catch-alls, so user entries appended at
                        # EOF (the previous behavior) could never match an IPv4 host (#144).
                        # Insert them above the first non-loopback host rule -- below the
                        # local/loopback trust rules, above every network auth rule -- so
                        # user trust/reject/scram overrides actually take effect. Idempotent
                        # via the sentinel; order among entries is preserved.
                        HBA_USER_SENTINEL="# cagriekin-charts: user pgHba entries (above network auth rules)"
                        if [ -n "$HBA_FILE_USER" ] && [ -f "$HBA_FILE_USER" ] && ! grep -qF "$HBA_USER_SENTINEL" "$HBA_FILE_USER"; then
                          HBA_USER_TMP="${HBA_FILE_USER}.cagriekin-user.tmp"
                          awk -v ins=0 '
                            !ins && $1 == "host" && $4 != "127.0.0.1/32" && $4 != "::1/128" {
                              print "# cagriekin-charts: user pgHba entries (above network auth rules)"
                              {{- range .Values.postgresql.pgHba }}
                              print "{{ . }}"
                              {{- end }}
                              ins=1
                            }
                            { print }
                          ' "$HBA_FILE_USER" > "$HBA_USER_TMP"
                          cp "$HBA_USER_TMP" "$HBA_FILE_USER"
                          rm -f "$HBA_USER_TMP"
                        fi
                        {{- end }}
                        {{- end }}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        HEADLESS="{{ include "pg.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
                        PRIMARY_HOST=""
                        # Discovery and the user commands connect over TCP to a remote
                        # pod; the image's pg_hba requires md5/scram for every
                        # non-loopback connection, so without PGPASSWORD both the
                        # discovery psql and the user psql fail auth and silently no-op.
                        export PGPASSWORD="$POSTGRES_PASSWORD"
                        {{- /* StatefulSet runs replicaCount + 1 pods, ordinals 0..replicaCount */}}
                        for n in $(seq 0 {{ int .Values.postgresql.replicaCount }}); do
                          H="{{ include "pg.fullname" . }}-${n}.${HEADLESS}"
                          if psql -h "$H" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SELECT pg_is_in_recovery();" 2>/dev/null | grep -q 'f'; then
                            PRIMARY_HOST="$H"
                            break
                          fi
                        done
                        if [ -n "$PRIMARY_HOST" ]; then
                          # export PGHOST as its own statement: psql reads it only from
                          # the environment, and a bare `PGHOST=... <cmd>` prefix is
                          # split onto its own line by nindent, leaving it unexported.
                          export PGHOST="$PRIMARY_HOST"
                          {{- .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 26 }}
                        fi
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- end }}
{{- if .Values.postgresql.startupProbe.enabled }}
          # Holds off liveness/readiness until postgres first accepts
          # connections, so the repmgr stale-primary guard's settle loop and
          # crash-recovery WAL replay cannot be killed mid-startup by the
          # liveness probe (#172). Steady-state liveness stays tight below.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.postgresql.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.startupProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.livenessProbe.enabled }}
          livenessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # In agent mode the agent (PID 1) supervises postgres as a child, so
            # liveness asserts the agent's reconcile loop is alive: /healthz fails
            # when the loop has not progressed within ~3x the reconcile interval
            # (it beats every tick, on leader and standby alike). A wedged agent
            # that still answered 200 would keep a stale primary read-write; a dead
            # child postgres is the supervisor's concern, not the kubelet's.
            httpGet:
              path: /healthz
              port: agent-metrics
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.livenessProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.readinessProbe.enabled }}
          readinessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # Agent mode: readiness is replication-aware (#186). A standby reports Ready
            # only once its walreceiver is actually streaming -- NOT merely when postgres
            # accepts connections. Because a StatefulSet RollingUpdate advances to the
            # next pod only after the current one is Ready, gating standby readiness on
            # streaming stops the controller from rolling the primary / clone-source
            # while a standby is still cloning or catching up (which interrupted the
            # clone and deadlocked the cluster). A primary stays plain pg_isready. A
            # cloning standby (no postgres yet, or walreceiver not yet streaming) is
            # NotReady by design -- it is not killed (agent-mode liveness is the agent
            # /healthz heartbeat, and readiness is independent of the startup probe).
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 || exit 1
                  rec=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)
                  if [ "$rec" = "f" ]; then exit 0; fi
                  if [ "$rec" = "t" ]; then
                    st=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT status FROM pg_stat_wal_receiver" 2>/dev/null)
                    [ "$st" = "streaming" ] && exit 0 || exit 1
                  fi
                  exit 1
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.readinessProbe.failureThreshold }}
{{- end }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
            - name: postgresql-config
              mountPath: /etc/postgresql/conf.d
              readOnly: true
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
            - name: postgresql-tls
              mountPath: /etc/postgresql/tls
              readOnly: true
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
            - name: ext-lib
              mountPath: /usr/lib/postgresql/{{ $pgMajor }}/lib
            - name: ext-share
              mountPath: /usr/share/postgresql/{{ $pgMajor }}/extension
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pg-run
              mountPath: /var/run/postgresql
{{- end }}
{{- if .Values.repmgr.enabled }}
            - name: repmgr-config
              mountPath: /etc/repmgr
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.repmgr.agent.dcs.etcd).tls).secretName) }}
            - name: etcd-tls
              mountPath: /etc/etcd-tls
              readOnly: true
{{- end }}
{{- if $control.enabled }}
            {{- /* Control-API mTLS material (#276), same shape as the etcd-tls mount.
                   The agent re-reads these files per handshake, so a rotated Secret
                   takes effect without a pod restart. */}}
            - name: agent-control-tls
              mountPath: /etc/agent-control-tls
              readOnly: true
{{- end }}
{{- with .Values.postgresql.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if eq (include "pg.repmgrdMode" .) "true" }}
        - name: repmgrd
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          # Workaround: cagriekin/repmgr <= trixie-5.5.0-7 calls
          # `standby register --force` without --upstream-node-id, leaving the
          # row on the primary with type='' on PG18 + repmgr 5.5.0 and crashing
          # the standby. Pre-register here with an explicit upstream node_id,
          # then exec the image entrypoint (its own register --force becomes a
          # no-op UPDATE). Drop once the image ships the fix upstream.
          # Tracking: github.com/cagriekin/repmgr-docker, repmgrd-entrypoint.sh:45.
          command:
            - /bin/bash
            - -c
            - |
              ORDINAL="${HOSTNAME##*-}"
              for _ in $(seq 1 120); do pg_isready -h 127.0.0.1 > /dev/null 2>&1 && break; sleep 2; done
              IN_RECOVERY=$(PGPASSWORD="${REPMGR_PASSWORD}" psql -h 127.0.0.1 -U "${REPMGR_USER}" -d "${REPMGR_DB}" -tA -c "SELECT pg_is_in_recovery();" 2>/dev/null || true)
              if [ "$IN_RECOVERY" = "f" ]; then
                echo "pre-register: primary register --force"
                repmgr -f /etc/repmgr/repmgr.conf primary register --force || true
              elif [ "$IN_RECOVERY" = "t" ]; then
                BASE="${HOSTNAME%-*}"
                PNID=""
                for _ in $(seq 1 60); do
                  for i in $(seq 0 {{ int .Values.postgresql.replicaCount }}); do
                    [ "$i" = "$ORDINAL" ] && continue
                    P="${BASE}-${i}.${HEADLESS_SERVICE}"
                    PGPASSWORD="${REPMGR_PASSWORD}" pg_isready -h "$P" -U "${REPMGR_USER}" -d "${REPMGR_DB}" > /dev/null 2>&1 || continue
                    PNID=$(PGPASSWORD="${REPMGR_PASSWORD}" psql -h "$P" -U "${REPMGR_USER}" -d "${REPMGR_DB}" -tA \
                      -c "SELECT node_id FROM repmgr.nodes WHERE type='primary' AND active=true LIMIT 1;" 2>/dev/null || true)
                    [ -n "$PNID" ] && break 2
                  done
                  sleep 2
                done
                if [ -n "$PNID" ]; then
                  echo "pre-register: standby register --upstream-node-id=${PNID}"
                  repmgr -f /etc/repmgr/repmgr.conf standby register --upstream-node-id="${PNID}" --force || true
                  # Read node_id from the generated repmgr.conf instead of
                  # re-deriving the image's ordinal+1000 convention here.
                  LOCAL_NID=$(awk -F= '$1=="node_id"{print $2; exit}' /etc/repmgr/repmgr.conf)
                  if [ -z "$LOCAL_NID" ]; then
                    echo "pre-register: no node_id in /etc/repmgr/repmgr.conf, skipping type backfill" >&2
                  else
                    # Defensive: some PG18 + repmgr image combos land the row
                    # with type=''. WHERE clause makes this a no-op on rows
                    # that are already correctly typed.
                    PGPASSWORD="${REPMGR_PASSWORD}" psql -h "$P" -U "${REPMGR_USER}" -d "${REPMGR_DB}" \
                      -v ON_ERROR_STOP=1 --no-psqlrc -c "
                        UPDATE repmgr.nodes SET type='standby'
                         WHERE node_id=${LOCAL_NID} AND (type IS NULL OR type='');
                      " || echo "pre-register: type-backfill UPDATE failed (ignored)" >&2
                  fi
                fi
              fi
              # repmgr 5.x has no conf-based retention for monitoring_history
              # (the image's monitoring_history_keep conf line is ignored as
              # an unknown parameter), so the table grows forever. Prune it
              # once per day on the primary via `repmgr cluster cleanup`.
              # Failures only log a warning: the loop must never take down
              # repmgrd (pid 1 via the exec below).
              (
                while true; do
                  sleep 86400
                  IN_RECOVERY=$(PGPASSWORD="${REPMGR_PASSWORD}" psql -h 127.0.0.1 -U "${REPMGR_USER}" -d "${REPMGR_DB}" -tA -c "SELECT pg_is_in_recovery();" 2>/dev/null || true)
                  [ "$IN_RECOVERY" = "f" ] || continue
                  if ! repmgr -f /etc/repmgr/repmgr.conf cluster cleanup --keep-history="${MONITORING_HISTORY_DAYS}"; then
                    echo "monitoring-history-cleanup: repmgr cluster cleanup failed, retrying in 24h" >&2
                  fi
                done
              ) &
              exec repmgrd -f /etc/repmgr/repmgr.conf --daemonize=no
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
            - name: MONITORING_HISTORY_DAYS
              value: {{ int (required "repmgr.monitoringHistoryDays is required when repmgr.enabled=true" .Values.repmgr.monitoringHistoryDays) | quote }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    repmgr daemon stop 2>/dev/null || true
          resources:
            {{- toYaml .Values.repmgr.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: repmgr-config
              mountPath: /etc/repmgr
        - name: service-updater
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/service-updater.sh"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MASTER_SERVICE
              value: {{ include "pg.fullname" . | quote }}
            - name: PRIMARY_MARKER
              value: {{ printf "%s-primary" (include "pg.fullname" .) | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: SPLIT_BRAIN_ACTION
              value: {{ .Values.repmgr.splitBrainDetection.action | quote }}
{{- if .Values.pgpool.enabled }}
            - name: PGPOOL_DEPLOYMENT
              value: {{ printf "%s-pgpool" (include "pg.fullname" .) | quote }}
            - name: PGPOOL_SERVICE
              value: {{ printf "%s-pgpool.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: PGPOOL_PORT
              value: "{{ .Values.pgpool.service.port }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
{{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  [ -f /tmp/service-updater-alive ] && [ $(( $(date +%s) - $(cat /tmp/service-updater-alive) )) -lt 120 ]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - sleep 5
          volumeMounts:
            - name: service-updater-script
              mountPath: /scripts
            # repmgr.conf (written by the init container) so the master's
            # service-updater can run `repmgr standby unregister` for ghost nodes (#139).
            - name: repmgr-config
              mountPath: /etc/repmgr
              readOnly: true
          resources:
            {{- toYaml .Values.repmgr.serviceUpdater.resources | nindent 12 }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Idle sidecar: holds the pgbackrest binary, config and S3 credentials
        # alongside PGDATA on every pg pod. The pgbackrest CronJobs find the
        # current primary via the primary service endpoints and `kubectl exec`
        # into this container to perform the actual backup. Scheduling lives
        # in the CronJobs, not here.
        - name: pgbackrest
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ["/bin/bash", "-c", "exec sleep infinity"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
          resources:
            {{- toYaml .Values.pgbackrest.resources | nindent 12 }}
{{- end }}
{{- if or .Values.postgresql.configuration .Values.postgresql.extensions.enabled .Values.repmgr.enabled .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.extraVolumes (not .Values.postgresql.persistence.enabled) (eq (include "pg.postgresqlConfigRenders" .) "true") }}
      volumes:
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
        - name: postgresql-config
          configMap:
            name: {{ include "pg.fullname" . }}-postgresql-config
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
        # Server cert (#110). defaultMode 0400 + fsGroup 103 -> the postgres uid reads
        # it and PostgreSQL accepts the key (root-owned, not group/world readable),
        # the same pattern the etcd-tls mount uses below.
        - name: postgresql-tls
          secret:
            secretName: {{ required "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" .Values.postgresql.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
        - name: ext-lib
          emptyDir:
            sizeLimit: 1Gi
        - name: ext-share
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
{{- if .Values.repmgr.enabled }}
        - name: repmgr-config
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.repmgr.agent.dcs.etcd).tls).secretName) }}
        - name: etcd-tls
          secret:
            secretName: {{ .Values.repmgr.agent.dcs.etcd.tls.secretName | quote }}
            defaultMode: 0400
{{- end }}
{{- if $control.enabled }}
        - name: agent-control-tls
          secret:
            secretName: {{ $control.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if eq (include "pg.repmgrdMode" .) "true" }}
        - name: service-updater-script
          configMap:
            name: {{ include "pg.fullname" . }}-service-updater
            defaultMode: 0755
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pgbackrest-config
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
{{- if .Values.pgbackrest.bootstrap.enabled }}
        - name: pgbackrest-bootstrap-script
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
            defaultMode: 0755
            items:
              - key: bootstrap.sh
                path: bootstrap.sh
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          # Always bound the ephemeral PGDATA volume: an unbounded emptyDir lets a
          # runaway DB/WAL fill the node's ephemeral storage and evict co-tenants
          # (#165, #214). Falls back to persistence.size (the cap the operator
          # already declared for persistent mode) when emptyDir.sizeLimit is unset,
          # then to a 10Gi floor if persistence.size is also blank -- so the cap is
          # never null (an empty sizeLimit would render as unbounded again).
          emptyDir:
            sizeLimit: {{ .Values.postgresql.persistence.emptyDir.sizeLimit | default .Values.postgresql.persistence.size | default "10Gi" }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
{{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
