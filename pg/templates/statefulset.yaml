{{- include "pg.validateResourceNames" . }}
{{- include "pg.validateAudit" . }}
{{- include "pg.validateExtraPassthrough" . }}
{{- include "pg.validateRemovedRepmgrdValues" . }}
{{- /* #289: cascading replication makes a STANDBY an upstream for other standbys, but the
       agent's native-mode slot reconcile only ever runs on the lease-holding primary and
       only ever touches slots on its own connection -- so a cascading child's
       primary_slot_name would name a slot that exists on the primary, not on the
       standby-parent it actually streams from, and its walreceiver would fail outright with
       "replication slot does not exist". Rejected at render time rather than shipping that
       (loud, but only discoverable at runtime) combination. Both flags are independently
       opt-in, so this forbids nothing that worked before. */}}
{{- if and (eq (include "pg.agentMode" .) "true") .Values.repmgr.agent.cascadingReplication (eq (.Values.repmgr.agent.mechanism | default "repmgr") "native") }}
{{- fail "repmgr.agent.cascadingReplication is not supported with repmgr.agent.mechanism: native (#289): native mode's replication-slot ownership runs only on the primary, so a cascading standby's child would reference a slot that does not exist on its actual upstream and its walreceiver would refuse to start. Use mechanism: repmgr for cascading replication, or disable cascadingReplication" }}
{{- end }}
{{- if and (not .Values.repmgr.enabled) (gt (int .Values.postgresql.replicaCount) 0) }}
{{- fail "postgresql.replicaCount > 0 requires repmgr.enabled=true: with repmgr disabled the chart would run replicaCount+1 independent PostgreSQL instances with no replication between them. Set postgresql.replicaCount=0 for standalone mode or enable repmgr" }}
{{- end }}
{{- /* Client TLS validation (#110) */}}
{{- if .Values.postgresql.tls.enabled }}
{{- if not .Values.postgresql.tls.existingSecret }}{{ fail "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" }}{{- end }}
{{- end }}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (not .Values.postgresql.tls.enabled) }}
{{- fail "postgresql.tls.require / clientCertAuth require postgresql.tls.enabled" }}
{{- end }}
{{- /* require/mTLS are enforced via the agent-assembled pg_hba (hostssl), and only the
       agent authors pg_hba. Standalone mode (repmgr.enabled=false) runs the stock postgres
       image with its own pg_hba, which carries an md5-fallback line that would bypass a
       hostssl rule -- so enforced TLS is unsafe there. Server TLS (ssl=on) still works;
       clients can opt in with sslmode=require, or add explicit hostssl rules via
       postgresql.pgHba. */}}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (ne (include "pg.agentMode" .) "true") }}
{{- fail "postgresql.tls.require / clientCertAuth require repmgr.enabled=true: enforced TLS depends on the agent-assembled pg_hba (hostssl with no md5 fallback), and standalone mode runs the stock postgres image's own pg_hba. For standalone, use postgresql.tls.enabled for optional server TLS and have clients set sslmode=require." }}
{{- end }}
{{- /* Cross-component sslmode consistency: when the server requires TLS, the exporter
       must also use TLS or its scrapes are rejected by hostssl. clientCertAuth forces
       hostssl on its own (it implies require in AssemblePgHba), so guard on either. */}}
{{- $tlsRequired := or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth }}
{{- if and $tlsRequired .Values.prometheusExporter.enabled (eq .Values.prometheusExporter.sslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires prometheusExporter.sslmode >= require (else the exporter's scrapes are rejected by hostssl). Set prometheusExporter.sslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- if and (has .Values.prometheusExporter.sslmode (list "verify-ca" "verify-full")) (not .Values.postgresql.tls.enabled) }}
{{- fail "prometheusExporter.sslmode verify-ca/verify-full requires postgresql.tls.enabled (the CA from postgresql.tls.existingSecret is mounted to verify the server cert)." }}
{{- end }}
{{- /* pgpool backend must also speak TLS when the server requires it. */}}
{{- if and $tlsRequired .Values.pgpool.enabled .Values.pgpool.tls.enabled (eq .Values.pgpool.tls.backendSslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires pgpool.tls.backendSslmode >= require (else pgpool's backend connections are rejected by hostssl). Set pgpool.tls.backendSslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- /* Under PostgreSQL mTLS, application connections passing through pgpool need pgpool
       to present a backend client cert (the app users are not exempted from clientcert). */}}
{{- if and .Values.postgresql.tls.clientCertAuth .Values.pgpool.enabled (or (not .Values.pgpool.tls.enabled) (not .Values.pgpool.tls.backendClientCert)) }}
{{- fail "postgresql.tls.clientCertAuth=true with pgpool.enabled requires pgpool.tls.enabled and pgpool.tls.backendClientCert (a client cert pgpool presents to the backends for app-user passthrough under mTLS)." }}
{{- end }}
{{- /* Control API validation (#276). Every one of these is a RENDER guard rather than
       only a boot check in the agent: an operator who enables the API without its TLS
       material would otherwise get a crash-looping database (the agent refuses to open
       an unauthenticated mutating port), and discovering that from a CrashLoopBackOff
       is a much worse experience than a failed `helm upgrade`. Mirrors the
       postgresql.tls.existingSecret guard above. */}}
{{- $control := .Values.repmgr.agent.control }}
{{- if $control.enabled }}
{{- if ne (include "pg.agentMode" .) "true" }}
{{- fail "repmgr.agent.control.enabled requires repmgr.enabled=true: the control API is served by the Go agent, and standalone mode runs no agent." }}
{{- end }}
{{- if not $control.tls.existingSecret }}
{{- fail "repmgr.agent.control.enabled requires repmgr.agent.control.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt). The control API is mTLS-only -- there is no token or plaintext mode -- so without client-CA material it would have no way to authenticate callers and the agent refuses to start." }}
{{- end }}
{{- if eq (int $control.port) 9200 }}
{{- fail "repmgr.agent.control.port must not be 9200: that is the agent's read-only metrics/probe port, and keeping the two apart is what lets a NetworkPolicy admit Prometheus to 9200 without admitting anything to the mutating control surface." }}
{{- end }}
{{- if eq (int $control.port) 5432 }}
{{- fail "repmgr.agent.control.port must not be 5432 (the PostgreSQL port)" }}
{{- end }}
{{- end }}
{{- if $control.restore.enabled }}
{{- if not $control.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires repmgr.agent.control.enabled" }}
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.enabled (there is no repository to restore from)" }}
{{- end }}
{{- if not .Values.pgbackrest.restore.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.restore.enabled: the API triggers the chart's restore Job rather than constructing one, so the release must render it" }}
{{- end }}
{{- if ne .Values.pgbackrest.restore.mode "cronjob" }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.restore.mode=cronjob: the agent clones the suspended CronJob's jobTemplate (exactly as `kubectl create job --from=cronjob/...` does), so in mode=job there is nothing to clone" }}
{{- end }}
{{- if not $control.restore.allowedClientCNs }}
{{- fail "repmgr.agent.control.restore.enabled requires a non-empty repmgr.agent.control.restore.allowedClientCNs: restore is a separate authz verb from pause/switchover, and an empty allowlist denies every client -- name the certificate CNs permitted to overwrite the data directory" }}
{{- end }}
{{- /* The grant and its bound render together or not at all (#279). Refusing here rather
       than warning is the point: `create jobs` cannot be resourceName-scoped, so a Role
       rendered without the admission policy carries a namespace-wide privilege-escalation
       primitive on a token that sits next to user-supplied SQL. Opting out stays possible
       -- a cluster below 1.30, a namespace-limited installer, a platform-managed policy --
       but it has to be said out loud in values, where it is reviewable. */}}
{{- if and (not $control.restore.admissionPolicy.enabled) (not $control.restore.admissionPolicy.acknowledgeUnbounded) }}
{{- fail "repmgr.agent.control.restore.admissionPolicy.enabled=false leaves the restore feature's `create jobs` grant unbounded: RBAC cannot restrict create by resourceName, so anything holding the database pods' ServiceAccount token could create arbitrary Jobs in this namespace and name any ServiceAccount in them. Either leave admissionPolicy.enabled=true (it needs Kubernetes >= 1.30 and cluster-scoped create on ValidatingAdmissionPolicy), or set repmgr.agent.control.restore.admissionPolicy.acknowledgeUnbounded=true to accept that trade deliberately" }}
{{- end }}
{{- end }}
{{- if and $control.restore.readPodLogs (not $control.restore.enabled) }}
{{- fail "repmgr.agent.control.restore.readPodLogs requires repmgr.agent.control.restore.enabled (it only affects reading a restore Job's log)" }}
{{- end }}
{{- if .Values.repmgr.enabled }}
{{- $repmgrMajor := required "repmgr.image.majorVersion is required (the PostgreSQL major bundled in the repmgr image)" .Values.repmgr.image.majorVersion }}
{{- if ne (toString .Values.postgresql.majorVersion) (toString $repmgrMajor) }}
{{- fail (printf "postgresql.majorVersion=%q does not match repmgr.image.majorVersion=%q. In repmgr mode the PostgreSQL server runs from the repmgr image (%s), which bundles only PostgreSQL %s and always runs that server regardless of postgresql.image; a mismatch crash-loops the extension init container or silently runs the wrong major. Set postgresql.majorVersion=%q (with a matching postgresql.image), or point repmgr.image at an image built for PostgreSQL %s and set repmgr.image.majorVersion to match" (toString .Values.postgresql.majorVersion) (toString $repmgrMajor) .Values.repmgr.image.repository (toString $repmgrMajor) (toString $repmgrMajor) (toString .Values.postgresql.majorVersion)) }}
{{- end }}
{{- /* The two majorVersion values above are hand-typed claims; the image TAG is what
       actually decides the major (#269). The published per-major tags carry a -pgNN
       suffix, so when one is in use the chart can check the claim against the artifact
       instead of trusting it -- catching "moved the tag, forgot the majors" (and the
       reverse) at render time rather than as a crash-looping extension init container or,
       with extensions off, a silently wrong major. An unsuffixed tag carries no major to
       compare, which is why the container also gets PG_MAJOR from majorVersion: the
       entrypoint and agent then refuse to start an image that lacks that major. */}}
{{- $tagMajor := regexFind "-pg[0-9]+$" (toString .Values.repmgr.image.tag) }}
{{- if $tagMajor }}
{{- $tagMajor = trimPrefix "-pg" $tagMajor }}
{{- if ne $tagMajor (toString $repmgrMajor) }}
{{- fail (printf "repmgr.image.tag=%q is built for PostgreSQL %s, but repmgr.image.majorVersion=%q. The tag decides which major actually runs, so these must agree: set repmgr.image.majorVersion=%q and postgresql.majorVersion=%q, or change the tag suffix to -pg%s" (toString .Values.repmgr.image.tag) $tagMajor (toString $repmgrMajor) $tagMajor $tagMajor (toString $repmgrMajor)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.pgbackrest.enabled (not .Values.repmgr.enabled) }}
{{- fail "pgbackrest.enabled requires repmgr.enabled=true: the pgbackrest binary and the archive_command run inside the postgresql container, which in standalone mode is the official postgres image without pgbackrest. WAL archiving would fail on every segment (unbounded WAL growth) and backups would time out. Enable repmgr, or disable pgbackrest" }}
{{- end }}
{{- /* Bootstrap-from-backup (#266) prerequisites. Fail fast rather than rendering an init
       container that could never work. */}}
{{- if .Values.pgbackrest.bootstrap.enabled }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires pgbackrest.enabled (the bootstrap init container reads the pgBackRest repo config and S3 credentials the pgbackrest feature renders)" }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires postgresql.persistence.enabled: with an emptyDir PGDATA every pod restart loses the data directory, so the bootstrap would re-restore the entire database on each start instead of once" }}
{{- end }}
{{- if and (ne .Values.pgbackrest.bootstrap.targetType "") (not .Values.pgbackrest.bootstrap.target) }}
{{- fail "pgbackrest.bootstrap.target is required when pgbackrest.bootstrap.targetType is set" }}
{{- end }}
{{- end }}
{{- /* Bundled etcd consistency: the subchart deploys 3 stateful pods, so reject the
       contradictory inputs that would silently orphan them (fail-fast). */}}
{{- if (.Values.etcd).enabled }}
{{- if ne (include "pg.agentEtcdMode" .) "true" }}
{{- fail "etcd.enabled=true deploys a bundled etcd cluster, but the agent etcd backend is not active (it would be left unused). Set repmgr.enabled=true and repmgr.agent.dcs.backend=etcd, or set etcd.enabled=false" }}
{{- end }}
{{- if (.Values.repmgr.agent.dcs.etcd).endpoints }}
{{- fail "etcd.enabled=true (bundled etcd) and repmgr.agent.dcs.etcd.endpoints (external etcd) are both set; the agent would target the external endpoints and leave the bundled cluster unused. Pick one: enable the bundle OR set endpoints" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pg.fullname" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if or .Values.global.annotations .Values.postgresql.annotations }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.postgresql.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  serviceName: {{ include "pg.fullname" . }}-headless
  # Pinned explicitly (not left to the API default) so it cannot change silently.
  # podManagementPolicy is IMMUTABLE: changing it needs the StatefulSet recreated
  # (`kubectl delete sts --cascade=orphan`), which is why the 2.0.0 upgrade note calls
  # this out for anyone coming from failoverMode: repmgrd (#286).
  {{- if eq (include "pg.agentMode" .) "true" }}
  # HA: Parallel — all pods are present at a cold boot, so the lease winner compares
  # timelines across the complete candidate set and the highest-timeline survivor is
  # chosen before any node promotes.
  podManagementPolicy: Parallel
  {{- else }}
  # Standalone: a single pod (replicaCount must be 0), so ordering is moot; OrderedReady
  # keeps the rollout one-at-a-time and matches the pre-2.0.0 default for this mode.
  podManagementPolicy: OrderedReady
  {{- end }}
  replicas: {{ add .Values.postgresql.replicaCount 1 }}
  {{- with .Values.postgresql.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "pg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled .Values.postgresql.podAnnotations }}
      annotations:
{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
        checksum/postgresql-config: {{ include (print $.Template.BasePath "/postgresql-configmap.yaml") . | sha256sum }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Roll the pod when the pgbackrest config (S3 endpoint/bucket/retention)
        # changes: pgbackrest.conf is a subPath mount, which the kubelet never
        # live-updates, so without this checksum a helm upgrade would silently keep
        # archiving WAL + running backups against the OLD repository (#145).
        checksum/pgbackrest-config: {{ include (print $.Template.BasePath "/pgbackrest-configmap.yaml") . | sha256sum }}
{{- end }}
      {{- with .Values.postgresql.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.repmgr.enabled }}
      # Standalone (no repmgr): the agent that needs the API token is not present,
      # so don't mount one (#166). In repmgr mode the token is required.
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.repmgr.enabled }}
      terminationGracePeriodSeconds: {{ .Values.repmgr.terminationGracePeriodSeconds | default 120 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
      {{- if .Values.repmgr.enabled }}
      {{- /* No shareProcessNamespace: it existed so repmgrd could signal postgres across
             containers. The agent is PID 1 in the postgresql container and owns its child
             directly, so the pods no longer share a PID namespace (#286). */}}
      serviceAccountName: {{ include "pg.fullname" . }}-repmgr
      {{- end }}
      {{- with .Values.postgresql.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.postgresql.affinity }}
        {{- toYaml .Values.postgresql.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "pg.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: postgresql
              topologyKey: kubernetes.io/hostname
          # Zone spread is preferred (soft) so single-zone clusters still
          # schedule; the hostname rule above stays hard and dominates.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pg.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: postgresql
                topologyKey: topology.kubernetes.io/zone
        {{- end }}
      {{- with .Values.postgresql.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{- if .Values.postgresql.persistence.enabled }}
        - name: fix-permissions
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ['sh', '-c', 'chown -R 101:103 /var/lib/postgresql/data && if [ -d /var/lib/postgresql/data/pgdata ]; then chmod 0700 /var/lib/postgresql/data/pgdata; fi']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # Root is required to chown the volume, but drop the rest of the default
            # capability set -- only CHOWN (chown), FOWNER (chmod) and DAC_OVERRIDE
            # (traverse/modify regardless of perms) are needed (#162).
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- end }}
{{- if .Values.pgbackrest.bootstrap.enabled }}
        # Bootstrap-from-backup (#266). Seeds an EMPTY data directory from the pgBackRest
        # repository, so a replica-0 that lost its PVC recovers its data instead of silently
        # initdb-ing an empty cluster. Ordered BEFORE repmgr-init on purpose: once PGDATA is
        # populated, init-repmgr.sh defers the start decision and the entrypoint skips initdb,
        # so postgres starts, replays the archived WAL via restore_command and promotes.
        # It refuses to touch an already-initialized directory (see bootstrap.sh), which is
        # what makes it safe to leave enabled across ordinary restarts and rollouts.
        - name: pgbackrest-bootstrap
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # pgbackrest's default log/lock paths may be unwritable, and neither belongs on
            # the data volume; /tmp is this container's own writable layer.
            - name: PGBACKREST_LOG_PATH
              value: /tmp/pgbackrest-log
            - name: PGBACKREST_LOCK_PATH
              value: /tmp/pgbackrest-lock
            - name: TARGET_TYPE
              value: {{ .Values.pgbackrest.bootstrap.targetType | quote }}
            - name: TARGET
              value: {{ .Values.pgbackrest.bootstrap.target | quote }}
            - name: BACKUP_SET
              value: {{ .Values.pgbackrest.bootstrap.backupSet | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
          resources:
            {{- toYaml .Values.pgbackrest.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            # Dedicated directory volume (not a subPath file) so /scripts is created by the
            # mount and need not pre-exist in the image.
            - name: pgbackrest-bootstrap-script
              mountPath: /scripts
              readOnly: true
{{- end }}
{{- if and .Values.postgresql.extensions.enabled .Values.repmgr.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
        - name: copy-base-ext
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ['sh', '-c', 'cp /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so /ext-lib/ && cp /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
        - name: copy-ext
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ['sh', '-c', 'cp /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so /ext-lib/ && cp /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- if .Values.repmgr.enabled }}
        - name: repmgr-init
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ["/usr/local/bin/entrypoint.sh", "init"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            {{- /* #288: the init container needs MECHANISM too, not just the postgresql
                   container. Its whole job -- write repmgr.conf, wait for a primary to appear
                   in repmgr.nodes, clone with `repmgr standby clone` -- is repmgr-specific,
                   and the middle step is what made native unusable with replicas: nothing
                   ever registers under native, so the poll timed out and every standby sat in
                   Init:CrashLoopBackOff forever. init-repmgr.sh now exits early on native and
                   lets the agent clone (BootstrapClone -> pg_basebackup), but it can only do
                   that if the value actually reaches it. Emitted only when non-default, same
                   as on the postgresql container, so the repmgr-mode render does not move. */}}
            {{- with (.Values.repmgr.agent).mechanism }}
            {{- if ne . "repmgr" }}
            - name: MECHANISM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: repmgr-config
              mountPath: /etc/repmgr
          resources:
            {{- toYaml .Values.repmgr.initContainerResources | nindent 12 }}
{{- end }}
        - name: setup-config
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              CONF=/var/lib/postgresql/data/pgdata/postgresql.conf
{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
              if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
              fi
{{- else }}
              # A stale include_dir left in PGDATA while conf.d features
              # were enabled is fatal at postmaster start once the mount
              # is gone.
              if [ -f "$CONF" ] && grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                grep -v "include_dir = '/etc/postgresql/conf.d'" "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
              # pgbackrest disabled: the repmgr image entrypoint persisted
              # archive_mode=on + a pgbackrest archive_command into PGDATA's
              # postgresql.conf at initdb (#132). With the pgbackrest config and
              # S3 credentials now gone, every archive_command fails and WAL is
              # never recycled -- pg_wal grows until the PVC fills and the
              # postmaster PANICs. Strip the entrypoint-written archive lines so
              # archiving reverts to the default (off). Live archive settings,
              # when enabled, come from the chart-managed conf.d include, never
              # this base file, so this only ever removes stale, failing config.
              if [ -f "$CONF" ] && grep -q "archive-push %p" "$CONF"; then
                grep -v -e '^archive_mode = on$' -e 'archive-push %p' "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
      containers:
        - name: postgresql
{{- if .Values.repmgr.enabled }}
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          # The image entrypoint runs a stale-primary guard before starting
          # read-write: on a container-only restart (which does not re-run the
          # init container) it detects a peer promoted to a newer timeline and
          # rejoins this node as a standby via pg_rewind instead of resuming as
          # a second primary. See repmgr-docker entrypoint.sh.
          {{- if eq (include "pg.agentMode" .) "true" }}
          command: ["/usr/local/bin/entrypoint.sh", "agent"]
          {{- else }}
          command: ["/usr/local/bin/entrypoint.sh", "postgres"]
          {{- end }}
{{- else }}
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
{{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
{{- if eq (include "pg.agentMode" .) "true" }}
            - name: agent-metrics
              containerPort: 9200
              protocol: TCP
{{- if $control.enabled }}
            {{- /* Control API (#276) on its own port, so the NetworkPolicy can admit
                   scrapers to agent-metrics without admitting anything here. */}}
            - name: agent-control
              containerPort: {{ int $control.port }}
              protocol: TCP
{{- end }}
{{- end }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
{{- if .Values.repmgr.enabled }}
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
            # Lets the entrypoint stale-primary guard read the durable primary
            # marker (#125) to tell a first install from a PVC-loss recreate, so
            # it only settles/retries the empty-data peer scan in the recreate
            # case and never delays a first install (#170).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRIMARY_MARKER
              value: {{ printf "%s-primary" (include "pg.fullname" .) | quote }}
{{- if eq (include "pg.agentMode" .) "true" }}
            {{- /* fail fast with a clear message if an overlay nulls out the agent
                   block, rather than a raw nil-pointer on .leaseDuration below */}}
            {{- $_ := required "repmgr.agent is required when repmgr.enabled=true" .Values.repmgr.agent }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LEASE_NAME
              value: {{ printf "%s-leader" (include "pg.fullname" .) | quote }}
            - name: LEASE_DURATION
              value: {{ .Values.repmgr.agent.leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .Values.repmgr.agent.renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .Values.repmgr.agent.retryPeriod | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.repmgr.agent.reconcileInterval | quote }}
{{- if .Values.repmgr.agent.cascadingReplication }}
            {{- /* Cascading replication (#29): a standby may follow another standby to
                   offload the primary's WAL senders. The agent picks a safe upstream and
                   falls back to the primary, so a failed upstream never strands a node. */}}
            - name: CASCADE_REPLICATION
              value: "true"
{{- end }}
            {{- /* Which replication mechanics the agent drives (#287). Emitted only when
                   set to a non-default value: the agent defaults to repmgr when MECHANISM is
                   absent, so a default render stays byte-identical to 1.x and an older image
                   that predates the flag keeps working. EXPERIMENTAL, but usable with replicas
                   since #288 (topology from pg_stat_replication, agent-owned bootstrap) and
                   #289 (slot ownership); `cascadingReplication` is still render-rejected with
                   it, and #292 owns migrating an existing repmgr cluster in place. */}}
            {{- with (.Values.repmgr.agent).mechanism }}
            {{- if ne . "repmgr" }}
            - name: MECHANISM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: MASTER_SERVICE
              value: {{ include "pg.fullname" . | quote }}
            - name: POD_SELECTOR
              value: app.kubernetes.io/name={{ include "pg.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=postgresql
            {{- /* The agent owns pg_hba in agent mode: it writes a hardened SCRAM-only
                   pg_hba trusting POD_CIDR (no legacy 0.0.0.0/0 md5), with the user's
                   postgresql.pgHba inserted above the network catch-alls. */}}
            - name: POD_CIDR
              value: {{ required "repmgr.agent.podCidr is required in agent mode (the pod network trusted by the hardened pg_hba)" .Values.repmgr.agent.podCidr | quote }}
{{- with .Values.postgresql.pgHba }}
            - name: POSTGRESQL_PGHBA
              value: {{ join "\n" . | quote }}
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
            {{- /* Client TLS pg_hba (#110): the agent emits hostssl on the pod CIDR
                   when require/clientCertAuth, exempting the internal service users
                   (repmgr/postgres/monitoring) from the client-cert requirement. */}}
            - name: TLS_REQUIRE_SSL
              value: {{ .Values.postgresql.tls.require | quote }}
            - name: TLS_CLIENT_CERT_AUTH
              value: {{ .Values.postgresql.tls.clientCertAuth | quote }}
{{- if and .Values.prometheusExporter.enabled .Values.prometheusExporter.monitoringUser.enabled }}
            - name: MONITORING_USER
              value: {{ .Values.prometheusExporter.monitoringUser.username | quote }}
{{- end }}
{{- end }}
            {{- /* The agent runs the md5->scram managed-user re-hash on promotion/boot-primary
                   (#199); POSTGRES_PASSWORD/POSTGRES_DB are already on the container env above. */}}
            - name: MIGRATE_LEGACY_MD5_USERS
              value: {{ .Values.postgresql.migrateLegacyMd5Users | quote }}
            - name: DCS_BACKEND
              value: {{ (.Values.repmgr.agent.dcs).backend | default "kubernetes" | quote }}
{{- if eq (include "pg.agentEtcdMode" .) "true" }}
            {{- $etcd := required "repmgr.agent.dcs.etcd is required when dcs.backend=etcd" .Values.repmgr.agent.dcs.etcd }}
            {{- $endpoints := $etcd.endpoints }}
            {{- /* No explicit endpoints + the bundled etcd subchart enabled: target the
                   bundled cluster's client Service (<release>-etcd:<clientPort>). The
                   scheme follows the bundled etcd's tls.enabled, and under
                   client-cert-auth the agent must carry a client cert. */}}
            {{- if and (not $endpoints) (.Values.etcd).enabled }}
            {{- $etcdTls := ((.Values.etcd).tls).enabled | default false }}
            {{- /* dig (not `| default true`) so an explicit clientCertAuth=false is honored:
                   `false | default true` would wrongly coerce to true and force a client cert
                   on an encrypt-only (no mutual-auth) etcd. */}}
            {{- $etcdCca := dig "tls" "clientCertAuth" true (.Values.etcd | default dict) }}
            {{- if and $etcdTls $etcdCca (not (($etcd.tls).secretName)) }}
            {{ fail "bundled etcd tls.enabled with clientCertAuth requires the agent's client cert: set repmgr.agent.dcs.etcd.tls.secretName to a Secret with tls.crt, tls.key, ca.crt" }}
            {{- end }}
            {{- $endpoints = list (printf "%s://%s-etcd:%v" (ternary "https" "http" $etcdTls) .Release.Name ((.Values.etcd).clientPort | default 2379)) }}
            {{- end }}
            {{- if not $endpoints }}{{ fail "etcd backend needs endpoints: set repmgr.agent.dcs.etcd.endpoints for a BYO/shared etcd, or enable the bundled etcd with etcd.enabled=true" }}{{ end }}
            - name: ETCD_ENDPOINTS
              value: {{ $endpoints | join "," | quote }}
            - name: ETCD_PREFIX
              value: {{ $etcd.prefix | default (printf "/pg-ha/%s/" .Release.Name) | quote }}
{{- if (($etcd.tls).secretName) }}
            - name: ETCD_TLS_CERT
              value: /etc/etcd-tls/tls.crt
            - name: ETCD_TLS_KEY
              value: /etc/etcd-tls/tls.key
            - name: ETCD_TLS_CA
              value: /etc/etcd-tls/ca.crt
{{- end }}
{{- end }}
            - name: SPLIT_BRAIN_ACTION
              value: {{ .Values.repmgr.splitBrainDetection.action | quote }}
{{- if $control.enabled }}
            {{- /* Control API (#276). The agent validates all of this at boot and
                   refuses to start if the mTLS material is incomplete -- the render
                   guards at the top of this file catch it earlier. */}}
            - name: CONTROL_ENABLED
              value: "true"
            - name: CONTROL_ADDR
              value: {{ printf ":%d" (int $control.port) | quote }}
            - name: CONTROL_TLS_CERT
              value: /etc/agent-control-tls/tls.crt
            - name: CONTROL_TLS_KEY
              value: /etc/agent-control-tls/tls.key
            - name: CONTROL_TLS_CA
              value: /etc/agent-control-tls/ca.crt
{{- with $control.allowedClientCNs }}
            - name: CONTROL_ALLOWED_CNS
              value: {{ join "," . | quote }}
{{- end }}
{{- if $control.restore.enabled }}
            - name: CONTROL_RESTORE_ENABLED
              value: "true"
            - name: CONTROL_RESTORE_ALLOWED_CNS
              value: {{ join "," $control.restore.allowedClientCNs | quote }}
            {{- /* The CronJob the agent clones, and the deterministic Job name it
                   creates -- deterministic so the RBAC get/delete grants can be scoped
                   to exactly that one object by resourceName. */}}
            - name: CONTROL_RESTORE_CRONJOB
              value: {{ printf "%s-pgbackrest-restore" (include "pg.fullname" .) | quote }}
            - name: CONTROL_RESTORE_JOB_NAME
              value: {{ printf "%s-pgbackrest-restore-api" (include "pg.fullname" .) | quote }}
            {{- /* Confirm-only: the volume the rendered Job writes into is decided here,
                   in values, and an HTTP body may only echo it back. */}}
            - name: CONTROL_RESTORE_POD_ORDINAL
              value: {{ .Values.pgbackrest.restore.podOrdinal | quote }}
{{- if $control.restore.readPodLogs }}
            - name: CONTROL_RESTORE_READ_POD_LOGS
              value: "true"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: PGBACKREST_ENABLED
              value: "true"
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if not .Values.repmgr.enabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..30}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- if .Values.postgresql.pgHba }}
                        HBA_FILE=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SHOW hba_file" | xargs)
                        {{- range .Values.postgresql.pgHba }}
                        if ! grep -qF '{{ . }}' "$HBA_FILE"; then
                          sed -i '/host all all all scram-sha-256/i {{ . }}' "$HBA_FILE"
                        fi
                        {{- end }}
                        {{- end }}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        {{ .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 24 }}
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- else }}
          lifecycle:
{{- /* No preStop hook: the agent is PID 1 and owns SIGTERM shutdown (release the Lease,
       then stop its postgres child). A preStop `pg_ctl stop` would race the supervisor and
       stop postgres before the Lease is released. The repmgrd-tuned preStop that used to
       render here went away with repmgrd itself (#286). */}}
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in {1..90}; do
                      if pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
                        {{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
                        CONF="$PGDATA/postgresql.conf"
                        if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                          echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
                        fi
                        {{- end }}
                        {{- /* md5/SCRAM pg_hba compat, the md5->scram re-hash and the user
                               pgHba entries are all authored by the agent (single author, #199):
                               it writes the md5-first compat pg_hba on every node and re-hashes
                               managed users on promotion/boot-primary. The postStart patches that
                               used to do this for repmgrd mode went with repmgrd (#286). */}}
                        psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" > /dev/null 2>&1
                        {{- if .Values.postgresql.lifecycle.postStart.additionalCommands }}
                        HEADLESS="{{ include "pg.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
                        PRIMARY_HOST=""
                        # Discovery and the user commands connect over TCP to a remote
                        # pod; the image's pg_hba requires md5/scram for every
                        # non-loopback connection, so without PGPASSWORD both the
                        # discovery psql and the user psql fail auth and silently no-op.
                        export PGPASSWORD="$POSTGRES_PASSWORD"
                        {{- /* StatefulSet runs replicaCount + 1 pods, ordinals 0..replicaCount */}}
                        for n in $(seq 0 {{ int .Values.postgresql.replicaCount }}); do
                          H="{{ include "pg.fullname" . }}-${n}.${HEADLESS}"
                          if psql -h "$H" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "SELECT pg_is_in_recovery();" 2>/dev/null | grep -q 'f'; then
                            PRIMARY_HOST="$H"
                            break
                          fi
                        done
                        if [ -n "$PRIMARY_HOST" ]; then
                          # export PGHOST as its own statement: psql reads it only from
                          # the environment, and a bare `PGHOST=... <cmd>` prefix is
                          # split onto its own line by nindent, leaving it unexported.
                          export PGHOST="$PRIMARY_HOST"
                          {{- .Values.postgresql.lifecycle.postStart.additionalCommands | nindent 26 }}
                        fi
                        {{- end }}
                        break
                      fi
                      sleep 1
                    done
{{- end }}
{{- if .Values.postgresql.startupProbe.enabled }}
          # Holds off liveness/readiness until postgres first accepts
          # connections, so the repmgr stale-primary guard's settle loop and
          # crash-recovery WAL replay cannot be killed mid-startup by the
          # liveness probe (#172). Steady-state liveness stays tight below.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.postgresql.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.startupProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.livenessProbe.enabled }}
          livenessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # In agent mode the agent (PID 1) supervises postgres as a child, so
            # liveness asserts the agent's reconcile loop is alive: /healthz fails
            # when the loop has not progressed within ~3x the reconcile interval
            # (it beats every tick, on leader and standby alike). A wedged agent
            # that still answered 200 would keep a stale primary read-write; a dead
            # child postgres is the supervisor's concern, not the kubelet's.
            httpGet:
              path: /healthz
              port: agent-metrics
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.livenessProbe.failureThreshold }}
{{- end }}
{{- if .Values.postgresql.readinessProbe.enabled }}
          readinessProbe:
{{- if eq (include "pg.agentMode" .) "true" }}
            # Agent mode: readiness is replication-aware (#186). A standby reports Ready
            # only once its walreceiver is actually streaming -- NOT merely when postgres
            # accepts connections. Because a StatefulSet RollingUpdate advances to the
            # next pod only after the current one is Ready, gating standby readiness on
            # streaming stops the controller from rolling the primary / clone-source
            # while a standby is still cloning or catching up (which interrupted the
            # clone and deadlocked the cluster). A primary stays plain pg_isready. A
            # cloning standby (no postgres yet, or walreceiver not yet streaming) is
            # NotReady by design -- it is not killed (agent-mode liveness is the agent
            # /healthz heartbeat, and readiness is independent of the startup probe).
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 || exit 1
                  rec=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT pg_is_in_recovery()" 2>/dev/null)
                  if [ "$rec" = "f" ]; then exit 0; fi
                  if [ "$rec" = "t" ]; then
                    st=$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT status FROM pg_stat_wal_receiver" 2>/dev/null)
                    [ "$st" = "streaming" ] && exit 0 || exit 1
                  fi
                  exit 1
{{- else }}
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
{{- end }}
            initialDelaySeconds: {{ .Values.postgresql.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.readinessProbe.failureThreshold }}
{{- end }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
            - name: postgresql-config
              mountPath: /etc/postgresql/conf.d
              readOnly: true
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
            - name: postgresql-tls
              mountPath: /etc/postgresql/tls
              readOnly: true
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
            - name: ext-lib
              mountPath: /usr/lib/postgresql/{{ $pgMajor }}/lib
            - name: ext-share
              mountPath: /usr/share/postgresql/{{ $pgMajor }}/extension
{{- end }}
{{- if .Values.pgbackrest.enabled }}
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pg-run
              mountPath: /var/run/postgresql
{{- end }}
{{- if .Values.repmgr.enabled }}
            - name: repmgr-config
              mountPath: /etc/repmgr
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.repmgr.agent.dcs.etcd).tls).secretName) }}
            - name: etcd-tls
              mountPath: /etc/etcd-tls
              readOnly: true
{{- end }}
{{- if $control.enabled }}
            {{- /* Control-API mTLS material (#276), same shape as the etcd-tls mount.
                   The agent re-reads these files per handshake, so a rotated Secret
                   takes effect without a pod restart. */}}
            - name: agent-control-tls
              mountPath: /etc/agent-control-tls
              readOnly: true
{{- end }}
{{- with .Values.postgresql.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Idle sidecar: holds the pgbackrest binary, config and S3 credentials
        # alongside PGDATA on every pg pod. The pgbackrest CronJobs find the
        # current primary via the primary service endpoints and `kubectl exec`
        # into this container to perform the actual backup. Scheduling lives
        # in the CronJobs, not here.
        - name: pgbackrest
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ["/bin/bash", "-c", "exec sleep infinity"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
          resources:
            {{- toYaml .Values.pgbackrest.resources | nindent 12 }}
{{- end }}
{{- if or .Values.postgresql.configuration .Values.postgresql.extensions.enabled .Values.repmgr.enabled .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.extraVolumes (not .Values.postgresql.persistence.enabled) }}
      volumes:
{{- if or .Values.postgresql.configuration .Values.pgbackrest.enabled .Values.postgresql.tls.enabled .Values.postgresql.audit.enabled }}
        - name: postgresql-config
          configMap:
            name: {{ include "pg.fullname" . }}-postgresql-config
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
        # Server cert (#110). defaultMode 0400 + fsGroup 103 -> the postgres uid reads
        # it and PostgreSQL accepts the key (root-owned, not group/world readable),
        # the same pattern the etcd-tls mount uses below.
        - name: postgresql-tls
          secret:
            secretName: {{ required "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" .Values.postgresql.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
        - name: ext-lib
          emptyDir:
            sizeLimit: 1Gi
        - name: ext-share
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
{{- if .Values.repmgr.enabled }}
        - name: repmgr-config
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
{{- if and (eq (include "pg.agentEtcdMode" .) "true") (((.Values.repmgr.agent.dcs.etcd).tls).secretName) }}
        - name: etcd-tls
          secret:
            secretName: {{ .Values.repmgr.agent.dcs.etcd.tls.secretName | quote }}
            defaultMode: 0400
{{- end }}
{{- if $control.enabled }}
        - name: agent-control-tls
          secret:
            secretName: {{ $control.tls.existingSecret | quote }}
            defaultMode: 0400
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pgbackrest-config
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
{{- if .Values.pgbackrest.bootstrap.enabled }}
        - name: pgbackrest-bootstrap-script
          configMap:
            name: {{ include "pg.fullname" . }}-pgbackrest
            defaultMode: 0755
            items:
              - key: bootstrap.sh
                path: bootstrap.sh
{{- end }}
{{- end }}
{{- with .Values.postgresql.extraVolumes }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          # Always bound the ephemeral PGDATA volume: an unbounded emptyDir lets a
          # runaway DB/WAL fill the node's ephemeral storage and evict co-tenants
          # (#165, #214). Falls back to persistence.size (the cap the operator
          # already declared for persistent mode) when emptyDir.sizeLimit is unset,
          # then to a 10Gi floor if persistence.size is also blank -- so the cap is
          # never null (an empty sizeLimit would render as unbounded again).
          emptyDir:
            sizeLimit: {{ .Values.postgresql.persistence.emptyDir.sizeLimit | default .Values.postgresql.persistence.size | default "10Gi" }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
{{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
