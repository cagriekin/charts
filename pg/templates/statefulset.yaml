{{- include "pg.validateResourceNames" . }}
{{- include "pg.validateAudit" . }}
{{- include "pg.validateExtraPassthrough" . }}
{{- include "pg.validateExtensionPackages" . }}
{{- include "pg.validateExtensionAptSources" . }}
{{- include "pg.validateWalLevel" . }}
{{- include "pg.validateSyncReplicationSlotsMajor" . }}
{{- include "pg.validateSyncReplicationSlotsWalLevel" . }}
{{- if and (not .Values.repmgr.enabled) (gt (int .Values.postgresql.replicaCount) 0) }}
{{- fail "postgresql.replicaCount > 0 requires repmgr.enabled=true: with repmgr disabled the chart would run replicaCount+1 independent PostgreSQL instances with no replication between them. Set postgresql.replicaCount=0 for standalone mode or enable repmgr" }}
{{- end }}
{{- /* Client TLS validation (#110) */}}
{{- if .Values.postgresql.tls.enabled }}
{{- if not .Values.postgresql.tls.existingSecret }}{{ fail "postgresql.tls.enabled requires postgresql.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt)" }}{{- end }}
{{- end }}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (not .Values.postgresql.tls.enabled) }}
{{- fail "postgresql.tls.require / clientCertAuth require postgresql.tls.enabled" }}
{{- end }}
{{- /* require/mTLS are enforced via the agent-assembled pg_hba (hostssl). In repmgrd
       mode pg_hba carries an md5-fallback line that would bypass a hostssl rule, so
       enforced TLS is unsafe there -- server TLS (ssl=on) still works; clients can opt
       in with sslmode=require, or add explicit hostssl rules via postgresql.pgHba. */}}
{{- if and (or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth) (ne (include "pg.agentMode" .) "true") }}
{{- fail "postgresql.tls.require / clientCertAuth are supported only in agent mode (repmgr.failoverMode=agent). In repmgrd mode use postgresql.tls.enabled for optional server TLS; enforced TLS needs agent mode." }}
{{- end }}
{{- /* Cross-component sslmode consistency: when the server requires TLS, the exporter
       must also use TLS or its scrapes are rejected by hostssl. clientCertAuth forces
       hostssl on its own (it implies require in AssemblePgHba), so guard on either. */}}
{{- $tlsRequired := or .Values.postgresql.tls.require .Values.postgresql.tls.clientCertAuth }}
{{- if and $tlsRequired .Values.prometheusExporter.enabled (eq .Values.prometheusExporter.sslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires prometheusExporter.sslmode >= require (else the exporter's scrapes are rejected by hostssl). Set prometheusExporter.sslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- if and (has .Values.prometheusExporter.sslmode (list "verify-ca" "verify-full")) (not .Values.postgresql.tls.enabled) }}
{{- fail "prometheusExporter.sslmode verify-ca/verify-full requires postgresql.tls.enabled (the CA from postgresql.tls.existingSecret is mounted to verify the server cert)." }}
{{- end }}
{{- /* pgpool backend must also speak TLS when the server requires it. */}}
{{- if and $tlsRequired .Values.pgpool.enabled .Values.pgpool.tls.enabled (eq .Values.pgpool.tls.backendSslmode "disable") }}
{{- fail "postgresql.tls.require/clientCertAuth requires pgpool.tls.backendSslmode >= require (else pgpool's backend connections are rejected by hostssl). Set pgpool.tls.backendSslmode: require (or verify-ca/verify-full)." }}
{{- end }}
{{- /* Under PostgreSQL mTLS, application connections passing through pgpool need pgpool
       to present a backend client cert (the app users are not exempted from clientcert). */}}
{{- if and .Values.postgresql.tls.clientCertAuth .Values.pgpool.enabled (or (not .Values.pgpool.tls.enabled) (not .Values.pgpool.tls.backendClientCert)) }}
{{- fail "postgresql.tls.clientCertAuth=true with pgpool.enabled requires pgpool.tls.enabled and pgpool.tls.backendClientCert (a client cert pgpool presents to the backends for app-user passthrough under mTLS)." }}
{{- end }}
{{- /* Control API validation (#276). Every one of these is a RENDER guard rather than
       only a boot check in the agent: an operator who enables the API without its TLS
       material would otherwise get a crash-looping database (the agent refuses to open
       an unauthenticated mutating port), and discovering that from a CrashLoopBackOff
       is a much worse experience than a failed `helm upgrade`. Mirrors the
       postgresql.tls.existingSecret guard above. */}}
{{- $control := .Values.repmgr.agent.control }}
{{- if $control.enabled }}
{{- if ne (include "pg.agentMode" .) "true" }}
{{- fail "repmgr.agent.control.enabled requires agent mode (repmgr.failoverMode=agent): the control API is served by the Go agent, and repmgrd mode runs no agent. In repmgrd mode use the kubectl runbooks in the README instead." }}
{{- end }}
{{- if not $control.tls.existingSecret }}
{{- fail "repmgr.agent.control.enabled requires repmgr.agent.control.tls.existingSecret (a Secret with keys tls.crt, tls.key, ca.crt). The control API is mTLS-only -- there is no token or plaintext mode -- so without client-CA material it would have no way to authenticate callers and the agent refuses to start." }}
{{- end }}
{{- if eq (int $control.port) 9200 }}
{{- fail "repmgr.agent.control.port must not be 9200: that is the agent's read-only metrics/probe port, and keeping the two apart is what lets a NetworkPolicy admit Prometheus to 9200 without admitting anything to the mutating control surface." }}
{{- end }}
{{- if eq (int $control.port) 5432 }}
{{- fail "repmgr.agent.control.port must not be 5432 (the PostgreSQL port)" }}
{{- end }}
{{- end }}
{{- if $control.restore.enabled }}
{{- if not $control.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires repmgr.agent.control.enabled" }}
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.enabled (there is no repository to restore from)" }}
{{- end }}
{{- if not .Values.pgbackrest.restore.enabled }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.restore.enabled: the API triggers the chart's restore Job rather than constructing one, so the release must render it" }}
{{- end }}
{{- if ne .Values.pgbackrest.restore.mode "cronjob" }}
{{- fail "repmgr.agent.control.restore.enabled requires pgbackrest.restore.mode=cronjob: the agent clones the suspended CronJob's jobTemplate (exactly as `kubectl create job --from=cronjob/...` does), so in mode=job there is nothing to clone" }}
{{- end }}
{{- if not $control.restore.allowedClientCNs }}
{{- fail "repmgr.agent.control.restore.enabled requires a non-empty repmgr.agent.control.restore.allowedClientCNs: restore is a separate authz verb from pause/switchover, and an empty allowlist denies every client -- name the certificate CNs permitted to overwrite the data directory" }}
{{- end }}
{{- /* The grant and its bound render together or not at all (#279). Refusing here rather
       than warning is the point: `create jobs` cannot be resourceName-scoped, so a Role
       rendered without the admission policy carries a namespace-wide privilege-escalation
       primitive on a token that sits next to user-supplied SQL. Opting out stays possible
       -- a cluster below 1.30, a namespace-limited installer, a platform-managed policy --
       but it has to be said out loud in values, where it is reviewable. */}}
{{- if and (not $control.restore.admissionPolicy.enabled) (not $control.restore.admissionPolicy.acknowledgeUnbounded) }}
{{- fail "repmgr.agent.control.restore.admissionPolicy.enabled=false leaves the restore feature's `create jobs` grant unbounded: RBAC cannot restrict create by resourceName, so anything holding the database pods' ServiceAccount token could create arbitrary Jobs in this namespace and name any ServiceAccount in them. Either leave admissionPolicy.enabled=true (it needs Kubernetes >= 1.30 and cluster-scoped create on ValidatingAdmissionPolicy), or set repmgr.agent.control.restore.admissionPolicy.acknowledgeUnbounded=true to accept that trade deliberately" }}
{{- end }}
{{- end }}
{{- if and $control.restore.readPodLogs (not $control.restore.enabled) }}
{{- fail "repmgr.agent.control.restore.readPodLogs requires repmgr.agent.control.restore.enabled (it only affects reading a restore Job's log)" }}
{{- end }}
{{- if .Values.repmgr.enabled }}
{{- $repmgrMajor := required "repmgr.image.majorVersion is required (the PostgreSQL major bundled in the repmgr image)" .Values.repmgr.image.majorVersion }}
{{- if ne (toString .Values.postgresql.majorVersion) (toString $repmgrMajor) }}
{{- fail (printf "postgresql.majorVersion=%q does not match repmgr.image.majorVersion=%q. In repmgr mode the PostgreSQL server runs from the repmgr image (%s), which bundles only PostgreSQL %s and always runs that server regardless of postgresql.image; a mismatch crash-loops the extension init container or silently runs the wrong major. Set postgresql.majorVersion=%q (with a matching postgresql.image), or point repmgr.image at an image built for PostgreSQL %s and set repmgr.image.majorVersion to match" (toString .Values.postgresql.majorVersion) (toString $repmgrMajor) .Values.repmgr.image.repository (toString $repmgrMajor) (toString $repmgrMajor) (toString .Values.postgresql.majorVersion)) }}
{{- end }}
{{- /* The two majorVersion values above are hand-typed claims; the image TAG is what
       actually decides the major (#269). The published per-major tags carry a -pgNN
       suffix, so when one is in use the chart can check the claim against the artifact
       instead of trusting it -- catching "moved the tag, forgot the majors" (and the
       reverse) at render time rather than as a crash-looping extension init container or,
       with extensions off, a silently wrong major. An unsuffixed tag carries no major to
       compare, which is why the container also gets PG_MAJOR from majorVersion: the
       entrypoint and agent then refuse to start an image that lacks that major. */}}
{{- $tagMajor := regexFind "-pg[0-9]+$" (toString .Values.repmgr.image.tag) }}
{{- if $tagMajor }}
{{- $tagMajor = trimPrefix "-pg" $tagMajor }}
{{- if ne $tagMajor (toString $repmgrMajor) }}
{{- fail (printf "repmgr.image.tag=%q is built for PostgreSQL %s, but repmgr.image.majorVersion=%q. The tag decides which major actually runs, so these must agree: set repmgr.image.majorVersion=%q and postgresql.majorVersion=%q, or change the tag suffix to -pg%s" (toString .Values.repmgr.image.tag) $tagMajor (toString $repmgrMajor) $tagMajor $tagMajor (toString $repmgrMajor)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.pgbackrest.enabled (not .Values.repmgr.enabled) }}
{{- fail "pgbackrest.enabled requires repmgr.enabled=true: the pgbackrest binary and the archive_command run inside the postgresql container, which in standalone mode is the official postgres image without pgbackrest. WAL archiving would fail on every segment (unbounded WAL growth) and backups would time out. Enable repmgr, or disable pgbackrest" }}
{{- end }}
{{- /* Bootstrap-from-backup (#266) prerequisites. Fail fast rather than rendering an init
       container that could never work. */}}
{{- if .Values.pgbackrest.bootstrap.enabled }}
{{- if not .Values.pgbackrest.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires pgbackrest.enabled (the bootstrap init container reads the pgBackRest repo config and S3 credentials the pgbackrest feature renders)" }}
{{- end }}
{{- if not .Values.postgresql.persistence.enabled }}
{{- fail "pgbackrest.bootstrap.enabled requires postgresql.persistence.enabled: with an emptyDir PGDATA every pod restart loses the data directory, so the bootstrap would re-restore the entire database on each start instead of once" }}
{{- end }}
{{- if and (ne .Values.pgbackrest.bootstrap.targetType "") (not .Values.pgbackrest.bootstrap.target) }}
{{- fail "pgbackrest.bootstrap.target is required when pgbackrest.bootstrap.targetType is set" }}
{{- end }}
{{- end }}
{{- /* Bundled etcd consistency: the subchart deploys 3 stateful pods, so reject the
       contradictory inputs that would silently orphan them (fail-fast). */}}
{{- if (.Values.etcd).enabled }}
{{- if ne (include "pg.agentEtcdMode" .) "true" }}
{{- fail "etcd.enabled=true deploys a bundled etcd cluster, but the agent etcd backend is not active (it would be left unused). Set repmgr.failoverMode=agent and repmgr.agent.dcs.backend=etcd, or set etcd.enabled=false" }}
{{- end }}
{{- if (.Values.repmgr.agent.dcs.etcd).endpoints }}
{{- fail "etcd.enabled=true (bundled etcd) and repmgr.agent.dcs.etcd.endpoints (external etcd) are both set; the agent would target the external endpoints and leave the bundled cluster unused. Pick one: enable the bundle OR set endpoints" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pg.fullname" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if or .Values.global.annotations .Values.postgresql.annotations }}
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.postgresql.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  serviceName: {{ include "pg.fullname" . }}-headless
  # OrderedReady is REQUIRED by the #125 stale-resurrection guard: on a
  # full-cluster restart pods must come up lowest-ordinal-first, one at a time,
  # so a stale lowest-ordinal pod boots ALONE and the guard/service-updater can
  # refuse to serve it until a newer-timeline peer is up. Parallel would let a
  # stale and the real primary race and silently defeat the guard. Pinned
  # explicitly (not left to the API default) so it cannot be changed silently.
  {{- if eq (include "pg.agentMode" .) "true" }}
  # agent mode: Parallel — all pods are present at a cold boot, so the lease winner
  # compares timelines across the complete candidate set and the highest-timeline
  # survivor is chosen before any node promotes (immutable; switching needs an STS
  # recreate, see the migration guide).
  podManagementPolicy: Parallel
  {{- else }}
  podManagementPolicy: OrderedReady
  {{- end }}
  replicas: {{ add .Values.postgresql.replicaCount 1 }}
  {{- with .Values.postgresql.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "pg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
{{- if or (eq (include "pg.postgresqlConfigRenders" .) "true") .Values.postgresql.podAnnotations }}
      annotations:
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
        checksum/postgresql-config: {{ include (print $.Template.BasePath "/postgresql-configmap.yaml") . | sha256sum }}
{{- end }}
{{- if .Values.pgbackrest.enabled }}
        # Roll the pod when the pgbackrest config (S3 endpoint/bucket/retention)
        # changes: pgbackrest.conf is a subPath mount, which the kubelet never
        # live-updates, so without this checksum a helm upgrade would silently keep
        # archiving WAL + running backups against the OLD repository (#145).
        checksum/pgbackrest-config: {{ include (print $.Template.BasePath "/pgbackrest-configmap.yaml") . | sha256sum }}
{{- end }}
      {{- with .Values.postgresql.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.repmgr.enabled }}
      # Standalone (no repmgr): the agent/service-updater that need the API token are
      # not present, so don't mount one (#166). In repmgr mode the token is required.
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.repmgr.enabled }}
      terminationGracePeriodSeconds: {{ .Values.repmgr.terminationGracePeriodSeconds | default 120 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
      {{- if .Values.repmgr.enabled }}
      {{- if eq (include "pg.repmgrdMode" .) "true" }}
      {{- /* repmgrd mode signals postgres cross-container (the failover test);
             the agent is PID 1 in the postgresql container and owns its child,
             so it is not needed in agent mode. */}}
      shareProcessNamespace: true
      {{- end }}
      serviceAccountName: {{ include "pg.fullname" . }}-repmgr
      {{- end }}
      {{- with .Values.postgresql.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.postgresql.affinity }}
        {{- toYaml .Values.postgresql.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "pg.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: postgresql
              topologyKey: kubernetes.io/hostname
          # Zone spread is preferred (soft) so single-zone clusters still
          # schedule; the hostname rule above stays hard and dominates.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pg.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: postgresql
                topologyKey: topology.kubernetes.io/zone
        {{- end }}
      {{- with .Values.postgresql.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{- if .Values.postgresql.persistence.enabled }}
        - name: fix-permissions
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          command: ['sh', '-c', 'chown -R 101:103 /var/lib/postgresql/data && if [ -d /var/lib/postgresql/data/pgdata ]; then chmod 0700 /var/lib/postgresql/data/pgdata; fi']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # Root is required to chown the volume, but drop the rest of the default
            # capability set -- only CHOWN (chown), FOWNER (chmod) and DAC_OVERRIDE
            # (traverse/modify regardless of perms) are needed (#162).
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
{{- end }}
{{- if .Values.pgbackrest.bootstrap.enabled }}
        # Bootstrap-from-backup (#266). Seeds an EMPTY data directory from the pgBackRest
        # repository, so a replica-0 that lost its PVC recovers its data instead of silently
        # initdb-ing an empty cluster. Ordered BEFORE repmgr-init on purpose: once PGDATA is
        # populated, init-repmgr.sh defers the start decision and the entrypoint skips initdb,
        # so postgres starts, replays the archived WAL via restore_command and promotes.
        # It refuses to touch an already-initialized directory (see bootstrap.sh), which is
        # what makes it safe to leave enabled across ordinary restarts and rollouts.
        - name: pgbackrest-bootstrap
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: PGBACKREST_STANZA
              value: {{ .Values.pgbackrest.stanza | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # pgbackrest's default log/lock paths may be unwritable, and neither belongs on
            # the data volume; /tmp is this container's own writable layer.
            - name: PGBACKREST_LOG_PATH
              value: /tmp/pgbackrest-log
            - name: PGBACKREST_LOCK_PATH
              value: /tmp/pgbackrest-lock
            - name: TARGET_TYPE
              value: {{ .Values.pgbackrest.bootstrap.targetType | quote }}
            - name: TARGET
              value: {{ .Values.pgbackrest.bootstrap.target | quote }}
            - name: BACKUP_SET
              value: {{ .Values.pgbackrest.bootstrap.backupSet | quote }}
{{- if .Values.pgbackrest.repoEncryption.enabled }}
            - name: PGBACKREST_REPO1_CIPHER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "pgbackrest.repoEncryption.existingSecret.name is required when pgbackrest.repoEncryption.enabled" .Values.pgbackrest.repoEncryption.existingSecret.name }}
                  key: {{ .Values.pgbackrest.repoEncryption.existingSecret.passphraseKey }}
{{- end }}
{{- if eq .Values.pgbackrest.s3.keyType "shared" }}
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.accessKeyIdKey }}
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.pgbackrestS3SecretName" . }}
                  key: {{ .Values.pgbackrest.existingSecret.secretAccessKeyKey }}
{{- end }}
          resources:
            {{- toYaml .Values.pgbackrest.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            # Dedicated directory volume (not a subPath file) so /scripts is created by the
            # mount and need not pre-exist in the image.
            - name: pgbackrest-bootstrap-script
              mountPath: /scripts
              readOnly: true
{{- end }}
{{- if and .Values.postgresql.extensions.enabled .Values.repmgr.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
{{- $pkgs := list }}
{{- range $p := (.Values.postgresql.extensions.packages | default list) }}
{{- $pkgs = append $pkgs ($p | toString | replace "{major}" ($pgMajor | toString)) }}
{{- end }}
        - name: copy-base-ext
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
{{- if $pkgs }}
          # #303: apt-get install into THIS container's own filesystem before the copy
          # below -- neither ext-lib nor ext-share is mounted at the real
          # /usr/lib(share)/postgresql/{{ $pgMajor }}/... paths here (only the main
          # postgresql container mounts them there), so dpkg unpacks straight into
          # this image's normal extension directories and the unmodified cp then
          # picks up both the repmgr image's original extensions and anything just
          # installed. The repmgr image configures the PGDG apt repo at build time
          # (images/repmgr/Dockerfile), so this is the reliable install path in
          # repmgr mode.
          #
          # Pin postgresql-{{ $pgMajor }} to whatever's already installed before naming any
          # extension package on the same apt-get install line (review, #303): an
          # unversioned `Depends: postgresql-{{ $pgMajor }}` is satisfied by any installed
          # version and normally left alone, but apt is still free to upgrade it to
          # satisfy some OTHER package's stricter constraint -- which would replace the
          # very libs this cp is about to copy with a build from a different point
          # release than the postmaster this chart actually starts (the #302 failure
          # mode, one layer up). The pin makes that impossible to do silently: apt
          # either leaves the server package alone (the normal case) or fails the
          # render-time-adjacent install outright, never a quiet swap.
          command: ['sh', '-c', {{ include "pg.extensionInstallCommand" (dict "pgMajor" $pgMajor "pkgs" $pkgs "aptSources" .Values.postgresql.extensions.aptSources "noClobber" false) | quote }}]
          securityContext:
            # apt-get/dpkg needs root to write /var/lib/dpkg and run package
            # maintainer scripts (e.g. ldconfig) -- broader than fix-permissions'
            # plain chown/chmod (#162), because dpkg's maintainer-script surface is
            # inherently wider than one chown call. Root is confined to this
            # throwaway init container, which persists nothing: its only output is
            # two file trees copied into emptyDirs. The main postgresql container,
            # and this same container with no packages set, keep running as the
            # unprivileged containerSecurityContext user. This whole block REPLACES
            # postgresql.containerSecurityContext for this container while packages
            # is set (review, #303) -- deliberate, since dpkg needs root -- but it
            # means a values-set runAsGroup/seccompProfile/readOnlyRootFilesystem is
            # NOT merged in here and has no effect on this container. A namespace
            # enforcing the PSA restricted profile (or any runAsNonRoot admission
            # policy) will reject this pod outright; see the README PSA note.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                # SETUID/SETGID/SETFCAP are no-ops here under
                # allowPrivilegeEscalation: false (kernel no_new_privs blocks the
                # privilege gain these grant) -- kept anyway so a dpkg postinst
                # script that merely CALLS setuid()/setgid()/setcap() (e.g. to
                # verify ownership, not to actually escalate) gets EPERM handled
                # gracefully by the calling code instead of the syscall itself
                # being denied in a way some maintainer scripts do not expect.
                - SETUID
                - SETGID
                - SETFCAP
                - MKNOD
{{- else }}
          command: ['sh', '-c', 'cp /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so* /ext-lib/ && cp /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
          resources:
{{- if $pkgs }}
            {{- toYaml .Values.postgresql.extensions.installResources | nindent 12 }}
{{- else }}
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.extensions.enabled }}
{{- $pgMajor := required "postgresql.majorVersion is required when postgresql.extensions.enabled is true" .Values.postgresql.majorVersion }}
{{- $pkgs := list }}
{{- range $p := (.Values.postgresql.extensions.packages | default list) }}
{{- $pkgs = append $pkgs ($p | toString | replace "{major}" ($pgMajor | toString)) }}
{{- end }}
        - name: copy-ext
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
{{- if $pkgs }}
          # #303: apt-get install before the copy below, same reasoning as
          # copy-base-ext. Still -n (no-clobber, #302) on the copy: in repmgr mode
          # copy-base-ext already populated ext-lib/ext-share from the repmgr image,
          # which is what actually runs the server, so this container's job (with or
          # without packages) is to ADD what's missing, never overwrite a core lib
          # with this image's build. PGDG apt-source availability in
          # postgresql.image is NOT verified by this chart -- see README "Installing
          # extensions without a custom image". Same postgresql-{{ $pgMajor }} version
          # pin as copy-base-ext, and for the same reason (review, #303) -- best-effort
          # here too: if this image did not install PostgreSQL via a dpkg-tracked
          # postgresql-{{ $pgMajor }} package, PGVER is empty and the pin is skipped
          # rather than failing an otherwise-valid custom-image install.
          command: ['sh', '-c', {{ include "pg.extensionInstallCommand" (dict "pgMajor" $pgMajor "pkgs" $pkgs "aptSources" .Values.postgresql.extensions.aptSources "noClobber" true) | quote }}]
          securityContext:
            # Same as copy-base-ext's apt-step securityContext above (review, #303):
            # REPLACES postgresql.containerSecurityContext, not a merge -- and will
            # be rejected under the PSA restricted profile. SETUID/SETGID/SETFCAP
            # are no-ops under allowPrivilegeEscalation: false; kept so a dpkg
            # postinst that calls those syscalls gets a handled EPERM.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - SETUID
                - SETGID
                - SETFCAP
                - MKNOD
{{- else }}
          # -n (no-clobber, #302): copy-base-ext (when repmgr is enabled) already
          # populated ext-lib/ext-share from the repmgr image, which is what actually
          # runs the server. This container only ADDS what's missing (e.g. vector.so)
          # -- it must never overwrite a core lib (e.g. libpqwalreceiver.so) with this
          # image's build. The two images can drift to different postgres point
          # releases independently (this image's tag is often floating), and an
          # unconditional overwrite silently reintroduces an ABI mismatch between
          # the running server and its own WAL receiver plugin.
          command: ['sh', '-c', 'cp -n /usr/lib/postgresql/{{ $pgMajor }}/lib/*.so* /ext-lib/ && cp -n /usr/share/postgresql/{{ $pgMajor }}/extension/* /ext-share/']
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: ext-lib
              mountPath: /ext-lib
            - name: ext-share
              mountPath: /ext-share
          resources:
{{- if $pkgs }}
            {{- toYaml .Values.postgresql.extensions.installResources | nindent 12 }}
{{- else }}
            {{- include "pg.initResources" . | nindent 12 }}
{{- end }}
{{- end }}
{{- if .Values.repmgr.enabled }}
        - name: repmgr-init
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          command: ["/usr/local/bin/entrypoint.sh", "init"]
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
{{- if eq (include "pg.agentMode" .) "true" }}
            {{- /* #308: the agent's own repmgr.conf (regenerated every boot, see
                   images/repmgr/agent/cmd/agent's boot()) has always used
                   use_replication_slots=1 for standbys -- this predates #308. The
                   initial clone below, run from THIS init container's repmgr.conf, did
                   not, so a fresh standby's first-ever streaming connection carried no
                   physical slot until an unrelated later repmgr operation happened to
                   create one. #308's synchronized_standby_slots reconciliation is the
                   first thing that depends on that slot existing reliably from the
                   start, so align the initial clone with the agent's own default.
                   repmgrd mode is deliberately untouched (retention there is
                   wal_keep_size-based, not slot-based -- introducing slots there is an
                   unrelated, unreviewed behavior change). */}}
            - name: USE_REPLICATION_SLOTS
              value: "1"
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: repmgr-config
              mountPath: /etc/repmgr
          resources:
            {{- toYaml .Values.repmgr.initContainerResources | nindent 12 }}
{{- end }}
        - name: setup-config
          image: {{ include "pg.image" .Values.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresql.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              CONF=/var/lib/postgresql/data/pgdata/postgresql.conf
{{- if eq (include "pg.postgresqlConfigRenders" .) "true" }}
              if [ -f "$CONF" ] && ! grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                echo "include_dir = '/etc/postgresql/conf.d'" >> "$CONF"
              fi
{{- else }}
              # A stale include_dir left in PGDATA while conf.d features
              # were enabled is fatal at postmaster start once the mount
              # is gone.
              if [ -f "$CONF" ] && grep -q "include_dir = '/etc/postgresql/conf.d'" "$CONF"; then
                grep -v "include_dir = '/etc/postgresql/conf.d'" "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
{{- if not .Values.pgbackrest.enabled }}
              # pgbackrest disabled: the repmgr image entrypoint persisted
              # archive_mode=on + a pgbackrest archive_command into PGDATA's
              # postgresql.conf at initdb (#132). With the pgbackrest config and
              # S3 credentials now gone, every archive_command fails and WAL is
              # never recycled -- pg_wal grows until the PVC fills and the
              # postmaster PANICs. Strip the entrypoint-written archive lines so
              # archiving reverts to the default (off). Live archive settings,
              # when enabled, come from the chart-managed conf.d include, never
              # this base file, so this only ever removes stale, failing config.
              if [ -f "$CONF" ] && grep -q "archive-push %p" "$CONF"; then
                grep -v -e '^archive_mode = on$' -e 'archive-push %p' "$CONF" > "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              fi
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- include "pg.initResources" . | nindent 12 }}
      containers:
        - name: postgresql
{{- if .Values.repmgr.enabled }}
          image: "{{ include "pg.repmgrImage" . }}"
          imagePullPolicy: {{ .Values.repmgr.image.pullPolicy }}
          # The image entrypoint runs a stale-primary guard before starting
          # read-write: on a container-only restart (which does not re-run the
          # init container) it detects a peer promoted to a newer timeline and
          # rejoins this node as a standby via pg_rewind instead of resuming as
          # a second primary. See repmgr-docker entrypoint.sh.
          {{- if eq (include "pg.agentMode" .) "true" }}
          command: ["/usr/local/bin/entrypoint.sh", "agent"]
          {{- else }}
          command: ["/usr/local/bin/entrypoint.sh", "postgres"]
          {{- end }}
{{- else }}
          image: {{ include "pg.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
{{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
{{- if eq (include "pg.agentMode" .) "true" }}
            - name: agent-metrics
              containerPort: 9200
              protocol: TCP
{{- if $control.enabled }}
            {{- /* Control API (#276) on its own port, so the NetworkPolicy can admit
                   scrapers to agent-metrics without admitting anything here. */}}
            - name: agent-control
              containerPort: {{ int $control.port }}
              protocol: TCP
{{- end }}
{{- end }}
          env:
{{- with (include "pg.pgMajorEnv" .) }}{{ . | nindent 12 }}{{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretUsernameKey" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretPasswordKey" . }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretDatabaseKey" . }}
{{- if .Values.repmgr.enabled }}
            - name: REPMGR_USER
              value: {{ .Values.repmgr.username | quote }}
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.secretName" . }}
                  key: {{ include "pg.secretRepmgrPasswordKey" . }}
            - name: REPMGR_DB
              value: {{ .Values.repmgr.database | quote }}
            - name: HEADLESS_SERVICE
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "pg.fullname" .) .Release.Namespace | quote }}
            - name: REPMGR_NODE_COUNT
              value: {{ add .Values.postgresql.replicaCount 1 | quote }}
            # Lets the entrypoint stale-primary guard read the durable primary
            # marker (#125) to tell a first install from a PVC-loss recreate, so
            # it only settles/retries the empty-data peer scan in the recreate
            # case and never delays a first install (#170).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRIMARY_MARKER
              value: {{ printf "%s-primary" (include "pg.fullname" .) | quote }}
{{- if eq (include "pg.agentMode" .) "true" }}
            {{- /* fail fast with a clear message if an overlay nulls out the agent
                   block, rather than a raw nil-pointer on .leaseDuration below */}}
            {{- $_ := required "repmgr.agent is required when repmgr.failoverMode=agent" .Values.repmgr.agent }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LEASE_NAME
              value: {{ printf "%s-leader" (include "pg.fullname" .) | quote }}
            - name: LEASE_DURATION
              value: {{ .Values.repmgr.agent.leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .Values.repmgr.agent.renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .Values.repmgr.agent.retryPeriod | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.repmgr.agent.reconcileInterval | quote }}
{{- if .Values.repmgr.agent.cascadingReplication }}
            {{- /* Cascading replication (#29): a standby may follow another standby to
                   offload the primary's WAL senders. The agent picks a safe upstream and
                   falls back to the primary, so a failed upstream never strands a node. */}}
            - name: CASCADE_REPLICATION
              value: "true"
{{- end }}
{{- if .Values.repmgr.agent.syncReplicationSlots }}
            {{- /* Logical failover slot sync (#308): the primary reconciles
                   synchronized_standby_slots to its current standby's physical slot(s)
                   on every tick. Requires postgresql.walLevel: logical -- enforced by
                   pg.validateSyncReplicationSlotsWalLevel, since the sync_replication_slots
                   worker this enables on every standby is NOT a harmless no-op without it
                   (it fails startup validation and PostgreSQL respawns it forever). */}}
            - name: SYNC_REPLICATION_SLOTS
              value: "true"
{{- end }}
            - name: MASTER_SERVICE
              value: {{ include "pg.fullname" . | quote }}
            - name: POD_SELECTOR
              value: app.kubernetes.io/name={{ include "pg.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=postgresql
            {{- /* The agent owns pg_hba in agent mode: it writes a hardened SCRAM-only
                   pg_hba trusting POD_CIDR (no legacy 0.0.0.0/0 md5), with the user's
                   postgresql.pgHba inserted above the network catch-alls. */}}
            - name: POD_CIDR
              value: {{ required "repmgr.agent.podCidr is required in agent mode (the pod network trusted by the hardened pg_hba)" .Values.repmgr.agent.podCidr | quote }}
{{- with .Values.postgresql.pgHba }}
            - name: POSTGRESQL_PGHBA
              value: {{ join "\n" . | quote }}
{{- end }}
{{- if .Values.postgresql.tls.enabled }}
