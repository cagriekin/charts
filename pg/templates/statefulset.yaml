                   (repmgr/postgres/monitoring) from the client-cert requirement. */}}
            - name: TLS_REQUIRE_SSL
              value: {{ .Values.postgresql.tls.require | quote }}
            - name: TLS_CLIENT_CERT_AUTH
              value: {{ .Values.postgresql.tls.clientCertAuth | quote }}
{{- if and .Values.prometheusExporter.enabled .Values.prometheusExporter.monitoringUser.enabled }}
            - name: MONITORING_USER
              value: {{ .Values.prometheusExporter.monitoringUser.username | quote }}
{{- end }}
{{- end }}
            {{- /* The agent runs the md5->scram managed-user re-hash on promotion/boot-primary
                   (#199); POSTGRES_PASSWORD/POSTGRES_DB are already on the container env above. */}}
            - name: MIGRATE_LEGACY_MD5_USERS
              value: {{ .Values.postgresql.migrateLegacyMd5Users | quote }}
            - name: DCS_BACKEND
              value: {{ (.Values.repmgr.agent.dcs).backend | default "kubernetes" | quote }}
{{- if eq (include "pg.agentEtcdMode" .) "true" }}
            {{- $etcd := required "repmgr.agent.dcs.etcd is required when dcs.backend=etcd" .Values.repmgr.agent.dcs.etcd }}
            {{- $endpoints := $etcd.endpoints }}
            {{- /* No explicit endpoints + the bundled etcd subchart enabled: target the
                   bundled cluster's client Service (<release>-etcd:<clientPort>). The
                   scheme follows the bundled etcd's tls.enabled, and under
                   client-cert-auth the agent must carry a client cert. */}}
            {{- if and (not $endpoints) (.Values.etcd).enabled }}
            {{- $etcdTls := ((.Values.etcd).tls).enabled | default false }}
            {{- /* dig (not `| default true`) so an explicit clientCertAuth=false is honored:
                   `false | default true` would wrongly coerce to true and force a client cert
                   on an encrypt-only (no mutual-auth) etcd. */}}
            {{- $etcdCca := dig "tls" "clientCertAuth" true (.Values.etcd | default dict) }}
            {{- if and $etcdTls $etcdCca (not (($etcd.tls).secretName)) }}
            {{ fail "bundled etcd tls.enabled with clientCertAuth requires the agent's client cert: set repmgr.agent.dcs.etcd.tls.secretName to a Secret with tls.crt, tls.key, ca.crt" }}
            {{- end }}
            {{- $endpoints = list (printf "%s://%s-etcd:%v" (ternary "https" "http" $etcdTls) .Release.Name ((.Values.etcd).clientPort | default 2379)) }}
            {{- end }}
            {{- if not $endpoints }}{{ fail "etcd backend needs endpoints: set repmgr.agent.dcs.etcd.endpoints for a BYO/shared etcd, or enable the bundled etcd with etcd.enabled=true" }}{{ end }}
            - name: ETCD_ENDPOINTS
              value: {{ $endpoints | join "," | quote }}
            - name: ETCD_PREFIX
              value: {{ $etcd.prefix | default (printf "/pg-ha/%s/" .Release.Name) | quote }}
{{- if (($etcd.tls).secretName) }}
            - name: ETCD_TLS_CERT
              value: /etc/etcd-tls/tls.crt
            - name: ETCD_TLS_KEY
              value: /etc/etcd-tls/tls.key
            - name: ETCD_TLS_CA
              value: /etc/etcd-tls/ca.crt
{{- end }}
{{- end }}
            - name: SPLIT_BRAIN_ACTION
              value: {{ .Values.repmgr.splitBrainDetection.action | quote }}
{{- if $control.enabled }}
