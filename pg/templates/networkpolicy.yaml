{{- /* Normalize FIRST (#291 review): this file reads .Values.ha transitively (pg.agentMode
       and friends), and in a full `helm template` it only works by accident -- statefulset.yaml
       sorts earlier and mutates .Values for every file after it. Rendering this template alone,
       which helm-unittest does per-file, would read the raw ha: defaults and ignore the
       repmgr.* alias entirely, so an alias-driven assertion here would pass vacuously. */ -}}
{{- include "pg.normalizeValues" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pg.fullname" . }}-postgresql
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
{{- if .Values.pgpool.enabled }}
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: pgpool
{{- end }}
{{- if .Values.prometheusExporter.enabled }}
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres-exporter
{{- if .Values.prometheusExporter.monitoringUser.enabled }}
{{- /*
The monitoring-user post-install/post-upgrade hook Job connects to 5432 (via the
write Service) to create the exporter's least-privileged role; without this rule a
default-deny CNI drops it and the helm hook fails the release.
*/}}
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: monitoring-user
{{- end }}
{{- end }}
{{- if .Values.backup.enabled }}
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backup
{{- end }}
{{- if .Values.networkPolicy.postgresql.allowExternal }}
        - podSelector: {}
{{- end }}
{{- if eq (include "pg.agentMode" .) "true" }}
{{- /*
The agent serves Prometheus metrics + the /healthz/readyz endpoints on 9200 from
inside the postgresql pods; without this rule the CNI drops every scrape. Mirrors
the pgpool 9719 / exporter 9116 metrics rules.
*/}}
    - ports:
        - port: 9200
          protocol: TCP
      from:
        - podSelector: {}
{{- /*
The control API port (#276) deliberately gets NO rule of its own, even when the API
is enabled. This policy is an explicit allowlist, so the absence of a rule IS
deny-by-default -- the opposite of the 9200 rule above, which has to admit every
same-namespace pod for scrapes to work. Admit a specific client with
networkPolicy.agentControl.extraIngress; humans reach it through `kubectl
port-forward`, which goes via the kubelet rather than the pod network and so is
unaffected by this policy on most CNIs.
*/}}
{{- with .Values.networkPolicy.agentControl.extraIngress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- /*
extraIngress entries are full ingress rules (each with its own from/ports),
spliced at the rules level -- symmetric with extraEgress. Previously they were
injected into the 5432 rule's `from:` list, which rejected rule-shaped input at
apply time and silently restricted peer-shaped input to port 5432 (#136).
*/}}
{{- with .Values.networkPolicy.postgresql.extraIngress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
{{- /* No egress to pgpool: the postgresql pods do not connect to it. This rule existed
       only for the service-updater's pgpool health check (#129), and that sidecar went
       away with repmgrd (#286). Traffic flows the other way -- pgpool -> postgresql --
       which the pgpool policy's egress and the ingress rule above already cover. */}}
{{- /*
443 covers HTTPS S3 endpoints and cloud API servers; 6443 covers the
API server on kubeadm-style clusters (the agent's client-go and the
lifecycle hooks reach it from these pods). NetworkPolicy matches the backend
port after service translation, so the in-cluster kubernetes Service
port 443 is not enough.
*/}}
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- if .Values.pgbackrest.enabled }}
{{- $s3Port := include "pg.s3EndpointPort" .Values.pgbackrest.s3.endpoint | int }}
{{- if and (ne $s3Port 443) (ne $s3Port 6443) }}
        - port: {{ $s3Port }}
          protocol: TCP
{{- end }}
{{- end }}
{{- if eq (include "pg.agentEtcdMode" .) "true" }}
{{- /*
The agent's etcd DCS client dials the etcd client port. Endpoints are arbitrary
external hosts, so this opens egress to that port cluster-wide (the same
unrestricted-port shape as the 443/6443 apiserver rule).

The port is DERIVED, not the literal 2379 it used to be (#298 review). The bundled
endpoint honours `etcd.clientPort` and a BYO endpoint carries its own port in the URL,
so a non-default port left the agent's dial blocked by the CNI: no node ever wins the
lease, the release comes up with no primary and no write-Service endpoint, and the only
symptom is a connection timeout. pg.agentEtcdPorts reads the same two sources the
StatefulSet builds ETCD_ENDPOINTS from, so the policy cannot disagree with what is dialed.
*/}}
    - ports:
{{- range (splitList "," (include "pg.agentEtcdPorts" .)) }}
        - port: {{ . | int }}
          protocol: TCP
{{- end }}
{{- end }}
{{- with .Values.networkPolicy.postgresql.extraEgress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
---
{{- if .Values.pgpool.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pg.fullname" . }}-pgpool
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgpool
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgpool
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9999
          protocol: TCP
      from:
        - podSelector: {}
{{- if .Values.pgpool.metrics.enabled }}
{{- /*
pgpool advertises Prometheus scraping on 9719 (the pgpool2_exporter sidecar);
without this rule the CNI drops every scrape and pgpool metrics silently
disappear despite the scrape annotations the chart itself emits (#135). Mirrors
the postgres-exporter policy's 9116 rule.
*/}}
    - ports:
        - port: 9719
          protocol: TCP
      from:
        - podSelector: {}
{{- end }}
{{- /* extraIngress: full ingress rules at the rules level, symmetric with extraEgress (#136) */}}
{{- with .Values.networkPolicy.pgpool.extraIngress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
{{- with .Values.networkPolicy.pgpool.extraEgress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
---
{{- if .Values.prometheusExporter.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pg.fullname" . }}-postgres-exporter
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
  {{- with (include "pg.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "pg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9116
          protocol: TCP
      from:
        - podSelector: {}
{{- /*
extraIngress: full ingress rules at the rules level (symmetric with extraEgress), so a
Prometheus in a separate monitoring namespace can scrape 9116 via a namespaceSelector
-- the bare podSelector above is same-namespace only (#147).
*/}}
{{- with .Values.networkPolicy.prometheusExporter.extraIngress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "pg.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
{{- with .Values.networkPolicy.prometheusExporter.extraEgress }}
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
