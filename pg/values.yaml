nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Lightweight image for helper init containers (permission fixups, config
# copy/templating) across the StatefulSet, pgpool, and exporter pods. Shared so
# the pin is consistent and overridable for air-gapped/private registries.
busyboxImage:
  repository: busybox
  tag: "1.37"
  digest: ""
  pullPolicy: IfNotPresent

postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    digest: ""
    pullPolicy: IfNotPresent

  # PostgreSQL major version shipped in image.tag above. Used to build the
  # extension paths (/usr/lib/postgresql/<major>/lib and
  # /usr/share/postgresql/<major>/extension) when extensions.enabled is true.
  # Keep in sync with image.tag.
  majorVersion: "18"

  replicaCount: 1

  annotations: {}

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    # When persistence.enabled=false, PGDATA lives in an emptyDir. A sizeLimit caps it so a
    # runaway DB/WAL is evicted itself instead of filling the node and evicting
    # co-tenants (#165, #214). Empty = fall back to persistence.size above, then a 10Gi
    # floor if that is also blank (never unbounded); set e.g. "8Gi" to override the cap.
    emptyDir:
      sizeLimit: ""

  database: postgres
  username: postgres

  existingSecret:
    enabled: false
    name: ""
    usernameKey: username
    passwordKey: password
    databaseKey: database
    repmgrPasswordKey: repmgr-password
    # Required only when prometheusExporter.monitoringUser.enabled is true.
    monitoringPasswordKey: monitoring-password

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  # Suspends the liveness and readiness probes until PostgreSQL first accepts
  # connections, so a slow start is not killed mid-startup by the liveness
  # probe: the repmgr stale-primary guard's settle loop runs before postgres
  # opens (up to ~147s if REPMGR_NODE_COUNT falls back to 10) and crash-recovery
  # WAL replay can take longer still, both of which can exceed the ~130s
  # liveness budget. failureThreshold x periodSeconds is the total startup
  # budget (600s here); keep the steady-state livenessProbe window tight.
  startupProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  affinity: {}
  # Hard topology spread for the postgresql pods (default none; the affinity above
  # already does a soft zone spread + hard hostname anti-affinity). Set a hard zone
  # spread for multi-AZ production -- see values-cloud.yaml.
  topologySpreadConstraints: []

  nodeSelector: {}

  tolerations: []

  priorityClassName: ""

  podAnnotations: {}

  # Annotations for the postgresql pods' ServiceAccount (<fullname>-repmgr), the
  # identity pgbackrest uses to reach S3. Set a cloud workload-identity annotation
  # here for keyless backups (pair with pgbackrest.s3.keyType: auto, no static
  # existingSecret needed):
  #   IRSA (EKS): eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  #   WI  (GKE):  iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  serviceAccount:
    annotations: {}

  podDisruptionBudget:
    enabled: true
    # maxUnavailable (not minAvailable) so a drain / rolling upgrade / autoscaler
    # scale-down takes at most one PostgreSQL pod at a time regardless of replica
    # count. unhealthyPodEvictionPolicy: AlwaysAllow lets a stuck/not-yet-Ready pod
    # (e.g. one slowly reattaching its volume) still be evicted, so it cannot wedge
    # node maintenance (k8s >= 1.27; older API servers prune the field harmlessly).
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
    minAvailable: null

  configuration: {}
    # max_connections: "200"
    # shared_buffers: "1GB"
    # work_mem: "32MB"

  podSecurityContext:
    fsGroup: 103
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    runAsUser: 101
    runAsGroup: 103
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  pgHba: []
    # - "host all all 10.0.0.0/8 md5"
    # - "host replication repmgr 10.0.0.0/8 trust"

  # Extra volumes/mounts/env for the postgresql container (#262). Generic pod-spec
  # passthrough for mounting an operator-supplied file that must be byte-identical on
  # every replica -- e.g. the pgsodium server root key (Supabase Vault) read via
  # pgsodium.getkey_script, which a promoted standby needs to decrypt supabase_vault
  # after failover. The same volume lands on the primary and every standby, and
  # survives failover and a pg_rewind rejoin.
  #
  # extraVolumes are pod-level; extraVolumeMounts and extraEnv land on the postgresql
  # container. Validated at render time (see pg.validateExtraPassthrough): each must be
  # a LIST of objects, extraVolumes names may not collide with a chart-managed volume
  # (data, postgresql-config, postgresql-tls, ext-lib, ext-share, repmgr-config,
  # etcd-tls, pg-run, pgbackrest-config, service-updater-script), every
  # extraVolumeMounts entry must reference a declared extraVolumes entry, and extraEnv
  # may not reuse a chart-set env name (PGDATA, POSTGRES_*, REPMGR_*, ...) -- each of
  # those is a silent-shadowing or apply-time failure, so the chart fails the render.
  #
  # To actually load an extension from a mounted key, pair this with
  # postgresql.configuration, e.g. for pgsodium:
  #   postgresql.configuration:
  #     shared_preload_libraries: pgsodium
  #     pgsodium.getkey_script: /etc/postgresql/pgsodium/getkey.sh
  # In repmgr mode the chart merges `repmgr` into shared_preload_libraries for you (a
  # bare value there would otherwise override the image's preload and silently disable
  # failover), so declare only your own libraries.
  extraVolumes: []
    # - name: pgsodium-key
    #   secret:
    #     secretName: pgsodium-root-key
    #     defaultMode: 0400
    #     items:
    #       - key: pgsodium.key
    #         path: pgsodium.key
  extraVolumeMounts: []
    # - name: pgsodium-key
    #   mountPath: /etc/postgresql/pgsodium
    #   readOnly: true
  # Extra env vars for the postgresql container (supports value and valueFrom).
  extraEnv: []
    # - name: SOME_FLAG
    #   value: "1"

  # Client-connection TLS (#110). Off by default (no change to rendered manifests unless
  # enabled). When enabled, PostgreSQL serves ssl=on from the cert Secret (BYO, like the
  # etcd TLS block).
  # NOTE: replication between primary/standby stays plaintext on the pod network --
  # `require`/`clientCertAuth` never convert the `host replication` or loopback pg_hba
  # rules, and the chart's internal service users (repmgr, postgres, monitoring) are
  # exempted from the client-cert requirement so the agent/repmgr/exporter/pgpool keep
  # working. After rotating the Secret, `kubectl rollout restart` to reload the cert.
  tls:
    enabled: false
    # Secret with the SERVER cert material -- keys: tls.crt, tls.key, ca.crt. Required
    # when enabled. The certificate MUST list SANs for the write/readonly/pgpool
    # Services and the headless pod FQDNs that clients connect to. ca.crt is used only
    # under clientCertAuth (to verify client certs).
    existingSecret: ""
    # Reject non-TLS client connections on the pod network (pg_hba hostssl). Clients
    # must then use sslmode=require or stronger. When true, prometheusExporter.sslmode
    # and pgpool.tls.backendSslmode must be >= require (enforced by a render guard).
    require: false
    # Mutual TLS: app/other users must present a client cert signed by ca.crt
    # (clientcert=verify-ca). Internal service users are exempted. Implies require.
    clientCertAuth: false

  # pgaudit-based audit logging (#219) for compliance regimes (SOC 2, HIPAA, PCI-DSS,
  # ISO 27001) that require a per-object record of who did what. Off by default:
  # audit.enabled=false renders manifests identically to a chart with no audit block.
  #
  # Requires repmgr.enabled=true -- the cagriekin/repmgr image bundles the pgaudit
  # extension. Standalone mode (repmgr.enabled=false) uses the stock postgres image,
  # which has no pgaudit, so audit + standalone fails a render guard (a bare
  # shared_preload_libraries=pgaudit would crash-loop the postmaster). To audit in
  # standalone mode, supply a postgresql.image that ships pgaudit.
  #
  # shared_preload_libraries is a postmaster parameter: enabling audit triggers a
  # controlled rolling restart via the StatefulSet's config-checksum annotation. The
  # chart keeps repmgr in shared_preload_libraries (replication depends on it) and adds
  # pgaudit. pgaudit writes to the PostgreSQL server log (stderr -> `kubectl logs`);
  # tamper-evident retention is your platform's job -- ship the logs to Loki/ELK/
  # CloudWatch. Runtime `ALTER SYSTEM`/session GUC changes are NOT persisted; this
  # declarative config is the source of truth.
  audit:
    enabled: false
    # pgaudit session-logging classes (comma-separated): read, write, function, role,
    # ddl, misc, misc_set, all. Prefix a class with `-` to subtract from `all`
    # (e.g. "all, -misc"). Validated against the allowlist at render time.
    log: "ddl, role, write"
    # Include catalog (pg_catalog) statements. Off keeps the log free of routine
    # client/tooling metadata queries.
    logCatalog: false
    # Log statement parameter values. Off by default -- parameters can contain PII/
    # secrets; enable only when your log sink is access-controlled and retained safely.
    logParameter: false
    # Log the fully-qualified relation for each affected table in READ/WRITE.
    logRelation: false
    # Optional object-level auditing: the pgaudit.role GUC. Set to an existing role;
    # any object that role is GRANTed on is audited regardless of the class list.
    # Empty disables object auditing (session logging via `log` still applies).
    role: ""

  # When repmgr.enabled is true, re-hash any managed user (POSTGRES_USER,
  # REPMGR_USER) whose stored password is still MD5 to SCRAM at pod startup.
  # Idempotent (no-op once everyone is SCRAM-hashed, and auto-skipped on
  # PG < 14 since md5->scram pg_hba auto-promotion only exists in PG14+).
  # Set to false to keep existing MD5 hashes; the md5 fallback line that
  # the chart writes into pg_hba.conf will still let them authenticate.
  # Recommended: true on PG14+.
  migrateLegacyMd5Users: true

  # Declarative databases, roles, and grants (#218). Default-empty -> renders nothing
  # (the chart still provisions exactly the single database/username above). When set, a
  # post-install/upgrade hook Job idempotently creates them on the primary (replicated to
  # standbys), so a platform team can self-serve additional databases and least-privilege
  # roles as declared desired state -- re-applied on every upgrade and after a restore.
  # Passwords are sourced from Secrets (never the ConfigMap). Names must match
  # ^[A-Za-z_][A-Za-z0-9_]*$ and may not be a reserved/internal identifier
  # (postgres, repmgr, the monitoring user, the primary username, template0/1).
  roles: []
    # - name: app
    #   login: true                     # default true; set false for a NOLOGIN group role
    #   # Password source for a LOGIN role. Empty name => chart-generated and persisted in
    #   # the chart Secret under key "<name>-acl-password" (survives upgrades like the
    #   # primary password). Set name/key to read from your own pre-created Secret.
    #   # GitOps/render-only (ArgoCD): ALWAYS set an explicit passwordSecret.name -- under
    #   # `helm template` the lookup is empty, so a chart-generated password would
    #   # regenerate every sync and lock the role out.
    #   passwordSecret: { name: "", key: "" }
    #   # Memberships: roles this role is granted INTO (e.g. a group role). Validated names.
    #   memberOf: []
    #   # Grants. Each entry targets one database; `privileges` are GRANT keywords only
    #   # (allowlist-validated, never arbitrary SQL):
    #   #   no schema/objects  -> GRANT <privs> ON DATABASE <database>
    #   #   schema, no objects -> GRANT <privs> ON SCHEMA <schema> (in <database>)
    #   #   objects=ALL_TABLES|ALL_SEQUENCES -> GRANT on all existing + ALTER DEFAULT
    #   #     PRIVILEGES for future objects in <schema> (so later tables inherit it)
    #   grants:
    #     - { database: app, privileges: [CONNECT] }
    #     - { database: app, schema: public, privileges: [USAGE] }
    #     - { database: app, schema: public, objects: ALL_TABLES, privileges: [SELECT, INSERT, UPDATE, DELETE] }
  databases: []
    # - name: app
    #   owner: app          # optional; must be a role in roles[] or a pre-existing role
    #   extensions: []      # optional CREATE EXTENSION IF NOT EXISTS in this database

  extensions:
    enabled: false
    # Debian/PGDG package names to `apt-get install` into the copy-ext/copy-base-ext init
    # containers before the existing lib/share copy (#303), so an extension the donor
    # image never shipped (e.g. postgresql-<major>-cron) reaches the server without a
    # custom image. `{major}` is substituted with postgresql.majorVersion at render time,
    # so bumping the major doesn't require editing this list. Pin a version with apt's `=`
    # syntax, e.g. "postgresql-{major}-cron=1.6.4-1". Validated at render time
    # (pg.validateExtensionPackages) -- see README "Installing extensions without a
    # custom image" for a full pg_cron example, the PGDG apt-source assumption for a
    # non-default postgresql.image, and the NetworkPolicy egress this requires.
    packages: []
      # - "postgresql-{major}-cron"
    # Resources for the apt-get step, only rendered while packages is non-empty (the
    # plain-copy default path keeps using the shared, lighter pg.initResources). apt-get
    # update + install is a real package-manager run (repo metadata fetch + dependency
    # resolution + dpkg unpack), not a `cp`, so it gets its own, values-overridable
    # budget -- same precedent as repmgr.initContainerResources for the standby-clone
    # init container.
    installResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  lifecycle:
    postStart:
      additionalCommands: ""

repmgr:
  image:
    repository: cagriekin/repmgr
    tag: trixie-5.5.0-31
    # Optional digest pin (e.g. "sha256:..."). When set it is appended as
    # repository:tag@digest, so the cosign-signed / provenance-attested image is
    # pinned at deploy time and a mutable-tag repush cannot silently change it.
    # Empty = pull by tag only. Refresh with: docker buildx imagetools inspect <ref>
    digest: ""
    pullPolicy: IfNotPresent
    # PostgreSQL major version bundled in the repmgr image. The image ships
    # exactly one PG major and always runs that server, so in repmgr mode the
    # cluster runs this version regardless of postgresql.image. The chart fails
    # at render time unless postgresql.majorVersion matches this. Bump this and
    # tag together when moving to a repmgr image built for a new PG major.
    #
    # The image is published per major (#269): the tag above (unsuffixed) is
    # PostgreSQL 18, and <tag>-pg18 / <tag>-pg17 select one explicitly. To run
    # PostgreSQL 17, set BOTH majorVersion values to "17" and tag to
    # <tag>-pg17 -- see pg/README.md "Choosing the PostgreSQL major".
    majorVersion: "18"

  enabled: true

  # Failover mode:
  #   agent (default)   — the lease-based Go agent (PID 1) drives failover
  #   repmgrd           — repmgrd sidecar + service-updater (the original path)
  # Default since chart v1.0.0 (was repmgrd through 0.x). Pin failoverMode: repmgrd
  # to stay on the legacy path for one major cycle (deprecated).
  failoverMode: agent

  # Lease-based agent (failoverMode: agent) tunables. Defaults suit a stable
  # control plane; raise for managed clouds (e.g. 30s/20s/4s) so brief apiserver
  # blips do not trip an unnecessary demote.
  agent:
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
    reconcileInterval: 5s
    # Cascading replication (#29). Off by default: every standby streams from the
    # primary. When true, a standby may instead follow another standby (a chain by
    # pod ordinal toward the primary) to offload the primary's WAL senders on larger
    # clusters. The agent only picks a verifiably-safe same-timeline upstream and
    # falls back to the primary otherwise, and re-homes on failover -- a broken or
    # promoted upstream never strands a standby. Most useful at higher replicaCount.
    cascadingReplication: false
    # Leadership store (DCS). "kubernetes" (default) holds the leader Lease in the
    # apiserver. "etcd" holds it in etcd instead, so a Kubernetes control-plane
    # outage no longer self-demotes the primary (only an etcd quorum loss does);
    # routing still needs the apiserver but only at failover time. With etcd,
    # leaseDuration must be >= 5s (the etcd lease TTL is whole seconds).
    dcs:
      backend: kubernetes # kubernetes | etcd
      etcd:
        # BYO/shared etcd: point at an existing cluster (recommended when running
        # several databases -- one platform etcd, ~0 marginal cost per DB). A bundled
        # etcd subchart is a separate, later option.
        endpoints: [] # e.g. ["https://etcd-0.etcd:2379","https://etcd-1.etcd:2379"]
        # Election key prefix; defaults to /pg-ha/<release>/ when empty.
        prefix: ""
        tls:
          # Optional mutual TLS. Set to a Secret carrying ALL THREE keys: tls.crt,
          # tls.key, ca.crt. cert-manager Certificates include ca.crt, but a stock
          # `kubectl create secret tls` does NOT -- add ca.crt explicitly or the agent
          # fails fast at boot (it reads all three). Empty = plaintext.
          secretName: ""
    # The pod-network CIDR the agent trusts in the hardened (SCRAM-only) pg_hba it
    # assembles in agent mode: loopback + this CIDR over SCRAM, with NO legacy
    # 0.0.0.0/0 md5 catch-all (agent mode is secure by construction). Set this to
    # your cluster's pod CIDR if it is outside 10.0.0.0/8, or replication/clients on
    # the pod network are refused. Add explicit `postgresql.pgHba` rules for any
    # access from outside the pod network.
    podCidr: 10.0.0.0/8
    # Monitoring for the agent's read-only metrics on port 9200 (agent mode only).
    # Both require the Prometheus Operator CRDs (same as prometheusExporter).
    monitoring:
      serviceMonitor:
        enabled: false
        interval: 30s
        scrapeTimeout: 10s
        additionalLabels: {}
      # Example alert rules over the agent metrics (no-leader, split-brain,
      # renew-failure, reconcile-error, flapping, agent-down, paused-too-long).
      prometheusRule:
        enabled: false
        additionalLabels: {}

    # Authenticated control REST API (#276), agent mode only. OFF by default: with
    # control.enabled=false the chart renders exactly as it did before, and port 9200
    # stays the agent's only listener (read-only: /metrics, /healthz, /readyz).
    #
    # What it adds over `kubectl annotate` is PREFLIGHT and a synchronous answer.
    # `kubectl annotate ... switchover-target=pg-9` succeeds even when pg-9 does not
    # exist, is on a divergent timeline, or is far behind, and you find out by reading
    # logs; POST /v1/switchover refuses those in the request. GET /v1/status and
    # /v1/cluster additionally expose state that exists nowhere else -- per-member
    # timeline/LSN, and the reconcile loop's latest decision with its reason.
    #
    # It is a FACADE, not a second control plane: pause/switchover write the same
    # marker annotations kubectl writes, and the reconcile loop stays the sole
    # authority for when anything happens. kubectl and the API remain equivalent.
    #
    # The API is per-pod on the headless Service (or `kubectl port-forward`). There is
    # deliberately NO ClusterIP Service: node-local verbs (restart, reload, restore)
    # act on whichever pod answers, and a load-balanced control endpoint would
    # eventually restart the primary during an incident. Requests must name the pod
    # they are addressing, so a misrouted call is refused rather than obeyed.
    control:
      enabled: false
      # Control-only listener. NEVER the metrics port: 9200 stays observe-only so a
      # NetworkPolicy can admit Prometheus there and nobody here.
      port: 9201
      # mTLS is mandatory and is the ONLY authentication mode -- there is no token,
      # password or plaintext mode, and reads are authenticated too. Set this to a
      # Secret carrying ALL THREE keys: tls.crt, tls.key (the server identity) and
      # ca.crt (the CA that signs client certificates). cert-manager Certificates
      # include ca.crt; a stock `kubectl create secret tls` does NOT -- add it
      # explicitly. Required when enabled: a render guard fails the release without it,
      # so you cannot end up with an unauthenticated mutating port.
      #
      # The server certificate needs SANs for however you reach the pods -- the
      # headless pod FQDNs (<release>-pg-0.<release>-pg-headless.<ns>.svc) for in-cluster
      # clients, and 127.0.0.1/localhost if you use port-forward. TLS 1.3 is required.
      tls:
        existingSecret: ""
      # Optional client-CN allowlist for every control route. Empty means "any
      # certificate signed by ca.crt", which is already a closed set (you issue them).
      # Set it to restrict further, e.g. ["ops-admin","ci-deployer"].
      #
      # NOTE: this gates EVERY route, so it composes with restore.allowedClientCNs below
      # rather than being an alternative to it -- when both are set, a restore client must
      # appear in BOTH lists. A 403 names whichever list refused the call.
      allowedClientCNs: []
      # Restore triggering (POST /v1/restore) is a SEPARATE opt-in, because it is the
      # one verb that widens the database pods' Kubernetes privileges: it needs
      # `create jobs`, which RBAC cannot restrict by resourceName. A leaked pod token
      # could then create arbitrary Jobs in this namespace, and a Job's pod may name
      # any ServiceAccount -- i.e. this grant is a namespace-wide privilege-escalation
      # primitive. Everything else about the API needs no new RBAC at all.
      #
      # What the API can and cannot do here: it clones the chart's suspended restore
      # CronJob verbatim -- identical to `kubectl create job --from=cronjob/...`, so
      # image, ServiceAccount, security contexts, volumes and secret references all
      # come from the release -- and overrides only TARGET_TYPE / TARGET / BACKUP_SET.
      # It cannot change which volume is restored into (that is
      # pgbackrest.restore.podOrdinal, rendered into the Job) and it never sets
      # pgbackrest's --force. It also cannot scale the StatefulSet: scaling to 0
      # deletes every agent, including the one reporting progress, so scale-down/up
      # stays an operator step and the API returns the remaining commands. Whether a
      # scale-down is needed at all depends on scheduling -- ReadWriteOnce binds the volume
      # to a NODE, not a pod, so a Job co-scheduled with the target pod starts at once.
      # What keeps the restore off a live PGDATA is the required pause plus the postmaster
      # stop, not the scale-down. With standbys, scale down regardless: they must not
      # stream from a primary being rewritten underneath them.
      #
      # Requires pgbackrest.enabled, pgbackrest.restore.enabled and
      # pgbackrest.restore.mode=cronjob (there must be a CronJob to clone).
      restore:
        enabled: false
        # The restore authz verb, an EXTRA lock on top of allowedClientCNs above (not a
        # replacement): when that list is non-empty a restore client must be on both.
        # Required when restore.enabled -- an empty list denies everyone, so forgetting
        # it cannot open the most destructive verb in the API.
        allowedClientCNs: []
        # The bound on the `create jobs` grant above (#279). RBAC restricts by VERB and
        # RESOURCE; this restricts by CONTENT, which is the primitive RBAC does not have --
        # so with it on, "create arbitrary Jobs in this namespace" becomes "create this one
        # restore Job, as this release's ServiceAccount, with this release's volumes".
        #
        # A ValidatingAdmissionPolicy + binding, both CLUSTER-SCOPED objects: in-tree and
        # GA since Kubernetes 1.30, so no webhook, no serving certificate and nothing that
        # can be down. It polices ONLY this release's ServiceAccount -- humans, GitOps
        # controllers and every other workload create Jobs untouched.
        #
        # What it checks: the Job's name (the deterministic one the agent uses, which is the
        # resourceName restriction RBAC refused to give), its pg-ha/restore label, its
        # ServiceAccount, automountServiceAccountToken=false, no host namespaces, no
        # explicit nodeName and only this release's priorityClassName (a higher-priority class
        # would let the scheduler preempt this release's own pods), the pod's own labels (so
        # the restore pod cannot join this release's Service endpoints), no manualSelector, one
        # container running this release's image and this release's restore command with no
        # args and no lifecycle hooks, this release's
        # pod and container security contexts (so no privileged / root / added-capability
        # container), CPU and memory requests and limits, a single pod (parallelism and
        # completions <= 1), volumes limited to the three the restore template renders, and
        # no envFrom / no valueFrom beyond the downward API and this release's own Secrets.
        #
        # What it does NOT bound, because a restore cannot be expressed without it: the
        # restore PARAMETERS. Anything holding the token can still run this release's own
        # restore against a target of its choosing, over the live PGDATA, without passing
        # the control API's mTLS. That is the operation the feature exposes; see the
        # "Bounding the job-create grant" section of README.md before enabling it on a
        # cluster running untrusted SQL.
        #
        # Three consequences worth knowing before you install:
        #   * The installing identity needs cluster-scoped create on
        #     admissionregistration.k8s.io ValidatingAdmissionPolicy/-Binding. A namespace-
        #     limited installer cannot render this (see acknowledgeUnbounded below).
        #   * Kubernetes >= 1.30 is required, and the render FAILS when the cluster does not
        #     expose admissionregistration.k8s.io/v1 rather than letting the apply fail
        #     halfway. The check is on the API group, not the reported version: with no
        #     cluster, .Capabilities.KubeVersion is the helm CLIENT's own version.
        #   * A cluster whose mutating admission rewrites JOB objects (not pod specs --
        #     sidecar injectors act on Pods and are unaffected) can make the rendered Job
        #     stop matching, which shows up as a denial naming the exact field.
        admissionPolicy:
          enabled: true
          # The escape hatch, and it is deliberately awkward: with admissionPolicy.enabled
          # false the RENDER FAILS unless this is also true. Turning the bound off silently
          # would leave the Role carrying a namespace-wide privilege-escalation primitive
          # with nothing recording that anyone chose that -- which is the exact shape #279
          # set out to remove. Set both only when you mean it:
          #   * the cluster is below Kubernetes 1.30;
          #   * you install the policy out of band (a namespace-limited installer, or one
          #     cluster-wide policy managed by the platform team);
          #   * or you accept the unbounded grant, as 1.9.0 required everyone to.
          acknowledgeUnbounded: false
        # Live file-copy progress (progress.percent on GET /v1/restore) by tailing the
        # restore pod's log. Off by default because it needs `get pods/log` across the
        # namespace -- the Job's pod name is generated, so it cannot be scoped -- and
        # logs are where other workloads leak secrets.
        #
        # It is also of limited use: a restore of podOrdinal 0 requires scaling the
        # StatefulSet to 0, which removes every agent, so nothing can serve progress
        # while the copy runs. The progress that IS always available needs none of
        # this: GET /v1/status reports WAL-replay position and the last replayed
        # transaction timestamp after scale-up, and lastRestore reports the outcome.
        readPodLogs: false

  username: repmgr
  database: repmgr

  # Days of repmgr.monitoring_history to retain. repmgr 5.x has no conf-based retention,
  # so the table is pruned once per day on the primary via `repmgr cluster cleanup
  # --keep-history`. Only applies in failoverMode: repmgrd; agent mode runs no repmgrd
  # and writes no monitoring_history.
  monitoringHistoryDays: 7

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Resources for the repmgr-init init container, which runs `repmgr standby clone`
  # (a full pg_basebackup of the database) -- heavier than the other init containers,
  # so it is overridable here (#153). Raise the limits for large databases.
  initContainerResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

  terminationGracePeriodSeconds: 120

  splitBrainDetection:
    action: log

  serviceUpdater:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

pgpool:
  enabled: false

  image:
    repository: cagriekin/pgpool
    tag: 4.7.1
    digest: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Startup command override for the pgpool container. Empty uses the chart default,
  # which reaps SysV shmem/semaphores orphaned by a prior OOM-killed pgpool
  # (`ipcrm -a`) before exec'ing pgpool -- without this, orphaned segments pile up
  # in the pod's IPC namespace across container restarts until the pod cgroup fills
  # and wedges in a crash loop (#234). Override only if you need a custom startup
  # sequence; keep the ipcrm reap and `exec` so pgpool still receives SIGTERM.
  command: []

  numInitChildren: 32
  maxPool: 4
  childLifeTime: 300
  connectionLifeTime: 600
  clientIdleLimit: 300

  resetQueryList: "ABORT; RESET ALL; DEALLOCATE ALL"

  tcpKeepalive:
    idle: 10
    interval: 3
    count: 5

  healthCheck:
    period: 10
    timeout: 30
    maxRetries: 10
    retryDelay: 3

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  failOverOnBackendError: false
  autoFailback: true
  allowClearTextFrontendAuth: false

  # PGPool TLS (#110). Off by default. `enabled` serves frontend TLS (clients->pgpool);
  # backendSslmode controls pgpool->PostgreSQL (libpq, via PGSSLMODE). Under PostgreSQL
  # mTLS, set backendClientCert so pgpool can present a client cert to the backends.
  tls:
    enabled: false
    existingSecret: ""        # frontend SERVER cert: tls.crt, tls.key[, ca.crt]
    clientCertAuth: false     # validate a client cert IF the frontend client presents one
                              # (sets ssl_ca_cert; needs ca.crt). pool_hba still authenticates
                              # by password -- it does not by itself REQUIRE a client cert.
    backendSslmode: prefer    # pgpool -> postgres: disable|prefer|require|verify-ca|verify-full
    backendClientCert: ""     # Secret (tls.crt, tls.key[, ca.crt]) for pgpool->postgres under mTLS

  logging:
    logConnections: true
    logStatement: false
    logPerNodeStatement: false
    logMinMessages: warning

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # PCP (pgpool admin) credentials. Rendered into a chart-managed Secret
  # unless existingSecret.enabled selects a pre-created Secret instead.
  admin:
    username: admin
    password: admin
    existingSecret:
      enabled: false
      name: ""
      usernameKey: username
      passwordKey: password

  service:
    type: ClusterIP
    port: 9999
    # Expose the PgPool-II PCP admin port (9898) on the Service. Off by default: PCP is
    # an admin/control endpoint that was reachable cluster-wide with no NetworkPolicy
    # rule admitting it (the pgpool NetworkPolicy only admits 9999) (#118). Enable only
    # if you run pcp_* commands against the Service, and pair it with a
    # pgpool.extraIngress rule for 9898 when NetworkPolicy is enabled.
    exposePcp: false

  affinity: {}

  nodeSelector: {}

  tolerations: []

  priorityClassName: ""

  podAnnotations: {}

  topologySpreadConstraints: []

  metrics:
    enabled: false
    image:
      repository: pgpool/pgpool2_exporter
      tag: "1.2.2"
      digest: ""
      pullPolicy: IfNotPresent
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  podDisruptionBudget:
    enabled: true
    # maxUnavailable (not minAvailable) so a single-replica pgpool can still be evicted
    # during a node drain / upgrade / autoscaler scale-down (minAvailable: 1 with
    # replicaCount: 1 leaves zero allowed disruptions forever and wedges drains, #161),
    # while a multi-replica pgpool keeps rolling protection (at most one pod down).
    # pgpool is stateless, so an eviction simply reschedules. Mirrors the postgresql PDB.
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
    minAvailable: null

prometheusExporter:
  enabled: false

  # sslmode for the exporter's connection to PostgreSQL (#110): disable | require |
  # verify-ca | verify-full. Default disable (no change to the rendered exporter unless
  # set). When postgresql.tls.require (or clientCertAuth) is true this must be >= require
  # (a render guard enforces it), since
  # the server then rejects non-TLS. verify-* additionally validates the server cert
  # against ca.crt from postgresql.tls.existingSecret (mounted into the exporter). The
  # exporter connects as the monitoring user, exempt from client-cert auth under mTLS.
  # NOTE: the exporter scrapes each pod at its SHORT headless name
  # (<release>-pg-<i>.<release>-pg-headless), so verify-full needs those short names in the
  # cert SANs; verify-ca (recommended here) verifies the chain without the hostname check.
  sslmode: disable

  # Least-privilege monitoring user (#28). When enabled, a post-install/upgrade
  # hook Job creates a read-only `pg_monitor` role on the primary (replicated to
  # standbys) and the exporter connects as it instead of the postgres superuser.
  # Disable to fall back to the superuser. With postgresql.existingSecret.enabled,
  # the existing secret must also carry a `monitoring-password` key.
  monitoringUser:
    enabled: true
    username: monitoring

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    # The exporter reads config/DSN from mounted volumes and writes nothing to the
    # root filesystem (a /tmp emptyDir is mounted for scratch). #117
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.19.1
    digest: ""
    pullPolicy: IfNotPresent

  priorityClassName: ""

  podAnnotations: {}

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 9116
    annotations: {}

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

service:
  type: ClusterIP
  port: 5432

backup:
  enabled: false
  schedule: "0 2 * * *"
  s3:
    endpoint: ""
    bucket: ""
    prefix: "backups"
  existingSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  mc:
    image:
      repository: minio/mc
      tag: RELEASE.2024-11-21T17-21-54Z
      digest: ""
      pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    # 999 is the postgres uid/gid in the official postgres image. fsGroup lets the
    # backup-validation Job's uid-999 process write the throwaway PGDATA on its
    # emptyDir (the writer job does not need it, but it is harmless there).
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  # 999 is the postgres uid/gid in the official postgres image; the kubelet
  # rejects root-defaulting images under runAsNonRoot without an explicit uid
  containerSecurityContext:
    # The backup/validation containers write only to mounted volumes (/tools, /work)
    # and /tmp (a /tmp emptyDir is mounted, incl. MC_CONFIG_DIR=/tmp/.mc). #117
    readOnlyRootFilesystem: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  retentionDays: 7
  priorityClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Opt-in weekly restore test (#31): downloads the latest pg_dump backup and
  # restores it into a throwaway PostgreSQL inside the Job pod (never the live
  # database), failing the Job if pg_restore errors -- so an unrestorable or
  # corrupt backup raises an alert. The validation container runs initdb/postgres
  # as the postgres uid, reusing postgresql.podSecurityContext /
  # containerSecurityContext.
  validation:
    enabled: false
    schedule: "0 3 * * 0"
    # emptyDir sizeLimit for the throwaway PGDATA + the downloaded dump. Must
    # exceed the restored database size; empty = unbounded (node disk bounds it).
    workdirSizeLimit: ""
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

pgbackrest:
  enabled: false
  stanza: db

  s3:
    endpoint: ""
    bucket: ""
    region: "us-east-1"
    prefix: "pgbackrest"
    # shared = static access/secret key from existingSecret (default).
    # auto    = cloud workload identity / instance credential chain (IRSA, GKE WI,
    #           EC2 instance profile); no existingSecret -- annotate the pod SA via
    #           postgresql.serviceAccount.annotations instead.
    keyType: shared
    # Addressing + TLS for S3-compatible stores that are not AWS (MinIO, Ceph RGW,
    # on-prem gateways). Defaults match AWS, so these render nothing for AWS users.
    #   uriStyle: host (AWS virtual-host style, default) | path (most other stores).
    #   verifyTls: false to accept a self-signed / internal-CA endpoint.
    uriStyle: host
    verifyTls: true

  existingSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

  # Encrypt the pgBackRest repository at rest in S3 (#120). Off by default
  # (repo1-cipher-type=none). When enabled, the passphrase is supplied to
  # pgbackrest via the PGBACKREST_REPO1_CIPHER_PASS env from an existingSecret --
  # never written into the ConfigMap. The passphrase is fixed for the life of the
  # repository: changing it cannot decrypt existing backups (create a new stanza).
  repoEncryption:
    enabled: false
    cipherType: aes-256-cbc
    existingSecret:
      name: ""
      passphraseKey: cipher-pass

  retention:
    full: 4
    diff: 14

  schedule:
    full: "0 1 * * 0"
    diff: "0 1 * * 1-6"

  # Sidecar container: keeps pgbackrest binary, config and credentials available
  # on every pg pod. CronJobs locate the current primary and `kubectl exec` into
  # this container to run the backup. The sidecar itself just sleeps.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # CronJob runner: schedules backups via Kubernetes-native CronJobs. Each job
  # finds the current primary via the headless primary service endpoints
  # (kept fresh by the service-updater sidecar) and execs into the pgbackrest
  # sidecar to perform the backup. Failover is handled automatically because
  # the primary is resolved at job-fire time.
  cronjob:
    image:
      repository: alpine/k8s
      tag: "1.31.3"
      digest: ""
      pullPolicy: IfNotPresent
    concurrencyPolicy: Forbid
    backoffLimit: 0
    activeDeadlineSeconds: 21600  # 6 hours
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    priorityClassName: ""
    # Hardened by default so the CronJob (which holds the exec-capable pgbackrest SA
    # token) matches the chart's other pods and passes restricted Pod Security (#155).
    # alpine/k8s runs kubectl fine as a non-root uid.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      # The runner only execs kubectl (HOME=/tmp for its cache) and writes /tmp,
      # which is a mounted emptyDir. #117
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Automated PITR restore-validation (#38). Opt-in CronJob that restores the pgBackRest
  # repository into a THROWAWAY PostgreSQL inside the Job pod (never the live cluster),
  # replays archived WAL to a consistent state, runs a sanity query, and exits -- so an
  # unrestorable or corrupt repository raises an alert instead of being discovered during
  # a real disaster. Read-only against S3; the throwaway PGDATA lives on an emptyDir
  # discarded when the pod ends. Runs from the repmgr image (pgbackrest + matching PG
  # major) as the postgresql pods' ServiceAccount (so s3.keyType=auto works), with its
  # token unmounted (it never calls the Kubernetes API).
  validation:
    enabled: false
    # Default offset from the backup schedules (full Sun 1am, diff 1am): validate weekly.
    schedule: "0 4 * * 0"
    # PITR target. Empty (default) restores the latest backup set and replays all archived
    # WAL to the end of the stream. To validate recovery to a specific point, set both:
    #   targetType: time   target: "2026-06-26 03:00:00+00"
    # targetType is one of: "" (latest) | time | xid | name | lsn (pgbackrest --type).
    targetType: ""
    target: ""
    # Seconds pg_ctl waits for WAL replay + promotion before failing the Job. Raise for
    # large databases / long WAL chains.
    recoveryTimeout: 1800
    # emptyDir sizeLimit for the throwaway restored PGDATA (+ replayed WAL). Must exceed
    # the restored database size; empty = bounded by node disk.
    workdirSizeLimit: ""
    activeDeadlineSeconds: 3600
    backoffLimit: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # First-class PITR restore (#226). Opt-in, and unlike `validation` above this restores
  # over the LIVE data directory of replica 0 -- it exists so a real disaster recovery is a
  # `kubectl create job` instead of a hand-built `kubectl run --overrides` pod spec. The
  # resource carries everything a restore needs (repmgr SA for s3.keyType=auto, postgresql
  # security contexts, the data PVC + pgbackrest ConfigMap mounts, S3 / repo-encryption
  # credentials) and runs `pgbackrest restore --delta`; it never starts postgres, so WAL
  # replay + promotion happen when you scale the StatefulSet back up.
  #
  # Enabling this renders an INERT resource -- a suspended CronJob, or a Job you render on
  # demand -- it does not restore anything by itself. The destructive scale down/up stays
  # an explicit operator action. See the README, "Point-in-Time Recovery".
  restore:
    enabled: false
    # How the restore is delivered:
    #   cronjob (default) -- a suspended CronJob to clone on demand:
    #       kubectl create job --from=cronjob/<fullname>-pgbackrest-restore restore-now
    #     The resource belongs to the release, so GitOps/ArgoCD sees no stray object; a
    #     point-in-time target has to be set in values (helm upgrade) before cloning.
    #   job -- a bare Job, for rendering one off with the target passed inline:
    #       helm template <release> <chart> -f <release-values> \
    #         --set pgbackrest.restore.enabled=true --set pgbackrest.restore.mode=job \
    #         -s templates/pgbackrest-restore-job.yaml | kubectl apply -f -
    #     Nothing is baked into the release, but the object is not release-managed either
    #     (ArgoCD may report/prune it), and Jobs are immutable -- see nameSuffix.
    mode: cronjob
    # PITR target. Empty (default) restores the latest backup set and replays all archived
    # WAL to the end of the stream (the disaster-recovery case). For a point in time set:
    #   targetType: time   target: "2026-03-22 12:00:00+00"
    # targetType is one of: "" (latest) | time | xid | name | lsn (pgbackrest --type).
    # A target always implies --target-action=promote.
    targetType: ""
    target: ""
    # pgbackrest --set: restore a SPECIFIC backup set (label from `pgbackrest info`, e.g.
    # "20260322-010002F") instead of the latest. Empty = latest.
    backupSet: ""
    # pgbackrest --force: restore even though $PGDATA/postmaster.pid exists. Needed only
    # when the cluster crashed and left a stale pid file behind -- pgbackrest otherwise
    # refuses to restore over what may be a running cluster, which is the safety interlock
    # that lets this Job run with no Kubernetes API access at all. Leave false unless you
    # have confirmed every postgresql pod is gone.
    force: false
    # Ordinal of the replica whose PVC (data-<fullname>-<ordinal>) is restored into.
    # Leave 0: replica 0 becomes the restored primary and repmgr re-clones the standbys.
    podOrdinal: 0
    # mode: job only -- appended to the Job name so a second attempt does not collide with
    # the completed first one (Jobs are immutable). Ignored in cronjob mode, where the name
    # must stay stable for `kubectl create job --from`.
    nameSuffix: ""
    # Generous by default: a real restore moves the whole database over the network. The
    # Job is killed at this deadline even mid-restore (rerun it; --delta resumes cheaply).
    activeDeadlineSeconds: 21600  # 6 hours
    # 0 = one pod attempt. A failed restore leaves PGDATA half-written, so an automatic
    # retry would race the operator's diagnosis -- and failures surface immediately.
    backoffLimit: 0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Bootstrap-from-backup (#266). Opt-in. Seeds an EMPTY data directory on replica 0 from this
  # release's own pgBackRest repository, via an init container that runs before repmgr-init.
  # The case it exists for: replica 0 loses its PVC (node failure, accidental delete, a storage
  # class that reclaims). Without this, the entrypoint sees an empty PGDATA and initdb's a
  # BRAND NEW EMPTY cluster -- the backups are intact in S3, but the running database is empty
  # until someone notices. With it, the pod restores from S3 and replays the archived WAL on
  # startup, with no operator action at all.
  #
  # Distinct from `restore` above, and safe to leave enabled:
  #   restore   -- restores OVER a live data directory. Destructive, so it is operator-driven
  #                (scale to 0, run the Job, scale up) and never automatic.
  #   bootstrap -- only ever populates an EMPTY data directory. It refuses to touch an
  #                initialized one, so an ordinary restart, rollout or re-schedule can never
  #                re-restore over a running cluster.
  # Only replica 0 bootstraps; standbys are cloned from it by repmgr as usual.
  bootstrap:
    enabled: false
    # PITR target for the bootstrap. Empty (default) restores the latest backup set and replays
    # all archived WAL -- what you want for recovering a lost replica. To pin a point in time:
    #   targetType: time   target: "2026-03-22 12:00:00+00"
    # targetType is one of: "" (latest) | time | xid | name | lsn (pgbackrest --type).
    # NOTE a target is applied on EVERY fresh bootstrap of this release, not once -- leave both
    # empty unless you deliberately want every rebuilt replica 0 pinned to that point.
    targetType: ""
    target: ""
    # pgbackrest --set: bootstrap from a SPECIFIC backup set label instead of the latest.
    backupSet: ""
    # The init container restores the whole database over the network, so give it room; the pod
    # stays in Init until it finishes (there is no Job deadline to tune here).
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

networkPolicy:
  enabled: false
  postgresql:
    # Gates DIRECT client access to PostgreSQL on 5432 from any same-namespace pod.
    # The <fullname>-readonly Service connects clients directly to standbys on 5432,
    # so allowExternal=false blocks the read-only path (PGPool on 9999 stays reachable,
    # so read-write clients via PGPool are unaffected). To keep direct-5432 clients
    # working under allowExternal=false, add a scoped extraIngress rule for them
    # (see README "allowExternal: false and the read-only Service").
    allowExternal: true
    extraIngress: []
    extraEgress: []
  pgpool:
    extraIngress: []
    extraEgress: []
  prometheusExporter:
    # The exporter's 9116 metrics ingress admits same-namespace pods only, so a
    # Prometheus in a separate monitoring namespace (the usual ServiceMonitor topology)
    # cannot scrape. Add an extraIngress rule with a namespaceSelector for the scraper:
    #   extraIngress:
    #     - ports: [{port: 9116, protocol: TCP}]
    #       from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
    extraIngress: []
    extraEgress: []
  # The agent control API port (repmgr.agent.control.port, default 9201) gets NO
  # ingress rule of its own: this policy is an explicit allowlist, so the absence of a
  # rule IS deny-by-default -- unlike the 9200 metrics port, which admits every
  # same-namespace pod so scrapes work. Nothing can reach the control port until you
  # add a rule here for the specific client:
  #   extraIngress:
  #     - ports: [{port: 9201, protocol: TCP}]
  #       from: [{podSelector: {matchLabels: {app.kubernetes.io/name: my-ops-tool}}}]
  # `kubectl port-forward` reaches the pod through the kubelet rather than the pod
  # network, so on most CNIs it keeps working under full deny -- which is the intended
  # path for humans.
  agentControl:
    extraIngress: []

global:
  annotations: {}

# Bundled etcd subchart (conditional dependency). Turn on ONLY for a self-contained
# install that has no external etcd: set both repmgr.agent.dcs.backend=etcd AND
# etcd.enabled=true; the agent then auto-targets the bundled <release>-etcd:2379
# (leave repmgr.agent.dcs.etcd.endpoints empty). For several databases, prefer one
# shared/BYO etcd (set endpoints, leave etcd.enabled=false). See the etcd subchart's
# values for tuning (replicaCount, resources, persistence). Adds 3 stateful pods.
etcd:
  enabled: false
  # The bundled etcd's RBAC-bootstrap Job runs the pg-ha-agent (repmgr) image, so keep
  # this in lockstep with repmgr.image.tag above; the subchart's own default can lag.
  # The subchart reads it at rbac.bootstrapImage -- a top-level etcd.bootstrapImage is
  # silently ignored, which left the Job on the subchart's older default (#269 review).
  rbac:
    bootstrapImage:
      tag: trixie-5.5.0-31
