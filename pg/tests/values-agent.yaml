postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

repmgr:
  # NO image pin (#293). This fixture used to pin trixie-5.5.0-27, six releases behind the
  # chart default. CI is unaffected -- set-pg-major.sh rewrites every fixture's repmgr tag to
  # the chart's own before any suite runs, so CI always tested the freshly built image -- but
  # a LOCAL run does not go through that script, so `make -C pg test-agent-rolling` silently
  # pulled a stale RELEASED image and asserted agent behaviour against last quarter's agent.
  # That is exactly how this suite's #293 assertions would have passed while testing nothing.
  # Inheriting the chart default keeps the local and CI subject the same image.
  enabled: true

  username: repmgr
  database: repmgr

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
