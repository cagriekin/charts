postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

repmgr:
  # No image pin on purpose. This suite exercises the image's own bootstrap shell
  # (init-repmgr.sh / entrypoint.sh), which only makes sense against the image CI built
  # from source, so inherit the tag from pg/values.yaml rather than naming one here.
  #
  # The pin was redundant rather than harmful: pg/tests/set-pg-major.sh globs every
  # pg/tests/values-*.yaml and rewrites the repmgr tag from pg/values.yaml before each
  # suite leg runs, so CI resolved the freshly-built tag whatever this file said. Dropping
  # it removes a value that had to be hand-bumped to stay honest.
  #
  # Local runs that skip set-pg-major.sh now resolve pg/values.yaml's tag, which is a
  # PUBLISHED image -- so a stage testing an unreleased image-shell change fails locally
  # until that tag is published. Run set-pg-major.sh (or build and pin by hand) to
  # exercise those against a locally built image.

  enabled: true
  failoverMode: agent

  username: repmgr
  database: repmgr

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
