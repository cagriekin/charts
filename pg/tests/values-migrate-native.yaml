# Fixture for test-migrate-native.sh (#292): the in-place migration of a LIVE repmgr-shaped
# cluster to the native mechanism, with no re-clone.
#
# Deliberately spelled `repmgr:`, not `ha:`. This one file is passed to BOTH the released 1.x
# chart and the local 2.0.0 chart, and 1.x has never heard of `ha:` -- so the old spelling is
# the only one both accept. That makes the suite live coverage of #291's alias on a real
# cluster as a side effect, which is worth having: every other KinD fixture except
# values-agent.yaml is on the alias, but none of them proves it survives a chart UPGRADE.
#
# No image pin here. The suite sets the image per phase: an older RELEASED tag for the 1.x
# install (it must contain repmgr, which the #290 image does not), then the chart's own pin
# for the upgrade. Pinning here instead would put the tag under set-pg-major.sh's rewrite,
# which is exactly wrong -- the "from" image has to stay an older published one.
postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  # Three nodes: the migration's order-of-operations claim (standbys first, primary last, one
  # at a time) is only meaningful with more than one standby, and a 2-pod cluster cannot show
  # a standby re-homing while another is still on the old image.
  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistence is the whole point: the repmgr state this migration has to survive lives in
  # PGDATA, so an emptyDir would make the suite assert nothing.
  persistence:
    enabled: true
    storageClass: standard
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

repmgr:
  enabled: true
  username: repmgr
  database: repmgr
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
