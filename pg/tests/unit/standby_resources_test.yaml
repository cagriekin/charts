suite: pg standbyResources (#386)
release:
  name: test-pg
templates:
  - templates/statefulset.yaml
capabilities:
  majorVersion: 1
  minorVersion: 35
tests:
  # The template carries the STANDBY size: every pod the controller creates starts small,
  # and only the elected primary's agent raises its own pod in place.
  - it: the postgresql container renders the standby size with resizePolicy NotRequired
    set:
      postgresql.standbyResources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "postgresql")].resources.limits.memory
          value: 512Mi
      - contains:
          path: spec.template.spec.containers[?(@.name == "postgresql")].resizePolicy
          content: {resourceName: memory, restartPolicy: NotRequired}
      - contains:
          path: spec.template.spec.containers[?(@.name == "postgresql")].env
          any: true
          content:
            name: PG_HA_RESIZE
  - it: a standby size without a memory limit fails the render
    set:
      postgresql.standbyResources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m}
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.standbyResources\.limits\.memory is missing'
  - it: a cluster older than Kubernetes 1.33 fails the render
    capabilities:
      majorVersion: 1
      minorVersion: 32
    set:
      postgresql.standbyResources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    asserts:
      - failedTemplate:
          errorPattern: 'need Kubernetes 1\.33 or later'
