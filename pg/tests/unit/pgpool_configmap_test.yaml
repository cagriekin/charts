suite: pgpool ConfigMap backend topology
release:
  name: test-pg
templates:
  - templates/pgpool-configmap.yaml
tests:
  # --- agent mode WITH standbys: RW (weight 0) + RO (weight 1) ---
  - it: agent mode with standbys emits both RW and RO backends
    values:
      - ../values-agent-pgpool.yaml
    set:
      postgresql.replicaCount: 2
    asserts:
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_hostname0 = 'test-pg\.
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_weight0 = 0
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_hostname1 = 'test-pg-readonly\.
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_weight1 = 1

  # --- agent mode primary-only (replicaCount=0): RW only, no RO backend (#207) ---
  - it: agent mode primary-only omits the RO backend and weights the primary 1
    values:
      - ../values-agent-pgpool.yaml
    set:
      postgresql.replicaCount: 0
    asserts:
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_hostname0 = 'test-pg\.
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_weight0 = 1
      - notMatchRegex:
          path: data["pgpool.conf"]
          pattern: backend_hostname1
      - notMatchRegex:
          path: data["pgpool.conf"]
          pattern: backend_hostname[0-9]+ = '[^']*-readonly

  # --- #361: the RO backend is detachable, the RW backend never is ---
  # A session connects to every attached backend first; an unreachable RO Service used to stall
  # every session and, through the probes, restart PgPool. Detaching ends the stall.
  - it: agent mode keeps the RW backend non-detachable and lets the RO backend detach (#361)
    set:
      pgpool.enabled: true
      postgresql.replicaCount: 1
    asserts:
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_flag0 = 'ALWAYS_PRIMARY\|DISALLOW_TO_FAILOVER'
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: backend_flag1 = 'ALLOW_TO_FAILOVER'
      - notMatchRegex:
          path: data["pgpool.conf"]
          pattern: backend_flag1 = 'DISALLOW_TO_FAILOVER'
  - it: health-check defaults detach an unreachable RO backend in well under a minute (#361)
    set:
      pgpool.enabled: true
    asserts:
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: health_check_timeout = 10\n
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: health_check_max_retries = 3\n
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: health_check_retry_delay = 2\n
