suite: pg structural render scenarios
release:
  name: test-pg
tests:
  # --- Scenario 1: minimal render ---
  - it: minimal statefulset has 1 replica
    values:
      - ../values-minimal.yaml
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: minimal has no repmgrd or service-updater container
    values:
      - ../values-minimal.yaml
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="repmgrd")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="service-updater")]

  - it: minimal renders a Secret
    values:
      - ../values-minimal.yaml
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: minimal renders a Service
    values:
      - ../values-minimal.yaml
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  # --- Scenario 2: repmgr render ---
  - it: repmgr statefulset has 2 replicas and OrderedReady policy
    values:
      - ../values-repmgr.yaml
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady

  - it: repmgr has repmgrd and service-updater containers
    values:
      - ../values-repmgr.yaml
    template: templates/statefulset.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=="repmgrd")]
      - exists:
          path: spec.template.spec.containers[?(@.name=="service-updater")]

  # --- Scenario 3: full render ---
  - it: full statefulset has 3 replicas
    values:
      - ../values-full-test.yaml
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: full renders a pgpool Deployment
    values:
      - ../values-full-test.yaml
    template: templates/pgpool-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: full postgresql pod has hostname podAntiAffinity
    values:
      - ../values-full-test.yaml
    template: templates/statefulset.yaml
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname

  # --- Scenario 7: primary Service selector ---
  - it: primary Service selects pod-name <release>-0
    values:
      - ../values-minimal.yaml
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: test-pg-0

  # --- Scenario 8: read-only Service ---
  - it: read-only Service name endswith -readonly, selects standby, targets postgresql
    values:
      - ../values-repmgr.yaml
    template: templates/service-readonly.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: -readonly$
      - equal:
          path: spec.selector["pg-role"]
          value: standby
      - equal:
          path: spec.ports[0].targetPort
          value: postgresql

  # --- Scenario 9: extraVolumes/extraVolumeMounts/extraEnv passthrough (#262) ---
  # persistence.enabled=true ON PURPOSE: values-minimal disables persistence, and
  # `(not persistence.enabled)` already renders a `volumes:` block on its own. With
  # persistence ON (and repmgr/tls/pgbackrest/extensions/configuration all off in
  # minimal), extraVolumes is the ONLY reason the block renders -- so this actually
  # exercises the new render gate instead of passing tautologically.
  - it: extra passthrough renders volume, mount on postgresql container, and env
    values:
      - ../values-minimal.yaml
    set:
      postgresql.persistence.enabled: true
      postgresql.extraVolumes:
        - name: pgsodium-key
          secret:
            secretName: pgsodium-root-key
            defaultMode: 0400
      postgresql.extraVolumeMounts:
        - name: pgsodium-key
          mountPath: /etc/postgresql/pgsodium
          readOnly: true
      postgresql.extraEnv:
        - name: SOME_FLAG
          value: "1"
        - name: PGSODIUM_KEY_REF
          valueFrom:
            secretKeyRef:
              name: pgsodium-root-key
              key: pgsodium.key
    template: templates/statefulset.yaml
    asserts:
      # extraVolumes alone opens the volumes block (persistence on, no other volume feature)
      - equal:
          path: spec.template.spec.volumes[?(@.name=="pgsodium-key")].secret.secretName
          value: pgsodium-root-key
      - equal:
          path: spec.template.spec.volumes[?(@.name=="pgsodium-key")].secret.defaultMode
          value: 256 # 0400 octal
      # The ephemeral data volume must NOT be there -- persistence is on (PVC template)
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="data")]
      # Mounted on the postgresql container
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts[?(@.name=="pgsodium-key")].mountPath
          value: /etc/postgresql/pgsodium
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts[?(@.name=="pgsodium-key")].readOnly
          value: true
      # Env injected onto the postgresql container -- both value and valueFrom forms
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env[?(@.name=="SOME_FLAG")].value
          value: "1"
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env[?(@.name=="PGSODIUM_KEY_REF")].valueFrom.secretKeyRef.name
          value: pgsodium-root-key
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env[?(@.name=="PGSODIUM_KEY_REF")].valueFrom.secretKeyRef.key
          value: pgsodium.key

  - it: no extra volumes, mounts or env by default
    values:
      - ../values-minimal.yaml
    template: templates/statefulset.yaml
    asserts:
      # minimal (persistence off) still renders the ephemeral `data` volume, so assert
      # on the absence of the extras specifically, not on the volumes block as a whole.
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="pgsodium-key")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts[?(@.name=="pgsodium-key")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env[?(@.name=="SOME_FLAG")]

  # --- Scenario: pgbackrest passthrough (#323) ---
  # One list, five containers. Asserted per-container rather than by occurrence count: the
  # failure this feature fixes was a pod that LOOKED configured, so "it rendered somewhere"
  # is not the property worth testing.
  - it: pgbackrest.extraEnv/extraVolumeMounts reach the sidecar and the bootstrap init container
    values:
      - ../values-pgbackrest.yaml
      - ../values-pgbackrest-extra.yaml
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="pgbackrest")].env[?(@.name=="KUBECONFIG")].value
          value: /etc/apiserver-proxy/kubeconfig
      - equal:
          path: spec.template.spec.containers[?(@.name=="pgbackrest")].env[?(@.name=="PGBACKREST_EXTRA_TOKEN")].valueFrom.secretKeyRef.name
          value: apiserver-proxy-token
      - equal:
          path: spec.template.spec.containers[?(@.name=="pgbackrest")].volumeMounts[?(@.name=="apiserver-proxy")].mountPath
          value: /etc/apiserver-proxy
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="pgbackrest-bootstrap")].env[?(@.name=="KUBECONFIG")].value
          value: /etc/apiserver-proxy/kubeconfig
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="pgbackrest-bootstrap")].volumeMounts[?(@.name=="apiserver-proxy")].mountPath
          value: /etc/apiserver-proxy
      # Pod-level, exactly once -- a mount naming a volume the pod does not declare is
      # rejected by the kubelet at apply time, not by helm.
      - equal:
          path: spec.template.spec.volumes[?(@.name=="apiserver-proxy")].configMap.name
          value: apiserver-proxy-kubeconfig

  # The postgresql container is deliberately NOT a target: it has postgresql.extraEnv of its
  # own, and that is also where archive_command's pgbackrest invocation reads its environment.
  # Leaking a KUBECONFIG into the postmaster's environment would redirect the entrypoint's
  # stale-primary guard as a side effect of configuring backups.
  - it: pgbackrest.extraEnv does not leak onto the postgresql container
    values:
      - ../values-pgbackrest.yaml
      - ../values-pgbackrest-extra.yaml
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env[?(@.name=="KUBECONFIG")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts[?(@.name=="apiserver-proxy")]

  # The backup CronJob is the one the issue was filed about: it lists EndpointSlices and
  # drives pgbackrest with `kubectl exec`, and it is the ONLY thing that runs stanza-create.
  - it: pgbackrest.extraEnv reaches the backup CronJob, the pod that talks to the apiserver
    values:
      - ../values-pgbackrest.yaml
      - ../values-pgbackrest-extra.yaml
    template: templates/pgbackrest-cronjob.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[?(@.name=="pgbackrest")].env[?(@.name=="KUBECONFIG")].value
          value: /etc/apiserver-proxy/kubeconfig
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[?(@.name=="pgbackrest")].volumeMounts[?(@.name=="apiserver-proxy")].mountPath
          value: /etc/apiserver-proxy
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[?(@.name=="apiserver-proxy")].configMap.name
          value: apiserver-proxy-kubeconfig

  - it: pgbackrest.extraEnv reaches the validation CronJob
    values:
      - ../values-pgbackrest.yaml
      - ../values-pgbackrest-extra.yaml
    template: templates/pgbackrest-validation-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[?(@.name=="pgbackrest-validation")].env[?(@.name=="KUBECONFIG")].value
          value: /etc/apiserver-proxy/kubeconfig
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[?(@.name=="pgbackrest-validation")].volumeMounts[?(@.name=="apiserver-proxy")].mountPath
          value: /etc/apiserver-proxy
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[?(@.name=="apiserver-proxy")].configMap.name
          value: apiserver-proxy-kubeconfig

  # restore.mode=job -- the Job body, which the cronjob mode wraps verbatim.
  - it: pgbackrest.extraEnv reaches the restore Job
    values:
      - ../values-pgbackrest.yaml
      - ../values-pgbackrest-extra.yaml
    set:
      pgbackrest.restore.mode: job
    template: templates/pgbackrest-restore-job.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="pgbackrest-restore")].env[?(@.name=="KUBECONFIG")].value
          value: /etc/apiserver-proxy/kubeconfig
      - equal:
          path: spec.template.spec.containers[?(@.name=="pgbackrest-restore")].volumeMounts[?(@.name=="apiserver-proxy")].mountPath
          value: /etc/apiserver-proxy
      - equal:
          path: spec.template.spec.volumes[?(@.name=="apiserver-proxy")].configMap.name
          value: apiserver-proxy-kubeconfig

  - it: no pgbackrest extra volumes, mounts or env by default
    values:
      - ../values-pgbackrest.yaml
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="apiserver-proxy")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="pgbackrest")].env[?(@.name=="KUBECONFIG")]
