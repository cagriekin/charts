suite: connection reserves and chart-managed roles
release:
  name: test-pg
tests:
  # --- reserved-connections.conf: sized from the topology, always rendered ---
  - it: HA without pgpool reserves one superuser slot per node plus 3, none for pgpool
    template: templates/postgresql-configmap.yaml
    set:
      postgresql.replicaCount: 2
    asserts:
      - matchRegex:
          path: data["reserved-connections.conf"]
          pattern: 'superuser_reserved_connections = 6\n\s*reserved_connections = 0'

  - it: HA with pgpool reserves 2 per pgpool replica plus 1 for the check role
    template: templates/postgresql-configmap.yaml
    set:
      pgpool.enabled: true
      pgpool.replicaCount: 3
    asserts:
      - matchRegex:
          path: data["reserved-connections.conf"]
          pattern: 'superuser_reserved_connections = 5\n\s*reserved_connections = 7'

  - it: standalone keeps PostgreSQL's 3 superuser slots
    template: templates/postgresql-configmap.yaml
    set:
      ha.enabled: false
      postgresql.replicaCount: 0
      pgpool.enabled: true
    asserts:
      - matchRegex:
          path: data["reserved-connections.conf"]
          pattern: 'superuser_reserved_connections = 3\n\s*reserved_connections = 3'

  # --- reserve guards ---
  - it: superuser_reserved_connections in postgresql.configuration is refused
    template: templates/statefulset.yaml
    set:
      postgresql.configuration.superuser_reserved_connections: "10"
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.configuration\.superuser_reserved_connections is set, but the chart owns the connection reserves'

  - it: reserved_connections is refused whatever its case
    template: templates/statefulset.yaml
    set:
      postgresql.configuration.Reserved_Connections: "2"
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.configuration\.Reserved_Connections is set, but the chart owns the connection reserves'

  - it: a max_connections the reserves would exhaust is refused
    template: templates/statefulset.yaml
    set:
      postgresql.configuration.max_connections: "8"
      pgpool.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'max_connections is 8, but the chart reserves 5 superuser slots .* and 3 for pgpool''s checks'

  - it: a max_connections just above the reserves renders
    template: templates/statefulset.yaml
    set:
      postgresql.configuration.max_connections: "9"
      pgpool.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: PostgreSQL before 16 is refused (reserved_connections, pg_use_reserved_connections)
    template: templates/statefulset.yaml
    set:
      postgresql.majorVersion: "15"
    asserts:
      - failedTemplate:
          errorPattern: 'both introduced in PostgreSQL 16'

  # --- managed role names ---
  - it: an application role named like the superuser is refused
    template: templates/statefulset.yaml
    set:
      postgresql.username: dbadmin
      postgresql.app.username: dbadmin
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.app\.username is "dbadmin", which collides with postgresql\.username'

  - it: an application role named postgres is refused
    template: templates/statefulset.yaml
    set:
      postgresql.app.username: postgres
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.app\.username is "postgres", which collides with'

  - it: a check role named like the replication role is refused
    template: templates/statefulset.yaml
    set:
      pgpool.checkUser.username: repmgr
    asserts:
      - failedTemplate:
          errorPattern: 'pgpool\.checkUser\.username is "repmgr", which collides with ha\.username'

  - it: a check role named like a postgresql.roles entry is refused
    template: templates/statefulset.yaml
    set:
      pgpool.checkUser.username: reporting
      postgresql.roles:
        - name: reporting
    asserts:
      - failedTemplate: {}

  - it: the two managed roles must differ
    template: templates/statefulset.yaml
    set:
      postgresql.app.username: shared
      pgpool.checkUser.username: shared
    asserts:
      - failedTemplate:
          errorPattern: 'postgresql\.app\.username and pgpool\.checkUser\.username are both "shared"'

  # --- the roles reach the postgresql container ---
  - it: the postgresql container carries both managed roles and their Secret keys
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_USER
            value: app_user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-pg
                key: app-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPOOL_CHECK_USER
            value: pgpool_check
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPOOL_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-pg
                key: pgpool-check-password

  - it: existingSecret reads the managed passwords from the configured keys
    template: templates/statefulset.yaml
    set:
      postgresql.existingSecret.enabled: true
      postgresql.existingSecret.name: creds
      postgresql.existingSecret.appPasswordKey: app-pw
      postgresql.existingSecret.pgpoolCheckPasswordKey: check-pw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: creds
                key: app-pw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPOOL_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: creds
                key: check-pw

  - it: the generated Secret carries both managed passwords
    template: templates/secret.yaml
    asserts:
      - exists:
          path: data["app-password"]
      - exists:
          path: data["pgpool-check-password"]

  - it: standalone provisions the managed roles from the postStart hook
    template: templates/statefulset.yaml
    set:
      ha.enabled: false
      postgresql.replicaCount: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: '\\getenv app_pw APP_PASSWORD[\s\S]*SET log_statement = ''none''[\s\S]*SET myvars\.app_pw[\s\S]*ALTER ROLE %I WITH LOGIN NOSUPERUSER[\s\S]*GRANT pg_monitor, pg_use_reserved_connections[\s\S]*ALTER DATABASE %I OWNER TO %I'

  # --- pgpool uses the check role and knows both new logins ---
  - it: pgpool's checks log in as the check role, not the superuser
    template: templates/pgpool-configmap.yaml
    set:
      pgpool.enabled: true
    asserts:
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: "sr_check_user = '__CHECK_USER__'"
      - matchRegex:
          path: data["pgpool.conf"]
          pattern: "health_check_user = '__CHECK_USER__'"
      - matchRegex:
          path: data["pool_passwd"]
          pattern: '__CHECK_USER__:TEXT__CHECK_PASSWORD__\n__APP_USER__:TEXT__APP_PASSWORD__'
