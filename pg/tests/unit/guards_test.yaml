suite: pg fail-fast guards
release:
  name: test-pg
tests:
  # --- Scenario 9: schema enum guards ---
  - it: invalid agent dcs backend is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.agent.dcs.backend: zookeeper
    asserts:
      - failedTemplate: {}

  # --- #286: the removed repmgrd keys fail the render rather than being ignored ---
  - it: repmgr.failoverMode=repmgrd is rejected and warns about the immutable field
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.failoverMode: repmgrd
    asserts:
      - failedTemplate:
          errorPattern: "repmgr.failoverMode was removed in chart 2.0.0.*IMMUTABLE"

  - it: repmgr.failoverMode=agent is rejected as a no-op key
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.failoverMode: agent
    asserts:
      - failedTemplate:
          errorPattern: "repmgr.failoverMode was removed in chart 2.0.0"

  - it: repmgr.serviceUpdater is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.serviceUpdater.resources.requests.cpu: 50m
    asserts:
      - failedTemplate:
          errorPattern: "repmgr.serviceUpdater.* was removed in chart 2.0.0"

  - it: repmgr.monitoringHistoryDays is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.monitoringHistoryDays: 7
    asserts:
      - failedTemplate:
          errorPattern: "repmgr.monitoringHistoryDays was removed in chart 2.0.0"

  - it: pgpool.autoFailback is rejected
    templates:
      - templates/statefulset.yaml
    set:
      pgpool.autoFailback: true
    asserts:
      - failedTemplate:
          errorPattern: "pgpool.autoFailback was removed in chart 2.0.0"

  # --- Scenario 10: standalone replica guard ---
  - it: standalone with replicas > 0 fails fast
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.enabled: false
      postgresql.replicaCount: 1
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.replicaCount > 0 requires repmgr.enabled=true: with repmgr disabled the chart would run replicaCount+1 independent PostgreSQL instances with no replication between them. Set postgresql.replicaCount=0 for standalone mode or enable repmgr"

  - it: standalone with replicaCount 0 renders
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.enabled: false
      postgresql.replicaCount: 0
    asserts:
      - isKind:
          of: StatefulSet
      - notFailedTemplate: {}

  # --- Scenario 11: pgbackrest requires repmgr ---
  - it: pgbackrest without repmgr fails fast
    templates:
      - templates/statefulset.yaml
    set:
      pgbackrest.enabled: true
      repmgr.enabled: false
      postgresql.replicaCount: 0
    asserts:
      - failedTemplate:
          errorMessage: "pgbackrest.enabled requires repmgr.enabled=true: the pgbackrest binary and the archive_command run inside the postgresql container, which in standalone mode is the official postgres image without pgbackrest. WAL archiving would fail on every segment (unbounded WAL growth) and backups would time out. Enable repmgr, or disable pgbackrest"

  # --- Scenario 12: pgbackrest S3 secret name is required on every ref (#213) ---
  - it: empty pgbackrest.existingSecret.name with keyType=shared fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.existingSecret.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "pgbackrest.existingSecret.name is required (pgbackrest.s3.keyType=shared); use keyType=auto for cloud workload identity"

  # --- Scenario 13: extra passthrough validation (#262) ---
  - it: extraEnv as a map (not a list) fails render with a shape message
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        FOO: bar
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraEnv must be a list of objects, got map. Use a YAML sequence of entries, each with a name (e.g. `postgresql.extraEnv: [{name: my-entry, ...}]`), not a map."

  - it: extraVolumes as a map (not a list) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        name: pgsodium-key
    asserts:
      - failedTemplate: {}

  - it: extraVolumes entry without a name fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraVolumes[0]: name is required"

  - it: extraVolumes colliding with the chart data volume fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: data
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumes[0]: "data" is a chart-managed volume name and may not be reused (reserved: data, postgresql-config, postgresql-tls, ext-lib, ext-share, ext-extra-lib, repmgr-config, etcd-tls, pg-run, pgbackrest-config). With persistence enabled a "data" volume is silently discarded in favour of the volumeClaimTemplate; with persistence disabled the duplicate name is rejected by the API server. Pick a distinct name.'

  - it: extraVolumes colliding with an internal volume (repmgr-config) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: repmgr-config
          emptyDir: {}
    asserts:
      - failedTemplate: {}

  - it: duplicate extraVolumes names fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: dup
          emptyDir: {}
        - name: dup
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumes[1]: duplicate volume name "dup"'

  # The sibling-key typo the schema cannot catch (additionalProperties is open):
  # a mount with no matching volume renders cleanly and is rejected only at apply.
  - it: extraVolumeMounts with no matching extraVolumes entry fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumeMounts:
        - name: pgsodium-key
          mountPath: /etc/postgresql/pgsodium
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumeMounts[0]: no postgresql.extraVolumes entry named "pgsodium-key" (declared: none). Every extra mount needs a matching extra volume -- otherwise the API server rejects the StatefulSet at apply time with `volumeMounts[..].name: Not found`. Check for a typo, or that you set extraVolumes (plural). Chart-managed volumes cannot be mounted here.'

  - it: extraVolumeMounts without mountPath fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: k
          emptyDir: {}
      postgresql.extraVolumeMounts:
        - name: k
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraVolumeMounts[0] (k): mountPath is required"

  - it: extraEnv reusing a chart-set env name (PGDATA) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: PGDATA
          value: /wrong
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraEnv[0]: "PGDATA" is set by the chart on the postgresql container and may not be overridden -- a duplicate env name is last-wins at runtime, so this would silently shadow the chart/Secret value (e.g. pointing the postmaster at the wrong PGDATA, or breaking cluster-wide auth). Use the chart''s own value for this setting instead.'

  # Reserved unconditionally: repmgr is disabled in values-minimal, but a value that
  # works today must not start shadowing the chart once an upgrade enables repmgr.
  - it: extraEnv reusing a disabled-feature env name (REPMGR_PASSWORD) still fails
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: REPMGR_PASSWORD
          value: x
    asserts:
      - failedTemplate: {}

  - it: duplicate extraEnv names fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: A
          value: "1"
        - name: A
          value: "2"
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraEnv[1]: duplicate env name "A"'

  # --- Scenario 14: extension package installer guards (#303) ---
  - it: extensions.packages without extensions.enabled fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - postgresql-18-cron
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: a package entry with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-18-cron; rm -rf /"
    asserts:
      - failedTemplate: {}

  # --- Scenario 15: non-PGDG apt source guards (#310) ---
  - it: aptSources without packages fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.aptSources is set but postgresql.extensions.packages is empty -- aptSources only exists to make packages from a non-PGDG source installable, so it has nothing to do without at least one package that needs it."

  # packages is also set here, so the pre-existing pg.validateExtensionPackages guard
  # fires first, with its own message -- pg.validateExtensionAptSources's own enabled
  # check is exercised separately below, with packages left empty.
  - it: aptSources with packages but without extensions.enabled hits the packages guard
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: aptSources alone without extensions.enabled hits its own enabled guard
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.aptSources is set but postgresql.extensions.enabled is false, so nothing would ever use it. Set postgresql.extensions.enabled=true."

  - it: an aptSources entry with an invalid name fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: "pig/sty"
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate: {}

  - it: duplicate aptSources names fail render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-pigsty-keyring.gpg] https://a.example/x trixie main"
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key2
          aptLine: "deb https://b.example/y trixie main"
    asserts:
      - failedTemplate: {}

  - it: an aptSources keyUrl with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: "https://repo.pigsty.io/key; rm -rf /"
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate: {}

  - it: an aptSources aptLine with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb `id` main"
    asserts:
      - failedTemplate: {}

  # trusted=/allow-insecure=/allow-weak=/allow-downgrade-to-insecure= each disable or
  # weaken apt's signature check, making the curl/gpg verification step decorative --
  # unsigned or weakly-signed packages would install as root. Case-insensitive with
  # optional whitespace before "=" (review): apt itself accepts both.
  - it: an aptSources aptLine setting trusted=yes fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [trusted=yes] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "sets an apt option that weakens or disables signature verification"

  - it: an aptSources aptLine setting allow-insecure=yes fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [allow-insecure=yes] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "sets an apt option that weakens or disables signature verification"

  - it: an aptSources aptLine setting Trusted = yes (mixed case, spaced) fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [Trusted = yes] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "sets an apt option that weakens or disables signature verification"

  # Without signed-by referencing exactly the keyring this entry's own key is
  # dearmored to, apt has no way to know which key to trust -- fails at apply time
  # (NO_PUBKEY) instead of at render time (CLAUDE.md invariant #4).
  - it: an aptSources aptLine without signed-by fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "must include \"signed-by=/usr/share/keyrings/pgchart-pigsty-keyring\\.gpg\""

  # signed-by referencing a DIFFERENT entry's keyring (or a typo) is just as broken
  # as omitting it outright -- must match this entry's own name exactly.
  - it: an aptSources aptLine with a mismatched signed-by fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-other-keyring.gpg] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "must include \"signed-by=/usr/share/keyrings/pgchart-pigsty-keyring\\.gpg\""

  - it: a valid aptSources entry renders successfully
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-pigsty-keyring.gpg] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "curl -fsSL --proto '=https' --proto-redir '=https' \"https://repo\\.pigsty\\.io/key\" \\| gpg --dearmor -o /usr/share/keyrings/pgchart-pigsty-keyring\\.gpg"

  # --- Scenario 16: extraLibs guards + LD_LIBRARY_PATH (#309) ---
  - it: extraLibs without packages fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.extraLibs is set but neither postgresql.extensions.packages nor postgresql.extensions.image.repository is -- extraLibs' copy step runs alongside one of those two (the apt-get install, or the prebuilt-image copy), so it has nothing to do without one of them."

  - it: extraLibs without extensions.enabled fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: a relative extraLibs path fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "usr/lib/x86_64-linux-gnu/libsodium.so.23"
    asserts:
      - failedTemplate: {}

  - it: a path-traversal extraLibs entry fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/../../../etc/passwd"
    asserts:
      - failedTemplate: {}

  # copy-base-ext and copy-ext can be different image builds -- auto-shadowing the
  # running container's own C runtime with a build from the other image is an ABI
  # hazard, not a convenience, so core libraries are refused outright.
  - it: a core runtime library in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libc.so.6"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # Denylist widened past the original libc-family set (review): the postgres server
  # itself links libssl/libcrypto too, so shadowing either is just as dangerous.
  - it: libssl in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libssl.so.3"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # "libcrypt" (a real, distinct core library, not "libcrypto") must still be caught by
  # the boundary-aware denylist regex, and an unrelated library that merely starts
  # with the same letters ("libz" vs "libzstd") must NOT be false-positived.
  - it: libcrypt (distinct from libcrypto) in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libcrypt.so.1"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # libzstd/liblz4/libxml2/etc. are ALSO denied (review): they're all real postgres
  # dependencies (verified via `ldd postgres`), not merely prefix-sharing lookalikes --
  # see the dedicated denial tests above. libcairo genuinely is unrelated to postgres's
  # own NEEDED set and shares only its first four letters with libc, so it's the correct
  # example of "boundary-aware matching, not a false positive on a shared prefix".
  - it: a library merely sharing a denylisted prefix (libcairo, not libc) is allowed
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libcairo.so.2
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "cp /usr/lib/x86_64-linux-gnu/libcairo\\.so\\.2 /ext-extra-lib/"

  # A trailing / is a directory, not a file -- cp would fail at init time and
  # crashloop the pod instead of failing fast at render time (review).
  - it: a trailing-slash extraLibs entry (a directory) fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/"
    asserts:
      - failedTemplate: {}

  # extraLibs lands in a volume SEPARATE from ext-lib (review, #302): ext-lib is also
  # populated by the unvalidated *.so* glob copy, so LD_LIBRARY_PATH pointing there
  # instead would extend the ABI-shadowing hazard this denylist exists to prevent to
  # every file that glob happens to sweep in.
  - it: a valid extraLibs entry copies into ext-extra-lib and sets LD_LIBRARY_PATH
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "cp /usr/lib/x86_64-linux-gnu/libsodium\\.so\\.23 /ext-extra-lib/"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-ext")].command[2]
          pattern: "cp -n /usr/lib/x86_64-linux-gnu/libsodium\\.so\\.23 /ext-extra-lib/"
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].volumeMounts
          content:
            name: ext-extra-lib
            mountPath: /ext-extra-lib
          any: true
      - contains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts
          content:
            name: ext-extra-lib
            mountPath: /usr/lib/postgresql/18/extra-lib
          any: true
      - contains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
            value: /usr/lib/postgresql/18/extra-lib
          any: true

  - it: LD_LIBRARY_PATH is not set when extensions are disabled
    templates:
      - templates/statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
          any: true

  # Gated on extraLibs specifically, not bare extensions.enabled (review): ext-lib is
  # also populated by the plain glob copy regardless of extraLibs, and copy-base-ext/
  # copy-ext can be different image builds (#302) -- widening LD_LIBRARY_PATH for every
  # extensions-enabled release risks a same-named file from one image's build shadowing
  # a system library for the other image's process.
  - it: LD_LIBRARY_PATH is not set when extensions.enabled but extraLibs is empty
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
          any: true

  # --- Scenario: pgbackrest passthrough validation (#323) ---
  # Same guard set as #262's, over a wider surface: one list feeds five containers across four
  # pod templates, so every reserved-name list is the union over all of them. The two SHAPE
  # cases (a map instead of a list, a mount with no mountPath) are not here: values.schema.json
  # rejects both before any template renders, so the equivalent {{ fail }} messages are
  # unreachable for helm-unittest to match. test-template.sh asserts those two by exit code.
  # Silently inert configuration is the failure this feature exists to remove, so setting it
  # with pgbackrest disabled is refused rather than ignored.
  - it: pgbackrest passthrough set while pgbackrest is disabled fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      pgbackrest.extraEnv:
        - name: KUBECONFIG
          value: /etc/apiserver-proxy/kubeconfig
    asserts:
      - failedTemplate:
          errorMessage: "pgbackrest.extraEnv/extraVolumes/extraVolumeMounts are set but pgbackrest.enabled is false, so none of the pgbackrest containers they configure is rendered and nothing would use them. Set pgbackrest.enabled=true, or remove these values."

  - it: pgbackrest.extraEnv reusing a chart-set name (PGBACKREST_STANZA) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraEnv:
        - name: PGBACKREST_STANZA
          value: elsewhere
    asserts:
      - failedTemplate:
          errorMessage: 'pgbackrest.extraEnv[0]: "PGBACKREST_STANZA" is set by the chart on one or more of the pgbackrest containers and may not be overridden -- a duplicate env name is last-wins at runtime, so this would silently shadow the chart/Secret value (e.g. pointing a restore at the wrong stanza, or a backup at the wrong repository credentials). Use the chart''s own value for this setting instead.'

  # Reserved even though only the backup CronJob sets it, and only that one pod would break --
  # the operator setting it has no reason to be thinking about that pod.
  - it: pgbackrest.extraEnv reusing a single-pod env name (HOME) still fails
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraEnv:
        - name: HOME
          value: /somewhere-unwritable
    asserts:
      - failedTemplate: {}

  # Reserved unconditionally: repoEncryption is off in this fixture, so this env name is not in
  # today's render at all -- but enabling it later must not start silently shadowing the Secret.
  - it: pgbackrest.extraEnv reusing a disabled-feature env name (cipher pass) still fails
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraEnv:
        - name: PGBACKREST_REPO1_CIPHER_PASS
          value: hunter2
    asserts:
      - failedTemplate: {}

  - it: duplicate pgbackrest.extraEnv names fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraEnv:
        - name: DUP
          value: "1"
        - name: DUP
          value: "2"
    asserts:
      - failedTemplate:
          errorMessage: 'pgbackrest.extraEnv[1]: duplicate env name "DUP"'

  - it: pgbackrest.extraVolumes colliding with a chart volume fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: pgbackrest-config
          emptyDir: {}
    asserts:
      - failedTemplate: {}

  # `tmp` only exists in the backup CronJob, and `work` only in the restore/validation pods --
  # both are still reserved, for the same reason HOME is.
  - it: pgbackrest.extraVolumes colliding with another pod's volume (work) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: work
          emptyDir: {}
    asserts:
      - failedTemplate: {}

  # postgresql.extraVolumes lands in the SAME pod volumes list, so a shared name is a duplicate
  # the API server rejects -- render-clean, pod never starts.
  - it: pgbackrest.extraVolumes colliding with postgresql.extraVolumes fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      postgresql.extraVolumes:
        - name: shared-name
          emptyDir: {}
      pgbackrest.extraVolumes:
        - name: shared-name
          emptyDir: {}
    asserts:
      - failedTemplate: {}

  - it: pgbackrest.extraVolumeMounts with no matching extraVolumes entry fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumeMounts:
        - name: apiserver-proxy
          mountPath: /etc/apiserver-proxy
    asserts:
      - failedTemplate: {}

  # A projection anywhere inside the data volume is corruption, not a failed mount: these
  # containers restore INTO PGDATA and a postmaster starts on it afterwards.
  - it: a pgbackrest.extraVolumeMounts entry inside PGDATA fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: k
          emptyDir: {}
      pgbackrest.extraVolumeMounts:
        - name: k
          mountPath: /var/lib/postgresql/data/pgdata
    asserts:
      - failedTemplate: {}

  # /tmp is the backup CronJob's writable emptyDir AND kubectl's HOME cache; replacing it with
  # a read-only projection fails at run time, not at apply time.
  - it: a pgbackrest.extraVolumeMounts entry over /tmp fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: k
          emptyDir: {}
      pgbackrest.extraVolumeMounts:
        - name: k
          mountPath: /tmp
    asserts:
      - failedTemplate: {}

  # Guarded on the FILE, not its directory: /etc/pgbackrest/conf.d is a legitimate mount, so
  # only a mount at or above /etc/pgbackrest/pgbackrest.conf is refused.
  - it: a pgbackrest.extraVolumeMounts entry over /etc/pgbackrest fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: k
          emptyDir: {}
      pgbackrest.extraVolumeMounts:
        - name: k
          mountPath: /etc/pgbackrest
    asserts:
      - failedTemplate: {}

  - it: duplicate pgbackrest.extraVolumeMounts mountPaths fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.extraVolumes:
        - name: a
          emptyDir: {}
        - name: b
          emptyDir: {}
      pgbackrest.extraVolumeMounts:
        - name: a
          mountPath: /shared
        - name: b
          mountPath: /shared
    asserts:
      - failedTemplate: {}

  # --- #308 x #288 (rebase review): syncReplicationSlots is repmgr-mechanism only ---
  # The synchronized_standby_slots reconcile resolves standbys from repmgr.nodes and names
  # slots repmgr_slot_<node_id>; a native cluster has neither, so it would never run while
  # every standby still enabled sync_replication_slots. Refuse instead of degrading quietly.
  - it: syncReplicationSlots with mechanism native is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.agent.syncReplicationSlots: true
      postgresql.walLevel: logical
      repmgr.agent.mechanism: native
    asserts:
      - failedTemplate:
          errorPattern: "not supported with repmgr.agent.mechanism: native"

  - it: syncReplicationSlots under the default mechanism still renders
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.agent.syncReplicationSlots: true
      postgresql.walLevel: logical
    asserts:
      - hasDocuments:
          count: 1

  # --- #293: repmgr must never be preloaded under the native mechanism ---
  # shared_preload_libraries is persisted INSIDE the data directory by the image entrypoint
  # and cloned to every standby, so once the repmgr-free image ships (#290) a cluster still
  # asking for repmgr.so crash-loops every pod at once -- and helm rollback cannot fix it,
  # because the line is in PGDATA, not the release. #288 stopped the chart emitting it under
  # native; this guard closes the one remaining path, an operator-declared value, which loads
  # via conf.d's include_dir and therefore OVERRIDES the image's own native gate.
  - it: an operator-preloaded repmgr under mechanism native is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.agent.mechanism: native
      postgresql.configuration.shared_preload_libraries: repmgr,pgsodium
    asserts:
      - failedTemplate:
          errorPattern: 'includes "repmgr" \(got "repmgr,pgsodium"\)'

  - it: an operator-preloaded repmgr under the default mechanism still renders
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.configuration.shared_preload_libraries: repmgr,pgsodium
    asserts:
      - hasDocuments:
          count: 1

  - it: native without repmgr in the operator list still renders
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.agent.mechanism: native
      postgresql.configuration.shared_preload_libraries: pgsodium
    asserts:
      - hasDocuments:
          count: 1
