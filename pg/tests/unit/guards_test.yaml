suite: pg fail-fast guards
release:
  name: test-pg
tests:
  # --- Scenario 9: schema enum guards ---
  - it: invalid failoverMode is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.failoverMode: bogus
    asserts:
      - failedTemplate: {}

  - it: invalid agent dcs backend is rejected
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.failoverMode: agent
      repmgr.agent.dcs.backend: zookeeper
    asserts:
      - failedTemplate: {}

  # --- Scenario 10: standalone replica guard ---
  - it: standalone with replicas > 0 fails fast
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.enabled: false
      postgresql.replicaCount: 1
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.replicaCount > 0 requires repmgr.enabled=true: with repmgr disabled the chart would run replicaCount+1 independent PostgreSQL instances with no replication between them. Set postgresql.replicaCount=0 for standalone mode or enable repmgr"

  - it: standalone with replicaCount 0 renders
    templates:
      - templates/statefulset.yaml
    set:
      repmgr.enabled: false
      postgresql.replicaCount: 0
    asserts:
      - isKind:
          of: StatefulSet
      - notFailedTemplate: {}

  # --- Scenario 11: pgbackrest requires repmgr ---
  - it: pgbackrest without repmgr fails fast
    templates:
      - templates/statefulset.yaml
    set:
      pgbackrest.enabled: true
      repmgr.enabled: false
      postgresql.replicaCount: 0
    asserts:
      - failedTemplate:
          errorMessage: "pgbackrest.enabled requires repmgr.enabled=true: the pgbackrest binary and the archive_command run inside the postgresql container, which in standalone mode is the official postgres image without pgbackrest. WAL archiving would fail on every segment (unbounded WAL growth) and backups would time out. Enable repmgr, or disable pgbackrest"

  # --- Scenario 12: pgbackrest S3 secret name is required on every ref (#213) ---
  - it: empty pgbackrest.existingSecret.name with keyType=shared fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-pgbackrest.yaml
    set:
      pgbackrest.existingSecret.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "pgbackrest.existingSecret.name is required (pgbackrest.s3.keyType=shared); use keyType=auto for cloud workload identity"

  # --- Scenario 13: extra passthrough validation (#262) ---
  - it: extraEnv as a map (not a list) fails render with a shape message
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        FOO: bar
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraEnv must be a list of objects, got map. Use a YAML sequence of entries, each with a name (e.g. `postgresql.extraEnv: [{name: my-entry, ...}]`), not a map."

  - it: extraVolumes as a map (not a list) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        name: pgsodium-key
    asserts:
      - failedTemplate: {}

  - it: extraVolumes entry without a name fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraVolumes[0]: name is required"

  - it: extraVolumes colliding with the chart data volume fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: data
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumes[0]: "data" is a chart-managed volume name and may not be reused (reserved: data, postgresql-config, postgresql-tls, ext-lib, ext-share, ext-extra-lib, repmgr-config, etcd-tls, pg-run, pgbackrest-config, service-updater-script). With persistence enabled a "data" volume is silently discarded in favour of the volumeClaimTemplate; with persistence disabled the duplicate name is rejected by the API server. Pick a distinct name.'

  - it: extraVolumes colliding with an internal volume (repmgr-config) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: repmgr-config
          emptyDir: {}
    asserts:
      - failedTemplate: {}

  - it: duplicate extraVolumes names fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: dup
          emptyDir: {}
        - name: dup
          emptyDir: {}
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumes[1]: duplicate volume name "dup"'

  # The sibling-key typo the schema cannot catch (additionalProperties is open):
  # a mount with no matching volume renders cleanly and is rejected only at apply.
  - it: extraVolumeMounts with no matching extraVolumes entry fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumeMounts:
        - name: pgsodium-key
          mountPath: /etc/postgresql/pgsodium
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraVolumeMounts[0]: no postgresql.extraVolumes entry named "pgsodium-key" (declared: none). Every extra mount needs a matching extra volume -- otherwise the API server rejects the StatefulSet at apply time with `volumeMounts[..].name: Not found`. Check for a typo, or that you set extraVolumes (plural). Chart-managed volumes cannot be mounted here.'

  - it: extraVolumeMounts without mountPath fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraVolumes:
        - name: k
          emptyDir: {}
      postgresql.extraVolumeMounts:
        - name: k
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extraVolumeMounts[0] (k): mountPath is required"

  - it: extraEnv reusing a chart-set env name (PGDATA) fails render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: PGDATA
          value: /wrong
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraEnv[0]: "PGDATA" is set by the chart on the postgresql container and may not be overridden -- a duplicate env name is last-wins at runtime, so this would silently shadow the chart/Secret value (e.g. pointing the postmaster at the wrong PGDATA, or breaking cluster-wide auth). Use the chart''s own value for this setting instead.'

  # Reserved unconditionally: repmgr is disabled in values-minimal, but a value that
  # works today must not start shadowing the chart once an upgrade enables repmgr.
  - it: extraEnv reusing a disabled-feature env name (REPMGR_PASSWORD) still fails
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: REPMGR_PASSWORD
          value: x
    asserts:
      - failedTemplate: {}

  - it: duplicate extraEnv names fail render
    templates:
      - templates/statefulset.yaml
    values:
      - ../values-minimal.yaml
    set:
      postgresql.extraEnv:
        - name: A
          value: "1"
        - name: A
          value: "2"
    asserts:
      - failedTemplate:
          errorMessage: 'postgresql.extraEnv[1]: duplicate env name "A"'

  # --- Scenario 14: extension package installer guards (#303) ---
  - it: extensions.packages without extensions.enabled fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - postgresql-18-cron
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: a package entry with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-18-cron; rm -rf /"
    asserts:
      - failedTemplate: {}

  # --- Scenario 15: non-PGDG apt source guards (#310) ---
  - it: aptSources without packages fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.aptSources is set but postgresql.extensions.packages is empty -- aptSources only exists to make packages from a non-PGDG source installable, so it has nothing to do without at least one package that needs it."

  # packages is also set here, so the pre-existing pg.validateExtensionPackages guard
  # fires first, with its own message -- pg.validateExtensionAptSources's own enabled
  # check is exercised separately below, with packages left empty.
  - it: aptSources with packages but without extensions.enabled hits the packages guard
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: aptSources alone without extensions.enabled hits its own enabled guard
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.aptSources is set but postgresql.extensions.enabled is false, so nothing would ever use it. Set postgresql.extensions.enabled=true."

  - it: an aptSources entry with an invalid name fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: "pig/sty"
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate: {}

  - it: duplicate aptSources names fail render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-pigsty-keyring.gpg] https://a.example/x trixie main"
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key2
          aptLine: "deb https://b.example/y trixie main"
    asserts:
      - failedTemplate: {}

  - it: an aptSources keyUrl with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: "https://repo.pigsty.io/key; rm -rf /"
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate: {}

  - it: an aptSources aptLine with a shell metacharacter fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb `id` main"
    asserts:
      - failedTemplate: {}

  # trusted=yes disables apt's signature check entirely, making the curl/gpg
  # verification step decorative -- unsigned packages would install as root.
  - it: an aptSources aptLine setting trusted=yes fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [trusted=yes] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "sets trusted="

  # Without signed-by referencing exactly the keyring this entry's own key is
  # dearmored to, apt has no way to know which key to trust -- fails at apply time
  # (NO_PUBKEY) instead of at render time (CLAUDE.md invariant #4).
  - it: an aptSources aptLine without signed-by fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "must include \"signed-by=/usr/share/keyrings/pgchart-pigsty-keyring\\.gpg\""

  # signed-by referencing a DIFFERENT entry's keyring (or a typo) is just as broken
  # as omitting it outright -- must match this entry's own name exactly.
  - it: an aptSources aptLine with a mismatched signed-by fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-other-keyring.gpg] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - failedTemplate:
          errorPattern: "must include \"signed-by=/usr/share/keyrings/pgchart-pigsty-keyring\\.gpg\""

  - it: a valid aptSources entry renders successfully
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.aptSources:
        - name: pigsty
          keyUrl: https://repo.pigsty.io/key
          aptLine: "deb [signed-by=/usr/share/keyrings/pgchart-pigsty-keyring.gpg] https://repo.pigsty.io/apt/pgsql/trixie trixie main"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "curl -fsSL --proto '=https' --proto-redir '=https' \"https://repo\\.pigsty\\.io/key\" \\| gpg --dearmor -o /usr/share/keyrings/pgchart-pigsty-keyring\\.gpg"

  # --- Scenario 16: extraLibs guards + LD_LIBRARY_PATH (#309) ---
  - it: extraLibs without packages fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.extraLibs is set but postgresql.extensions.packages is empty -- extraLibs' copy step only runs alongside the packages apt-get install, so it has nothing to do without at least one package that needs it."

  - it: extraLibs without extensions.enabled fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.extensions.packages is set but postgresql.extensions.enabled is false, so nothing would ever install them. Set postgresql.extensions.enabled=true."

  - it: a relative extraLibs path fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "usr/lib/x86_64-linux-gnu/libsodium.so.23"
    asserts:
      - failedTemplate: {}

  - it: a path-traversal extraLibs entry fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/../../../etc/passwd"
    asserts:
      - failedTemplate: {}

  # copy-base-ext and copy-ext can be different image builds -- auto-shadowing the
  # running container's own C runtime with a build from the other image is an ABI
  # hazard, not a convenience, so core libraries are refused outright.
  - it: a core runtime library in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libc.so.6"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # Denylist widened past the original libc-family set (review): the postgres server
  # itself links libssl/libcrypto too, so shadowing either is just as dangerous.
  - it: libssl in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libssl.so.3"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # "libcrypt" (a real, distinct core library, not "libcrypto") must still be caught by
  # the boundary-aware denylist regex, and an unrelated library that merely starts
  # with the same letters ("libz" vs "libzstd") must NOT be false-positived.
  - it: libcrypt (distinct from libcrypto) in extraLibs is refused
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/libcrypt.so.1"
    asserts:
      - failedTemplate:
          errorPattern: "refusing .* copying a library the postgres server itself links"

  # libzstd/liblz4/libxml2/etc. are ALSO denied (review): they're all real postgres
  # dependencies (verified via `ldd postgres`), not merely prefix-sharing lookalikes --
  # see the dedicated denial tests above. libcairo genuinely is unrelated to postgres's
  # own NEEDED set and shares only its first four letters with libc, so it's the correct
  # example of "boundary-aware matching, not a false positive on a shared prefix".
  - it: a library merely sharing a denylisted prefix (libcairo, not libc) is allowed
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libcairo.so.2
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "cp /usr/lib/x86_64-linux-gnu/libcairo\\.so\\.2 /ext-extra-lib/"

  # A trailing / is a directory, not a file -- cp would fail at init time and
  # crashloop the pod instead of failing fast at render time (review).
  - it: a trailing-slash extraLibs entry (a directory) fails render
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - "/usr/lib/x86_64-linux-gnu/"
    asserts:
      - failedTemplate: {}

  # extraLibs lands in a volume SEPARATE from ext-lib (review, #302): ext-lib is also
  # populated by the unvalidated *.so* glob copy, so LD_LIBRARY_PATH pointing there
  # instead would extend the ABI-shadowing hazard this denylist exists to prevent to
  # every file that glob happens to sweep in.
  - it: a valid extraLibs entry copies into ext-extra-lib and sets LD_LIBRARY_PATH
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
      postgresql.extensions.packages:
        - "postgresql-{major}-pgsodium"
      postgresql.extensions.extraLibs:
        - /usr/lib/x86_64-linux-gnu/libsodium.so.23
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].command[2]
          pattern: "cp /usr/lib/x86_64-linux-gnu/libsodium\\.so\\.23 /ext-extra-lib/"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="copy-ext")].command[2]
          pattern: "cp -n /usr/lib/x86_64-linux-gnu/libsodium\\.so\\.23 /ext-extra-lib/"
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="copy-base-ext")].volumeMounts
          content:
            name: ext-extra-lib
            mountPath: /ext-extra-lib
          any: true
      - contains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].volumeMounts
          content:
            name: ext-extra-lib
            mountPath: /usr/lib/postgresql/18/extra-lib
          any: true
      - contains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
            value: /usr/lib/postgresql/18/extra-lib
          any: true

  - it: LD_LIBRARY_PATH is not set when extensions are disabled
    templates:
      - templates/statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
          any: true

  # Gated on extraLibs specifically, not bare extensions.enabled (review): ext-lib is
  # also populated by the plain glob copy regardless of extraLibs, and copy-base-ext/
  # copy-ext can be different image builds (#302) -- widening LD_LIBRARY_PATH for every
  # extensions-enabled release risks a same-named file from one image's build shadowing
  # a system library for the other image's process.
  - it: LD_LIBRARY_PATH is not set when extensions.enabled but extraLibs is empty
    templates:
      - templates/statefulset.yaml
    set:
      postgresql.extensions.enabled: true
      postgresql.majorVersion: "18"
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name=="postgresql")].env
          content:
            name: LD_LIBRARY_PATH
          any: true
