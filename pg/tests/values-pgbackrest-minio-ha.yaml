# Fixture for the multi-replica pgBackRest restore test (#226): primary + one streaming
# standby, backed by an in-cluster MinIO (TLS) instead of AWS S3 -- path-style addressing +
# verify-tls off for the self-signed endpoint. Identical to values-pgbackrest-minio.yaml
# except for replicaCount, which is the whole point: after a PITR restore of replica 0, the
# standby's PVC still holds PRE-restore data on the old timeline, and the test asserts how
# it rejoins.
postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  # 1 = primary + 1 standby (the chart adds the primary to replicaCount).
  replicaCount: 1
  database: testdb
  username: testuser

  persistence:
    enabled: true
    size: 1Gi

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repmgr:
  image:
    repository: cagriekin/pg-ha
    tag: 2.0.0-pg18
    pullPolicy: IfNotPresent
  enabled: true
  username: repmgr
  database: repmgr
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

pgbackrest:
  enabled: true
  stanza: db
  s3:
    endpoint: minio   # in-cluster MinIO Service (TLS on :443 -> targetPort 9000)
    bucket: pgbackrest-test
    region: us-east-1
    prefix: pgbackrest
    keyType: shared
    uriStyle: path    # MinIO/Ceph addressing
    verifyTls: false  # self-signed MinIO cert
  existingSecret:
    name: s3-backup-creds
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  retention:
    full: 4
    diff: 14
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
