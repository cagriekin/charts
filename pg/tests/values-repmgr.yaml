postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # The failover and chaos suites exercise data durability across pod
  # recreation (stale-primary self-delete, standby chaos deletes); without
  # persistent volumes pod deletion wipes PGDATA and ordinal-0 fresh-boots
  # instead of re-cloning, so these suites must run like production does.
  persistence:
    enabled: true
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

repmgr:
  # The generic HA fixture: repmgr.enabled with one replica and persistence. It pinned
  # failoverMode: repmgrd until #286 removed that path; the agent is now the only mode.
  image:
    repository: cagriekin/repmgr
    tag: trixie-5.5.0-27
    pullPolicy: IfNotPresent

  enabled: true

  username: repmgr
  database: repmgr

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
