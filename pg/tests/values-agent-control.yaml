postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

# Security-relevant control keys go under ha.* (the canonical name), not the deprecated
# repmgr.* alias: the chart refuses that alias for these keys since the alias overwrites ha.*
# even over --set (#298 security review). The merge combines both trees, so the rendered
# result is identical to nesting everything under repmgr.
ha:
  agent:
    control:
      # Only this CN may call the API, so the suite can prove an unlisted identity is
      # refused with a certificate the same CA signed.
      allowedClientCNs:
        - ops-admin

repmgr:
  image:
    repository: cagriekin/pg-ha
    tag: 2.0.0-pg18
    pullPolicy: IfNotPresent

  enabled: true

  username: repmgr
  database: repmgr

  agent:
    # Control REST API (#276). The Secret is created by the suite from a throwaway CA
    # before install; the chart's render guard requires it to be named here.
    control:
      enabled: true
      tls:
        existingSecret: pg-agent-control-tls

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
