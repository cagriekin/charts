postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  # 1 (2 pods) so the upgrade to values-upgrade-to.yaml SCALES UP to 3. That scale-up is the
  # point: it is the only coverage of adding a replica to a live agent-mode cluster, where a
  # new pod is created concurrently with the rolling restart and can reach the Lease before it
  # has registered in repmgr.nodes (#297). #286 briefly pinned this to 2 to keep CI honest
  # while that bug was open; #297 fixed it and restored the scale-up.
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: standard
    size: 1Gi

  database: testdb
  username: testuser

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  affinity: {}

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

repmgr:
  # This suite tests the in-place component upgrade (2 -> 3 nodes + pgpool + exporter).
  # #286 removed failoverMode entirely, so there is no repmgrd pin here any more and this
  # runs agent mode -- which is the point: the scale-up race it covers is agent-specific.
  image:
    repository: cagriekin/repmgr
    tag: trixie-5.5.0-34
    pullPolicy: IfNotPresent

  enabled: true

  username: repmgr
  database: repmgr

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

service:
  type: ClusterIP
  port: 5432
