# Fixture for the API-driven pgBackRest restore test (#276): agent mode with the control
# REST API and its SEPARATE restore opt-in enabled, backed by the in-cluster MinIO the
# other pgbackrest suites use. Single node: the restore overwrites replica 0's volume, and
# freeing it means scaling the StatefulSet to 0 -- which deletes every agent, so nothing
# can report progress during the copy. That is the point the suite documents.
postgresql:
  image:
    repository: postgres
    tag: 18.1-trixie
    pullPolicy: IfNotPresent

  replicaCount: 0
  database: testdb
  username: testuser

  persistence:
    enabled: true
    size: 1Gi

  podDisruptionBudget:
    enabled: false

  lifecycle:
    postStart:
      additionalCommands: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repmgr:
  image:
    repository: cagriekin/repmgr
    tag: trixie-5.5.0-29
    pullPolicy: IfNotPresent
  enabled: true

  agent:
    control:
      enabled: true
      tls:
        existingSecret: pg-control-restore-tls
      # allowedClientCNs gates EVERY control route, so a restore client has to be on it
      # too -- the two lists compose (this one is the door, restore's is an extra lock).
      allowedClientCNs:
        - ops-admin
        - dba-break-glass
      restore:
        enabled: true
        # The restore-only list. ops-admin is deliberately absent, so the suite can prove
        # an identity cleared for pause/switchover still cannot overwrite the volume.
        allowedClientCNs:
          - dba-break-glass
  username: repmgr
  database: repmgr
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

pgpool:
  enabled: false

prometheusExporter:
  enabled: false

backup:
  enabled: false

pgbackrest:
  enabled: true
  stanza: db
  # Enabled IN THE FIXTURE, not via --set: repmgr.agent.control.restore.enabled render-
  # guards on it, so a fixture that omitted it would not render at all -- and
  # resolve_fullname (a helm template call with only this file) would fail before the
  # suite printed a single line.
  restore:
    enabled: true
  s3:
    endpoint: minio   # in-cluster MinIO Service (TLS on :443 -> targetPort 9000)
    bucket: pgbackrest-test
    region: us-east-1
    prefix: pgbackrest
    keyType: shared
    uriStyle: path    # MinIO/Ceph addressing
    verifyTls: false  # self-signed MinIO cert
  existingSecret:
    name: s3-backup-creds
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  retention:
    full: 4
    diff: 14
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
