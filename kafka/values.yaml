fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""

kafka:
  enabled: true
  image:
    registry: docker.io
    repository: apache/kafka
    tag: "4.1.0"
    pullPolicy: IfNotPresent
  bootstrapServer: ""

  tls:
    # TLS is required by default. To run without it (INSECURE), set
    # tls.enabled=false AND auth.allowInsecure=true.
    enabled: true
    existingSecret: ""
    certFilename: tls.crt
    keyFilename: tls.key
    caFilename: ca.crt
    # TLS hostname verification for inter-broker, controller-quorum and client
    # SSL connections. "https" (default) verifies the peer certificate SANs match
    # the host being dialed, closing the MITM window inside the trust domain. The
    # chart-managed certificate already carries the per-pod service SANs. Only
    # "https" and "" are accepted; any other value fails the render. If the key is
    # omitted entirely (e.g. a values override that replaces this whole tls map),
    # it defaults to "https" so verification is never silently disabled.
    # Set to "" to disable verification (INSECURE) only for a documented edge case,
    # e.g. an existingSecret (or a custom kafka.bootstrapServer host) whose
    # certificate lacks the required SANs -- prefer adding the host to
    # certManager.additionalDnsNames instead of turning verification off.
    endpointIdentificationAlgorithm: https
    certManager:
      issuerRef:
        # Leave name empty to use a chart-managed self-signed CA (a SelfSigned
        # Issuer + CA Certificate + CA Issuer are created for you). Requires
        # cert-manager to be installed. Set name to use your own issuer instead.
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      duration: 8760h
      renewBefore: 720h
      additionalDnsNames: []

  controller:
    replicaCount: 3
    logDir: /var/lib/kafka/data/kraft-controller-logs
    terminationGracePeriodSeconds: 120
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    jvm:
      heapOpts: "-Xms1g -Xmx1g"
      performanceOpts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    podAnnotations: {}
    priorityClassName: ""
    nodeSelector: {}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - kafka-controller
            topologyKey: kubernetes.io/hostname
    tolerations: []
    topologySpreadConstraints: []

  broker:
    replicaCount: 3
    logDir: /var/lib/kafka/data/kraft-broker-logs
    terminationGracePeriodSeconds: 120
    persistence:
      size: 100Gi
      storageClass: ""
    config:
      numPartitions: 3
      defaultReplicationFactor: 3
      minInsyncReplicas: 2
      offsetsTopicReplicationFactor: 3
      transactionStateLogReplicationFactor: 3
      transactionStateLogMinIsr: 2
      numIoThreads: 8
      numNetworkThreads: 3
      numReplicaFetchers: 1
      logRetentionHours: 168
      logRetentionBytes: -1
      logSegmentBytes: 1073741824
      logCleanupPolicy: delete
    extraConfig: {}
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    jvm:
      heapOpts: "-Xms4g -Xmx4g"
      performanceOpts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=35"
    podAnnotations: {}
    priorityClassName: ""
    nodeSelector: {}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - kafka-broker
            topologyKey: kubernetes.io/hostname
    tolerations: []
    topologySpreadConstraints: []

  auth:
    # SASL mechanism for EXTERNAL clients (the CLIENT listener). Internal
    # (inter-broker) and controller listeners always use mTLS when TLS is on.
    # One of: SCRAM-SHA-512 (recommended), SCRAM-SHA-256, PLAIN (legacy/insecure).
    saslMechanism: SCRAM-SHA-512
    # Must be true to run with tls.enabled=false. INSECURE.
    allowInsecure: false
    # SASL users. SCRAM credentials are provisioned into KRaft metadata by the
    # bootstrap Job. Passwords: explicit password wins; otherwise a random value
    # is generated on first install and persisted across upgrades. Set
    # existingSecret to source the password from a pre-existing Secret instead.
    users:
      - username: admin
        password: ""
        existingSecret: ""
        existingSecretPasswordKey: password
    authorization:
      # StandardAuthorizer with deny-by-default.
      enabled: true
      allowEveryoneIfNoAcl: false
      # Extra super-users (bypass ACLs). The internal cert principal is always a
      # super-user; list SASL usernames here to grant them full access too.
      superUsers:
        - admin
      # Declarative ACLs. Either role-based:
      #   - principal: app
      #     role: consumer            # producer | consumer | admin
      #     topics: ["orders"]
      #     groups: ["orders-consumers"]
      # or raw:
      #   - principal: app
      #     operations: [Read, Describe]
      #     resourceType: topic       # topic | group | cluster | transactionalId
      #     resourceName: orders
      #     patternType: literal      # literal | prefixed
      #     host: "*"
      #     permission: allow         # allow | deny
      acls: []

  autoCreateTopicsEnable: false
  deleteTopicEnable: true
  topics: {}

exporters:
  kafka:
    enabled: true
    image:
      registry: docker.io
      repository: danielqsj/kafka-exporter
      tag: v1.9.0
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podAnnotations: {}
    priorityClassName: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: null

serviceMonitors:
  enabled: false
  labels:
    release: kube-prometheus-stack

autoscaling:
  broker:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null

keda:
  broker:
    enabled: false
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 3
    maxReplicaCount: 10
    triggers: []

networkPolicy:
  enabled: true
  controller:
    ingress: []
    egress: []
  broker:
    ingress: []
    egress: []
  exporter:
    ingress: []
    egress: []
