name: Build and publish repmgr image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Base image tag (e.g., trixie-5.5.0-29). Published as <tag> (default major) plus <tag>-pg18 / <tag>-pg17'
        required: true
        type: string
  push:
    tags:
      - 'trixie-*'

permissions:
  contents: read
  id-token: write   # keyless cosign signing via the GitHub OIDC token

jobs:
  # Gate the publish on the same tests the PR/master workflow runs, because a
  # `trixie-*` tag push does NOT trigger repmgr-image-test.yaml -- without this an
  # untested image could be built, signed, and pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run script tests
        run: bash images/repmgr/test/scripts-test.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: vet + test + verify + hermetic build + govulncheck
        working-directory: images/repmgr/agent
        run: |
          go vet ./...
          go test ./...
          go mod verify
          GOFLAGS=-mod=vendor GOPROXY=off go build ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  # One leg per PostgreSQL major (#269). The DEFAULT major also claims the unsuffixed
  # tag, so every existing chart pin keeps resolving to it; the -pgNN tags let a user
  # select a major explicitly. Both tags in a leg are one push, hence one digest and
  # one signature.
  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg_major: "18", default_major: "true" }
          - { pg_major: "17", default_major: "false" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        # The dispatch input reaches the shell through the ENVIRONMENT, never through
        # ${{ }} interpolation: an expression is expanded into the script source before bash
        # parses it, so shell metacharacters in the input would execute as code -- in a job
        # holding id-token: write (cosign signing) and the DockerHub credentials. Quoting
        # "$INPUT_TAG" instead keeps it data, and the validation below then actually guards
        # what gets used.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PG_MAJOR: ${{ matrix.pg_major }}
          DEFAULT_MAJOR: ${{ matrix.default_major }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            echo "Could not resolve an image tag" >&2
            exit 1
          fi
          # Only the exact shape the tag scheme allows, ANCHORED at both ends. A glob cannot
          # express that ("trixie-*-[0-9]*" still matches trixie-5.5.0-30-pg17 via the
          # trailing wildcard), and both rejections matter: a major-suffixed base tag would
          # publish the PostgreSQL 18 build as ...-pg17 -- a signed image whose name states
          # the wrong major, which the chart's tag guard would then trust -- and shell
          # metacharacters must never reach a later step in a job that holds id-token: write.
          if [[ ! "$tag" =~ ^trixie-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Refusing to publish from '${tag}': expected an UNSUFFIXED trixie-<repmgr-version>-<n>, e.g. trixie-5.5.0-30 (each leg appends its own -pgNN)" >&2
            exit 1
          fi
          # The base tag must NOT carry a major suffix: the suffix is appended per matrix
          # leg, so `trixie-5.5.0-30-pg17` would publish the PostgreSQL 18 build as
          # ...-pg17 (and the 17 build as ...-pg17-pg17) -- a signed image whose name
          # states the wrong major, which the chart's tag guard would then trust.
          case "$tag" in
            *-pg[0-9]*)
              echo "Refusing to publish from ${tag}: pass the UNSUFFIXED base tag (e.g. trixie-5.5.0-30); each leg appends its own -pgNN" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Tag list for this major. The default major additionally publishes the
          # UNSUFFIXED tag -- that is the contract every existing chart pin relies on,
          # and it is why Dockerfile's ARG PG_MAJOR default must stay in step with
          # default_major here.
          tags="cagriekin/repmgr:${tag}-pg${PG_MAJOR}"
          if [ "$DEFAULT_MAJOR" = "true" ]; then
            tags="cagriekin/repmgr:${tag},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing PG${PG_MAJOR} as: ${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build this major for amd64 and START it before anything is pushed: a tag push does
      # not run repmgr-image-test.yaml, so without this a per-major regression (a missing
      # postgresql-<major>-pgaudit, a bindir the scripts cannot find) could be published and
      # signed. Deliberately inside the publish leg, not a separate job: as its own job it
      # gated BOTH legs, so a PG17-only failure would withhold the unsuffixed default-major
      # tag that every existing chart pin resolves to. The multi-arch build below reuses
      # this leg's layer cache, so the extra wall-clock is small.
      - name: Build and smoke-test PG${{ matrix.pg_major }} (amd64) before publishing
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          ref="cagriekin/repmgr:${TAG}-pg${PG_MAJOR}"
          docker buildx build --load \
            --build-arg "PG_MAJOR=${PG_MAJOR}" \
            --cache-from "type=gha,scope=repmgr-publish-pg${PG_MAJOR}" \
            --cache-to "type=gha,mode=max,scope=repmgr-publish-pg${PG_MAJOR}" \
            -t "$ref" images/repmgr
          # Named with the real tag so image-smoke.sh derives the repmgr version the tag
          # advertises and holds the artifact to it.
          bash images/repmgr/test/image-smoke.sh "$ref" "$PG_MAJOR"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/repmgr
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          # Per-major cache scope: the two majors share only the layers above the apt
          # install, so one scope would evict the other on every run.
          cache-from: type=gha,scope=repmgr-publish-pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=repmgr-publish-pg${{ matrix.pg_major }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # One digest per leg (both tags of the default major point at the same manifest),
      # so one signature covers every tag this leg published.
      - name: Sign the image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "cagriekin/repmgr@${DIGEST}"
