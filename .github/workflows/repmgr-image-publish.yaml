name: Build and publish repmgr image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Base image tag (e.g., trixie-5.5.0-29). Published as <tag> (default major) plus <tag>-pg18 / <tag>-pg17'
        required: true
        type: string
  push:
    tags:
      - 'trixie-*'

permissions:
  contents: read
  id-token: write   # keyless cosign signing via the GitHub OIDC token

jobs:
  # Gate the publish on the same tests the PR/master workflow runs, because a
  # `trixie-*` tag push does NOT trigger repmgr-image-test.yaml -- without this an
  # untested image could be built, signed, and pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run script tests
        run: bash images/repmgr/test/scripts-test.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: vet + test + verify + hermetic build + govulncheck
        working-directory: images/repmgr/agent
        run: |
          go vet ./...
          go test ./...
          go mod verify
          GOFLAGS=-mod=vendor GOPROXY=off go build ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Build each major for amd64 and start it before anything is pushed (#269): a tag push
  # does not run repmgr-image-test.yaml, so without this a per-major package regression
  # (e.g. no postgresql-<major>-pgaudit) could be published and signed. The multi-arch
  # build below reuses the same layer cache, so this costs little wall-clock.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg_major: ["18", "17"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build repmgr image (PG${{ matrix.pg_major }}, amd64)
        run: |
          docker buildx build --load \
            --build-arg PG_MAJOR=${{ matrix.pg_major }} \
            --cache-from type=gha,scope=repmgr-publish-pg${{ matrix.pg_major }} \
            --cache-to type=gha,mode=max,scope=repmgr-publish-pg${{ matrix.pg_major }} \
            -t "repmgr:smoke-pg${{ matrix.pg_major }}" images/repmgr

      - name: Smoke-test the image
        run: bash images/repmgr/test/image-smoke.sh "repmgr:smoke-pg${{ matrix.pg_major }}" "${{ matrix.pg_major }}"

  # One leg per PostgreSQL major (#269). The DEFAULT major also claims the unsuffixed
  # tag, so every existing chart pin keeps resolving to it; the -pgNN tags let a user
  # select a major explicitly. Both tags in a leg are one push, hence one digest and
  # one signature.
  build-and-publish:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg_major: "18", default_major: "true" }
          - { pg_major: "17", default_major: "false" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            echo "Could not resolve an image tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Tag list for this major. The default major additionally publishes the
          # UNSUFFIXED tag -- that is the contract every existing chart pin relies on,
          # and it is why Dockerfile's ARG PG_MAJOR default must stay in step with
          # default_major here.
          tags="cagriekin/repmgr:${tag}-pg${{ matrix.pg_major }}"
          if [ "${{ matrix.default_major }}" = "true" ]; then
            tags="cagriekin/repmgr:${tag},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing PG${{ matrix.pg_major }} as: ${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/repmgr
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          # Per-major cache scope: the two majors share only the layers above the apt
          # install, so one scope would evict the other on every run.
          cache-from: type=gha,scope=repmgr-publish-pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=repmgr-publish-pg${{ matrix.pg_major }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # One digest per leg (both tags of the default major point at the same manifest),
      # so one signature covers every tag this leg published.
      - name: Sign the image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "cagriekin/repmgr@${DIGEST}"
