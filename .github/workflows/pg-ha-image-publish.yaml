name: Build and publish pg-ha image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., pg-ha-2.0.0). Published as <version>-pg18 and <version>-pg17'
        required: true
        type: string
  push:
    tags:
      - 'pg-ha-*'

permissions:
  contents: read
  id-token: write   # keyless cosign signing via the GitHub OIDC token

jobs:
  # Gate the publish on the same tests the PR/master workflow runs, because a
  # `trixie-*` tag push does NOT trigger pg-ha-image-test.yaml -- without this an
  # untested image could be built, signed, and pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run script tests
        run: bash images/pg-ha/test/scripts-test.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'

      - name: vet + test + verify + build + govulncheck
        working-directory: images/pg-ha/agent
        run: |
          go vet ./...
          go test ./...
          go mod verify
          GOFLAGS=-mod=readonly go build ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  # One leg per PostgreSQL major (#269). The DEFAULT major also claims the unsuffixed
  # tag, so every existing chart pin keeps resolving to it; the -pgNN tags let a user
  # select a major explicitly. Both tags in a leg are one push, hence one digest and
  # one signature.
  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # No default_major any more (#290): with the major in the tag there is no
          # unsuffixed alias for one of them to own.
          - { pg_major: "18" }
          - { pg_major: "17" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        # The dispatch input reaches the shell through the ENVIRONMENT, never through
        # ${{ }} interpolation: an expression is expanded into the script source before bash
        # parses it, so shell metacharacters in the input would execute as code -- in a job
        # holding id-token: write (cosign signing) and the DockerHub credentials. Quoting
        # "$INPUT_TAG" instead keeps it data, and the validation below then actually guards
        # what gets used.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            echo "Could not resolve an image tag" >&2
            exit 1
          fi
          # The tag scheme is `pg-ha-<version>` in git, published as <version>-pg<major>.
          #
          # It was `trixie-<repmgr-version>-<n>`, keyed on a package this image no longer
          # contains, so every published tag advertised a version that was not in it (#290). The
          # version now tracks the CHART release the image shipped with, which is the number a
          # consumer already reasons about, and the PostgreSQL major stays IN the tag because one
          # build bundles exactly one -- a tag that does not say which is the hazard #290 removed.
          #
          # Equality with the chart version is not enforced, deliberately: a chart-only patch
          # needs no new image, and it keeps pinning the last one rather than publishing a
          # byte-identical rebuild. The version says "this image shipped with that chart line".
          #
          # Anchored at both ends, and a glob cannot express it, so this stays a regex. Shell
          # metacharacters must never reach a later step in a job holding id-token: write.
          if [[ ! "$tag" =~ ^pg-ha-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish from '${tag}': expected pg-ha-<major>.<minor>.<patch>, e.g. pg-ha-2.0.0 (matching the chart version this image ships with). Each leg publishes <version>-pg<major> from it." >&2
            exit 1
          fi
          version="${tag#pg-ha-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # ONE tag per leg, naming its own major. No unsuffixed alias: a pin must say which
          # major it wants, and the chart's own majorVersion guard then cross-checks it.
          tags="cagriekin/pg-ha:${version}-pg${PG_MAJOR}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing PG${PG_MAJOR} as: ${tags}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build this major for amd64 and START it before anything is pushed: a tag push does
      # not run pg-ha-image-test.yaml, so without this a per-major regression (a missing
      # postgresql-<major>-pgaudit, a bindir the scripts cannot find) could be published and
      # signed. Deliberately inside the publish leg, not a separate job: as its own job it
      # gated BOTH legs, so a PG17-only failure would withhold the unsuffixed default-major
      # tag that every existing chart pin resolves to. The multi-arch build below reuses
      # this leg's layer cache, so the extra wall-clock is small.
      - name: Build and smoke-test PG${{ matrix.pg_major }} (amd64) before publishing
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail
          ref="cagriekin/pg-ha:${TAG#pg-ha-}-pg${PG_MAJOR}"
          docker buildx build --load \
            --build-arg "PG_MAJOR=${PG_MAJOR}" \
            --cache-from "type=gha,scope=pg-ha-publish-pg${PG_MAJOR}" \
            --cache-to "type=gha,mode=max,scope=pg-ha-publish-pg${PG_MAJOR}" \
            -t "$ref" images/pg-ha
          # Named with the real tag so image-smoke.sh checks the artifact under the name it
          # will be published as.
          bash images/pg-ha/test/image-smoke.sh "$ref" "$PG_MAJOR"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/pg-ha
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          # Per-major cache scope: the two majors share only the layers above the apt
          # install, so one scope would evict the other on every run.
          cache-from: type=gha,scope=pg-ha-publish-pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg-ha-publish-pg${{ matrix.pg_major }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # One digest per leg (both tags of the default major point at the same manifest),
      # so one signature covers every tag this leg published.
      - name: Sign the image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "cagriekin/pg-ha@${DIGEST}"
