name: Test pg chart

permissions:
  contents: read

on:
  # No paths filter on pull_request: the `gate` job must report a status on EVERY PR
  # so it can be a required check without blocking PRs that do not touch pg. The
  # `changes` job below skips the heavy work when pg is untouched.
  pull_request:

concurrency:
  group: pg-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this PR touches pg (chart, agent image, or bundled etcd). On push
  # to master the trigger is already path-filtered to those paths, so treat it as
  # changed. The heavy jobs gate on this; the gate job self-passes when untouched.
  changes:
    runs-on: ubuntu-latest
    outputs:
      pg: ${{ steps.detect.outputs.pg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect pg changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push to master is already path-filtered upstream; always run.
            echo "pg=true" >> "$GITHUB_OUTPUT"
            echo "pg changed: $(grep pg= "$GITHUB_OUTPUT")"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base" HEAD)
          # Build the render-affecting set by removing changes that cannot affect what
          # the chart renders, so release/docs-only PRs skip the kind matrix and are
          # gated by `lint` (always-on) alone:
          #   - Markdown (*.md): docs never affect rendering.
          #   - pg/Chart.yaml when ONLY version:/appVersion: changed (a pure release
          #     bump). Any other Chart.yaml edit (dependencies, description, ...) is
          #     kept and still runs the full suite. helm lint validates Chart.yaml on
          #     every PR regardless.
          render_files=$(printf '%s\n' "$files" | grep -vE '\.md$' || true)
          if printf '%s\n' "$render_files" | grep -qxE 'pg/Chart\.yaml'; then
            non_version=$(git diff "$base" HEAD -- pg/Chart.yaml \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-](version|appVersion):' || true)
            if [ -z "$non_version" ]; then
              render_files=$(printf '%s\n' "$render_files" | grep -vxE 'pg/Chart\.yaml' || true)
            fi
          fi
          # images/pg-extensions/ belongs here for the same reason images/pg-ha/ does: the
          # chart points at that image via postgresql.extensions.image, and its install paths
          # are a two-file contract with pg.extensionPrebuiltCopyCommand in _helpers.tpl. Its
          # only other coverage is pg-ha-image-test.yaml, which is deliberately paths-filtered
          # and feeds NO required check -- so a PR touching only that directory used to skip the
          # whole matrix and self-pass pg-tests-passed with nothing blocking the drift.
          if printf '%s\n' "$render_files" | grep -qE '^(pg/|images/pg-ha/|images/pg-extensions/|etcd/|\.github/workflows/pg-test\.yaml)'; then
            echo "pg=true" >> "$GITHUB_OUTPUT"
          else
            echo "pg=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pg changed: $(grep pg= "$GITHUB_OUTPUT")"

  # ---------------------------------------------------------------------------
  # Build the repmgr image + warm the base-image cache ONCE, then hand every
  # suite a ready-to-load image bundle. Also runs the fast render gate so a
  # template/lint regression fails in ~1min without spinning up any clusters.
  # ---------------------------------------------------------------------------
  build:
    name: build images + render gate
    needs: changes
    if: needs.changes.outputs.pg == 'true'
    runs-on: ubuntu-latest
    # Two apt-heavy image builds (one per major, separate cache scopes so each is cold on
    # its first run), two docker saves and three artifact uploads. A timeout here cancels
    # the job, which skips all 50 suite legs and fails the required gate with no test
    # signal at all, so it is sized for the cold case rather than the cached one.
    timeout-minutes: 50
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache the third-party base images. Keyed on the image MANIFEST, not on
      # pg/values.yaml -- a chart image-tag bump no longer busts this cache (only
      # editing pg/tests/ci-base-images.txt does).
      - name: Cache base images
        id: base-cache
        uses: actions/cache@v5
        with:
          path: /tmp/base-images
          key: pg-base-images-${{ hashFiles('pg/tests/ci-base-images.txt') }}

      - name: Pull base images (on cache miss)
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/base-images
          grep -vE '^\s*(#|$)' pg/tests/ci-base-images.txt | while read -r image; do
            docker pull "$image"
            safe=$(echo "$image" | tr '/:' '_')
            docker save "$image" -o "/tmp/base-images/${safe}.tar"
          done

      # The repmgr image is built from source (images/pg-ha) so an image change
      # ships and is tested with the chart in one PR. The tag is read from
      # pg/values.yaml so the loaded image satisfies the chart's IfNotPresent pull
      # policy. buildx + the gha cache keeps the apt-heavy build off the critical
      # path on cache hits. Built ONCE here; every suite loads the saved tars.
      #
      # One build per PostgreSQL major in the suite matrix (#269). The unsuffixed tag is
      # the default major (matching the Dockerfile's ARG PG_MAJOR default and the
      # published tag scheme); other majors get the -pgNN tag that pg/tests/set-pg-major.sh
      # rewrites the fixtures to. Cache scopes are per major -- the layers diverge at the
      # apt install, so a shared scope would thrash.
      - name: Build repmgr images from source (one per PG major)
        run: |
          set -euo pipefail
          # Matches BOTH block spellings, same as pg/tests/set-pg-major.sh: #291 renamed the
          # block to `ha:` and keeps `repmgr:` as a values alias, so the tree can carry either.
          # Anchoring on one is a hard CI outage, not a soft miss -- the -z guards below exit 1
          # and every leg of both majors dies before a single suite runs.
          tag=$(awk '/^(repmgr|ha):/{r=1} r&&/^    tag:/{gsub(/"/,"",$2); print $2; exit}' pg/values.yaml)
          if [ -z "$tag" ]; then echo "could not resolve the HA image tag from pg/values.yaml (looked for tag: under the ha:/repmgr: block)" >&2; exit 1; fi
          # The image REPOSITORY comes from the chart too, so this keeps building whatever the
          # chart points at across the #290 rename (cagriekin/repmgr -> cagriekin/pg-ha).
          repo=$(awk '/^(repmgr|ha):/{r=1} r&&/^    repository:/{gsub(/"/,"",$2); print $2; exit}' pg/values.yaml)
          if [ -z "$repo" ]; then echo "could not resolve the HA image repository from pg/values.yaml (looked for repository: under the ha:/repmgr: block)" >&2; exit 1; fi
          # Two tag shapes, exactly as pg/tests/set-pg-major.sh accepts (#290): the chart pin
          # moves to the new scheme only after the new image is published, so both must work or
          # that bump breaks CI silently.
          #
          #   NEW: <chart-version>-pg<major>   e.g. 2.0.0-pg18 -- substitute the major
          #   OLD: trixie-<repmgr>-<n>         unsuffixed is PG18, others take -pgNN
          # (This table said `trixie-pg<major>-<n>` for NEW until #291 review; the classifier
          #  below keys on a LEADING semver and would have sent that shape to the legacy arm.)
          #
          # Getting this wrong is quiet, not loud: building the PG18 image under a "-pg17" name
          # while set-pg-major points the PG17 fixtures at that name makes every PG17 leg run
          # PostgreSQL 18 and pass.
          # Shape `<chart-version>-pg<major>` (e.g. 2.0.0-pg18), keyed on a LEADING semver --
          # both it and the old trixie-<repmgr>-<n>-pgNN end in -pg<digits>, so a trailing test
          # would misclassify the legacy suffixed form. Shared verbatim with
          # pg/tests/set-pg-major.sh; if the two disagree, CI builds one major under the other's
          # name and every leg of the mismatched major passes while running the wrong server.
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*-pg[0-9]*) scheme=major-in-tag ;;
            *) scheme=legacy
               base=${tag%-pg[0-9]*}
               if [ "$base" != "$tag" ]; then
                 echo "::notice title=pg-major::chart tag ${tag} is major-suffixed; using base ${base} for the per-major builds"
                 tag="$base"
               fi ;;
          esac
          echo "::notice title=pg-major::tag scheme=${scheme} repo=${repo} base=${tag}"
          for major in 18 17; do
            if [ "$scheme" = "major-in-tag" ]; then
              ref="${repo}:$(printf '%s' "$tag" | sed -E "s/-pg[0-9]+$/-pg${major}/")"
            elif [ "$major" = "18" ]; then
              ref="${repo}:${tag}"
            else
              ref="${repo}:${tag}-pg${major}"
            fi
            echo "Building ${ref} (PG_MAJOR=${major}) from images/pg-ha"
            docker buildx build --load \
              --build-arg "PG_MAJOR=${major}" \
              --cache-from type=gha,scope=pg-ha-image-pg${major} \
              --cache-to type=gha,mode=max,scope=pg-ha-image-pg${major} \
              -t "$ref" images/pg-ha
            # Own artifact per major (~190MB each): a suite leg needs exactly one, and
            # with 50 legs bundling both would download a spare 190MB 50 times.
            mkdir -p "/tmp/kind-images-pg${major}"
            docker save "$ref" -o "/tmp/kind-images-pg${major}/repmgr.tar"
          done

      # Fast render gate: template + lint take ~1min and catch most regressions
      # before any live cluster is started. If this fails the matrix is skipped.
      - name: Run template + lint tests
        run: make -C pg test-template

      - name: Assemble image bundles for the suites
        run: |
          set -euo pipefail
          mkdir -p /tmp/kind-images-common
          cp /tmp/base-images/*.tar /tmp/kind-images-common/
          ls -lh /tmp/kind-images-common/ /tmp/kind-images-pg18/ /tmp/kind-images-pg17/

      # Third-party images every leg needs, regardless of major.
      - name: Upload common image bundle
        uses: actions/upload-artifact@v7
        with:
          name: kind-images-common
          path: /tmp/kind-images-common
          retention-days: 1

      - name: Upload PG18 repmgr image
        uses: actions/upload-artifact@v7
        with:
          name: kind-images-pg18
          path: /tmp/kind-images-pg18
          retention-days: 1

      - name: Upload PG17 repmgr image
        uses: actions/upload-artifact@v7
        with:
          name: kind-images-pg17
          path: /tmp/kind-images-pg17
          retention-days: 1

  # ---------------------------------------------------------------------------
  # One job per live suite PER PostgreSQL major, each on its OWN fresh Kind cluster
  # (so a suite gets the whole 2-CPU runner to itself, no cross-suite resource
  # contention, and no cumulative cluster degradation). fail-fast: false so one
  # flaky suite does not cancel the others, and each suite retries once on a clean
  # cluster state.
  #
  # The majors are a real axis (#269), not an include list, so every suite runs on
  # every major: the chart is version-agnostic by design and PG17 is a supported
  # selection, not a spot-check. Suite names map 1:1 to Makefile targets
  # (test-<suite>), and extra per-suite fields come from `include`, which merges into
  # that suite's combination for both majors.
  # ---------------------------------------------------------------------------
  suite:
    name: ${{ matrix.suite }} (pg${{ matrix.pg_major }})
    needs: [changes, build]
    if: needs.changes.outputs.pg == 'true'
    runs-on: ubuntu-latest
    # Per-leg, because migrate-native is in a different class: it installs a RELEASED chart,
    # upgrades in place, then rolls the StatefulSet a second time to prove idempotence, and the
    # run step below retries the whole suite once on failure. 30 minutes cannot hold that, and a
    # timeout kills the required check with no diagnosis (#292 review).
    timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
    strategy:
      fail-fast: false
      matrix:
        pg_major: ["18", "17"]
        # #294: the mechanism axis is GONE. It existed for the repmgr-to-native transition
        # (#288/#295) and carried 11 exclusions to keep the fan-out honest; native is now the
        # only mechanism, so 25 suites x 2 majors = 50 legs with no exclusions at all. Anything
        # that reads as mechanism-conditional below is a leftover and should be deleted, not
        # re-gated.
        suite:
          - minimal
          - agent
          - agent-control
          - agent-control-restore
          - full
          - upgrade
          - agent-etcd
          - agent-etcd-tls
          - tls
          - pgpool-failover
          - config-failover
          - cascading-replication
          - sync-replication-slots
          - agent-rolling
          - backup-restore
          - backup-concurrent
          - pgbackrest-restore
          - pgbackrest-restore-ha
          - pgbackrest-bootstrap
          - databases-roles
          - scaledown
          # #298 review: both of these existed in pg/Makefile and in no matrix leg, so they ran
          # only when somebody remembered to. special-chars is the pointed one -- it covers
          # identifiers and passwords with characters that break SQL, which is exactly the class
          # of bug #298 found in bootstrap_initdb (an uppercase POSTGRES_USER made the bootstrap
          # unpassable), and the suite that would have caught it was not wired in.
          - config
          - special-chars
          # #292: starts from the released 1.x chart + an older released image, so unlike every
          # other leg it is not hermetic against the local tree. It is in the matrix anyway
          # because the in-place migration is the one path every existing consumer takes, and
          # a suite that only runs by hand is a suite that rots.
          - migrate-native
          # #298 review: the failoverMode:repmgrd -> 2.0.0 upgrade, which is the only path in
          # this release that recreates a live StatefulSet (--cascade=orphan) and the one every
          # remaining repmgrd consumer must follow. It had no coverage at all -- migrate-native
          # covers agent->agent and says so in its own comments. Same class as migrate-native:
          # not hermetic (pulls a released chart + image) and long, so it gets the same budget.
          - migrate-repmgrd
        include:
          - { suite: migrate-native, timeout_minutes: 50, no_retry: "1" }
          - { suite: migrate-repmgrd, timeout_minutes: 50, no_retry: "1" }
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.2

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pg-test
          config: pg/kind-config.yaml

      - name: Download common image bundle
        uses: actions/download-artifact@v8
        with:
          name: kind-images-common
          path: /tmp/kind-images

      # Only this leg's major -- the other one is a 190MB download it would never use.
      - name: Download PG${{ matrix.pg_major }} repmgr image
        uses: actions/download-artifact@v8
        with:
          name: kind-images-pg${{ matrix.pg_major }}
          path: /tmp/kind-images

      - name: Load images into Kind
        run: |
          set -euo pipefail
          for tarball in /tmp/kind-images/*.tar; do
            kind load image-archive "$tarball" --name pg-test
          done

      # The two migration suites alone start from an older RELEASED image, and it is deliberately NOT in
      # pg/tests/ci-base-images.txt: that list is bundled into every leg, so adding a ~200MB
      # image there would ship it to every leg to serve two suites -- the same waste the per-major
      # image bundles exist to avoid. Pull it here, on the runner, once, and kind-load it: with
      # pullPolicy IfNotPresent the alternative is each of the 3 kind workers pulling it
      # anonymously from Docker Hub mid-suite, which is both slower and rate-limitable (#292
      # review). The tag is derived exactly as the suite derives it, so the two cannot drift.
      - name: Pre-load the released from-image (migration suites only)
        if: matrix.suite == 'migrate-native' || matrix.suite == 'migrate-repmgrd'
        run: |
          set -euo pipefail
          # `|| true` is load-bearing: under `set -euo pipefail` a grep that matches nothing
          # makes the whole pipeline (and therefore the assignment) exit 1, so `set -e` killed
          # the step BEFORE the guard below could print its message -- the one case it was
          # written for, e.g. someone renaming FROM_IMAGE_BASE in the suite (#298 review).
          base=$(grep -oE 'FROM_IMAGE_BASE:-[^}]+' "pg/tests/test-${{ matrix.suite }}.sh" | head -1 \
            | sed 's/^FROM_IMAGE_BASE:-//' || true)
          [ -n "$base" ] || { echo "could not resolve FROM_IMAGE_BASE from the suite" >&2; exit 1; }
          ref="cagriekin/repmgr:${base%-pg[0-9]*}-pg${{ matrix.pg_major }}"
          echo "pre-loading $ref"
          # Retried, because this is the ONLY image in the required path that is not delivered
          # by download-artifact, and these two legs carry no_retry: "1" (#298 review). A
          # GitHub-hosted runner shares its egress IP, so an anonymous Docker Hub pull can come
          # back TOOMANYREQUESTS -- and an unretried failure here reds `pg-tests-passed` on a PR
          # that changed nothing related. Three attempts with backoff; if they all fail we still
          # let the leg proceed, since pullPolicy IfNotPresent means the kind workers will try
          # the pull themselves and the suite fails with its own diagnosis rather than this one.
          pulled=""
          for attempt in 1 2 3; do
            if docker pull "$ref"; then pulled=1; break; fi
            echo "docker pull $ref failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          if [ -n "$pulled" ]; then
            kind load docker-image "$ref" --name pg-test
          else
            echo "::warning::could not pre-load $ref; the kind workers will pull it in-cluster"
          fi

      # Point the chart defaults and every fixture at this leg's major (#269). Both
      # majors' images are already loaded, so this only decides which one the suite
      # deploys. The script fails if any rewrite rule matches nothing, so a leg cannot
      # silently run the wrong major and report green.
      - name: Target PostgreSQL ${{ matrix.pg_major }}
        run: bash pg/tests/set-pg-major.sh "${{ matrix.pg_major }}"

      - name: Run ${{ matrix.suite }} suite (pg${{ matrix.pg_major }})
        env:
          NO_RETRY: ${{ matrix.no_retry }}
        run: |
          set +e
          run() { make -C pg test-${{ matrix.suite }}; }
          run; rc=$?
          # NO_RETRY legs opt out of the second attempt (#292 review): timeout-minutes is a JOB
          # budget, so a retry halves what each attempt gets. migrate-native is the longest
          # suite in the matrix and would end up with LESS per attempt than every shorter leg,
          # killed mid-run with no diagnosis -- the exact outcome the per-leg budget exists to
          # avoid. Its own convergence waits already absorb the churn a retry was papering over.
          if [ "$rc" -ne 0 ] && [ -n "${NO_RETRY:-}" ]; then
            echo "::notice title=no-retry::test-${{ matrix.suite }} (pg${{ matrix.pg_major }}) failed (rc=${rc}); this leg does not retry"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning title=suite-retry::test-${{ matrix.suite }} (pg${{ matrix.pg_major }}) failed (rc=${rc}); cleaning namespaces and retrying once"
            kubectl get ns -o name 2>/dev/null | sed 's#namespace/##' | grep '^pg-test' \
              | xargs -r -I{} kubectl delete ns {} --ignore-not-found --wait=true --timeout=180s || true
            sleep 15
            run; rc=$?
          fi
          exit "$rc"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          kubectl get pvc -A || true
          for ns in $(kubectl get ns -o name 2>/dev/null | sed 's#namespace/##' | grep '^pg-test'); do
            for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null); do
              ready=$(kubectl get -n "$ns" "$pod" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
              [ "$ready" = "True" ] && continue
              echo "===== $ns/$pod (Ready=$ready) ====="
              kubectl describe -n "$ns" "$pod" 2>/dev/null | sed -n '/^Init Containers:/,/^Conditions:/p' || true
              for c in $(kubectl get -n "$ns" "$pod" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}' 2>/dev/null); do
                echo "--- $c (current) ---"; kubectl logs -n "$ns" "$pod" -c "$c" --tail=50 2>/dev/null || true
                echo "--- $c (previous) ---"; kubectl logs -n "$ns" "$pod" -c "$c" --previous --tail=50 2>/dev/null || true
              done
            done
          done

  # The single required status check for pg. ALWAYS runs (no path filter on the
  # trigger), so it reports on every PR: it self-passes when pg is untouched, and
  # otherwise fails unless the build + every suite leg succeeded. Require this one
  # context in branch protection instead of the brittle per-leg names.
  gate:
    name: pg-tests-passed
    needs: [changes, build, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          # The no-op arm requires `changes` to have SUCCEEDED (#298). `if: always()` runs this
          # gate even when `changes` failed or was cancelled, and an unfinished job has EMPTY
          # outputs -- so `!= "true"` held and the required check went GREEN having examined
          # nothing. That is worse than never reporting: a missing check blocks the merge,
          # this one waved it through. (Same guard in kafka-test.yaml and redis-test.yaml.)
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "pg gate FAILED: the changes job did not succeed (result=${{ needs.changes.result }}), so relevance is unknown"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.pg }}" != "true" ]; then
            echo "pg unchanged — gate passes (no-op)"; exit 0
          fi
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.suite.result }}" = "success" ]; then
            echo "pg build + all suites passed"; exit 0
          fi
          echo "pg gate FAILED: build=${{ needs.build.result }} suite=${{ needs.suite.result }}"
          exit 1
