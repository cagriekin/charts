suite: etcd structural render
release:
  name: test-etcd
tests:
  # --- StatefulSet defaults ---
  - it: statefulset has 3 replicas, Parallel policy, headless serviceName
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.podManagementPolicy
          value: Parallel
      - equal:
          path: spec.serviceName
          value: test-etcd-etcd-headless

  - it: etcd container runs the etcd binary, pinned image+digest, both ports
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /usr/local/bin/etcd
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^quay\.io/coreos/etcd:v3\.5\.16@sha256:[0-9a-f]{64}$

      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: client
            containerPort: 2379
            protocol: TCP
          any: true
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: peer
            containerPort: 2380
            protocol: TCP
          any: true


  # A DIGEST-ONLY pin renders no bare colon (#298 review). image.digest is documented as the
  # pin that "takes precedence over the tag", so clearing the tag is a reference an operator can
  # reasonably ask for -- and `repository ":" tag` emitted unconditionally gave
  # `quay.io/coreos/etcd:@sha256:...`, which the kubelet rejects as InvalidImageName. All three
  # etcd pods then never start, the agent loses its DCS, no node wins the lease and the release
  # comes up with no primary. Same shape the RBAC-bootstrap Job was fixed for.
  - it: a digest-only image pin renders no empty tag separator
    template: templates/statefulset.yaml
    set:
      image.tag: ""
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^quay\.io/coreos/etcd@sha256:[0-9a-f]{64}$

  # ...and the RBAC-bootstrap Job's image line, which is the one the digest-only fix landed on
  # FIRST and the one that had no render test at all (#298 review). Both now go through
  # etcd.image, so this is what pins the second caller: pg.validateEtcdBootstrapImage tells the
  # operator to set this image to the same repository/tag/digest as ha.image, and ha.image
  # (through pg.image) accepts a tag-less digest pin -- so following that advice must not render
  # `cagriekin/pg-ha:@sha256:...` and take the Job to InvalidImageName, which leaves etcd auth
  # and the per-release tenants unprovisioned.
  - it: a digest-only bootstrapImage pin renders no empty tag separator
    template: templates/rbac-bootstrap-job.yaml
    set:
      tls.enabled: true
      tls.existingSecret: etcd-tls
      rbac.enabled: true
      rbac.adminSecret: etcd-root
      rbac.tenants:
        - commonName: pg-agent
          prefix: /pg/
      rbac.bootstrapImage.tag: ""
      rbac.bootstrapImage.digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: cagriekin/pg-ha@sha256:1111111111111111111111111111111111111111111111111111111111111111

  # A NON-STRING tag still renders as the tag, not as Go's %!s error verb (#298 review).
  # values.schema.json does not type image.tag, so an unquoted YAML scalar reaches the helper as
  # int64/float64, and `printf "%s:%s"` on one rendered
  # `quay.io/coreos/etcd:%!s(float64=3.5)` -- a render-CLEAN manifest the kubelet then rejects
  # as InvalidImageName, which is the failure etcd.image exists to move to render time. The
  # expression it replaced (`{{ with .tag }}:{{ . }}{{ end }}`) printed any scalar, so this is
  # the regression direction to pin.
  - it: a non-string tag renders as the tag, not as a format-verb error
    template: templates/statefulset.yaml
    set:
      image.tag: 3.5
      image.digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/coreos/etcd:3.5

  - it: plaintext default uses httpGet readiness and tcpSocket liveness
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: client
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: client
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec

  - it: pod and container are hardened (non-root, read-only fs, drop ALL)
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: resources carry both requests and limits
    template: templates/statefulset.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.requests
      - isNotNullOrEmpty:
          path: spec.template.spec.containers[0].resources.limits

  - it: data PVC is provisioned at the configured size
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 2Gi

  - it: default soft hostname topology spread is emitted
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: persistence disabled uses an emptyDir data volume and no PVC template
    template: templates/statefulset.yaml
    set:
      persistence.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="data")].emptyDir
      - notExists:
          path: spec.volumeClaimTemplates

  # --- Services ---
  - it: client Service is ClusterIP on the client port
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: client
      - equal:
          path: spec.ports[0].port
          value: 2379

  - it: headless Service is clusterIP None, publishes not-ready, exposes both ports
    template: templates/service-headless.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-etcd-etcd-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - lengthEqual:
          path: spec.ports
          count: 2
