{{- if .Values.rbac.enabled }}
{{- $full := include "etcd.fullname" . -}}
{{- if not .Values.tls.enabled }}{{ fail "etcd: rbac.enabled requires tls.enabled (auth is by client-cert Common Name)" }}{{- end }}
{{- if not .Values.tls.clientCertAuth }}{{ fail "etcd: rbac.enabled requires tls.clientCertAuth=true (the CN is the authenticated user)" }}{{- end }}
{{- if not .Values.rbac.adminSecret }}{{ fail "etcd: rbac.enabled requires rbac.adminSecret (a client cert whose CN is root)" }}{{- end }}
{{- if not .Values.rbac.tenants }}{{ fail "etcd: rbac.enabled requires at least one rbac.tenants entry -- enabling auth with no tenant user would lock every CN-authenticated agent out of the keyspace" }}{{- end }}
{{- $img := .Values.rbac.bootstrapImage -}}
{{- if not $img.repository }}{{ fail "etcd: rbac.bootstrapImage.repository is required (the pg-ha-agent image; it runs `pg-ha-agent rbac-bootstrap`)" }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-rbac-bootstrap
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  annotations:
    # one-shot hook Job: liveness/readiness probes do not apply (kube-linter waiver). Missing
    # until #298's review widened the policy gate past each chart's DEFAULT render -- this Job
    # only renders under `dcs.backend: etcd`, so the gate had never seen it, while every sibling
    # one-shot Job in pg/templates already carried the pair.
    ignore-check.kube-linter.io/no-liveness-probe: "one-shot etcd rbac-bootstrap hook Job"
    ignore-check.kube-linter.io/no-readiness-probe: "one-shot etcd rbac-bootstrap hook Job"
    # Run after the cluster is up on install AND upgrade; the bootstrap is idempotent
    # (existence-checked + auth-enable guarded), so re-running reconciles the tenants.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "etcd.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      # The bootstrap talks only to etcd (via the mounted root-CN admin cert), never to
      # the Kubernetes API, so it needs no ServiceAccount token -- and mounting one next to
      # the etcd superuser credential only gives a compromised bootstrap image a second
      # identity for free (#298 security review). Every sibling one-shot Job in pg/templates
      # already sets this; this Job was the lone omission.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rbac-bootstrap
          # The bundled etcd image is distroless (no shell -- it ships etcd + etcdctl
          # only), so the bootstrap runs in the pg-ha-agent image and drives the etcd
          # Auth API via the Go client (the same mTLS client the agent uses).
          {{- /* The tag is OMITTED when empty, rather than emitted as a bare colon (#298
                 review). pg's pg.haImage (via pg.image) supports a digest-only pin -- no tag
                 at all -- and pg.validateEtcdBootstrapImage tells the operator to set THIS
                 image to the same repository/tag/digest as ha.image. Following that with a
                 digest-only pin rendered `repo:@sha256:...`, which the kubelet rejects as
                 InvalidImageName: the Job never runs, etcd auth and the per-release tenants
                 are never provisioned, every agent's etcd dial is unauthenticated, no node
                 wins the lease, and the release comes up with no primary -- the outcome that
                 guard exists to prevent. */}}
          image: "{{ $img.repository }}{{ with $img.tag }}:{{ . }}{{ end }}{{ with $img.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.rbac.resources | nindent 12 }}
          command: ["/usr/local/bin/pg-ha-agent", "rbac-bootstrap"]
          env:
            - name: ETCD_ENDPOINTS
              value: "https://{{ $full }}:{{ .Values.clientPort }}"
            - name: ETCD_TLS_CERT
              value: /admin-tls/tls.crt
            - name: ETCD_TLS_KEY
              value: /admin-tls/tls.key
            - name: ETCD_TLS_CA
              value: /admin-tls/ca.crt
            # etcd's reserved superuser is literally "root"; AuthEnable requires it,
            # so the admin cert's CN must be "root".
            - name: ETCD_RBAC_ROOT_CN
              value: "root"
            # Read-only health user (#187): its CN must equal the SERVER cert's CN, which
            # the liveness/readiness probe presents, so the probe stops logging
            # "cannot find a user for permission check". Empty disables (no health user).
            - name: ETCD_RBAC_HEALTHCHECK_CN
              value: {{ .Values.rbac.healthCheckCN | quote }}
            - name: ETCD_RBAC_TENANTS
              value: {{ .Values.rbac.tenants | toJson | quote }}
          volumeMounts:
            - name: admin-tls
              mountPath: /admin-tls
              readOnly: true
      volumes:
        - name: admin-tls
          secret:
            secretName: {{ .Values.rbac.adminSecret | quote }}
{{- end }}
