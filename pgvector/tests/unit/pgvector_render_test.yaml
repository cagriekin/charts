# pgvector-SCOPED, not a mirror of pg's suite of the same name (#298 review).
#
# It carried pg's filename and a reworded subset of pg's cases -- 24 of 76 -- which read as a
# mirror while being free to drift, and nothing checked. It is not a mirror and should not be:
# pg/templates and pgvector/templates are byte-identical by gate (`diff -r`) and pgvector's
# templates are symlinks INTO pg's, so pg's suite already exercises every line of shared
# template logic. What belongs here is what is chart-SPECIFIC: pgvector's own defaults, its
# image, and that the shared validators fire under pgvector's values.
#
# Renamed so the filename cannot imply a mirror. The rule is now enforced in
# scripts/helm-unittest-charts.sh: a pgvector unit file sharing a name with a pg one must be a
# SYMLINK to it (audit_test.yaml and pgpool_deployment_test.yaml already are), never a copy.
suite: pgvector structural render
release:
  name: test-pgv
tests:
  # pgvector defaults to agent HA (repmgr.enabled, replicaCount 1) -- the symlinked pg
  # templates must render under pgvector values. Since #286 the agent is the only mode.
  - it: default statefulset is agent-mode HA (2 replicas, Parallel, agent entrypoint)
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.podManagementPolicy
          value: Parallel
      - equal:
          path: spec.template.spec.containers[?(@.name=="postgresql")].command
          value:
            - /usr/local/bin/entrypoint.sh
            - agent
      - notExists:
          path: spec.template.spec.containers[?(@.name=="repmgrd")]

  - it: default renders a Secret
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: default renders a primary Service selecting <release>-0
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: test-pgv-pgvector-0
